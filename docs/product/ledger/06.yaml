# Input ledger rows for spec 06: people and roles in an intent.
- id: "06.pick_people"
  spec: "06"
  journey: shared
  stage: notice
  screen: "invite dialog, Pick from your company"
  input: "People invited to the intent, with a role each"
  person: organiser
  mode: confirm
  agent: North
  source: "the company people list, the areas and the type's stated range"
  minutes_without: 10
  minutes_with: 2
  basis: "estimate: choosing invitees and roles by hand versus confirming suggestions"
  claim: "The organiser picks from the company people list; North checks the count against the type's range"
  built: manual
- id: "06.area_affected"
  spec: "06"
  journey: shared
  stage: notice
  screen: "invite dialog, Tell people in these areas"
  input: "Affected people told by area"
