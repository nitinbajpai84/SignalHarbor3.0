  mode: derived
  agent: Nira
  source: "everyone tagged to the intent's areas in the company people list"
  minutes_without: 10
  minutes_with: 0.5
  basis: "estimate: building a distribution list"
  claim: "Ticking an area tells everyone in it as affected; nobody builds a list"
- id: "06.named_slot"
