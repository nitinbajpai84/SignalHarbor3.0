# Input ledger rows for spec 09: closure and sign-off.
- id: "09.summary"
  spec: "09"
  journey: shared
  stage: prove
  screen: "/centre/intent/<id>/close (summary draft with source chips, Draft it)"
  input: "Closure summary, three to six sentences, each with a source"
  person: organiser
  mode: confirm
  agent: North
  source: "the wall, charter, session and records the intent points at"
  minutes_without: 45
  minutes_with: 5
  basis: "estimate: writing a wrap-up note versus editing a sourced draft"
  claim: "North drafts the closure from the records, every sentence traced to its source; the organiser edits"
- id: "09.why"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Why it happened)"
  input: "Why it happened"
  person: organiser
  mode: confirm
  agent: North
  source: "the purpose, who opened it and when"
  minutes_without: 10
  minutes_with: 1
  basis: "estimate: recalling why work started"
  claim: "North writes why the intent happened from what was recorded when it opened"
- id: "09.outcome_block"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Outcome block per type)"
  input: "The outcome of the type: charter, chosen idea, week record, root cause and fix, decision"
  person: organiser
  mode: derived
  agent: North
  source: "the type's own records; this screen only reads them"
  minutes_without: 30
  minutes_with: 0
  basis: "estimate: assembling outputs into a closing note"
  claim: "The outcome is read from the work the type already recorded"
- id: "09.next_rows"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Next list, Add next, reason per row)"
  input: "What happens next: kind, title and reason for each row"
  person: organiser
  mode: confirm
  built: manual
  agent: North
  source: "the outcome and open items, for example a check-in item with no owner proposes Backlog"
  minutes_without: 15
  minutes_with: 3
  basis: "estimate: agreeing follow-ups in a closing meeting"
  claim: "North proposes each next step with a reason; the organiser confirms, edits or removes each"
- id: "09.people_list"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Who took part, contribution counts)"
  input: "Who took part and what each contributed"
  person: organiser
  mode: automatic
  source: "cards, replies, votes and comments in the records; anonymous counted apart"
  minutes_without: 15
  minutes_with: 0
  basis: "estimate: listing participants and their contributions"
  claim: "Who took part is counted from the records, anonymous contributions apart and without names"
- id: "09.sign"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Sign closure)"
  input: "Sign the closure: sponsor, decider, or owner then reporter"
  person: sponsor
  mode: manual
  source: "the named signer; North prepared the draft they review"
  minutes_without: 15
  minutes_with: 3
  basis: "estimate: reading a document and signing it by email"
  claim: "A named person signs; agents never sign"
- id: "09.send_link"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Send to approver, Withdraw link)"
  input: "Send the closure to a named approver by link"
  person: organiser
  mode: manual
  source: "the organiser names the approver; the link is made by the system and shown once"
  minutes_without: 10
  minutes_with: 1
  basis: "estimate: emailing a document for approval"
  claim: "An approver without an account signs from a one-time link"
- id: "09.approver_decision"
  spec: "09"
  journey: shared
  stage: prove
  screen: "/approve/<token> (approve or send back with a comment)"
  input: "Approve or send back with a comment"
  person: approver
  mode: manual
  source: "the approver"
  minutes_without: 15
  minutes_with: 2
  basis: "estimate: email back and forth"
  claim: "The approver reads a one-page view and approves or sends it back with a comment"
- id: "09.close_checks"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (checks beside Close this intent)"
  input: "Closing checks: purpose, outcome fields, next reasons, confirmer acted"
  person: organiser
  mode: derived
  agent: North
  source: "the record against the closing rules"
  minutes_without: 10
  minutes_with: 0
  basis: "estimate: checking a closing checklist"
  claim: "The first unmet check is named beside the Close button"
- id: "09.close_press"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Close this intent)"
  input: "Close the intent"
  person: organiser
  mode: manual
  source: "the organiser"
  minutes_without: 5
  minutes_with: 0.5
  basis: "estimate: announcing a closed project"
  claim: "One press closes; the follow-ups and rating prompts are then created for the person"
- id: "09.close_incomplete"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Close with what we have, one reason)"
  input: "Close incomplete, with one reason"
  person: organiser
  mode: manual
  source: "the organiser; North lists what is missing"
  minutes_without: 15
  minutes_with: 2
  basis: "estimate: a conversation about closing early"
  claim: "A close with gaps lists what was missing and why, and is marked incomplete"
- id: "09.cancel"
  spec: "09"
  journey: shared
  stage: prove
  screen: "closure screen (Cancel this intent, reason)"
  input: "Cancel with a reason"
  person: organiser
  mode: manual
  source: "the organiser"
  minutes_without: 5
  minutes_with: 1
  basis: "estimate: telling people why work stopped"
  claim: "A cancelled intent keeps who, when and why"
- id: "09.links_created"
  spec: "09"
  journey: shared
  stage: prove
  screen: "after Close (child intents and backlog items from the next list)"
  input: "Follow-up intents and backlog items created"
  person: system
  mode: automatic
  source: "the confirmed next list"
  minutes_without: 20
  minutes_with: 0
  basis: "estimate: raising follow-up tickets"
  claim: "Confirmed follow-ups are created by the system and linked to the intent they came from"
- id: "09.rating_prompt"
  spec: "09"
  journey: shared
  stage: prove
  screen: "after Close (rating prompt to participants; none for a weekly check-in)"
  input: "Rating prompt to each participant"
  person: participant
  mode: derived
  agent: Nira
  source: "the participants of the closed intent"
  minutes_without: 10
  minutes_with: 0
  basis: "estimate: sending a feedback survey"
  claim: "Nira asks each participant to rate once the intent closes"
- id: "09.pulse_row"
  spec: "09"
  journey: shared
  stage: shared
  screen: "Pulse line and past list row for a closed intent"
  input: "Closed line: title, one-line outcome, next"
  person: any
  mode: automatic
  source: "the stored closure, the first sentence of the outcome"
  minutes_without: 10
  minutes_with: 0
  basis: "estimate: announcing outcomes to the area"
  claim: "People in the area hear what came out without anyone announcing it"
- id: "09.counters"
  spec: "09"
  journey: admin
  stage: prove
  screen: "centre counters (closed by type, incomplete, cancelled reasons, median days, send-backs)"
  input: "Closed this month by type, closed with gaps, cancel reasons, time to sign, sentences edited"
  person: company_admin
  mode: automatic
  source: "the closure blocks"
  minutes_without: 60
  minutes_with: 0
  basis: "estimate: compiling close-out performance"
  claim: "How intents end, and how much of North's draft people keep, is counted from the records"
