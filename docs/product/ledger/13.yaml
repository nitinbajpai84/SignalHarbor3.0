# Input ledger rows for spec 13: Pulse lines and notifications.
- id: "13.lines"
  spec: "13"
  journey: shared
  stage: run
  screen: "Pulse page (intent cards: invited, your turn, vote, card to confirm, signature, rating, clock, shared)"
  input: "What an intent needs from this person today"
  person: any
  mode: derived
  agent: Nira
  source: "the intent records that name the person, computed on each read"
  minutes_without: 20
  minutes_with: 0
  basis: "estimate: checking email, chat and trackers for what is waiting on you"
  claim: "Each person finds out it is their turn on one page, with the action named; a line goes the moment the record changes"
- id: "13.one_line"
  spec: "13"
  journey: shared
  stage: run
  screen: "Pulse page (one line per person per intent, seven line cap)"
  input: "Which single line an intent shows a person"
  person: any
  mode: automatic
  source: "the priority order and the cap of seven lines"
  minutes_without: 10
  minutes_with: 0
  basis: "estimate: deciding what to do first across projects"
  claim: "A busy intent cannot flood the page; the most urgent line wins and the count cut is shown"
- id: "13.waiting_on"
  spec: "13"
  journey: shared
  stage: run
  screen: "intent record (waiting_on: person, what, since)"
  input: "Whose turn it is and the one-line ask"
  person: any
  mode: derived
  agent: North
  source: "the stage and what the open stage needs"
  minutes_without: 10
  minutes_with: 0
  basis: "estimate: working out who has the ball"
  claim: "North writes whose turn it is when a stage opens or the turn passes"
