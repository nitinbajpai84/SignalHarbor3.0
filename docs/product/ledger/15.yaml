# Input ledger rows for spec 15: search and filters.
- id: "15.search"
  spec: "15"
  journey: shared
  stage: shared
  screen: "/centre/intent and /centre/intent/past (search box)"
  input: "Search by title, purpose, area, organiser or outcome"
  person: any
  mode: manual
  source: "the person's own words; matched only in fields the viewer's tier may read"
  minutes_without: 15
  minutes_with: 0.5
  basis: "estimate: searching email and folders for what was discussed"
  claim: "Any intent is found by what a person remembers, and a person only finds what they may see"
- id: "15.chips"
