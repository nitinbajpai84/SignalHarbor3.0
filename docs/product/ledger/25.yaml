- id: 25.w.cards
  spec: '25'
  journey: shared
  stage: think
  screen: /centre/intent/<id>/wall (own lane view)
  input: Up to three suggestion cards per lane, drafted from documents, the person's interview and the pack
  person: participant
  mode: derived
  agent: North
  source: company documents the person may see, the person's own interview and the industry pack
  minutes_without: 20
  minutes_with: 0
  basis: 'estimate: drafted while the room opens versus thinking of what to write'
  claim: North fills the first screen of a wall with dashed suggestions so nobody starts from a blank page
