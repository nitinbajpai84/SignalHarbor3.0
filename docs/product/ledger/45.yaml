- id: 45.list.build
  spec: '45'
  journey: shared
  stage: notice
  screen: GET /api/intents/waiting and GET /api/pulse
  input: The person's whole list of what waits on them across all intents
  person: any person
  mode: automatic
  agent: Nira
  source: every intent record that names the person
  minutes_without: 20
  minutes_with: 0
  basis: 'estimate: keeping a personal list of requests from email, chat and meetings'
  claim: Nira builds each person's list of everything waiting on them from the records
- id: 45.list.priority
  spec: '45'
  journey: shared
  stage: notice
  screen: Your turn strip and Pulse
  input: 'Order: signatures and decisions first, then due date, never by who asks'
  person: any person
  mode: automatic
  agent: Nira
  source: kind, due and source.at of each line
  minutes_without: 5
  minutes_with: 0
  basis: 'estimate: deciding what to do first from a mixed inbox'
  claim: The order is a rule on kind and date, never on who asked or how senior they are
