# Charter templates (spec section 8, M1-24). The organiser picks one in preparation; Nira writes the charter
# from the ticked clusters into it. Chosen (A-028): the spec names no templates, so these two are placeholders.
# Every charter line can show: the problem, the purpose, the priority and the number of notes.
default_template: standard
templates:
  - id: standard
    name: Standard charter
    description: Each line shows the problem, its purpose, its priority and how many notes back it.
    columns: [problem, purpose, priority, notes]
  - id: short
    name: Short charter
    description: Each line shows only the problem and its priority.
    columns: [problem, priority]
