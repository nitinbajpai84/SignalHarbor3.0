# LI-M1: how a person's one interview (sh_platform/interview, questions Q1-Q6) becomes note drafts in their private room.
# `kinds`: the kind of note each answer becomes (a kind of contracts/note_fields.yaml). Q3 (the numbers they watch) and Q6
# (what matters now) are statements of intent. A question that is not listed makes no draft. Wording is "chosen".
kinds:
  Q1: intent
  Q2: pain_point
  Q3: intent
  Q4: future_signal
  Q5: lever
  Q6: intent
max_cards: 6            # most note cards North writes from one conversation, in one go
from_label: "Interview with {name}"        # the source label every draft carries
cards_label: "North, from your conversation"
intro: "I have drafted {count} from your interview. Please keep, change or mark each one anonymous."
no_gaps: "That covers each kind of note, so I have no more questions. Add anything else in your own words."
no_cards_model: "North is not available right now, so no cards were written. You can write a note yourself."
no_cards_found: "North found nothing new to turn into a card yet. Tell North a little more, or write a note yourself."
