# How long module 1 keeps what it stores (D-017, M1-29). A setting per customer; every value below is "chosen":
# Nitin to confirm. Nothing is ever deleted on a schedule: a person with the right role approves each purge.
default:
  transcripts_days: 365     # a person's private conversation
  notes_days: 365           # submitted notes (and the apart-stored authors of them)
  requests_days: 365        # the log of requests made to North and Nira
guest_read_days_after_close: 30   # chosen: how long a seated guest's token still reads the charter and the board after the session closed
customers: {}               # company id -> any of the three values above, for a customer whose contract differs
