# ---- Everything below is M2-P04's own; the sections above are read from the template, not typed.
# The shape of catalogue.json is in SHARED.md. This file is the template's layout (tabs, columns, guidance, dropdown
# lists and formulas) plus the rules that fill and guard it. Descriptions only; never data.
ids:                     # stable ids, assigned once and never reused (M2-16)
  sources: {prefix: S, width: 2}
  tables: {prefix: T, width: 2}
  fields: {prefix: F, width: 3}
  extractions: {prefix: X, width: 3}    # the template numbers these X001, X002
quality_rules:          # IC-0d: data-quality facts module 3's scan found, a proposal beside a measure's signed entry (never an edit of it)
  file: quality_rules.json   # intents/m2_baseline/<baseline_id>/quality_rules.json = {rules: {kpi_id: [rule]}}; written by module 3, read here
  header: Quality rules (proposed by Lens)   # the KPI tab column that carries them: a cell {value: [text, ...], rules: [rule, ...], by: Lens, mark: guessed}
  rule:                  # one rule
    id: text             # stable per source, kind and column, so a scan again replaces the same rule
    source_id: text      # the catalogue Source ID it came from; null for a rule that belongs to no source (a missing benchmark). Who may see that source may see the rule
    kind: fill_rate | period_gap | missing_field | missing_benchmark
    column: text         # the column or field it is about
    text: text           # plain words
    figure: object       # the number found, e.g. {fill, empty, of} or {data_to, period_to}
    state: proposal | edited   # Lens writes proposal; a person's edit is never replaced by a scan again
    by: text             # Lens, or the person who edited it
    provenance: {from: text, at: text}   # the scan of that file, and when
export:
  last_row: 204          # the template's formulas and dropdowns run to this row
provenance_columns:      # filled from each row's provenance when read or exported, never typed
  how_sure: How sure are we
  by: Confirmed by
  at: Date confirmed
how_sure_words: {stated: Stated by a named person, guessed: Guessed, unknown: Unknown}
from_words:              # the "from" a cell carries, so a rebuild knows what a person already settled
  edited: edited in the catalogue
  settled: settled by a named person
  conflict: two owners answered differently
mapping:                 # kpis.json and answers.json words, to the template's dropdown words
  tracking: {tracked_now: Tracked today, partly: Will be tracked in future, not_tracked: Cannot be tracked}
  tracking_if_could_track: Can be tracked now
  structure: {structured: Structured, unstructured: Unstructured, both: Both}
  personal: {"yes": "Yes", "no": "No", not_sure: Not sure}
  kind:                  # the questionnaire's kind of system, to the template's Source type words
    excel: Manual workbook (Excel)
    email: Email with attachment
    database: "Database: other"
    file_drop: "File drop: CSV or Excel"
    portal: Third-party portal or API
    api: Third-party portal or API
    document_store: "Document store: unstructured"
    other: Other
  connection:            # only answers that ARE a dropdown word; "I download it" and "Typed in by hand" stay the owner's own words
    email_forward: Email forwarded to us
    api: API
    file_drop: Scheduled file drop
    database: Direct database connection
  table_kind: {email: Email type, document: Document type, file: File, table: Table}
governance:              # M2-05: only these answers are open; "Not sure", blank and anything unknown count as personal until someone confirms
  open_yes_no: ["No"]
  open_classes: [Neither]
conflict_cells:          # a key of a `sources` row of an answer (an old single answer reads as one row), to the cell two owners can disagree about, found by system
  - {row_key: structure, column: Structured or unstructured}
  - {row_key: frequency, column: How often it arrives}
  - {row_key: sla, column: Expected arrival time or SLA}
  - {row_key: connection, column: Connection method}
column_words:            # words a column name and a KPI may use for one thing (generic, not an industry's): used to suggest which KPI a column feeds
  - [pay, salary, bonus, compensation, wage, payroll, remuneration]
  - [return, performance, alpha]
  - [benchmark, index]

