# Template asset_management@1 column synonyms (V3-13), same schema as insurance@1's
# column_synonyms.yaml. Seeded ONLY from spellings actually found in this repo's own
# asset-management source contracts (contracts/sources/asset_management/awm_*.source.yaml) --
# no discovery profile exists yet for the star-asset-management workspace. Every spelling carries
# its own source; where no spelling has been seen (every field of the nine proposal feeds), the
# synonym list is empty rather than invented and the regex is the canonical field id only.
#
# Regex patterns are plain, case-insensitive, anchored alternations of the known spellings -- no
# attempt to guess spellings that have not been seen in this pack's sources.
template: asset_management@1
status: proposed
feeds:
  portfolios:
    portfolio_code:
      spellings:
        - spelling: portfolio_code
          source: "contracts/sources/asset_management/awm_portfolios.source.yaml schema[0].name"
      regex: "^(?i:portfolio_code)$"
    portfolio_name:
      spellings:
        - spelling: portfolio_name
          source: "contracts/sources/asset_management/awm_portfolios.source.yaml schema[1].name"
