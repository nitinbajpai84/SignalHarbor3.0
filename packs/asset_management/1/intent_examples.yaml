# Template asset_management@1 -- prompts/examples for catalogue_chat intent capture.
template: asset_management@1
examples:
  - "Grow AUM by 5% next quarter through net flows, not market movement."
  - "Understand why fee yield declined this quarter."
  - "Improve client retention in the under-performing segment."
# Plain examples of the other three things North and the note form ask about, shown to a person as "Industry practice
# (suggestion)" and never as the company's own list. Wording from this pack's own measures.
pain_point_examples:
  - "Net flows reach us late and by hand, so the monthly view is out of date."
  - "We cannot explain why fee yield fell without a long manual analysis."
  - "Client concentration is not visible until a large client redeems."
future_signal_examples:
  - "Market moves that change assets under management without any client action."
  - "Peer fee changes and flow data published by the industry."
  - "Redemption trends in the largest client segments."
lever_examples:
  - "Change distributor coverage, and watch gross subscriptions and net flows."
  - "Change the fee schedule for a fund, and watch fee yield and redemptions."
