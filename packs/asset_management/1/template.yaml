# Template asset_management@1 (design section 3.1 and section 0). Star Asset Management is
# provisioned in `clean` mode (design section 3.2's worked example) with the `asset_management`
# domain registered and empty (Addendum A.2, OQ-6) -- clean mode installs only role labels, skill
# overlays and the glossary (section 3.2), never this template's kpi_tree/intent_examples, so
# those two files exist here for a FUTURE starter/demo instantiation, not for Star Asset
# Management's own provisioning.
#
# Status is `proposed`, not `approved` (OQ-5 is still open, per kpi_tree.yaml): CLAUDE.md rule 4
# and design section 3.4 -- an unapproved template stays out of provision.list_templates()'s
# default (approved-only) listing. provision_workspace() itself still accepts it when called
# directly (e.g. by scripts/sh/seed_dev_users.py's caller, a human operator, per this build's
# task), logging a warning -- the sign-off gate is the LISTING default, not a hard block on an
# operator who already knows what they are doing.
