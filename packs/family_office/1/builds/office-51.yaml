# Persona builds of the office domain for use cases 51 to 100 (docs/v3/w1/build51-office.md): the twenty cards built on the real pack readers (84 on the rates signed in A57, 96 on the rework minutes signed in A51). Merged with role_builds.yaml by role id (docs/test/uc-live/uc6-scripts/v3_persona.py).
# files: "office6m:<glob under tests/v1/fixtures/office6m>". check.expect: copied from tests/v1/fixtures/office6m/answer_keys.yaml, never computed.
# uc-082 also lists the 13 Oct fixing file: the key puts SGD into USD at 1.3400, which is that day's fixing.
template: family_office@1
roles:
  - id: hr_admin
    builds:
      - id: uc-052-insurance
        title: "Insurance policies and renewals"
        say: "Our policies renew once a year and the broker's schedule is the list. Show me which policies renew in the next 60 days, what each insures and costs, and whether the insurer's renewal notice has come, so I can draft the renewal request for the Principal."
        files: ["office6m:*/insurance_schedule/insurance_schedule_2026-10-01.pdf", "office6m:*/insurance/*_renewal.pdf"]
        skills: ["data.read-pdf-fields", "action.detect-exception", "action.draft-message"]
        dashboard: "Policies by renewal date with sum insured, premium and the notice received"
        check: {ask: "Which policies expire in the next 60 days and what is each worth?", expect: ["POL-LIAB-03", "POL-CYB-04", "10,000,000", "1,000,000", "2026-11-01", "2026-12-01"]}

      - id: uc-081-payroll
        title: "Household and office payroll"
        say: "Before the pay file goes I compare the draft run with last month: net pay, the employer's CPF, the total and the change. Any line not on the staff register or with a changed gross stops the file until the CFO has seen it. Check that last month's net actually left the bank."
        files: ["office6m:*/payroll_drafts/payroll_run_2026-10_draft.xlsx", "office6m:*/payroll/payroll_2026-09.xlsx", "office6m:*/bank_statements/HB_HOLD_SGD_2026-09.xlsx"]
        skills: ["data.recognise-file", "check.against-source", "action.detect-exception", "action.route-owner"]
        dashboard: "Draft run against last month, flagged lines and the release decision"
        check: {ask: "Whether to release the pay file", expect: ["100,224", "21,297.6", "121,521.6", "113,199", "93,360", "7.35", "Jun Tan"], must_have_verdict: true}

      - id: uc-082-covergap
        title: "Insurance cover against what we own"
        say: "Once a year I check that our homes, art and other assets are insured for what they are worth. Put the latest appraisal of each asset beside the sum insured of the policies that name it, both in USD, and show me the gap, so I can take it to the Principal."
        files: ["office6m:*/insurance_schedule/insurance_schedule_2026-10-01.pdf", "office6m:*/property_valuations/valuation_RA-*.pdf", "office6m:*/fx_rates/fx_usdsgd_20261013.csv"]
        skills: ["data.read-pdf-fields", "check.against-source", "consume.answer-question"]
        dashboard: "Assets with appraisal, sum insured and the gap in USD"
        check: {ask: "Whether to raise or lower cover", expect: ["-9,647,014.92", "-820,895.52", "-4,776,119.4", "Hillcrest House", "Fine art collection"], must_have_verdict: true}

      - id: uc-091-jml
        title: "Joiner, mover, leaver access"
        say: "When someone joins or leaves, HR mails Anita what to give and what to take away. Check the access register against that mail: which grants have no approver, what the leaver still holds and what the joiner has that nobody asked for."
        files: ["office6m:*/access_register/access_register_2026-10-13.csv", "office6m:*/access_register/2026-10-02_joiner_leaver.eml"]
        skills: ["intent.set-access", "action.route-owner", "action.close-with-reason"]
        dashboard: "Grants without an approver, the leaver's access to remove and the joiner's extra access"
        check: {ask: "Which access to give or remove", expect: ["Sam Lee", "Wei Tan", "J. Ng", "Harbour Bank portal", "Shared drive"]}

      - id: uc-092-accessrev
        title: "Quarterly access review"
        say: "Every quarter the Principal attests who can see what. List every grant on the register and the ones nobody has used in more than 90 days, so the Head of Data can remove them."
        files: ["office6m:*/access_register/access_register_2026-10-13.csv"]
        skills: ["intent.set-access", "action.detect-exception", "action.route-owner"]
        dashboard: "Grants by person with the days since last use"
        check: {ask: "Which access to remove", expect: ["Anita Rao", "Custody portal", "168", "146", "132"]}

      - id: uc-095-sopreview
        title: "SOPs not reviewed in a year"
        say: "Each quarter I check our written procedures. Show me each one with its owner and when it was last reviewed, and which are more than a year old, so I can assign the reviews."
        files: ["office6m:*/sops/sop_*.md"]
        skills: ["action.detect-exception", "action.route-owner"]
        dashboard: "Procedures by days since the last review"
        check: {ask: "Which procedures to review", expect: ["Open or change a bank account", "Vendor payment run", "Payroll release", "681", "480", "378"]}

      - id: uc-089-expapp
        title: "Expense approval and sign-off rules"
        say: "Every payment in the expense ledger names who approved it, and each of us has a signed limit. Show me every payment approved above the approver's limit, in USD at the day's fixing, and how many each of us approved."
        files: ["office6m:*/expense_ledger/expense_ledger_2026-04_to_2026-09.xlsx", "office6m:reference/office_rules.csv"]
        skills: ["check.against-source", "action.detect-exception", "action.route-owner"]
        dashboard: "Payments over the approver's limit, and approvals by person"
        check: {ask: "Which approval limits to set and who may approve", expect: ["BAL-2026-051", "LL-2026-0708", "16,662.93", "38,000", "Priya Nair", "10,000"]}

      - id: uc-100-famaccess
        title: "What each family member can see"
        say: "Each family member sees the reports the signed family access policy allows. Put what each is given beside what the policy allows, show me anyone who sees more than allowed, and tell me whether Maya's request for the Holdings report fits the policy."
        files: ["office6m:*/family_access/*"]
        skills: ["intent.set-access", "action.detect-exception", "action.route-owner"]
        dashboard: "Views granted against the policy, per member and entity"
        check: {ask: "What each family member may see", expect: ["Wen Chen", "Entity B", "Maya Chen", "Evergreen Holdings", "summary"]}

  - id: ops_lead
    builds:
      - id: uc-093-onbmgr
        title: "Onboard a new manager"
        say: "We just committed to a new fund. Before the first call I need every item of the onboarding checklist in place: contacts, KYC pack, subscription document, bank details confirmed by call-back and the statement schedule. Tell me what is missing."
        files: ["office6m:*/onboarding/*"]
        skills: ["action.detect-exception", "action.route-owner"]
        dashboard: "Checklist items of the new manager, complete and missing"
        check: {ask: "Whether every document and feed is in place before the first call", expect: ["Bank details confirmed by call-back", "Statement schedule"], must_have_verdict: true}

  - id: risk_officer
    builds:
      - id: uc-097-kycrefresh
        title: "Know-your-client documents expiring"
        say: "Banks and managers freeze an account when a KYC document lapses. Show me every KYC document with its expiry, the ones that expire in the next 90 days and the ones already expired, so I can ask the owner for a new one."
        files: ["office6m:*/kyc_register/kyc_register_2026-10-13.csv", "office6m:*/kyc_register/kyc_pack_Evergreen_Holdings_2026.pdf"]
        skills: ["action.detect-exception", "action.draft-message"]
        dashboard: "KYC documents by days to expiry"
        check: {ask: "Which documents to refresh before the bank or manager freezes the account", expect: ["2026-11-14", "2026-12-02", "2027-01-05", "2026-09-12", "-31", "Daniel Foo"]}

  - id: head_of_data
    builds:
      - id: uc-098-wordlist
        title: "Keep the office words in step with the model"
        say: "The team keeps using words that are not on our word list. Show me every word proposed in mails and meeting notes, which are already on the list as a term or an alias, and which I should add."
        files: ["office6m:*/glossary/*"]
        skills: ["consume.understand-words", "knowledge.learn-word"]
        dashboard: "Words proposed, already on the list and to add"
        check: {ask: "Whether to add a word to the language list", expect: ["side letter", "stub period", "capital account", "dry powder"], must_have_verdict: true}

      - id: uc-096-automation
        title: "Which processes to automate next"
        say: "Each quarter I rank our written procedures by the time they take and how often they fail. Put every procedure's manual minutes a month, its runs, and the failures of the last six months (at 45 minutes of rework each) side by side, and tell me which to automate next."
        files: ["office6m:*/sops/sop_*.md", "office6m:*/exception_log/exception_log_2026-10-13.csv", "office6m:received_log_all.csv"]
        skills: ["intent.draw-process-steps", "action.detect-exception", "consume.build-board"]
        dashboard: "Procedures ranked by score, with minutes, runs, failures and the slowest manual step"
        check: {ask: "Which process to automate", expect: ["Bank statement chase", "2,040", "1,935", "1,395", "Chase late or missing ones", "Collect manager statements"]}

  - id: fund_accountant
    builds:
      - id: uc-083-taxcal
        title: "Tax calendar"
        say: "The tax calendar lists every filing and payment of our three entities and who prepares it. Show me what falls due in the next 60 days and anything past its date that is not filed."
        files: ["office6m:*/tax_calendar/tax_calendar_2026-27.xlsx", "office6m:*/tax_notices/eci_notice_EG-HOLD_2026.pdf"]
        skills: ["data.recognise-file", "action.detect-exception", "action.route-owner"]
        dashboard: "Tax items by due date, the next 60 days and the overdue ones"
        check: {ask: "Which filings and payments are due and who prepares them", expect: ["TX-01", "TX-02", "TX-04", "2026-11-30", "2026-09-30", "Summit Tax Advisory"]}

      - id: uc-087-trustdist
        title: "Trust distributions to beneficiaries"
        say: "The deed lets the trustees pay out part of the trust's distributable income, split by each beneficiary's share, and the allowances count. Work out this trust year's income less costs, each beneficiary's room and what has been paid, and flag anyone paid beyond the deed."
        files: ["office6m:*/trust_deed/evergreen_family_trust_deed.pdf", "office6m:*/administrator_cash/administrator_cash_2026-10_mtd.csv", "office6m:*/family_allowances/allowance_schedule_2026-*.xlsx"]
        skills: ["data.read-pdf-fields", "check.adds-up", "action.detect-exception"]
        dashboard: "Room, paid and left per beneficiary under the deed"
        check: {ask: "Whether the trust pays what its deed allows", expect: ["504,980.42", "46,001.31", "321,285.38", "25,702.83", "-2,297.17", "Wen Chen"], must_have_verdict: true}

      - id: uc-084-taxest
        title: "Estimated tax for the year"
        say: "Each quarter I set cash aside for tax. For each entity take the income received since 1 April (coupons, dividends, bank interest and income distributions) and the gains on the lots sold, times the signed 2026 rates, less the tax the managers withheld on distributions, and tell me how much to set aside. Say where an entity's income is short because a bank statement never arrived."
        files: ["office6m:*/tax_calendar/tax_calendar_2026-27.xlsx", "office6m:*/realised_lots/realised_lots_2026-10-13.csv", "office6m:*/notices/*_distribution.pdf"]
        skills: ["build.write-formula-table", "action.detect-exception", "consume.answer-question"]
        dashboard: "Income, realised gains, rates, credits and the cash to set aside by entity"
        check: {ask: "How much cash to set aside for tax", expect: ["244,440.48", "504,980.42", "361,740", "41,554.88", "114,858.65", "29,054.88", "89,664.6", "15,242.98", "159,156.51"]}

  - id: principal
    builds:
      - id: uc-085-grants
        title: "Philanthropy: budget used"
        say: "We set a grants budget for the year. Show me what is paid and pledged against it, what is left, and whether the paid grants agree with the bank."
        files: ["office6m:*/grant_ledger/grant_ledger_2026.xlsx", "office6m:*/bank_statements/HB_HOLD_USD_2026-0[5-9].xlsx"]
        skills: ["check.against-source", "consume.answer-question"]
        dashboard: "Paid and pledged grants against the budget"
        check: {ask: "Whether to approve more grants this year", expect: ["300,000", "175,000", "90,000", "265,000", "88.3", "35,000"], must_have_verdict: true}

      - id: uc-086-grantappr
        title: "Approve a grant payment"
        say: "Before I pay a grant I check three things: it fits what is left of the budget, the charity has been registered long enough, and Holdings keeps its cash buffer after the calls due. Check this request and tell me whether to pay it."
        files: ["office6m:*/grant_requests/grant_request_REQ-2026-06.pdf", "office6m:*/grant_requests/2026-10-09_REQ-2026-06.eml", "office6m:*/grant_ledger/grant_ledger_2026.xlsx"]
        skills: ["check.against-source", "action.detect-exception", "action.suggest-next-step"]
        dashboard: "The request against budget, charity age and cash"
        check: {ask: "Whether to pay the grant", expect: ["REQ-2026-06", "50,000", "35,000", "1,230,000", "1,250,000", "-70,000"], must_have_verdict: true}

      - id: uc-088-estateliq
        title: "Cash for an estate or transfer tax"
        say: "If the estate passed today, the adviser's memo says transfer tax is due above an exemption. Value what the family owns, work out the tax and tell me whether the liquid assets after the loan could pay it."
        files: ["office6m:*/trust_deed/evergreen_family_trust_deed.pdf", "office6m:*/estate_planning/transfer_tax_memo_2026.pdf", "office6m:*/property_valuations/valuation_RA-*.pdf"]
        skills: ["data.read-pdf-fields", "check.adds-up", "consume.answer-question"]
        dashboard: "Estate, transfer tax and the liquid assets that cover it"
        check: {ask: "Whether the family could meet a transfer tax from liquid assets", expect: ["131,306,339.91", "109,960,000", "18,945,950.99", "55,879,741.41", "2.95"], must_have_verdict: true}

  - id: cfo
    builds:
      - id: uc-090-offcost
        title: "What the office costs"
        say: "The Principal set the year's office budget by category in April. Put the expense ledger of April to September beside half of it, in USD, and show me which categories are over."
        files: ["office6m:*/expense_ledger/expense_ledger_2026-04_to_2026-09.xlsx", "office6m:*/office_budget/office_budget_2026.xlsx"]
        skills: ["check.against-source", "check.explain-difference", "consume.answer-question"]
        dashboard: "Cost by category against the budget for the half year"
        check: {ask: "Whether the office costs more than planned", expect: ["1,463,862.76", "1,455,850", "78,252.48", "35,752.48", "Professional fees", "Grants"], must_have_verdict: true}

      - id: uc-094-onbbank
        title: "Open or change a bank or custody account"
        say: "No account opens until its signatories meet our signing policy. Check the opening form's signatories against the policy and tell me who is missing."
        files: ["office6m:*/bank_forms/*"]
        skills: ["data.read-pdf-fields", "check.against-source", "action.detect-exception"]
        dashboard: "Signatories on the form against the signing policy"
        check: {ask: "Whether the account and its signatories are approved", expect: ["Raj Patel", "Grace Ong", "Daniel Foo"], must_have_verdict: true}
