        - {month: "2026-09", kind: decision, text: "Confirmed that the pay-related measures stay restricted to a named list."}
  company:
    north:
      - {month: "2026-04", kind: fact, text: "The family council reads the committee pack the week before each meeting."}
      - {month: "2026-04", kind: preference, text: "Leadership prefers a one-page summary ahead of any detail."}
      - {month: "2026-05", kind: decision, text: "Evidence coverage and stale valuations are reviewed together each month."}
      - {month: "2026-06", kind: fact, text: "The custodian file lands first each month and other sources wait on it."}
      - {month: "2026-07", kind: decision, text: "Private-market allocation is reported gross; unfunded commitments stay separate."}
      - {month: "2026-08", kind: preference, text: "Benchmark comparisons use the index each manager reports against."}
      - {month: "2026-08", kind: fact, text: "The fee schedule has no single owner yet and several copies exist."}
      - {month: "2026-09", kind: open, text: "Why did evidence coverage fall sharply in September: missing statements or a real change?"}
    lens:
      - {month: "2026-04", kind: fact, text: "Measure definitions were first drafted from the industry pack and the glossary."}
      - {month: "2026-05", kind: decision, text: "Each measure owner confirmed their definition at the baseline review."}
      - {month: "2026-05", kind: preference, text: "Owners want definitions in plain words with the formula underneath."}
      - {month: "2026-06", kind: fact, text: "Cash is counted once at the consolidated level in coverage measures."}
      - {month: "2026-08", kind: decision, text: "The benchmark rule for manager performance changed after an accepted suggestion."}
      - {month: "2026-09", kind: fact, text: "A valuation counts as stale after one quarter without a final statement."}
      - {month: "2026-09", kind: open, text: "Should the fee schedule become its own source with a named owner?"}

# Model calls in the egress log: counts only (module, bytes); the host is a placeholder, not a real provider.
egress:
  host: model-provider.example
  day: 10
  calls: [{module: north, bytes: 2140}, {module: lens, bytes: 3380}, {module: nira, bytes: 910}, {module: profile, bytes: 1820}, {module: m2_baseline, bytes: 2630}]
