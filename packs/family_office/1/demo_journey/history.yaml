        - {month: "2026-06", kind: preference, text: "Likes to confirm a definition in writing before it goes on the map."}
        - {month: "2026-09", kind: open, text: "Does look-through exposure count towards single-issuer concentration?"}
    - role: "name:Katie Menon"
      entries:
        - {month: "2026-05", kind: fact, text: "Pastes benchmark index levels into the performance workbook by hand."}
        - {month: "2026-07", kind: preference, text: "Prefers questions that can be answered from a file she already holds."}
        - {month: "2026-08", kind: decision, text: "Named as the tester who signs each measure's acceptance."}
    - role: "name:Grace Ward"
      entries:
        - {month: "2026-05", kind: fact, text: "Approves who may see the restricted measures."}
