    - {id: unit, label: unit, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: origin, label: derived_snapshot or synthetic_illustration, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: source_reference, label: where the value came from, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: probable_real_source, label: where a real value would come from, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: required, label: required, type: boolean, required_for: [], pii: false, fallback: not_computable}
    - {id: basis, label: always "synthetic illustration", type: varchar, required_for: [], pii: false, fallback: not_computable}
