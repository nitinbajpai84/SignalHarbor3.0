# Template family_office@1 logical feeds: one feed per table of the synthetic workbook
# (Family Office Data/Family_Office_Test_Data.xlsx), fields and types copied from its own
# data_dictionary sheet. required_for lists only the KPI ids (kpi_tree.yaml) whose formula in
# Signal_Harbor_Intent_Test_Pack/KPI_Catalog.json emitters/family_office.py computes from that
# field. fallback is not_computable everywhere: a missing input is never defaulted (CLAUDE.md
# rule 4; Agent_Specifications.md 'missing is not zero'). pii is false: the pack is synthetic.
