  # FO-08: a synthetic supplement, not a workbook table. Invented fee rates, generated by the seed
  # and labelled "synthetic illustration" wherever shown. No measure reads it.
  holding_fees:
    source: "scripts/sh/seed_family_office.py (_fee_rows): synthetic illustration; the workbook records no fee for an existing holding"
    fields:
    - id: investment_id
      label: investment id
      type: varchar
      required_for: []
      pii: false
      fallback: not_computable
    - id: annual_fee_pct
      label: annual fee as a fraction of value (invented)
      type: double
      required_for: []
      pii: false
      fallback: not_computable
    - id: basis
      label: always "synthetic illustration"
      type: varchar
      required_for: []
      pii: false
      fallback: not_computable
  # FO-11: synthetic supplements for existing holdings. Invented or re-stated by the seed, labelled
  # "synthetic illustration" wherever shown. No measure reads either table.
  holding_theses:
    source: "scripts/sh/seed_family_office.py (_thesis_rows): synthetic illustration; the workbook records no thesis for any holding"
    fields:
    - {id: investment_id, label: investment id, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: thesis_summary, label: why the holding is held (invented), type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: key_assumptions, label: what the thesis rests on (invented), type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: review_triggers, label: what would prompt a review (invented), type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: recorded_on, label: date the illustration is dated, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: basis, label: always "synthetic illustration", type: varchar, required_for: [], pii: false, fallback: not_computable}
  holding_decision_inputs:
    source: "scripts/sh/seed_family_office.py (_holding_input_rows): the shape of the workbook's decision_inputs, one set per holding; origin says which values are from the workbook (derived_snapshot) and which are invented (synthetic_illustration)"
    fields:
    - {id: input_id, label: input id, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: investment_id, label: investment id, type: varchar, required_for: [], pii: false, fallback: not_computable}
    - {id: dimension, label: decision dimension, type: varchar, required_for: [], pii: false, fallback: not_computable}
