pain_point_examples:
  - "Preparing the investment meeting pack takes too much manual effort every month."
  - "We cannot trust one consolidated picture across the entities."
  - "Capital call notices arrive as documents, so nobody sees them in time to plan the cash."
future_signal_examples:
