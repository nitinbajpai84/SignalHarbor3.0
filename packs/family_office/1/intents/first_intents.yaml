# Suggestions only: what others in a family office usually start with. Illustrative words, no figures, no names.
# `type` is the record key (pulse is shown as Weekly check-in). Nothing here belongs to a company until a person picks it up.
suggestions:
  - id: fo-initiative-family-reporting
    type: initiative
    title: Report to the family on one page every quarter
    purpose: One trusted set of numbers for the family instead of several files
    areas: [investments, finance]
    why: Offices that rebuild the family report by hand each quarter often start here
    start_answers:
      i1: Report to the family each quarter with one set of numbers
      i3: not_sure
  - id: fo-checkin-operations
    type: pulse
    title: Weekly check-in for operations
    purpose: Hear each week what ran, what broke and what is on people's minds
    areas: [operations]
    why: A short weekly look at operations is how many offices find small problems early
    start_answers: {}
  - id: fo-decision-custodian
    type: decision
    title: Decide whether to consolidate custodians
    purpose: Record one decision on custodian consolidation with the options considered
    areas: [operations, investments]
    why: Offices with several custodians often settle this once, in writing
    start_answers:
      d1: Whether to consolidate custodians
