# Recipes of one domain (family-office pack). Format, snippets and the rules are in recipes/_shared.yaml; assumptions A7, A8 and A11 onward, in docs/v3/ASSUMPTIONS.md.
# status: stub = named and scoped but not built (sql: null): the loader skips it until the owner of this file fills in sql, grain, measure, columns
# and tie_out and removes `status: stub`. cards = the use-case cards (docs/v3/USE-CASES-100.md numbers) that need it.
recipes:
  - id: cash_by_entity
    label: Cash by entity
    names: [cash by entity, cash position, cash balance, closing cash, cash on hand, cash]
    may_read: [position_snapshots, instruments, portfolios, legal_entities, bank_accounts]
    never_read: [commitments, transactions, cash_movements]
    why: The administrator's cash is a balance, a position snapshot of the cash instrument. A movement is a change in a balance, never the balance.
    formula: Cash = the market value of the cash instrument's position snapshots, summed by entity and date. The instruments of the office's own bank accounts (bank_accounts.cash_instrument_id) are left out, because a bank balance is another source for the same cash and would be counted twice.
    grain: By entity and position date
    sql: >-
      create table {name} as with {positions} select e.entity_name as entity, l.position_date, l.currency, cast(sum(l.source_market_value) as decimal(18,2)) as cash
      from positions as l join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      join legal_entities as e on e.id = p.legal_entity_id where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id) group by all
    measure: cash
    columns:
      cash: The cash the administrator reports at the end of the day.
    tie_out:
      label: Cash equals the cash positions of the position snapshots for the same dates
      sql: >-
        select (select coalesce(sum(cash), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c join instruments as i on i.id = c.instrument_id
        and i.instrument_type = 'cash' join portfolios as p on p.id = c.portfolio_id join legal_entities as e on e.id = p.legal_entity_id
        where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id))

  - id: cash_break
    label: Cash break
    names: [cash break, cash breaks, cash difference, cash differs, cash reconciliation, cash variance, break]
    words_all: [[cash], [break, breaks, variance, difference, differences, differs, mismatch]]
    may_read: [position_snapshots, cash_movements, instruments, portfolios, legal_entities]
    never_read: [commitments, transactions]
    why: A break is the administrator's change in cash set against the movements that should explain it. It is never the plain sum of the movements.
    formula: Break of a day = the administrator's closing cash of the day, less its closing cash on the day before it (its previous snapshot date), less the sum of the cash movements recorded on the same portfolios after that earlier date up to the day. Money in is positive. Zero means the two sources agree; the break of one day is never carried into the next. The administrator's cash is its own balance, not the office's bank accounts and not a cash line the desk derived.
    grain: By entity and day
    sql: >-
      create table {name} as with {positions},
      bal0 as (select p.legal_entity_id as entity_id, e.entity_name as entity, l.portfolio_id, l.position_date, l.currency, l.source_market_value as v
      from positions as l join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      join legal_entities as e on e.id = p.legal_entity_id where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id)
      and coalesce(lower(l.data_status), '') <> 'derived'),
      bal as (select entity_id, entity, position_date, currency, sum(v) as closing_cash from bal0 group by all),
      step as (select b.*, lag(b.position_date) over w as prev_date, lag(b.closing_cash) over w as prev_cash from bal as b window w as (partition by b.entity_id, b.currency order by b.position_date)),
      held as (select distinct portfolio_id from bal0),
      mv as (select p.legal_entity_id as entity_id, m.currency, m.effective_date, sum(m.amount) as moved from cash_movements as m
      join portfolios as p on p.id = m.portfolio_id where m.portfolio_id in (select portfolio_id from held)
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id) group by all),
      moved as (select s.entity_id, s.currency, s.position_date, coalesce(sum(mv.moved), 0) as moved from step as s
      left join mv on mv.entity_id = s.entity_id and mv.currency = s.currency and mv.effective_date > s.prev_date and mv.effective_date <= s.position_date where s.prev_date is not null group by all)
      select s.entity, s.position_date as day, s.currency, cast(s.closing_cash as decimal(18,2)) as closing_cash,
      cast(s.closing_cash - s.prev_cash as decimal(18,2)) as cash_change, cast(m.moved as decimal(18,2)) as movements,
      cast(s.closing_cash - s.prev_cash - m.moved as decimal(18,2)) as cash_break
      from step as s join moved as m on m.entity_id = s.entity_id and m.currency = s.currency and m.position_date = s.position_date
    measure: cash_break
    columns:
      closing_cash: The administrator's closing cash of the day.
      cash_change: The administrator's closing cash less its closing cash on its previous snapshot date.
      movements: The cash movements recorded on the same portfolios after the previous snapshot date, up to the day.
      cash_break: The cash change less the movements. Zero when the two sources agree.
    tie_out:
      label: The administrator cash in the break equals the administrator cash positions of the position snapshots for the same entities, currencies and days
      sql: >-
        select (select coalesce(sum(closing_cash), 0) from {name}), (select coalesce(sum(s.source_market_value), 0) from position_snapshots as s join instruments as i on i.id = s.instrument_id
        and i.instrument_type = 'cash' join portfolios as p on p.id = s.portfolio_id join legal_entities as e on e.id = p.legal_entity_id
        where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id) and coalesce(lower(s.data_status), '') not in ('derived', 'carried forward')
        and not exists (select 1 from position_snapshots as x where x.supersedes_position_id = s.id)
        and exists (select 1 from {name} as t where t.entity = e.entity_name and t.currency = s.currency and t.day = s.position_date))
    needs:   # an input with no rows: the figure is held at Decision 3, never stated (c6 ops_lead: with no movements the break was the plain change in cash)
      - why: No cash movements are loaded for the portfolios whose cash the administrator reports, so the break would only be the change in that cash, not a break.
        sql: >-
          select count(*) from cash_movements as m where m.portfolio_id in (select s.portfolio_id from position_snapshots as s
          join instruments as i on i.id = s.instrument_id and i.instrument_type = 'cash')
          and m.effective_date > (select min(s.position_date) from position_snapshots as s join instruments as i on i.id = s.instrument_id and i.instrument_type = 'cash')

  - id: fx_confirmation_variance
    label: FX forward confirmation variance
    names: [fx forward confirmation variance, fx confirmation variance, fx forward confirmation, fx confirmation, confirmation variance, fx forward difference, confirmation differs]
    words_all: [[fx, forward, forwards], [confirmation, confirmations, confirm], [differ, differs, difference, variance, mismatch, match]]
    may_read: [fx_confirmations, transactions, instruments, instrument_identifiers]
    never_read: [commitments, cash_movements, position_snapshots]
    why: A confirmation is checked against the trade the desk booked, by the trade reference, leg for leg. Cash balances and commitments say nothing about it.
    formula: For each confirmation (the latest row for the trade reference), find the desk's trade by the same reference (its trade id, or the identifier of its instrument). Take the confirmation's leg in the trade's currency and compare it with the trade's cash amount (absolute). Variance = confirmation leg less trade amount.
    grain: By trade reference
    sql: >-
      create table {name} as with conf as (select c.* from fx_confirmations as c where not exists (select 1 from fx_confirmations as x where x.supersedes_fx_confirmation_id = c.id)),
      trade as (select t.id, t.external_trade_id, t.trade_date, t.currency, abs(t.cash_amount) as trade_amount, t.instrument_id from transactions as t
      where t.supersedes_transaction_id is null and not exists (select 1 from transactions as x where x.supersedes_transaction_id = t.id)),
      ref as (select t.id as trade_id, t.external_trade_id as ref from trade as t union select t.id, x.identifier_value from trade as t
      join instrument_identifiers as x on x.instrument_id = t.instrument_id)
      select c.trade_reference, c.trade_date, c.counterparty, t.currency, cast(case when c.currency_bought = t.currency then c.amount_bought
      when c.currency_sold = t.currency then c.amount_sold end as decimal(18,2)) as confirmed_amount, cast(t.trade_amount as decimal(18,2)) as trade_amount,
      cast(case when c.currency_bought = t.currency then c.amount_bought when c.currency_sold = t.currency then c.amount_sold end - t.trade_amount as decimal(18,2)) as variance
      from conf as c join ref as r on r.ref = c.trade_reference join trade as t on t.id = r.trade_id
    measure: variance
    columns:
      confirmed_amount: The confirmation's amount in the currency of the desk's trade.
      trade_amount: The desk's trade amount, as a positive number.
      variance: The confirmed amount less the trade amount. Zero when they agree.
    tie_out:
      label: Every confirmation is compared once with a trade
      sql: >-
        select (select count(distinct trade_reference) from {name}), (select count(distinct c.trade_reference) from fx_confirmations as c
        where exists (select 1 from transactions as t where t.external_trade_id = c.trade_reference)
        or exists (select 1 from transactions as t join instrument_identifiers as x on x.instrument_id = t.instrument_id where x.identifier_value = c.trade_reference))

  # ---- W1 cash builder: the stubs of cards 2, 4, 5, 6, 8, 10, 18, 28, 37 are built below (liquidity_ladder and cash_forecast, cards 54 and 72, stay stubs).
  # Two recipes are new: call_fee_check (card 2 figure fee_part_check) and calls_due (card 3 figure calls_due); fx_rate_check (card 6, the bank's rate against the fixing) was added in wave 2.
  # Where a recipe needs a signed office rule, business_rules and rule_versions are added to may_read (the stub lists did not name them); the rule is read, never typed (docs/v3/ASSUMPTIONS.md A20).
  # Wave 2 (verifier fixes): an unpaid call that is past due stays in the calls (open = noticed or expected, or recorded with a due date not yet passed); every date is the entity's own latest cash date;
  # a rule that is not signed gives an empty figure ("not on record"), never zero; the administrator's cash excludes the instruments of the office's own bank accounts (no double count).
  # Shadow commitment rows (live r1, uc-007): a row with no register source, no called figure and no call movement, in a fund whose other rows state a called figure, is a placeholder
  # for a commitment the register already holds (it would add its whole amount as unfunded); it is left out. ponytail: a genuinely new commitment recorded by hand in a fund with register siblings is left out until it has a call or a register line.
  - id: called_to_date
    label: Called to date and unfunded
    cards: [2, 36]
    names: [called to date, unfunded after call, capital called, uncalled commitments, unfunded commitments, unfunded commitment after call, unfunded commitment after the call]
    words_all: [[fit, fits, within], [commit, committed, commitment]]  # "does call 7 fit what we committed" (w6)
    may_read: [cash_movements, commitments, instruments, legal_entities]
    never_read: [position_snapshots, transactions]
    why: A call is a cash movement of type call linked to its commitment; the commitment file states the called amount at its own date. Cash balances say nothing about what was called.
    formula: Called before the notice = the called amount the commitment file states at its as-at date, plus the confirmed call movements after that date in the commitment's currency. A noticed call not yet recorded is added for "after the notice". Unfunded = commitment less called. A noticed call larger than the unfunded amount before it does not fit, and neither does a call in another currency than the commitment (calls_in_other_currency counts them; they are not added).
    grain: By commitment (fund and investor entity)
    sql: >-
      create table {name} as with cur as (select c.* from commitments as c where not exists (select 1 from commitments as x where x.supersedes_commitment_id = c.id) and not (c.source_record_id is null and c.called_to_date is null and not exists (select 1 from cash_movements as m where m.commitment_id = c.id) and exists (select 1 from commitments as r where r.instrument_id = c.instrument_id and r.called_to_date is not null))),
      mv as (select m.*, c.currency as commit_currency from cash_movements as m join cur as c on c.id = m.commitment_id where m.movement_type = 'call' and m.confirmation_status <> 'cancelled'
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      conf as (select c.id as commitment_id, coalesce(sum(abs(m.amount)) filter (where m.confirmation_status = 'confirmed' and m.currency = c.currency
      and m.effective_date > coalesce(c.called_as_at, date '1900-01-01')), 0) as since_stated,
      count(m.id) filter (where m.currency <> c.currency) as other_currency_calls from cur as c left join mv as m on m.commitment_id = c.id group by c.id),
      nt as (select m.commitment_id, sum(abs(m.amount)) filter (where m.currency = m.commit_currency) as noticed, min(m.due_date) as due_date from mv as m
      where m.confirmation_status = 'noticed' group by m.commitment_id),
      base as (select c.id as commitment_id, c.legal_entity_id, e.entity_name as investor, i.canonical_name as fund, c.currency, c.commitment_amount as commitment,
      coalesce(c.called_to_date, 0) + f.since_stated as called_before, coalesce(n.noticed, 0) as noticed, n.due_date as notice_due_date, f.other_currency_calls
      from cur as c join instruments as i on i.id = c.instrument_id join legal_entities as e on e.id = c.legal_entity_id join conf as f on f.commitment_id = c.id
      left join nt as n on n.commitment_id = c.id)
      select b.commitment_id, b.legal_entity_id, b.investor, b.fund, b.currency, cast(b.commitment as decimal(18,2)) as commitment,
      cast(b.called_before as decimal(18,2)) as called_before_notice, cast(b.noticed as decimal(18,2)) as noticed_not_recorded, b.notice_due_date,
      cast(b.called_before + b.noticed as decimal(18,2)) as called_after_notice,
      cast(b.commitment - b.called_before as decimal(18,2)) as unfunded_before_notice,
      cast(b.commitment - b.called_before - b.noticed as decimal(18,2)) as unfunded_after_notice,
      b.noticed <= b.commitment - b.called_before and b.other_currency_calls = 0 as notice_fits, b.other_currency_calls as calls_in_other_currency from base as b
    measure: unfunded_after_notice
    columns:
      investor: The entity that made the commitment.
      commitment: What the office committed to the fund.
      called_before_notice: Capital called to date as the commitment file states it, plus the confirmed calls recorded after that date, before any noticed call.
      noticed_not_recorded: The calls noticed by the fund and not yet recorded (positive).
      called_after_notice: Called before the notice plus the noticed calls.
      unfunded_before_notice: Commitment less called before the notice.
      unfunded_after_notice: Commitment less called after the notice. Negative means the call is larger than what is left.
      notice_fits: True when the noticed calls are not larger than the unfunded amount before them and no call is in another currency than the commitment.
      calls_in_other_currency: How many calls are in a different currency than the commitment. They are not added, so the amounts cannot be read until someone looks.
    tie_out:
      label: Called before the notice equals, commitment by commitment, the called amount the commitment file states plus the confirmed calls recorded after its as-at date
      sql: >-
        select (select count(*) from {name} as t where abs(t.called_before_notice - (coalesce((select c.called_to_date from commitments as c where c.id = t.commitment_id), 0)
        + (select coalesce(sum(abs(m.amount)), 0) from cash_movements as m where m.commitment_id = t.commitment_id and m.movement_type = 'call' and m.confirmation_status = 'confirmed'
        and m.currency = t.currency and m.effective_date > coalesce((select c.called_as_at from commitments as c where c.id = t.commitment_id), date '1900-01-01')
        and not exists (select 1 from cash_movements as y where y.supersedes_cash_movement_id = m.id)))) < 0.01), (select count(*) from {name})
    needs:
      - why: No commitments are loaded, so there is nothing to compare a call with.
        sql: select count(*) from commitments

  - id: call_fee_check
    label: Fee part of a call against the fund terms
    cards: [2]
    names: [fee part check, call fee check, fee against fund terms, management fee on the call]
    words_all: [[fee], [call, notice], [terms, schedule, check, matches, differs]]
    may_read: [documents, extracted_fields, commitments, instruments, legal_entities]
    never_read: [cash_movements, position_snapshots]
    why: The fee on a call is checked against the fee rate the fund's terms state, read from the fund's documents, times the commitment. Cash and positions say nothing about it.
    formula: Fee on the notice (read from the notice) against the management fee rate in the fund terms (extracted field management_fee_rate, a fraction of the commitment per billing) times the commitment of the investor the notice names (extracted field investor; when the notice names none and the fund has one commitment, that one). Difference = fee on the notice less the fee per terms. It matches when the difference is under one cent. With no rate on record, no commitment, or several investors and none named, the fee cannot be checked and fee_matches is empty; fee_basis says why.
    grain: By capital call notice
    sql: >-
      create table {name} as with notice as (select d.id as document_id, d.title, d.document_date as notice_date, d.instrument_id, f.value_numeric as fee_on_notice,
      (select coalesce(g.corrected_value_text, g.value_text) from extracted_fields as g where g.document_id = d.id and g.field_name = 'investor' and g.review_status <> 'rejected' limit 1) as investor
      from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'management_fee' and f.review_status <> 'rejected'
      where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)),
      rate as (select d.instrument_id, f.value_numeric as fee_rate from documents as d join extracted_fields as f on f.document_id = d.id
      and f.field_name = 'management_fee_rate' and f.review_status <> 'rejected' where d.document_type = 'fund_terms'
      and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)),
      commit as (select c.instrument_id, e.entity_name as investor, c.commitment_amount as commitment from commitments as c join legal_entities as e on e.id = c.legal_entity_id
      where not exists (select 1 from commitments as x where x.supersedes_commitment_id = c.id) and not (c.source_record_id is null and c.called_to_date is null and exists (select 1 from commitments as r where r.instrument_id = c.instrument_id and r.called_to_date is not null))),
      pick as (select n.*, c.commitment, count(c.commitment) over (partition by n.document_id) as matches from notice as n left join commit as c on c.instrument_id = n.instrument_id
      and (n.investor is null or position(lower(c.investor) in lower(n.investor)) > 0) qualify row_number() over (partition by n.document_id order by c.commitment desc) = 1)
      select p.title as notice, try_cast(regexp_extract(p.title, '([0-9]+)$', 1) as integer) as call_no, i.canonical_name as fund, p.investor, p.notice_date,
      cast(p.fee_on_notice as decimal(18,2)) as fee_on_notice, r.fee_rate,
      case when p.matches = 1 then cast(p.commitment as decimal(18,2)) end as commitment,
      case when p.matches = 1 and r.fee_rate is not null then cast(r.fee_rate * p.commitment as decimal(18,2)) end as fee_per_terms,
      case when p.matches = 1 and r.fee_rate is not null then cast(p.fee_on_notice - r.fee_rate * p.commitment as decimal(18,2)) end as fee_difference,
      case when p.matches = 1 and r.fee_rate is not null then abs(p.fee_on_notice - r.fee_rate * p.commitment) < 0.01 end as fee_matches,
      case when r.fee_rate is null then 'fee rate not on record' when p.matches = 0 then 'no commitment on record' when p.matches > 1 then 'investor not named on the notice' else 'rate times commitment' end as fee_basis
      from pick as p join instruments as i on i.id = p.instrument_id left join rate as r on r.instrument_id = p.instrument_id
    measure: fee_difference
    columns:
      call_no: The call number, the last digits of the notice reference.
      investor: The investor the notice names, empty when it names none.
      fee_on_notice: The management fee the notice charges.
      fee_rate: The fund terms' management fee rate, a fraction of the commitment per billing. Empty when the terms are not on record.
      fee_per_terms: The fee rate times the commitment. Empty when it cannot be worked out.
      fee_difference: The fee on the notice less the fee per terms. Zero when they agree.
      fee_matches: True when the fee on the notice equals the fee per terms, false when it differs, empty when the fee cannot be checked.
      fee_basis: How the fee per terms was worked out, or why it could not be.
    tie_out:
      label: Every call notice with a fee is checked once
      sql: >-
        select (select count(*) from {name}), (select count(*) from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'management_fee'
        where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id))

  - id: calls_due
    label: Calls due in 30 and 60 days
    cards: [3]
    names: [calls due, calls due in 30 days, calls due in 60 days, capital calls due]
    may_read: [cash_movements, portfolios, legal_entities, position_snapshots, instruments, bank_accounts]
    never_read: [commitments, transactions]
    why: A call due is a recorded or noticed call movement with a due date in the window; the commitment says what may still be called, not what is due.
    formula: For each entity and each window (30 and 60 days from the entity's own latest cash position date), the sum of the open call movements (not cancelled, not superseded) with a due date up to the end of the window. Open = noticed or expected (still to be paid, even when past its due date; those are also shown as overdue_amount), or recorded with a due date on or after the as-at date.
    grain: By entity, currency and window
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.position_date from positions as l join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash'
      join portfolios as p on p.id = l.portfolio_id where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id)),
      refd as (select e.id as entity_id, e.entity_name, coalesce((select max(c.position_date) from cashp as c where c.entity_id = e.id), (select max(c.position_date) from cashp as c)) as d from legal_entities as e),
      calls as (select p.legal_entity_id as entity_id, m.currency, m.due_date, m.confirmation_status as status, abs(m.amount) as amount from cash_movements as m join portfolios as p on p.id = m.portfolio_id
      where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date is not null
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      ccy as (select distinct currency from calls)
      select a.entity_name as entity, y.currency, w.days as window_days, a.d as as_of,
      case when a.d is not null then cast(coalesce(sum(c.amount) filter (where c.due_date <= a.d + w.days * interval 1 day), 0) as decimal(18,2)) end as calls_due,
      count(c.amount) filter (where c.due_date <= a.d + w.days * interval 1 day) as calls,
      min(c.due_date) filter (where c.due_date <= a.d + w.days * interval 1 day) as next_due_date,
      cast(coalesce(sum(c.amount) filter (where c.due_date < a.d), 0) as decimal(18,2)) as overdue_amount
      from refd as a cross join ccy as y cross join (select 30 as days union all select 60) as w
      left join calls as c on c.entity_id = a.entity_id and c.currency = y.currency and (c.status in ('noticed', 'expected') or c.due_date >= a.d) group by a.entity_name, y.currency, w.days, a.d
    measure: calls_due
    columns:
      as_of: The entity's latest cash position date; its windows start here.
      calls_due: The open calls due up to the end of the window, including any already past due and unpaid.
      calls: How many calls make up the amount.
      next_due_date: The earliest due date inside the window.
      overdue_amount: Of the calls due, the amount already past its due date and still unpaid.
    tie_out:
      label: The calls due in 60 days equal the open calls with a due date within 60 days of each entity's latest cash date
      sql: >-
        select (select coalesce(sum(calls_due), 0) from {name} where window_days = 60),
        (select coalesce(sum(abs(m.amount)), 0) from cash_movements as m join portfolios as p on p.id = m.portfolio_id where m.movement_type = 'call'
        and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date is not null and p.legal_entity_id is not null
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)
        and m.due_date <= coalesce((select max(a.position_date) from position_snapshots as a join portfolios as q on q.id = a.portfolio_id where q.legal_entity_id = p.legal_entity_id),
        (select max(a.position_date) from position_snapshots as a)) + interval 60 day
        and (m.confirmation_status in ('noticed', 'expected') or m.due_date >= coalesce((select max(a.position_date) from position_snapshots as a join portfolios as q on q.id = a.portfolio_id
        where q.legal_entity_id = p.legal_entity_id), (select max(a.position_date) from position_snapshots as a))))

  - id: cash_after_calls
    label: Cash after calls due
    cards: [4]
    names: [cash after calls, cash cover after calls, cash after calls due]
    words_all: [[short, shortfall, shortage, shortfalls], [buffer, buffers]]  # "Shortfall" after the buffer, "Cash short after the buffer" (w6)
    may_read: [position_snapshots, cash_movements, instruments, portfolios, legal_entities, business_rules, rule_versions, bank_accounts]
    never_read: [commitments, transactions]
    why: The cash is the administrator's balance, a position snapshot of the cash instrument. The calls are call movements. The buffer is the signed office rule, never a number typed in.
    formula: For each entity and currency, the latest cash balance (as cash_by_entity counts it) less the open calls due in that currency less the buffer of the signed office rule cash_buffer (the buffer applies in the currency the rule names; in another currency, or with no signed rule, the buffer and the result are empty). Open = noticed or expected (even when past due), or recorded with a due date on or after the entity's latest cash date. Negative means the entity is short; the shortfall is that amount made positive.
    grain: By entity and currency, at the entity's latest cash date
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.currency, l.position_date, sum(l.source_market_value) as cash from positions as l
      join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id) group by all),
      calls as (select p.legal_entity_id as entity_id, m.currency, m.due_date, m.confirmation_status as status, abs(m.amount) as amount from cash_movements as m join portfolios as p on p.id = m.portfolio_id
      where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      lastc0 as (select c.* from cashp as c where c.position_date = (select max(x.position_date) from cashp as x where x.entity_id = c.entity_id and x.currency = c.currency)),
      lastc as (select entity_id, currency, position_date, cash from lastc0 union all
      select distinct k.entity_id, k.currency, (select max(x.position_date) from cashp as x where x.entity_id = k.entity_id), 0 from calls as k
      where exists (select 1 from cashp as x where x.entity_id = k.entity_id) and not exists (select 1 from lastc0 as x where x.entity_id = k.entity_id and x.currency = k.currency)),
      due as (select c.entity_id, c.currency, sum(k.amount) as amount, min(k.due_date) as next_due_date, sum(k.amount) filter (where k.due_date < c.position_date) as overdue
      from lastc as c join calls as k on k.entity_id = c.entity_id and k.currency = c.currency and (k.status in ('noticed', 'expected') or k.due_date >= c.position_date) group by c.entity_id, c.currency),
      bufall as (select cast(json_extract_string(v.parameters, '$.amount') as decimal(18,2)) as amount, json_extract_string(v.parameters, '$.currency') as currency, v.version_number, v.effective_from, v.effective_to
      from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'),
      buf as (select c.entity_id, c.currency, b.amount from lastc as c join bufall as b on b.currency = c.currency and b.effective_from <= c.position_date
      and (b.effective_to is null or b.effective_to >= c.position_date) qualify row_number() over (partition by c.entity_id, c.currency order by b.version_number desc) = 1)
      select e.entity_name as entity, c.currency, c.position_date as as_of, cast(c.cash as decimal(18,2)) as cash, cast(coalesce(d.amount, 0) as decimal(18,2)) as calls_due,
      cast(coalesce(d.overdue, 0) as decimal(18,2)) as overdue_calls, d.next_due_date, cast(b.amount as decimal(18,2)) as buffer,
      case when b.amount is not null then cast(c.cash - coalesce(d.amount, 0) - b.amount as decimal(18,2)) end as cash_after_calls,
      case when b.amount is not null then cast(greatest(coalesce(d.amount, 0) + b.amount - c.cash, 0) as decimal(18,2)) end as shortfall
      from lastc as c join legal_entities as e on e.id = c.entity_id left join due as d on d.entity_id = c.entity_id and d.currency = c.currency
      left join buf as b on b.entity_id = c.entity_id and b.currency = c.currency
    measure: cash_after_calls
    columns:
      cash: The administrator's closing cash for the entity and currency at its latest date (zero when the entity has a call in a currency it holds no cash in).
      calls_due: The open calls due in the same currency, including any past due and unpaid.
      overdue_calls: Of the calls due, the amount already past its due date and unpaid.
      buffer: The cash buffer of the signed office rule, in its currency. Empty in another currency or while no rule is signed.
      cash_after_calls: Cash less the calls due less the buffer. Negative means short. Empty while the buffer is not on record.
      shortfall: How much the entity is short, zero when it is not. Empty while the buffer is not on record.
    tie_out:
      label: The cash in the table equals the cash positions of the latest date for each entity and currency
      sql: >-
        select (select coalesce(sum(cash), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c
        join instruments as i on i.id = c.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = c.portfolio_id
        where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id)
        and c.position_date = (select max(d.position_date) from ({positions_check}) as d join instruments as j on j.id = d.instrument_id and j.instrument_type = 'cash'
        join portfolios as q on q.id = d.portfolio_id where q.legal_entity_id = p.legal_entity_id and d.currency = c.currency
        and not exists (select 1 from bank_accounts as bb where bb.cash_instrument_id = j.id)))
    needs:   # the buffer is a signed office rule: without it the shortfall would be a guess
      - why: No signed cash buffer rule (cash_buffer) is on file, so the cash after calls cannot be stated.
        sql: >-
          select count(*) from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'

  - id: bank_details_changed
    label: Payee bank details changed
    cards: [5]
    names: [bank details changed, payee account changed, standing instruction changed, bank account changed]
    words_all: [[account, wire, bank, payee], [ending, changed, new, different]]  # "wire to an account ending 4471" (w6)
    may_read: [bank_accounts, extracted_fields, documents, cash_movements, instruments]
    never_read: [position_snapshots, commitments]
    why: The account on a notice is compared with the payee account the office has on file, as it stood when the notice came. The notice and the file say it; balances and commitments do not.
    formula: For each capital call notice, the account ending read from the notice against the payee account on file for the fund as it stood on the notice date (the latest payee row verified on or before it). Changed = the endings differ. The payment stays on hold while it is changed and no payee row for the notice's account records a call-back (verified_on on or after the notice date). Earlier payments to the fund show where the money went before.
    grain: By capital call notice
    sql: >-
      create table {name} as with notice as (select d.id as document_id, d.title, d.instrument_id, d.document_date as notice_date,
      right(regexp_replace(coalesce(f.corrected_value_text, f.value_text), '[^0-9A-Za-z]', '', 'g'), 4) as notice_ending
      from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'bank_account' and f.review_status <> 'rejected'
      where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)),
      payee as (select b.* from bank_accounts as b where b.holder_kind = 'payee' and b.status <> 'closed'),
      basis as (select n.document_id, right(p.account_ref, 4) as on_file_ending, p.verified_on as on_file_verified_on from notice as n join payee as p on p.instrument_id = n.instrument_id
      and p.verified_on is not null and p.verified_on <= n.notice_date where p.verified_on = (select max(q.verified_on) from payee as q where q.instrument_id = n.instrument_id
      and q.verified_on is not null and q.verified_on <= n.notice_date)),
      callback as (select n.document_id, max(p.verified_on) as callback_on from notice as n join payee as p on p.instrument_id = n.instrument_id
      and right(p.account_ref, 4) = n.notice_ending and p.verified_on is not null and p.verified_on >= n.notice_date group by n.document_id),
      paid as (select n.document_id, count(*) as paid_before, string_agg(right(b.account_ref, 4), ',' order by m.effective_date) as paid_to
      from notice as n join cash_movements as m on m.instrument_id = n.instrument_id and m.movement_type = 'payment' and m.confirmation_status = 'confirmed'
      and m.effective_date < n.notice_date and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)
      join bank_accounts as b on b.id = m.bank_account_id group by n.document_id)
      select n.title as notice, try_cast(regexp_extract(n.title, '([0-9]+)$', 1) as integer) as call_no, i.canonical_name as fund, n.notice_date, n.notice_ending, s.on_file_ending as old_ending, n.notice_ending as new_ending,
      coalesce(n.notice_ending <> s.on_file_ending, true) as changed, c.callback_on as callback_verified_on,
      coalesce(n.notice_ending <> s.on_file_ending, true) and c.callback_on is null as on_hold, coalesce(p.paid_before, 0) as paid_before, p.paid_to
      from notice as n join instruments as i on i.id = n.instrument_id left join basis as s on s.document_id = n.document_id
      left join callback as c on c.document_id = n.document_id left join paid as p on p.document_id = n.document_id
    measure: on_hold
    columns:
      call_no: The call number, the last digits of the notice reference.
      notice_ending: The last four characters of the account the notice asks to pay.
      old_ending: The last four characters of the payee account on file when the notice came (empty when none was on file).
      new_ending: The account ending on the notice.
      changed: True when the notice account differs from the account on file, or none was on file.
      callback_verified_on: The date a call-back on a known number was recorded for the notice's account, empty when none.
      on_hold: True while the account is changed and no call-back is recorded. The payment stays on hold.
      paid_before: How many earlier payments to the fund were confirmed.
      paid_to: The account endings those earlier payments went to, oldest first.
    tie_out:
      label: Every capital call notice with an account is compared once
      sql: >-
        select (select count(*) from {name}), (select count(*) from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'bank_account'
        where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id))

  - id: fx_required
    label: FX needed to pay a call
    cards: [6]
    names: [fx required, fx needed, currency to convert, amount to convert]
    words_all: [[convert, conversion, converted, converting], [short, shortfall, shortage, call, calls]]  # "SGD to convert" for a shortfall or a call (w6)
    may_read: [cash_movements, position_snapshots, market_observations, instruments, portfolios, legal_entities, business_rules, rule_versions, bank_accounts]
    never_read: [commitments, transactions, fx_confirmations]
    why: The amount to convert is the shortfall after calls and buffer at the planning rate of the FX series. A confirmation is checked against it afterwards; it does not set it.
    formula: For each entity short after calls due (cash_after_calls, with the signed buffer), the shortfall in the call currency times the planning rate of the FX series (the latest observation of the pair on or before the entity's latest cash date, SGD per 1 USD for the pair USD/SGD), rounded up to the next whole unit of the other currency. The rate and its date are shown, with the cash held in the other currency. With no signed buffer there is no row.
    grain: By entity, call currency and convert currency
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.currency, l.position_date, sum(l.source_market_value) as cash from positions as l
      join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id) group by all),
      calls as (select p.legal_entity_id as entity_id, m.currency, m.due_date, m.confirmation_status as status, abs(m.amount) as amount from cash_movements as m join portfolios as p on p.id = m.portfolio_id
      where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      lastc0 as (select c.* from cashp as c where c.position_date = (select max(x.position_date) from cashp as x where x.entity_id = c.entity_id and x.currency = c.currency)),
      lastc as (select entity_id, currency, position_date, cash from lastc0 union all
      select distinct k.entity_id, k.currency, (select max(x.position_date) from cashp as x where x.entity_id = k.entity_id), 0 from calls as k
      where exists (select 1 from cashp as x where x.entity_id = k.entity_id) and not exists (select 1 from lastc0 as x where x.entity_id = k.entity_id and x.currency = k.currency)),
      due as (select c.entity_id, c.currency, sum(k.amount) as amount from lastc as c join calls as k on k.entity_id = c.entity_id and k.currency = c.currency
      and (k.status in ('noticed', 'expected') or k.due_date >= c.position_date) group by c.entity_id, c.currency),
      bufall as (select cast(json_extract_string(v.parameters, '$.amount') as decimal(18,2)) as amount, json_extract_string(v.parameters, '$.currency') as currency, v.version_number, v.effective_from, v.effective_to
      from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'),
      buf as (select c.entity_id, c.currency, b.amount from lastc as c join bufall as b on b.currency = c.currency and b.effective_from <= c.position_date
      and (b.effective_to is null or b.effective_to >= c.position_date) qualify row_number() over (partition by c.entity_id, c.currency order by b.version_number desc) = 1),
      fxall as (select o.base_currency, o.quote_currency, o.value as rate, o.observed_at from market_observations as o
      where o.observation_type = 'fx' and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id)),
      short as (select c.entity_id, c.currency, c.position_date, c.cash, d.amount as calls_due, b.amount as buffer, d.amount + b.amount - c.cash as shortfall
      from lastc as c join due as d on d.entity_id = c.entity_id and d.currency = c.currency join buf as b on b.entity_id = c.entity_id and b.currency = c.currency
      where d.amount + b.amount - c.cash > 0),
      fx as (select s.entity_id, s.currency, o.quote_currency, o.rate, cast(o.observed_at as date) as rate_date from short as s join fxall as o on o.base_currency = s.currency
      and cast(o.observed_at as date) <= s.position_date qualify row_number() over (partition by s.entity_id, s.currency, o.quote_currency order by o.observed_at desc) = 1)
      select e.entity_name as entity, s.currency, cast(s.shortfall as decimal(18,2)) as shortfall, f.quote_currency as convert_currency, f.rate, f.rate_date,
      cast(ceil(s.shortfall * f.rate) as decimal(18,2)) as convert_amount, cast(coalesce(o.cash, 0) as decimal(18,2)) as other_cash, cast(coalesce(o.cash, 0) / f.rate as decimal(18,2)) as other_cash_in_call_currency, coalesce(o.cash, 0) >= ceil(s.shortfall * f.rate) as other_cash_covers
      from short as s join legal_entities as e on e.id = s.entity_id join fx as f on f.entity_id = s.entity_id and f.currency = s.currency
      left join lastc0 as o on o.entity_id = s.entity_id and o.currency = f.quote_currency
    measure: convert_amount
    columns:
      shortfall: The amount short after calls due and the buffer, in the call currency.
      convert_currency: The currency held that would be converted.
      rate: The planning rate of the FX series, units of the convert currency per one unit of the call currency.
      rate_date: The date of that observation.
      convert_amount: The shortfall times the rate, rounded up to the next whole unit.
      other_cash: The cash the entity holds in the convert currency.
      other_cash_in_call_currency: That cash in the call currency at the same rate (other cash divided by the rate).
      other_cash_covers: True when that cash is enough for the conversion.
    tie_out:
      label: Every row's amount to convert equals its shortfall times its rate, rounded up to the next whole unit
      sql: >-
        select (select count(*) from {name} where convert_amount = ceil(shortfall * rate)), (select count(*) from {name})
    needs:
      - why: No signed cash buffer rule (cash_buffer) is on file, so the shortfall to convert cannot be stated.
        sql: >-
          select count(*) from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'
      - why: No FX rate observation is loaded, so the amount to convert cannot be stated.
        sql: select count(*) from market_observations as o where o.observation_type = 'fx'

  - id: fx_rate_check
    label: Bank FX rate against the fixing
    cards: [6]
    names: [fx rate check, bank rate against fixing, confirmation rate against fixing, fx conversion rate check]
    words_all: [[fx, conversion, confirmation], [rate], [fixing, check, against]]
    may_read: [fx_confirmations, transactions, instruments, market_observations]
    never_read: [cash_movements, commitments, position_snapshots]
    why: The bank's rate on a confirmation is checked against the fixing of its trade date. A spot conversion the desk booked with no confirmation is still a conversion. It is listed, marked none on record, and checked against the same fixing. The planned amount to convert is a different figure and does not set the rate.
    formula: One row per trade reference, from the latest confirmation and the desk's spot conversions (transactions of type fx_spot, not superseded). The pair is the instrument's name (base/quote, SGD per 1 USD when USD is the base). A confirmation gives the bank rate; a desk conversion with no confirmation gives the rate it was booked at (quote amount over base amount) and is marked none on record. The bank rate is then checked against the fixing of the same pair on the trade date (the last observation of that day). Difference in percent of the fixing. A reference whose pair or date has no fixing shows an empty fixing; nothing is guessed. The tolerance is the signed rule fx_plan_tolerance, read by the signal, not here.
    grain: By trade reference
    sql: >-
      create table {name} as with conf as (select c.* from fx_confirmations as c where not exists (select 1 from fx_confirmations as x where x.supersedes_fx_confirmation_id = c.id)),
      fix as (select o.base_currency, o.quote_currency, cast(o.observed_at as date) as day, o.value as rate from market_observations as o
      where o.observation_type = 'fx' and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id)
      qualify row_number() over (partition by o.base_currency, o.quote_currency, cast(o.observed_at as date) order by o.observed_at desc) = 1),
      spot as (select t.external_trade_id as ref, t.trade_date, split_part(split_part(i.canonical_name, ' ', 1), '/', 1) as base, split_part(split_part(i.canonical_name, ' ', 1), '/', 2) as quote,
      abs(t.quantity_delta) as base_amount, abs(t.cash_amount) as quote_amount, t.quantity_delta > 0 as bought_base
      from transactions as t join instruments as i on i.id = t.instrument_id where t.transaction_type = 'fx_spot' and t.supersedes_transaction_id is null
      and not exists (select 1 from transactions as x where x.supersedes_transaction_id = t.id)),
      pair as (select coalesce(c.trade_reference, s.ref) as trade_reference, coalesce(c.trade_date, s.trade_date) as trade_date, c.counterparty,
      case when c.trade_reference is not null then c.currency_bought when s.bought_base then s.base else s.quote end as currency_bought,
      case when c.trade_reference is not null then c.currency_sold when s.bought_base then s.quote else s.base end as currency_sold,
      case when c.trade_reference is not null then c.amount_bought when s.bought_base then s.base_amount else s.quote_amount end as amount_bought,
      case when c.trade_reference is not null then c.amount_sold when s.bought_base then s.quote_amount else s.base_amount end as amount_sold,
      case when c.trade_reference is not null then c.rate else s.quote_amount / s.base_amount end as rate,
      case when c.trade_reference is not null then 'bank confirmation' else 'none on record' end as confirmation
      from conf as c full outer join spot as s on s.ref = c.trade_reference)
      select p.trade_reference, p.trade_date, p.counterparty, p.currency_bought, p.currency_sold, p.confirmation, cast(p.amount_bought as decimal(18,2)) as amount_bought,
      cast(p.amount_sold as decimal(18,2)) as amount_sold, cast(p.rate as decimal(18,6)) as bank_rate, cast(f.rate as decimal(18,6)) as fixing,
      cast(p.rate - f.rate as decimal(18,6)) as rate_difference, cast(100 * (p.rate - f.rate) / f.rate as decimal(9,4)) as difference_pct
      from pair as p left join fix as f on f.base_currency = p.currency_bought and f.quote_currency = p.currency_sold and f.day = p.trade_date
    measure: difference_pct
    columns:
      confirmation: bank confirmation when the bank's confirmation is on file; none on record when only the desk's conversion is.
      bank_rate: The rate on the bank's confirmation, or the rate the desk booked the conversion at when none is on record.
      fixing: The fixing of the same pair on the trade date, empty when none is on record.
      rate_difference: The bank rate less the fixing.
      difference_pct: The difference in percent of the fixing. Empty when there is no fixing.
    tie_out:
      label: Every confirmation and every desk spot conversion is checked once
      sql: >-
        select (select count(*) from {name}), (select count(*) from (select c.trade_reference as ref from fx_confirmations as c
        where not exists (select 1 from fx_confirmations as x where x.supersedes_fx_confirmation_id = c.id)
        union select t.external_trade_id from transactions as t where t.transaction_type = 'fx_spot' and t.supersedes_transaction_id is null
        and not exists (select 1 from transactions as x where x.supersedes_transaction_id = t.id)) as u)

  - id: payment_batch
    label: Payment batch by approval state
    cards: [8]
    names: [payment batch, payment run, payments awaiting approval, payments to release]
    may_read: [cash_movements, approvals, bank_accounts, users, business_rules, rule_versions, documents, extracted_fields]
    never_read: [position_snapshots, commitments]
    why: A payment is a cash movement of type payment that is still expected; its approvals are rows of approvals that name the movement. Cash balances and commitments do not say whether it may be released.
    formula: The payments still to be released (cash movements of type payment, status expected), each in one state. Hold when an open approval of type payment_hold names it (its rationale is the reason), or when the office has signed the rule invoice_above_fee_schedule (parameters action hold, tolerance_amount) and the payment's invoice (the invoice document read from the same source record as the payment) bills more than its fee schedule allows by more than the tolerance, the fee variance worked out as in invoice_variance (billed less fee base times the schedule rate over the billing periods, from the schedule in force on the invoice date; an invoice that cannot be checked is not held by it); with no such rule signed no payment is held for its fee; waiting for approval when an approval requested for it is not yet approved; hold on an unverified changed account when the payment goes to an account that replaced an earlier payee account and has no call-back (verified_on); otherwise ready. release_blocked is true while any of these stands, and blocked_by lists them all. The run window (days from the latest movement date) is the signed rule payment_run_window_days; with no signed rule in_window is empty and every expected payment is listed. Totals are by currency, never across currencies.
    grain: By payment
    sql: >-
      create table {name} as with pay as (select m.* from cash_movements as m where m.movement_type = 'payment' and m.confirmation_status = 'expected'
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      refd as (select max(m.effective_date) as d from cash_movements as m),
      win as (select cast(json_extract_string(v.parameters, '$.days') as integer) as days from business_rules as r join rule_versions as v on v.business_rule_id = r.id
      where r.rule_code = 'payment_run_window_days' and v.approval_status = 'approved' and v.effective_from <= (select d from refd) and (v.effective_to is null or v.effective_to >= (select d from refd))
      order by v.version_number desc limit 1),
      ap as (select a.cash_movement_id, count(*) filter (where a.status = 'requested') as requested, count(*) filter (where a.status = 'approved') as approved,
      string_agg(u.display_name, ', ') filter (where a.status = 'approved') as approver, string_agg(r.display_name, ', ') filter (where a.status = 'requested') as requested_from
      from approvals as a left join users as u on u.id = a.decision_by_user_id left join users as r on r.id = a.requested_from_user_id
      where a.approval_type <> 'payment_hold' and a.cash_movement_id is not null group by a.cash_movement_id),
      hold as (select a.cash_movement_id, string_agg(a.rationale, '; ') as reason from approvals as a where a.approval_type = 'payment_hold' and a.status = 'requested'
      and a.cash_movement_id is not null group by a.cash_movement_id),
      frule as (select cast(coalesce(json_extract_string(v.parameters, '$.tolerance_amount'), '0') as decimal(18,2)) as tol from business_rules as r join rule_versions as v on v.business_rule_id = r.id
      where r.rule_code = 'invoice_above_fee_schedule' and v.approval_status = 'approved' and v.effective_to is null and json_extract_string(v.parameters, '$.action') = 'hold'
      order by v.version_number desc limit 1),
      fld as (select f.document_id, f.field_name, f.value_text, f.value_numeric, f.currency from extracted_fields as f where f.review_status is distinct from 'Rejected'),
      inv as (select d.id as document_id, d.source_record_id, d.document_date, max(case when fld.field_name = 'vendor' then fld.value_text end) as vendor,
      max(case when fld.field_name = 'fee_base' then fld.value_numeric end) as fee_base, max(case when fld.field_name = 'fee_base' then fld.currency end) as base_currency,
      max(case when fld.field_name = 'amount_due' then fld.value_numeric end) as billed, max(case when fld.field_name = 'amount_due' then fld.currency end) as currency
      from documents as d join fld on fld.document_id = d.id where d.document_type = 'invoice' and d.source_record_id in (select source_record_id from pay)
      and not exists (select 1 from documents as x where x.supersedes_document_id = d.id) group by all having max(case when fld.field_name = 'fee_base' then 1 end) = 1),
      sd as (select d.id as schedule_id, d.document_date, d.received_at, lower(trim(fld.value_text)) as vendor,
      max(case when fld.field_name = 'service_fee_rate' then fld.value_numeric end) as rate, count(distinct case when fld.field_name = 'service_fee_rate' then fld.value_numeric end) as n_rates,
      max(case when fld.field_name = 'service_fee_periods' then fld.value_numeric end) as periods, count(distinct case when fld.field_name = 'service_fee_periods' then fld.value_numeric end) as n_periods
      from fld join documents as d on d.id = fld.document_id where d.document_type = 'fee_schedule' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)
      and fld.field_name in ('service_fee_rate', 'service_fee_periods') group by all),
      sch as (select i.*, s.rate, s.n_rates, s.periods, s.n_periods,
      row_number() over (partition by i.document_id order by coalesce(s.document_date, cast(s.received_at as date)) desc, s.received_at desc, s.schedule_id desc) as k
      from inv as i join sd as s on s.vendor = lower(trim(i.vendor)) and (s.document_date is null or i.document_date is null or s.document_date <= i.document_date)),
      fee as (select source_record_id, max(billed - round(fee_base * rate / periods, 2)) as variance from sch where k = 1 and n_rates = 1 and n_periods = 1 and coalesce(periods, 0) <> 0
      and rate is not null and base_currency = currency group by source_record_id),
      st as (select m.id, m.currency, abs(m.amount) as amount, m.due_date, b.holder_name as payee, right(b.account_ref, 4) as account_ending,
      coalesce(p.requested, 0) as requested, coalesce(p.approved, 0) as approved, p.approver, p.requested_from,
      nullif(concat_ws('; ', h.reason, case when fe.variance > (select tol from frule) then 'invoice above fee schedule' end), '') as hold_reason, fe.variance as fee_variance,
      coalesce(b.supersedes_bank_account_id is not null and b.verified_on is null and right(b.account_ref, 4) <> coalesce((select right(o.account_ref, 4) from bank_accounts as o
      where o.id = b.supersedes_bank_account_id), right(b.account_ref, 4)), false) as account_changed_unverified
      from pay as m left join bank_accounts as b on b.id = m.bank_account_id left join ap as p on p.cash_movement_id = m.id left join hold as h on h.cash_movement_id = m.id
      left join fee as fe on fe.source_record_id = m.source_record_id),
      fin as (select s.*, case when s.hold_reason is not null then 'hold: ' || s.hold_reason when s.requested > 0 then 'waiting for approval'
      when s.account_changed_unverified then 'hold: account changed, no call-back' else 'ready' end as state,
      s.hold_reason is not null or s.requested > 0 or s.account_changed_unverified as release_blocked,
      concat_ws('; ', s.hold_reason, case when s.requested > 0 then 'approval not yet given' end, case when s.account_changed_unverified then 'account changed, no call-back' end) as blocked_by from st as s)
      select s.payee, s.currency, cast(s.amount as decimal(18,2)) as amount, s.due_date, s.state,
      case when s.requested > 0 then 'requested' when s.approved > 0 then 'approved' else 'not needed' end as approval_state,
      s.hold_reason, cast(s.fee_variance as decimal(18,2)) as fee_variance, s.requested_from, s.approver, s.account_ending, s.account_changed_unverified, s.release_blocked, nullif(s.blocked_by, '') as blocked_by,
      (select days from win) as window_days, case when (select days from win) is not null then s.due_date <= (select d from refd) + (select days from win) end as in_window,
      cast(sum(s.amount) over (partition by s.currency) as decimal(18,2)) as batch_total_in_currency,
      cast(sum(s.amount) filter (where not s.release_blocked) over (partition by s.currency) as decimal(18,2)) as releasable_total_in_currency from fin as s
    measure: amount
    columns:
      payee: Who is paid, the holder of the account the payment goes to.
      amount: The payment as a positive number.
      state: Hold with its reason, waiting for approval, or ready.
      approval_state: Requested while an approval is open, approved when one was given, not needed when none was asked for.
      hold_reason: Why a payment is on hold, from the open payment_hold approval and, under the signed rule invoice_above_fee_schedule, 'invoice above fee schedule'.
      fee_variance: The payment's invoice billed less its fee schedule (as invoice_variance works it out); empty when the payment has no fee invoice or it cannot be checked.
      account_changed_unverified: True when the payee account replaced an earlier one and no call-back is recorded.
      release_blocked: True while a hold, an open approval or an unverified changed account stands in the way of the release.
      blocked_by: Every reason the payment cannot be released yet, empty when none.
      window_days: The run window of the signed rule payment_run_window_days. Empty while no rule is signed.
      in_window: True when the payment is due within the window from the latest movement date. Empty while no window is signed, so the window is never assumed.
      batch_total_in_currency: All expected payments of the batch in the payment's currency, held and waiting ones included.
      releasable_total_in_currency: Of those, the total that nothing blocks, in the payment's currency.
    tie_out:
      label: Every expected payment is in the batch once
      sql: >-
        select (select count(*) from {name}), (select count(*) from cash_movements as m where m.movement_type = 'payment' and m.confirmation_status = 'expected'
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))

  - id: cash_by_bank
    label: Cash by bank
    cards: [10]
    names: [cash by bank, cash at each bank, bank concentration, cash held at each bank]
    may_read: [position_snapshots, bank_accounts, instruments, market_observations, business_rules, rule_versions]
    never_read: [commitments, transactions, cash_movements]
    why: A bank balance is the position snapshot of the account's cash instrument (bank_accounts.cash_instrument_id), a balance, never the movements on the account. The limit is a signed rule, never a number typed in.
    formula: Closing balance of each office account on its latest date (the position snapshots of the account's cash instrument), converted to USD at the latest FX observation up to that date, summed by bank. An account with no rate to USD makes its bank's USD equivalent and every share empty (unconverted_accounts says how many); nothing is left out silently. Share = the bank's USD equivalent over all banks. The limit is the signed rule bank_limit_<bank> (parameters max_pct, the bank name in lower case with other characters as underscores), the version in force at the latest balance date; with no signed rule the limit is empty and nothing is over it.
    grain: By bank
    sql: >-
      create table {name} as with {positions},
      acct as (select b.* from bank_accounts as b where b.holder_kind = 'office' and b.cash_instrument_id is not null and b.status <> 'closed'
      and not exists (select 1 from bank_accounts as x where x.supersedes_bank_account_id = b.id)),
      bal as (select a.bank_name, a.id as account_id, l.currency, l.position_date, l.source_market_value as v from acct as a join positions as l on l.instrument_id = a.cash_instrument_id
      where l.position_date = (select max(y.position_date) from positions as y where y.instrument_id = a.cash_instrument_id)),
      fx as (select o.base_currency, o.quote_currency, o.value as rate, cast(o.observed_at as date) as rate_date from market_observations as o
      where o.observation_type = 'fx' and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id)),
      usd as (select b.bank_name, b.currency, b.position_date, b.v,
      case when b.currency = 'USD' then b.v else b.v / (select f.rate from fx as f where f.base_currency = 'USD' and f.quote_currency = b.currency and f.rate_date <= b.position_date
      order by f.rate_date desc limit 1) end as usd_value from bal as b),
      bank as (select u.bank_name, count(*) as accounts, max(u.position_date) as as_of, sum(u.usd_value) as usd_sum, count(*) filter (where u.usd_value is null) as unconverted_accounts,
      string_agg(u.currency || ' ' || cast(round(u.v, 2) as varchar), '; ' order by u.currency) as balances from usd as u group by u.bank_name),
      lim as (select r.rule_code, cast(json_extract_string(v.parameters, '$.max_pct') as decimal(9,4)) as max_pct from business_rules as r
      join rule_versions as v on v.business_rule_id = r.id where v.approval_status = 'approved' and r.rule_code like 'bank_limit_%'
      and v.effective_from <= (select max(position_date) from bal) and (v.effective_to is null or v.effective_to >= (select max(position_date) from bal))
      qualify row_number() over (partition by r.id order by v.version_number desc) = 1),
      conv as (select k.*, case when k.unconverted_accounts = 0 then k.usd_sum end as usd_equivalent, sum(k.unconverted_accounts) over () as unconverted_all from bank as k),
      shared as (select k.*, case when k.unconverted_all = 0 then 100 * k.usd_equivalent / sum(k.usd_equivalent) over () end as share_pct,
      (select l.max_pct from lim as l where l.rule_code = 'bank_limit_' || rtrim(regexp_replace(lower(k.bank_name), '[^a-z0-9]+', '_', 'g'), '_')) as limit_pct from conv as k)
      select s.bank_name as bank, s.accounts, s.as_of, s.balances, cast(s.usd_equivalent as decimal(18,2)) as usd_equivalent, s.unconverted_accounts, cast(s.share_pct as decimal(9,2)) as share_pct,
      s.limit_pct, cast(s.share_pct - s.limit_pct as decimal(9,2)) as excess_pct, s.share_pct > s.limit_pct as over_limit,
      case when s.limit_pct is not null and s.share_pct is not null then row_number() over (partition by s.limit_pct is not null order by s.share_pct - s.limit_pct desc, s.bank_name) end as worst,
      count(*) filter (where s.share_pct > s.limit_pct) over () as banks_over_limit
      from shared as s
    measure: usd_equivalent
    columns:
      accounts: How many accounts the bank holds for the office.
      as_of: The latest balance date among them.
      balances: The balances by currency, in their own currency.
      usd_equivalent: The balances converted to USD and added up. Empty when one of the bank's balances has no rate to USD.
      unconverted_accounts: How many of the bank's accounts have no rate to USD on or before their balance date.
      share_pct: The bank's share of all cash at banks, in percent. Empty while any account at any bank is unconverted.
      limit_pct: The signed limit for the bank in percent of all cash, empty when no limit is signed.
      excess_pct: Share less the limit, in percentage points.
      over_limit: True when the share is above a signed limit, empty when there is no limit.
      worst: 1 for the bank furthest over its limit (2, 3 ... for the next), empty for a bank with no signed limit.
      banks_over_limit: How many banks are over their signed limit, the same on every row.
    tie_out:
      label: The cash at banks equals the closing cash of every office account on its latest date, in USD
      sql: >-
        select (select coalesce(sum(usd_equivalent), 0) from {name}), (select coalesce(sum(case when c.currency = 'USD' then c.v else c.v / (select f.value from market_observations as f
        where f.observation_type = 'fx' and f.base_currency = 'USD' and f.quote_currency = c.currency and cast(f.observed_at as date) <= c.position_date
        and not exists (select 1 from market_observations as x where x.supersedes_observation_id = f.id) order by f.observed_at desc limit 1) end), 0)
        from ({positions_check}) as c join bank_accounts as b on b.cash_instrument_id = c.instrument_id and b.holder_kind = 'office' and b.status <> 'closed'
        and not exists (select 1 from bank_accounts as x where x.supersedes_bank_account_id = b.id)
        where c.position_date = (select max(d.position_date) from ({positions_check}) as d where d.instrument_id = c.instrument_id))
    needs:
      - why: No office bank accounts with a cash instrument are loaded, so cash by bank cannot be stated.
        sql: select count(*) from bank_accounts as b where b.holder_kind = 'office' and b.cash_instrument_id is not null
      - why: An office account in another currency has no rate to USD on or before its balance date, so the cash by bank would leave it out.
        sql: >-
          select case when exists (select 1 from position_snapshots as s join bank_accounts as b on b.cash_instrument_id = s.instrument_id and b.holder_kind = 'office'
          where s.currency <> 'USD' and s.position_date = (select max(y.position_date) from position_snapshots as y where y.instrument_id = s.instrument_id)
          and not exists (select 1 from market_observations as o where o.observation_type = 'fx' and o.base_currency = 'USD' and o.quote_currency = s.currency
          and cast(o.observed_at as date) <= s.position_date)) then 0 else 1 end

  - id: funding_plan
    label: Which entity pays a call
    cards: [18]
    names: [funding plan, entity that pays, which entity pays, who pays the call]
    may_read: [commitments, position_snapshots, cash_movements, instruments, portfolios, legal_entities, business_rules, rule_versions, bank_accounts]
    never_read: [transactions]
    why: The entity that pays is the one the commitment names. The other entities are shown with their cover so a transfer or another source can be weighed, never chosen for the person.
    formula: For each open call (noticed or expected even when past due, or recorded with a due date on or after the paying entity's latest cash date) and each entity, the entity's latest cash in the call currency (zero when it holds none), less all its open calls in that currency, less the buffer of the signed office rule cash_buffer (empty when no buffer is signed). The entity named in the call's commitment is the one that pays; when the call names no commitment, the entity whose portfolio carries the call. A negative cover after calls means a transfer is needed first. Spare cover is the cover when positive. best_other_spare is the largest spare cover of the other entities.
    grain: By call and candidate entity
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.currency, l.position_date, sum(l.source_market_value) as cash from positions as l
      join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      where not exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id) group by all),
      calls as (select m.id as call_id, p.legal_entity_id as entity_id, m.currency, m.due_date, m.confirmation_status as status, abs(m.amount) as amount, m.commitment_id, m.instrument_id from cash_movements as m
      join portfolios as p on p.id = m.portfolio_id where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected')
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      lastc0 as (select c.* from cashp as c where c.position_date = (select max(x.position_date) from cashp as x where x.entity_id = c.entity_id and x.currency = c.currency)),
      lastc as (select entity_id, currency, position_date, cash from lastc0 union all
      select distinct k.entity_id, k.currency, (select max(x.position_date) from cashp as x where x.entity_id = k.entity_id), 0 from calls as k
      where exists (select 1 from cashp as x where x.entity_id = k.entity_id) and not exists (select 1 from lastc0 as x where x.entity_id = k.entity_id and x.currency = k.currency)),
      due as (select c.entity_id, c.currency, sum(k.amount) as amount from lastc as c join calls as k on k.entity_id = c.entity_id and k.currency = c.currency
      and (k.status in ('noticed', 'expected') or k.due_date >= c.position_date) group by c.entity_id, c.currency),
      refd as (select e.id as entity_id, coalesce((select max(c.position_date) from cashp as c where c.entity_id = e.id), (select max(c.position_date) from cashp as c)) as d from legal_entities as e),
      bufall as (select cast(json_extract_string(v.parameters, '$.amount') as decimal(18,2)) as amount, json_extract_string(v.parameters, '$.currency') as currency, v.version_number, v.effective_from, v.effective_to
      from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'),
      buf as (select a.entity_id, b.currency, b.amount from refd as a join bufall as b on b.effective_from <= a.d and (b.effective_to is null or b.effective_to >= a.d)
      qualify row_number() over (partition by a.entity_id, b.currency order by b.version_number desc) = 1),
      open as (select k.call_id, coalesce(c.legal_entity_id, k.entity_id) as named_id, k.currency, k.due_date, k.amount, k.instrument_id
      from calls as k left join commitments as c on c.id = k.commitment_id
      left join lastc as n on n.entity_id = coalesce(c.legal_entity_id, k.entity_id) and n.currency = k.currency
      where k.status in ('noticed', 'expected') or n.position_date is null or k.due_date >= n.position_date),
      plan as (select k.call_id, i.canonical_name as fund, k.amount as call_amount, k.currency, k.due_date, e.entity_name as entity, e.id = k.named_id as is_named,
      coalesce(l.cash, 0) as cash, coalesce(d.amount, 0) as calls_due, b.amount as buffer, case when b.amount is not null then coalesce(l.cash, 0) - coalesce(d.amount, 0) - b.amount end as cover_after
      from open as k join instruments as i on i.id = k.instrument_id cross join legal_entities as e
      left join lastc as l on l.entity_id = e.id and l.currency = k.currency left join due as d on d.entity_id = e.id and d.currency = k.currency
      left join buf as b on b.entity_id = e.id and b.currency = k.currency),
      pick as (select p.*, arg_max(p.entity, p.cover_after) filter (where not p.is_named) over (partition by p.call_id) as top_entity,
      max(p.cover_after) filter (where not p.is_named) over (partition by p.call_id) as top_cover from plan as p)
      select p.fund, p.entity, p.is_named, p.currency, cast(p.call_amount as decimal(18,2)) as call_amount, cast(p.due_date as varchar) as due_date, cast(p.cash as decimal(18,2)) as cash,
      cast(p.calls_due as decimal(18,2)) as calls_due, cast(p.buffer as decimal(18,2)) as buffer, cast(p.cover_after as decimal(18,2)) as cover_after_calls,
      cast(greatest(p.cover_after, 0) as decimal(18,2)) as spare_cover, p.is_named and p.cover_after < 0 as transfer_needed,
      cast(greatest(-p.cover_after, 0) as decimal(18,2)) as shortfall,
      cast(coalesce(greatest(p.top_cover, 0), 0) as decimal(18,2)) as best_other_spare, case when p.top_cover > 0 then p.top_entity end as best_other_entity from pick as p
    measure: cover_after_calls
    columns:
      is_named: True for the entity the commitment names (or that carries the call when it names none); it is the one that pays.
      due_date: The call's due date, as text (yyyy-mm-dd).
      cash: The entity's latest cash in the call currency, zero when it holds none.
      calls_due: All the entity's open calls in the currency, past due and unpaid ones included.
      buffer: The cash buffer of the signed office rule. Empty while none is signed.
      cover_after_calls: Cash less calls due less the buffer. Negative means a transfer is needed first. Empty while the buffer is not on record.
      spare_cover: The cover when it is positive, else zero.
      transfer_needed: True for the paying entity when its cover after calls is negative.
      shortfall: How far below zero the cover is, zero when it is not.
      best_other_spare: The largest spare cover among the other entities for the same call.
      best_other_entity: The entity with that spare cover, empty when none has any.
    tie_out:
      label: Each open call appears once for every entity
      sql: >-
        select (select count(*) from {name}), (select count(distinct m.id) from cash_movements as m
        where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected')
        and (m.confirmation_status in ('noticed', 'expected') or m.due_date >= (select max(a.position_date) from position_snapshots as a))
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)) * (select count(*) from legal_entities)
    needs:
      - why: No signed cash buffer rule (cash_buffer) is on file, so the cover after calls cannot be stated.
        sql: >-
          select count(*) from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'

  - id: intercompany_balance
    label: Intercompany balance
    cards: [28]
    names: [intercompany balance, transfers between entities, due to due from, intercompany loan, money between entities, lent between entities, entity lent to, inter entity loan, inter entity loans, loans between entities]
    may_read: [cash_movements, portfolios, legal_entities, source_records, approvals, users]
    never_read: [position_snapshots, commitments, transactions]
    why: A transfer between two entities is two cash movements, one on each side, each naming the other portfolio. The balance is what one side lent less what came back, never read from a bank balance.
    formula: Each transfer is one flow from the entity that sent (negative amount on its side) to the entity that received. The two rows of one transfer are paired by sender, receiver, currency and amount (first with first, in date order); a flow is counted once, from the sender's row, or from the receiver's row when the sender's is missing. For each pair of entities and currency the flows one way less the flows back give the balance; the entity that is net out is the lender. Rows with no partner are counted in unmatched_rows and rows whose partner is on another date in date_differs; sides_agree is true only when there are none. The reference is the external record id of the source rows; approvals are the approved approvals naming a transfer row.
    grain: By pair of entities and currency
    sql: >-
      create table {name} as with t as (select m.id, m.effective_date as day, m.amount, m.currency, p.legal_entity_id as entity_id, q.legal_entity_id as other_id, m.source_record_id
      from cash_movements as m join portfolios as p on p.id = m.portfolio_id join portfolios as q on q.id = m.counterparty_portfolio_id
      where m.movement_type = 'transfer' and m.confirmation_status <> 'cancelled' and p.legal_entity_id <> q.legal_entity_id
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      f as (select t.*, t.amount < 0 as sent, case when t.amount < 0 then t.entity_id else t.other_id end as sender, case when t.amount < 0 then t.other_id else t.entity_id end as receiver,
      row_number() over (partition by case when t.amount < 0 then t.entity_id else t.other_id end, case when t.amount < 0 then t.other_id else t.entity_id end, t.currency, abs(t.amount), t.amount < 0
      order by t.day, t.id) as rk from t),
      u as (select a.*, (select min(b.day) from f as b where b.sender = a.sender and b.receiver = a.receiver and b.currency = a.currency and abs(b.amount) = abs(a.amount)
      and b.sent <> a.sent and b.rk = a.rk) as other_day from f as a),
      pair as (select least(sender, receiver) as lo, greatest(sender, receiver) as hi, currency, min(day) as first_transfer_date, max(day) as last_transfer_date,
      count(*) filter (where other_day is null) as unmatched_rows, count(*) filter (where sent and other_day is not null and other_day <> day) as date_differs,
      coalesce(sum(abs(amount)) filter (where (sent or other_day is null) and sender < receiver), 0) as lo_to_hi,
      coalesce(sum(abs(amount)) filter (where (sent or other_day is null) and sender > receiver), 0) as hi_to_lo from u group by all),
      ref as (select least(u.sender, u.receiver) as lo, greatest(u.sender, u.receiver) as hi, u.currency, string_agg(distinct s.external_record_id, ', ') as reference
      from u join source_records as s on s.id = u.source_record_id group by all),
      apr as (select least(u.sender, u.receiver) as lo, greatest(u.sender, u.receiver) as hi, u.currency, count(distinct a.id) as approvals_recorded,
      string_agg(distinct us.display_name, ', ') as approved_by from u join approvals as a on a.cash_movement_id = u.id and a.status = 'approved'
      left join users as us on us.id = a.decision_by_user_id group by all)
      select case when n.lo_to_hi >= n.hi_to_lo then a.entity_name else b.entity_name end as lender, case when n.lo_to_hi >= n.hi_to_lo then b.entity_name else a.entity_name end as borrower, n.currency,
      cast(abs(n.lo_to_hi - n.hi_to_lo) as decimal(18,2)) as balance_outstanding, r.reference, coalesce(x.approvals_recorded, 0) as approvals_recorded, x.approved_by,
      n.first_transfer_date, n.last_transfer_date, n.unmatched_rows, n.date_differs, n.unmatched_rows = 0 and n.date_differs = 0 as sides_agree
      from pair as n join legal_entities as a on a.id = n.lo join legal_entities as b on b.id = n.hi
      left join ref as r on r.lo = n.lo and r.hi = n.hi and r.currency = n.currency left join apr as x on x.lo = n.lo and x.hi = n.hi and x.currency = n.currency
    measure: balance_outstanding
    columns:
      lender: The entity that is net out, owed the balance.
      borrower: The entity that owes it.
      balance_outstanding: Transfers out of the lender less transfers back, in the currency, each transfer counted once.
      reference: The external reference of the transfer rows (for example IC-2026-08-01), empty when the rows carry none.
      approvals_recorded: How many approved approvals name a row of these transfers.
      approved_by: Who approved them.
      first_transfer_date: The date of the first transfer between the two.
      last_transfer_date: The date of the latest transfer between the two.
      unmatched_rows: Transfer rows with no row on the other side of the same amount.
      date_differs: Transfer rows whose partner row is on another date.
      sides_agree: True when every transfer row has its partner on the same date.
    tie_out:
      label: Every transfer row has its row on the other side
      sql: >-
        select (select coalesce(sum(unmatched_rows), 0) from {name}), 0

  - id: distribution_gap
    label: Distributions expected against received
    cards: [37]
    names: [distribution gap, distributions expected against received, distribution not received, distributions received]
    may_read: [cash_movements, instruments, commitments, bank_accounts, documents, extracted_fields]
    never_read: [position_snapshots, transactions]
    why: A distribution is promised by a notice (a noticed movement, or the notice document itself when no movement was recorded) and arrives as a bank credit (a confirmed movement on an office account). The gap is the notice less the credit; a position or a commitment does not say whether the money arrived.
    formula: For each distribution notice, the notice amount less the confirmed bank credits of the same fund and currency that belong to it. A credit belongs to the notice of the fund whose pay date is nearest to the credit date (the earlier one on a tie), so a credit a day late is still found, and credits are signed (a reversal reduces what was received). A notice with no credit shows its whole amount as the gap. A pay date later than the latest movement date on file is shown as not due, not as a gap.
    grain: By fund, pay date and currency
    sql: >-
      create table {name} as with cm as (select m.* from cash_movements as m where m.movement_type = 'distribution' and m.confirmation_status <> 'cancelled'
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      n1 as (select m.instrument_id, m.due_date as pay_date, m.currency, sum(abs(m.amount)) as notice_amount, true as recorded from cm as m
      where m.confirmation_status = 'noticed' and m.notice_kind = 'distribution' and m.due_date is not null group by all),
      n2 as (select d.instrument_id, try_cast(coalesce(p.corrected_value_text, p.value_text) as date) as pay_date, coalesce(a.currency, i.currency) as currency,
      sum(a.value_numeric) as notice_amount, false as recorded from documents as d
      join extracted_fields as p on p.document_id = d.id and p.field_name = 'pay_date' and p.review_status <> 'rejected'
      join extracted_fields as a on a.document_id = d.id and a.field_name = 'distribution_amount' and a.review_status <> 'rejected'
      join instruments as i on i.id = d.instrument_id
      where d.document_type = 'distribution_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)
      and try_cast(coalesce(p.corrected_value_text, p.value_text) as date) is not null
      and not exists (select 1 from n1 where n1.instrument_id = d.instrument_id and n1.pay_date = try_cast(coalesce(p.corrected_value_text, p.value_text) as date)) group by all),
      notice as (select * from n1 union all select * from n2),
      cr as (select m.id, m.instrument_id, m.effective_date as day, m.currency, m.amount from cm as m
      where m.confirmation_status = 'confirmed' and m.bank_account_id is not null and m.notice_kind is null),
      asg as (select c.id, n.instrument_id, n.pay_date, n.currency, c.amount from cr as c join notice as n on n.instrument_id = c.instrument_id and n.currency = c.currency
      qualify row_number() over (partition by c.id order by abs(date_diff('day', c.day, n.pay_date)), n.pay_date) = 1),
      got as (select instrument_id, pay_date, currency, sum(amount) as received from asg group by all),
      lastday as (select max(m.effective_date) as d from cash_movements as m)
      select i.canonical_name as fund, cast(n.pay_date as varchar) as pay_date, n.currency, cast(n.notice_amount as decimal(18,2)) as notice_amount, cast(coalesce(g.received, 0) as decimal(18,2)) as received,
      cast(case when n.pay_date <= a.d then n.notice_amount - coalesce(g.received, 0) else 0 end as decimal(18,2)) as gap, n.pay_date <= a.d as pay_date_passed, n.recorded,
      case when n.pay_date > a.d and g.received is null then 'not due' when n.pay_date > a.d then 'credit before pay date' when g.received is null then 'no credit'
      when g.received < n.notice_amount then 'short' when g.received > n.notice_amount then 'over' else 'received' end as status
      from notice as n join instruments as i on i.id = n.instrument_id cross join lastday as a
      left join got as g on g.instrument_id = n.instrument_id and g.pay_date = n.pay_date and g.currency = n.currency
    measure: gap
    columns:
      notice_amount: The distribution the fund's notice says will be paid.
      received: The confirmed bank credits of the fund that belong to the notice, zero when none.
      gap: Notice less credit once the pay date has passed. Zero when the money arrived in full or is not due yet; negative when more arrived than the notice said.
      pay_date_passed: True when the pay date is on or before the latest movement date on file.
      recorded: True when the notice is a recorded (noticed) movement, false when only the notice document is on file.
      status: Received, short, over, no credit, credit before pay date, or not due.
    tie_out:
      label: The notice amounts in the table equal the noticed distributions and the distribution notice documents with no recorded movement
      sql: >-
        select (select coalesce(sum(notice_amount), 0) from {name}), (select coalesce(sum(abs(m.amount)), 0) from cash_movements as m where m.movement_type = 'distribution'
        and m.confirmation_status = 'noticed' and m.notice_kind = 'distribution' and m.due_date is not null and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))
        + (select coalesce(sum(a.value_numeric), 0) from documents as d join extracted_fields as p on p.document_id = d.id and p.field_name = 'pay_date' and p.review_status <> 'rejected'
        join extracted_fields as a on a.document_id = d.id and a.field_name = 'distribution_amount' and a.review_status <> 'rejected'
        where d.document_type = 'distribution_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)
        and try_cast(coalesce(p.corrected_value_text, p.value_text) as date) is not null
        and not exists (select 1 from cash_movements as m where m.movement_type = 'distribution' and m.confirmation_status = 'noticed' and m.notice_kind = 'distribution'
        and m.instrument_id = d.instrument_id and m.due_date = try_cast(coalesce(p.corrected_value_text, p.value_text) as date)
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)))

  - id: call_payment_status
    label: Capital call payment status
    cards: [6]
    names: [call payment status, capital call paid, call paid, calls paid, call status after the bank statement]
    words_all: [[call, calls], [paid, payment, status, unpaid]]
    may_read: [cash_movements, instruments]
    never_read: [position_snapshots, commitments, transactions]
    why: A call is paid when the bank shows a payment to the fund of the exact amount on the call's due date. A call that is not yet due is not unpaid. The commitment and the cash balance do not say it.
    formula: For each call (not cancelled, not superseded) with a due date, paid when a confirmed payment movement of the same fund, currency and amount (compared as positive numbers, A5) has the call's due date as its value date. A call past its due date with no such payment is not paid; a due date after the latest movement date on file is not due.
    grain: By call
    sql: >-
      create table {name} as with calls as (select m.id, m.instrument_id, m.currency, m.due_date, abs(m.amount) as amount from cash_movements as m
      where m.movement_type = 'call' and m.confirmation_status <> 'cancelled' and m.due_date is not null and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      pay as (select m.id, m.instrument_id, m.currency, m.effective_date, abs(m.amount) as amount from cash_movements as m
      where m.movement_type = 'payment' and m.confirmation_status = 'confirmed' and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      lastday as (select max(m.effective_date) as d from cash_movements as m)
      select i.canonical_name as fund, c.currency, cast(c.amount as decimal(18,2)) as amount, cast(c.due_date as varchar) as due_date, count(p.id) as payments_found,
      case when count(p.id) > 0 then 'paid' when c.due_date > l.d then 'not due' else 'not paid' end as status
      from calls as c join instruments as i on i.id = c.instrument_id cross join lastday as l
      left join pay as p on p.instrument_id = c.instrument_id and p.currency = c.currency and p.amount = c.amount and p.effective_date = c.due_date group by c.id, i.canonical_name, c.currency, c.amount, c.due_date, l.d
    measure: amount
    columns:
      due_date: The call's due date, as text (yyyy-mm-dd).
      payments_found: How many confirmed payments of the exact amount to the fund are dated on the due date.
      status: Paid, not paid (due date passed, no such payment) or not due (due date after the latest movement on file).
    tie_out:
      label: Every call with a due date has one row
      sql: >-
        select (select count(*) from {name}), (select count(*) from cash_movements as m where m.movement_type = 'call' and m.confirmation_status <> 'cancelled' and m.due_date is not null
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))

