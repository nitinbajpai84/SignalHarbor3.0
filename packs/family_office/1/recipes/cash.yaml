# Recipes of one domain (family-office pack). Format, snippets and the rules are in recipes/_shared.yaml; assumptions A7, A8 and A11 onward, in docs/v3/ASSUMPTIONS.md.
# status: stub = named and scoped but not built (sql: null): the loader skips it until the owner of this file fills in sql, grain, measure, columns
# and tie_out and removes `status: stub`. cards = the use-case cards (docs/v3/USE-CASES-100.md numbers) that need it.
recipes:
  - id: cash_by_entity
    label: Cash by entity
    names: [cash by entity, cash position, cash balance, closing cash, cash on hand, cash]
    may_read: [position_snapshots, instruments, portfolios, legal_entities]
    never_read: [commitments, transactions, cash_movements]
    why: The administrator's cash is a balance, a position snapshot of the cash instrument. A movement is a change in a balance, never the balance.
    formula: Cash = the market value of the cash instrument's position snapshots, summed by entity and date.
    grain: By entity and position date
    sql: >-
      create table {name} as with {positions} select e.entity_name as entity, l.position_date, l.currency, cast(sum(l.source_market_value) as decimal(18,2)) as cash
      from positions as l join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      join legal_entities as e on e.id = p.legal_entity_id group by all
    measure: cash
    columns:
      cash: The cash the administrator reports at the end of the day.
    tie_out:
      label: Cash equals the cash positions of the position snapshots for the same dates
      sql: >-
        select (select coalesce(sum(cash), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c join instruments as i on i.id = c.instrument_id
        and i.instrument_type = 'cash' join portfolios as p on p.id = c.portfolio_id join legal_entities as e on e.id = p.legal_entity_id)

  - id: cash_break
    label: Cash break
    names: [cash break, cash breaks, cash difference, cash differs, cash reconciliation, cash variance, break]
    words_all: [[cash], [break, breaks, variance, difference, differences, differs, mismatch]]
    may_read: [position_snapshots, cash_movements, instruments, portfolios, legal_entities]
    never_read: [commitments, transactions]
    why: A break is the administrator's change in cash set against the movements that should explain it. It is never the plain sum of the movements.
    formula: Break = the administrator's closing cash of the day, less the cash it started the period with, less the sum of the cash movements recorded on the same portfolios after the period start up to that day. Money in is positive. Zero means the two sources agree.
    grain: By entity and day
    sql: >-
      create table {name} as with {positions},
      bal as (select p.legal_entity_id as entity_id, e.entity_name as entity, l.position_date, l.currency, sum(l.source_market_value) as closing_cash
      from positions as l join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id
      join legal_entities as e on e.id = p.legal_entity_id group by all),
      first_day as (select entity_id, currency, min(position_date) as start_date from bal group by all),
      held as (select distinct l.portfolio_id from positions as l join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash'),
      mv as (select p.legal_entity_id as entity_id, m.currency, m.effective_date, sum(m.amount) as moved from cash_movements as m
      join portfolios as p on p.id = m.portfolio_id where m.portfolio_id in (select portfolio_id from held)
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id) group by all),
      moved as (select b.entity_id, b.currency, b.position_date, coalesce(sum(mv.moved), 0) as moved from bal as b
      join first_day as f on f.entity_id = b.entity_id and f.currency = b.currency
      left join mv on mv.entity_id = b.entity_id and mv.currency = b.currency and mv.effective_date > f.start_date and mv.effective_date <= b.position_date group by all)
      select b.entity, b.position_date as day, b.currency, cast(b.closing_cash as decimal(18,2)) as closing_cash,
      cast(b.closing_cash - o.closing_cash as decimal(18,2)) as cash_change, cast(m.moved as decimal(18,2)) as movements,
      cast(b.closing_cash - o.closing_cash - m.moved as decimal(18,2)) as cash_break
      from bal as b join first_day as f on f.entity_id = b.entity_id and f.currency = b.currency
      join bal as o on o.entity_id = f.entity_id and o.currency = f.currency and o.position_date = f.start_date
      join moved as m on m.entity_id = b.entity_id and m.currency = b.currency and m.position_date = b.position_date
    measure: cash_break
    columns:
      closing_cash: The administrator's closing cash of the day.
      cash_change: The administrator's closing cash less the cash at the start of the period.
      movements: The cash movements recorded on the same portfolios after the period start, up to the day.
      cash_break: The cash change less the movements. Zero when the two sources agree.
    tie_out:
      label: The administrator cash in the break equals the cash positions of the position snapshots for the same days
      sql: >-
        select (select coalesce(sum(closing_cash), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c join instruments as i on i.id = c.instrument_id
        and i.instrument_type = 'cash' join portfolios as p on p.id = c.portfolio_id where p.legal_entity_id is not null)
    needs:   # an input with no rows: the figure is held at Decision 3, never stated (c6 ops_lead: with no movements the break was the plain change in cash)
      - why: No cash movements are loaded for the portfolios whose cash the administrator reports, so the break would only be the change in that cash, not a break.
        sql: >-
          select count(*) from cash_movements as m where m.portfolio_id in (select s.portfolio_id from position_snapshots as s
          join instruments as i on i.id = s.instrument_id and i.instrument_type = 'cash')
          and m.effective_date > (select min(s.position_date) from position_snapshots as s join instruments as i on i.id = s.instrument_id and i.instrument_type = 'cash')

  - id: fx_confirmation_variance
    label: FX forward confirmation variance
    names: [fx forward confirmation variance, fx confirmation variance, fx forward confirmation, fx confirmation, confirmation variance, fx forward difference, confirmation differs]
    words_all: [[fx, forward, forwards], [confirmation, confirmations, confirm], [differ, differs, difference, variance, mismatch, match]]
    may_read: [fx_confirmations, transactions, instruments, instrument_identifiers]
    never_read: [commitments, cash_movements, position_snapshots]
    why: A confirmation is checked against the trade the desk booked, by the trade reference, leg for leg. Cash balances and commitments say nothing about it.
    formula: For each confirmation (the latest row for the trade reference), find the desk's trade by the same reference (its trade id, or the identifier of its instrument). Take the confirmation's leg in the trade's currency and compare it with the trade's cash amount (absolute). Variance = confirmation leg less trade amount.
    grain: By trade reference
    sql: >-
      create table {name} as with conf as (select c.* from fx_confirmations as c where not exists (select 1 from fx_confirmations as x where x.supersedes_fx_confirmation_id = c.id)),
      trade as (select t.id, t.external_trade_id, t.trade_date, t.currency, abs(t.cash_amount) as trade_amount, t.instrument_id from transactions as t
      where t.supersedes_transaction_id is null and not exists (select 1 from transactions as x where x.supersedes_transaction_id = t.id)),
      ref as (select t.id as trade_id, t.external_trade_id as ref from trade as t union select t.id, x.identifier_value from trade as t
      join instrument_identifiers as x on x.instrument_id = t.instrument_id)
      select c.trade_reference, c.trade_date, c.counterparty, t.currency, cast(case when c.currency_bought = t.currency then c.amount_bought
      when c.currency_sold = t.currency then c.amount_sold end as decimal(18,2)) as confirmed_amount, cast(t.trade_amount as decimal(18,2)) as trade_amount,
      cast(case when c.currency_bought = t.currency then c.amount_bought when c.currency_sold = t.currency then c.amount_sold end - t.trade_amount as decimal(18,2)) as variance
      from conf as c join ref as r on r.ref = c.trade_reference join trade as t on t.id = r.trade_id
    measure: variance
    columns:
      confirmed_amount: The confirmation's amount in the currency of the desk's trade.
      trade_amount: The desk's trade amount, as a positive number.
      variance: The confirmed amount less the trade amount. Zero when they agree.
    tie_out:
      label: Every confirmation is compared once with a trade
      sql: >-
        select (select count(distinct trade_reference) from {name}), (select count(distinct c.trade_reference) from fx_confirmations as c
        where exists (select 1 from transactions as t where t.external_trade_id = c.trade_reference)
        or exists (select 1 from transactions as t join instrument_identifiers as x on x.instrument_id = t.instrument_id where x.identifier_value = c.trade_reference))

  # ---- W1 cash builder: the stubs of cards 2, 4, 5, 6, 8, 10, 18, 28, 37 are built below (liquidity_ladder and cash_forecast, cards 54 and 72, stay stubs).
  # Two recipes are new: call_fee_check (card 2 figure fee_part_check) and calls_due (card 3 figure calls_due). Where a recipe needs a signed office rule,
  # business_rules and rule_versions are added to may_read (the stub lists did not name them); the rule is read, never typed (docs/v3/ASSUMPTIONS.md A20).
  - id: called_to_date
    label: Called to date and unfunded
    cards: [2, 36]
    names: [called to date, unfunded after call, capital called, uncalled commitments, unfunded commitments]
    may_read: [cash_movements, commitments, instruments]
    never_read: [position_snapshots, transactions]
    why: A call is a cash movement of type call linked to its commitment; the commitment file states the called amount at its own date. Cash balances say nothing about what was called.
    formula: Called before the notice = the called amount the commitment file states at its as-at date, plus the confirmed call movements after that date. A noticed call not yet recorded is added for "after the notice". Unfunded = commitment less called. A noticed call larger than the unfunded amount before it does not fit.
    grain: By commitment (fund and investor entity)
    sql: >-
      create table {name} as with cur as (select c.* from commitments as c where not exists (select 1 from commitments as x where x.supersedes_commitment_id = c.id)),
      mv as (select m.* from cash_movements as m where m.movement_type = 'call' and m.confirmation_status <> 'cancelled'
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      conf as (select c.id as commitment_id, coalesce(sum(abs(m.amount)) filter (where m.confirmation_status = 'confirmed'
      and m.effective_date > coalesce(c.called_as_at, date '1900-01-01')), 0) as since_stated from cur as c left join mv as m on m.commitment_id = c.id group by c.id),
      nt as (select m.commitment_id, sum(abs(m.amount)) as noticed, min(m.due_date) as due_date from mv as m where m.confirmation_status = 'noticed' group by m.commitment_id),
      base as (select c.id as commitment_id, c.legal_entity_id, i.canonical_name as fund, c.currency, c.commitment_amount as commitment,
      coalesce(c.called_to_date, 0) + f.since_stated as called_before, coalesce(n.noticed, 0) as noticed, n.due_date as notice_due_date
      from cur as c join instruments as i on i.id = c.instrument_id join conf as f on f.commitment_id = c.id left join nt as n on n.commitment_id = c.id)
      select b.commitment_id, b.legal_entity_id, b.fund, b.currency, cast(b.commitment as decimal(18,2)) as commitment,
      cast(b.called_before as decimal(18,2)) as called_before_notice, cast(b.noticed as decimal(18,2)) as noticed_not_recorded, b.notice_due_date,
      cast(b.called_before + b.noticed as decimal(18,2)) as called_after_notice,
      cast(b.commitment - b.called_before as decimal(18,2)) as unfunded_before_notice,
      cast(b.commitment - b.called_before - b.noticed as decimal(18,2)) as unfunded_after_notice,
      b.noticed <= b.commitment - b.called_before as notice_fits from base as b
    measure: unfunded_after_notice
    columns:
      commitment: What the office committed to the fund.
      called_before_notice: Capital called to date as the commitment file states it, plus the confirmed calls recorded after that date, before any noticed call.
      noticed_not_recorded: The calls noticed by the fund and not yet recorded (positive).
      called_after_notice: Called before the notice plus the noticed calls.
      unfunded_before_notice: Commitment less called before the notice.
      unfunded_after_notice: Commitment less called after the notice. Negative means the call is larger than what is left.
      notice_fits: True when the noticed calls are not larger than the unfunded amount before them.
    tie_out:
      label: Called before the notice equals the called amount the commitment files state, plus the confirmed calls recorded after their as-at date
      sql: >-
        select (select coalesce(sum(called_before_notice), 0) from {name}),
        (select coalesce(sum(c.called_to_date), 0) from commitments as c where not exists (select 1 from commitments as x where x.supersedes_commitment_id = c.id))
        + (select coalesce(sum(abs(m.amount)), 0) from cash_movements as m join commitments as c on c.id = m.commitment_id
        where not exists (select 1 from commitments as x where x.supersedes_commitment_id = c.id) and m.movement_type = 'call' and m.confirmation_status = 'confirmed'
        and m.effective_date > coalesce(c.called_as_at, date '1900-01-01') and not exists (select 1 from cash_movements as y where y.supersedes_cash_movement_id = m.id))
    needs:
      - why: No commitments are loaded, so there is nothing to compare a call with.
        sql: select count(*) from commitments

  - id: call_fee_check
    label: Fee part of a call against the fund terms
    cards: [2]
    names: [fee part check, call fee check, fee against fund terms, management fee on the call]
    words_all: [[fee], [call, notice], [terms, schedule, check, matches, differs]]
    may_read: [documents, extracted_fields, commitments, instruments]
    never_read: [cash_movements, position_snapshots]
    why: The fee on a call is checked against the fee rate the fund's terms state, read from the fund's documents, times the commitment. Cash and positions say nothing about it.
    formula: Fee on the notice (read from the notice) against the management fee rate in the fund terms (extracted field management_fee_rate, a fraction of the commitment per billing) times the commitment. Difference = fee on the notice less the fee per terms. It matches when the difference is under one cent.
    grain: By capital call notice
    sql: >-
      create table {name} as with notice as (select d.id as document_id, d.title, d.document_date as notice_date, d.instrument_id, f.value_numeric as fee_on_notice
      from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'management_fee' and f.review_status <> 'rejected'
      where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)),
      rate as (select d.instrument_id, f.value_numeric as fee_rate from documents as d join extracted_fields as f on f.document_id = d.id
      and f.field_name = 'management_fee_rate' and f.review_status <> 'rejected' where d.document_type = 'fund_terms'
      and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)),
      commit as (select c.instrument_id, sum(c.commitment_amount) as commitment from commitments as c
      where not exists (select 1 from commitments as x where x.supersedes_commitment_id = c.id) group by c.instrument_id)
      select n.title as notice, try_cast(regexp_extract(n.title, '([0-9]+)$', 1) as integer) as call_no, i.canonical_name as fund, n.notice_date, cast(n.fee_on_notice as decimal(18,2)) as fee_on_notice, r.fee_rate,
      cast(c.commitment as decimal(18,2)) as commitment, cast(r.fee_rate * c.commitment as decimal(18,2)) as fee_per_terms,
      cast(n.fee_on_notice - r.fee_rate * c.commitment as decimal(18,2)) as fee_difference,
      abs(n.fee_on_notice - r.fee_rate * c.commitment) < 0.01 as fee_matches
      from notice as n join instruments as i on i.id = n.instrument_id join rate as r on r.instrument_id = n.instrument_id join commit as c on c.instrument_id = n.instrument_id
    measure: fee_difference
    columns:
      call_no: The call number, the last digits of the notice reference.
      fee_on_notice: The management fee the notice charges.
      fee_rate: The fund terms' management fee rate, a fraction of the commitment per billing.
      fee_per_terms: The fee rate times the commitment.
      fee_difference: The fee on the notice less the fee per terms. Zero when they agree.
      fee_matches: True when the fee on the notice equals the fee per terms.
    tie_out:
      label: Every call notice with a fee is checked once
      sql: >-
        select (select count(*) from {name}), (select count(*) from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'management_fee'
        where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)
        and exists (select 1 from documents as t join extracted_fields as g on g.document_id = t.id and g.field_name = 'management_fee_rate'
        where t.document_type = 'fund_terms' and t.instrument_id = d.instrument_id))

  - id: calls_due
    label: Calls due in 30 and 60 days
    cards: [3]
    names: [calls due, calls due in 30 days, calls due in 60 days, capital calls due]
    may_read: [cash_movements, portfolios, legal_entities, position_snapshots]
    never_read: [commitments, transactions]
    why: A call due is a recorded or noticed call movement with a due date in the window; the commitment says what may still be called, not what is due.
    formula: For each entity and each window (30 and 60 days from the latest cash position date), the sum of the call movements (noticed or recorded, not cancelled, not superseded) with a due date from that date up to the end of the window. A call already past its due date is not due.
    grain: By entity, currency and window
    sql: >-
      create table {name} as with {positions}, lastday as (select max(l.position_date) as d from positions as l),
      calls as (select p.legal_entity_id as entity_id, m.currency, m.due_date, abs(m.amount) as amount from cash_movements as m join portfolios as p on p.id = m.portfolio_id
      where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date is not null
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      ccy as (select distinct currency from calls)
      select e.entity_name as entity, y.currency, w.days as window_days, a.d as as_of,
      cast(coalesce(sum(c.amount) filter (where c.due_date >= a.d and c.due_date <= a.d + w.days * interval 1 day), 0) as decimal(18,2)) as calls_due,
      count(c.amount) filter (where c.due_date >= a.d and c.due_date <= a.d + w.days * interval 1 day) as calls,
      min(c.due_date) filter (where c.due_date >= a.d and c.due_date <= a.d + w.days * interval 1 day) as next_due_date
      from legal_entities as e cross join ccy as y cross join (select 30 as days union all select 60) as w cross join lastday as a
      left join calls as c on c.entity_id = e.id and c.currency = y.currency group by all
    measure: calls_due
    columns:
      as_of: The latest cash position date; the windows start here.
      calls_due: The calls due from the as-at date to the end of the window.
      calls: How many calls make up the amount.
      next_due_date: The earliest due date inside the window.
    tie_out:
      label: The calls due in 60 days equal the open calls with a due date in 60 days
      sql: >-
        select (select coalesce(sum(calls_due), 0) from {name} where window_days = 60),
        (select coalesce(sum(abs(m.amount)), 0) from cash_movements as m join portfolios as p on p.id = m.portfolio_id where m.movement_type = 'call'
        and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date >= (select max(a.position_date) from position_snapshots as a)
        and m.due_date <= (select max(a.position_date) from position_snapshots as a) + interval 60 day and p.legal_entity_id is not null
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))

  - id: cash_after_calls
    label: Cash after calls due
    cards: [4]
    names: [cash after calls, cash cover after calls, cash after calls due]
    may_read: [position_snapshots, cash_movements, instruments, portfolios, legal_entities, business_rules, rule_versions]
    never_read: [commitments, transactions]
    why: The cash is the administrator's balance, a position snapshot of the cash instrument. The calls are call movements. The buffer is the signed office rule, never a number typed in.
    formula: For each entity and currency, the latest cash balance (as cash_by_entity counts it) less the calls due on or after that date in the same currency less the buffer of the signed office rule cash_buffer (the buffer applies in the currency the rule names). Negative means the entity is short; the shortfall is that amount made positive.
    grain: By entity and currency, at the latest cash date
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.currency, l.position_date, sum(l.source_market_value) as cash from positions as l
      join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id group by all),
      lastc as (select c.* from cashp as c where c.position_date = (select max(x.position_date) from cashp as x where x.entity_id = c.entity_id and x.currency = c.currency)),
      calls as (select p.legal_entity_id as entity_id, m.currency, m.due_date, abs(m.amount) as amount from cash_movements as m join portfolios as p on p.id = m.portfolio_id
      where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date >= (select max(position_date) from cashp)
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      due as (select entity_id, currency, sum(amount) as amount, min(due_date) as next_due_date from calls group by all),
      buf as (select cast(json_extract_string(v.parameters, '$.amount') as decimal(18,2)) as amount, json_extract_string(v.parameters, '$.currency') as currency
      from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'
      and v.effective_from <= (select max(position_date) from cashp) and (v.effective_to is null or v.effective_to >= (select max(position_date) from cashp))
      order by v.version_number desc limit 1)
      select e.entity_name as entity, c.currency, c.position_date as as_of, cast(c.cash as decimal(18,2)) as cash, cast(coalesce(d.amount, 0) as decimal(18,2)) as calls_due,
      d.next_due_date, cast(coalesce(b.amount, 0) as decimal(18,2)) as buffer,
      cast(c.cash - coalesce(d.amount, 0) - coalesce(b.amount, 0) as decimal(18,2)) as cash_after_calls,
      cast(greatest(coalesce(d.amount, 0) + coalesce(b.amount, 0) - c.cash, 0) as decimal(18,2)) as shortfall
      from lastc as c join legal_entities as e on e.id = c.entity_id left join due as d on d.entity_id = c.entity_id and d.currency = c.currency
      left join buf as b on b.currency = c.currency
    measure: cash_after_calls
    columns:
      cash: The administrator's closing cash for the entity and currency at the latest date.
      calls_due: The calls due on or after that date, in the same currency.
      buffer: The cash buffer of the signed office rule, in its currency (zero in another currency).
      cash_after_calls: Cash less the calls due less the buffer. Negative means short.
      shortfall: How much the entity is short, zero when it is not.
    tie_out:
      label: The cash in the table equals the cash positions of the latest date for each entity and currency
      sql: >-
        select (select coalesce(sum(cash), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c
        join instruments as i on i.id = c.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = c.portfolio_id
        where c.position_date = (select max(d.position_date) from ({positions_check}) as d join instruments as j on j.id = d.instrument_id and j.instrument_type = 'cash'
        join portfolios as q on q.id = d.portfolio_id where q.legal_entity_id = p.legal_entity_id and d.currency = c.currency))
    needs:   # the buffer is a signed office rule: without it the shortfall would be a guess
      - why: No signed cash buffer rule (cash_buffer) is on file, so the cash after calls cannot be stated.
        sql: >-
          select count(*) from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'

  - id: bank_details_changed
    label: Payee bank details changed
    cards: [5]
    names: [bank details changed, payee account changed, standing instruction changed, bank account changed]
    may_read: [bank_accounts, extracted_fields, documents, cash_movements, instruments]
    never_read: [position_snapshots, commitments]
    why: The account on a notice is compared with the payee account the office has on file, as it stood when the notice came. The notice and the file say it; balances and commitments do not.
    formula: For each capital call notice, the account ending read from the notice against the payee account on file for the fund as it stood on the notice date (the latest payee row verified on or before it). Changed = the endings differ. The payment stays on hold while it is changed and no payee row for the notice's account records a call-back (verified_on on or after the notice date). Earlier payments to the fund show where the money went before.
    grain: By capital call notice
    sql: >-
      create table {name} as with notice as (select d.id as document_id, d.title, d.instrument_id, d.document_date as notice_date,
      right(regexp_replace(coalesce(f.corrected_value_text, f.value_text), '[^0-9A-Za-z]', '', 'g'), 4) as notice_ending
      from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'bank_account' and f.review_status <> 'rejected'
      where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id)),
      payee as (select b.* from bank_accounts as b where b.holder_kind = 'payee' and b.status <> 'closed'),
      basis as (select n.document_id, right(p.account_ref, 4) as on_file_ending, p.verified_on as on_file_verified_on from notice as n join payee as p on p.instrument_id = n.instrument_id
      and p.verified_on is not null and p.verified_on <= n.notice_date where p.verified_on = (select max(q.verified_on) from payee as q where q.instrument_id = n.instrument_id
      and q.verified_on is not null and q.verified_on <= n.notice_date)),
      callback as (select n.document_id, max(p.verified_on) as callback_on from notice as n join payee as p on p.instrument_id = n.instrument_id
      and right(p.account_ref, 4) = n.notice_ending and p.verified_on is not null and p.verified_on >= n.notice_date group by n.document_id),
      paid as (select n.document_id, count(*) as paid_before, string_agg(right(b.account_ref, 4), ',' order by m.effective_date) as paid_to
      from notice as n join cash_movements as m on m.instrument_id = n.instrument_id and m.movement_type = 'payment' and m.confirmation_status = 'confirmed'
      and m.effective_date < n.notice_date and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)
      join bank_accounts as b on b.id = m.bank_account_id group by n.document_id)
      select n.title as notice, try_cast(regexp_extract(n.title, '([0-9]+)$', 1) as integer) as call_no, i.canonical_name as fund, n.notice_date, n.notice_ending, s.on_file_ending as old_ending, n.notice_ending as new_ending,
      coalesce(n.notice_ending <> s.on_file_ending, true) as changed, c.callback_on as callback_verified_on,
      coalesce(n.notice_ending <> s.on_file_ending, true) and c.callback_on is null as on_hold, coalesce(p.paid_before, 0) as paid_before, p.paid_to
      from notice as n join instruments as i on i.id = n.instrument_id left join basis as s on s.document_id = n.document_id
      left join callback as c on c.document_id = n.document_id left join paid as p on p.document_id = n.document_id
    measure: on_hold
    columns:
      call_no: The call number, the last digits of the notice reference.
      notice_ending: The last four characters of the account the notice asks to pay.
      old_ending: The last four characters of the payee account on file when the notice came (empty when none was on file).
      new_ending: The account ending on the notice.
      changed: True when the notice account differs from the account on file, or none was on file.
      callback_verified_on: The date a call-back on a known number was recorded for the notice's account, empty when none.
      on_hold: True while the account is changed and no call-back is recorded. The payment stays on hold.
      paid_before: How many earlier payments to the fund were confirmed.
      paid_to: The account endings those earlier payments went to, oldest first.
    tie_out:
      label: Every capital call notice with an account is compared once
      sql: >-
        select (select count(*) from {name}), (select count(*) from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'bank_account'
        where d.document_type = 'capital_call_notice' and not exists (select 1 from documents as x where x.supersedes_document_id = d.id))

  - id: fx_required
    label: FX needed to pay a call
    cards: [6]
    names: [fx required, fx needed, currency to convert, amount to convert]
    may_read: [cash_movements, position_snapshots, market_observations, instruments, portfolios, legal_entities, business_rules, rule_versions]
    never_read: [commitments, transactions, fx_confirmations]
    why: The amount to convert is the shortfall after calls and buffer at the planning rate of the FX series. A confirmation is checked against it afterwards; it does not set it.
    formula: For each entity short after calls due (cash_after_calls), the shortfall in the call currency times the planning rate of the FX series (the latest observation of the pair, SGD per 1 USD for the pair USD/SGD), rounded up to the next whole unit of the other currency. The rate and its date are shown, with the cash held in the other currency.
    grain: By entity and call currency
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.currency, l.position_date, sum(l.source_market_value) as cash from positions as l
      join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id group by all),
      lastc as (select c.* from cashp as c where c.position_date = (select max(x.position_date) from cashp as x where x.entity_id = c.entity_id and x.currency = c.currency)),
      calls as (select p.legal_entity_id as entity_id, m.currency, abs(m.amount) as amount from cash_movements as m join portfolios as p on p.id = m.portfolio_id
      where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date >= (select max(position_date) from cashp)
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      due as (select entity_id, currency, sum(amount) as amount from calls group by all),
      buf as (select cast(json_extract_string(v.parameters, '$.amount') as decimal(18,2)) as amount, json_extract_string(v.parameters, '$.currency') as currency
      from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'
      and v.effective_from <= (select max(position_date) from cashp) and (v.effective_to is null or v.effective_to >= (select max(position_date) from cashp))
      order by v.version_number desc limit 1),
      fx as (select o.base_currency, o.quote_currency, o.value as rate, cast(o.observed_at as date) as rate_date from market_observations as o
      where o.observation_type = 'fx' and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id)
      and o.observed_at = (select max(y.observed_at) from market_observations as y where y.series_key = o.series_key and y.observation_type = 'fx'
      and cast(y.observed_at as date) <= (select max(position_date) from cashp))),
      short as (select c.entity_id, c.currency, c.cash, d.amount as calls_due, coalesce(b.amount, 0) as buffer, d.amount + coalesce(b.amount, 0) - c.cash as shortfall
      from lastc as c join due as d on d.entity_id = c.entity_id and d.currency = c.currency left join buf as b on b.currency = c.currency
      where d.amount + coalesce(b.amount, 0) - c.cash > 0)
      select e.entity_name as entity, s.currency, cast(s.shortfall as decimal(18,2)) as shortfall, f.quote_currency as convert_currency, f.rate, f.rate_date,
      cast(ceil(s.shortfall * f.rate) as decimal(18,2)) as convert_amount, cast(o.cash as decimal(18,2)) as other_cash, o.cash >= ceil(s.shortfall * f.rate) as other_cash_covers
      from short as s join legal_entities as e on e.id = s.entity_id join fx as f on f.base_currency = s.currency
      left join lastc as o on o.entity_id = s.entity_id and o.currency = f.quote_currency
    measure: convert_amount
    columns:
      shortfall: The amount short after calls due and the buffer, in the call currency.
      convert_currency: The currency held that would be converted.
      rate: The planning rate of the FX series, units of the convert currency per one unit of the call currency.
      rate_date: The date of that observation.
      convert_amount: The shortfall times the rate, rounded up to the next whole unit.
      other_cash: The cash the entity holds in the convert currency.
      other_cash_covers: True when that cash is enough for the conversion.
    tie_out:
      label: The amount to convert equals the shortfall times the rate, rounded up to the next whole unit
      sql: >-
        select (select coalesce(sum(convert_amount), 0) from {name}), (select coalesce(sum(ceil(shortfall * rate)), 0) from {name})
    needs:
      - why: No signed cash buffer rule (cash_buffer) is on file, so the shortfall to convert cannot be stated.
        sql: >-
          select count(*) from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'
      - why: No FX rate observation is loaded, so the amount to convert cannot be stated.
        sql: select count(*) from market_observations as o where o.observation_type = 'fx'

  - id: payment_batch
    label: Payment batch by approval state
    cards: [8]
    names: [payment batch, payment run, payments awaiting approval, payments to release]
    may_read: [cash_movements, approvals, bank_accounts, users]
    never_read: [position_snapshots, commitments]
    why: A payment is a cash movement of type payment that is still expected; its approvals are rows of approvals that name the movement. Cash balances and commitments do not say whether it may be released.
    formula: The payments still to be released (cash movements of type payment, status expected), each in one state. Hold when an open approval of type payment_hold names it (its rationale is the reason); waiting for approval when an approval requested for it is not yet approved; otherwise ready (approved, or none was needed). A payment to an account that replaced an earlier payee account and has no call-back (verified_on) cannot be released. Totals by currency are shown on each row.
    grain: By payment
    sql: >-
      create table {name} as with pay as (select m.* from cash_movements as m where m.movement_type = 'payment' and m.confirmation_status = 'expected'
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      ap as (select a.cash_movement_id, count(*) filter (where a.status = 'requested') as requested, count(*) filter (where a.status = 'approved') as approved,
      string_agg(u.display_name, ', ') filter (where a.status = 'approved') as approver, string_agg(r.display_name, ', ') filter (where a.status = 'requested') as requested_from
      from approvals as a left join users as u on u.id = a.decision_by_user_id left join users as r on r.id = a.requested_from_user_id
      where a.approval_type <> 'payment_hold' and a.cash_movement_id is not null group by a.cash_movement_id),
      hold as (select a.cash_movement_id, string_agg(a.rationale, '; ') as reason from approvals as a where a.approval_type = 'payment_hold' and a.status = 'requested'
      and a.cash_movement_id is not null group by a.cash_movement_id),
      st as (select m.id, m.currency, abs(m.amount) as amount, m.due_date, b.holder_name as payee, right(b.account_ref, 4) as account_ending,
      coalesce(p.requested, 0) as requested, coalesce(p.approved, 0) as approved, p.approver, p.requested_from, h.reason as hold_reason,
      b.supersedes_bank_account_id is not null and b.verified_on is null and right(b.account_ref, 4) <> coalesce((select right(o.account_ref, 4) from bank_accounts as o
      where o.id = b.supersedes_bank_account_id), right(b.account_ref, 4)) as account_changed_unverified
      from pay as m left join bank_accounts as b on b.id = m.bank_account_id left join ap as p on p.cash_movement_id = m.id left join hold as h on h.cash_movement_id = m.id)
      select s.payee, s.currency, cast(s.amount as decimal(18,2)) as amount, s.due_date,
      case when s.hold_reason is not null then 'hold: ' || s.hold_reason when s.requested > 0 then 'waiting for approval' else 'ready' end as state,
      case when s.requested > 0 then 'requested' when s.approved > 0 then 'approved' else 'not needed' end as approval_state,
      s.hold_reason, s.requested_from, s.approver, s.account_ending, s.account_changed_unverified,
      s.hold_reason is not null or s.requested > 0 or s.account_changed_unverified as release_blocked,
      cast(sum(s.amount) over (partition by s.currency) as decimal(18,2)) as batch_total_in_currency from st as s
    measure: amount
    columns:
      payee: Who is paid, the holder of the account the payment goes to.
      amount: The payment as a positive number.
      state: Hold with its reason, waiting for approval, or ready.
      approval_state: Requested while an approval is open, approved when one was given, not needed when none was asked for.
      hold_reason: Why a payment is on hold, from the open payment_hold approval.
      account_changed_unverified: True when the payee account replaced an earlier one and no call-back is recorded.
      release_blocked: True while a hold, an open approval or an unverified changed account stands in the way of the release.
      batch_total_in_currency: The total of the batch in the payment's currency.
    tie_out:
      label: Every expected payment is in the batch once
      sql: >-
        select (select count(*) from {name}), (select count(*) from cash_movements as m where m.movement_type = 'payment' and m.confirmation_status = 'expected'
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))

  - id: cash_by_bank
    label: Cash by bank
    cards: [10]
    names: [cash by bank, cash at each bank, bank concentration, cash held at each bank]
    may_read: [position_snapshots, bank_accounts, instruments, market_observations, business_rules, rule_versions]
    never_read: [commitments, transactions, cash_movements]
    why: A bank balance is the position snapshot of the account's cash instrument (bank_accounts.cash_instrument_id), a balance, never the movements on the account. The limit is a signed rule, never a number typed in.
    formula: Closing balance of each office account on its latest date (the position snapshots of the account's cash instrument), converted to USD at the latest FX observation up to that date, summed by bank. Share = the bank's USD equivalent over all banks. The limit is the signed rule bank_limit_<bank> (parameters max_pct, the bank name in lower case with other characters as underscores); with no signed rule the limit is empty and nothing is over it.
    grain: By bank
    sql: >-
      create table {name} as with {positions},
      acct as (select b.* from bank_accounts as b where b.holder_kind = 'office' and b.cash_instrument_id is not null and b.status <> 'closed'
      and not exists (select 1 from bank_accounts as x where x.supersedes_bank_account_id = b.id)),
      bal as (select a.bank_name, a.id as account_id, l.currency, l.position_date, l.source_market_value as v from acct as a join positions as l on l.instrument_id = a.cash_instrument_id
      where l.position_date = (select max(y.position_date) from positions as y where y.instrument_id = a.cash_instrument_id)),
      fx as (select o.base_currency, o.quote_currency, o.value as rate, cast(o.observed_at as date) as rate_date from market_observations as o
      where o.observation_type = 'fx' and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id)),
      usd as (select b.bank_name, b.currency, b.position_date, b.v,
      case when b.currency = 'USD' then b.v else b.v / (select f.rate from fx as f where f.base_currency = 'USD' and f.quote_currency = b.currency and f.rate_date <= b.position_date
      order by f.rate_date desc limit 1) end as usd_value from bal as b),
      bank as (select u.bank_name, count(*) as accounts, max(u.position_date) as as_of, sum(u.usd_value) as usd_equivalent,
      string_agg(u.currency || ' ' || cast(round(u.v, 2) as varchar), '; ' order by u.currency) as balances from usd as u group by u.bank_name),
      lim as (select r.rule_code, cast(json_extract_string(v.parameters, '$.max_pct') as decimal(9,4)) as max_pct from business_rules as r
      join rule_versions as v on v.business_rule_id = r.id where v.approval_status = 'approved' and r.rule_code like 'bank_limit_%'
      and v.version_number = (select max(w.version_number) from rule_versions as w where w.business_rule_id = r.id and w.approval_status = 'approved')),
      shared as (select k.*, 100 * k.usd_equivalent / sum(k.usd_equivalent) over () as share_pct,
      (select l.max_pct from lim as l where l.rule_code = 'bank_limit_' || rtrim(regexp_replace(lower(k.bank_name), '[^a-z0-9]+', '_', 'g'), '_')) as limit_pct from bank as k)
      select s.bank_name as bank, s.accounts, s.as_of, s.balances, cast(s.usd_equivalent as decimal(18,2)) as usd_equivalent, cast(s.share_pct as decimal(9,2)) as share_pct,
      s.limit_pct, cast(s.share_pct - s.limit_pct as decimal(9,2)) as excess_pct, s.share_pct > s.limit_pct as over_limit,
      case when s.limit_pct is not null then rank() over (partition by s.limit_pct is not null order by s.share_pct - s.limit_pct desc) end as worst
      from shared as s
    measure: usd_equivalent
    columns:
      accounts: How many accounts the bank holds for the office.
      as_of: The latest balance date among them.
      balances: The balances by currency, in their own currency.
      usd_equivalent: The balances converted to USD and added up.
      share_pct: The bank's share of all cash at banks, in percent.
      limit_pct: The signed limit for the bank in percent of all cash, empty when no limit is signed.
      excess_pct: Share less the limit, in percentage points.
      over_limit: True when the share is above a signed limit, empty when there is no limit.
      worst: 1 for the bank furthest over its limit, empty for a bank with no signed limit.
    tie_out:
      label: The cash at banks equals the closing cash of every office account on its latest date, in USD
      sql: >-
        select (select coalesce(sum(usd_equivalent), 0) from {name}), (select coalesce(sum(case when c.currency = 'USD' then c.v else c.v / (select f.value from market_observations as f
        where f.observation_type = 'fx' and f.base_currency = 'USD' and f.quote_currency = c.currency and cast(f.observed_at as date) <= c.position_date
        and not exists (select 1 from market_observations as x where x.supersedes_observation_id = f.id) order by f.observed_at desc limit 1) end), 0)
        from ({positions_check}) as c join bank_accounts as b on b.cash_instrument_id = c.instrument_id and b.holder_kind = 'office' and b.status <> 'closed'
        and not exists (select 1 from bank_accounts as x where x.supersedes_bank_account_id = b.id)
        where c.position_date = (select max(d.position_date) from ({positions_check}) as d where d.instrument_id = c.instrument_id))
    needs:
      - why: No office bank accounts with a cash instrument are loaded, so cash by bank cannot be stated.
        sql: select count(*) from bank_accounts as b where b.holder_kind = 'office' and b.cash_instrument_id is not null

  - id: funding_plan
    label: Which entity pays a call
    cards: [18]
    names: [funding plan, entity that pays, which entity pays, who pays the call]
    may_read: [commitments, position_snapshots, cash_movements, instruments, portfolios, legal_entities, business_rules, rule_versions]
    never_read: [transactions]
    why: The entity that pays is the one the commitment names. The other entities are shown with their cover so a transfer or another source can be weighed, never chosen for the person.
    formula: For each call still to be paid (a call movement due on or after the latest cash date) and each entity, the entity's latest cash in the call currency, less all its calls due in that currency, less the buffer of the signed office rule cash_buffer. The entity named in the call's commitment is the one that pays; a negative cover after calls means a transfer is needed first. Spare cover is the cover when positive. best_other_spare is the largest spare cover of the other entities.
    grain: By call and candidate entity
    sql: >-
      create table {name} as with {positions},
      cashp as (select p.legal_entity_id as entity_id, l.currency, l.position_date, sum(l.source_market_value) as cash from positions as l
      join instruments as i on i.id = l.instrument_id and i.instrument_type = 'cash' join portfolios as p on p.id = l.portfolio_id group by all),
      lastc as (select c.* from cashp as c where c.position_date = (select max(x.position_date) from cashp as x where x.entity_id = c.entity_id and x.currency = c.currency)),
      calls as (select m.id as call_id, p.legal_entity_id as entity_id, m.currency, m.due_date, abs(m.amount) as amount, m.commitment_id, m.instrument_id from cash_movements as m
      join portfolios as p on p.id = m.portfolio_id where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected')
      and m.due_date >= (select max(position_date) from cashp) and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      due as (select entity_id, currency, sum(amount) as amount from calls group by all),
      buf as (select cast(json_extract_string(v.parameters, '$.amount') as decimal(18,2)) as amount, json_extract_string(v.parameters, '$.currency') as currency
      from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'
      and v.effective_from <= (select max(position_date) from cashp) and (v.effective_to is null or v.effective_to >= (select max(position_date) from cashp))
      order by v.version_number desc limit 1),
      plan as (select k.call_id, i.canonical_name as fund, k.amount as call_amount, k.currency, k.due_date, e.entity_name as entity, e.id = c.legal_entity_id as is_named,
      l.cash, coalesce(d.amount, 0) as calls_due, coalesce(b.amount, 0) as buffer, l.cash - coalesce(d.amount, 0) - coalesce(b.amount, 0) as cover_after
      from calls as k join commitments as c on c.id = k.commitment_id join instruments as i on i.id = k.instrument_id
      join lastc as l on l.currency = k.currency join legal_entities as e on e.id = l.entity_id
      left join due as d on d.entity_id = l.entity_id and d.currency = l.currency left join buf as b on b.currency = l.currency),
      pick as (select p.*, arg_max(p.entity, p.cover_after) filter (where not p.is_named) over (partition by p.call_id) as top_entity,
      max(p.cover_after) filter (where not p.is_named) over (partition by p.call_id) as top_cover from plan as p)
      select p.fund, p.entity, p.is_named, p.currency, cast(p.call_amount as decimal(18,2)) as call_amount, p.due_date, cast(p.cash as decimal(18,2)) as cash,
      cast(p.calls_due as decimal(18,2)) as calls_due, cast(p.buffer as decimal(18,2)) as buffer, cast(p.cover_after as decimal(18,2)) as cover_after_calls,
      cast(greatest(p.cover_after, 0) as decimal(18,2)) as spare_cover, p.is_named and p.cover_after < 0 as transfer_needed,
      cast(greatest(-p.cover_after, 0) as decimal(18,2)) as shortfall,
      cast(coalesce(greatest(p.top_cover, 0), 0) as decimal(18,2)) as best_other_spare, case when p.top_cover > 0 then p.top_entity end as best_other_entity from pick as p
    measure: cover_after_calls
    columns:
      is_named: True for the entity the commitment names; it is the one that pays.
      cash: The entity's latest cash in the call currency.
      calls_due: All the entity's calls due on or after that date in the currency.
      buffer: The cash buffer of the signed office rule.
      cover_after_calls: Cash less calls due less the buffer. Negative means a transfer is needed first.
      spare_cover: The cover when it is positive, else zero.
      transfer_needed: True for the paying entity when its cover after calls is negative.
      shortfall: How far below zero the cover is, zero when it is not.
      best_other_spare: The largest spare cover among the other entities for the same call.
      best_other_entity: The entity with that spare cover, empty when none has any.
    tie_out:
      label: Each call appears once for every entity that holds cash in its currency
      sql: >-
        select (select count(*) from {name}), (select count(distinct m.id) from cash_movements as m join portfolios as p on p.id = m.portfolio_id
        where m.movement_type = 'call' and m.confirmation_status in ('noticed', 'confirmed', 'expected') and m.due_date >= (select max(a.position_date) from position_snapshots as a)
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))
        * (select count(distinct p.legal_entity_id) from position_snapshots as s join instruments as i on i.id = s.instrument_id and i.instrument_type = 'cash'
        join portfolios as p on p.id = s.portfolio_id)
    needs:
      - why: No signed cash buffer rule (cash_buffer) is on file, so the cover after calls cannot be stated.
        sql: >-
          select count(*) from business_rules as r join rule_versions as v on v.business_rule_id = r.id where r.rule_code = 'cash_buffer' and v.approval_status = 'approved'

  - id: intercompany_balance
    label: Intercompany balance
    cards: [28]
    names: [intercompany balance, transfers between entities, due to due from, intercompany loan]
    may_read: [cash_movements, portfolios, legal_entities]
    never_read: [position_snapshots, commitments, transactions]
    why: A transfer between two entities is two cash movements, one on each side, each naming the other portfolio. The balance is what one side lent less what came back, never read from a bank balance.
    formula: For each pair of entities and currency, the transfers out of one entity less the transfers back, from cash movements of type transfer whose counterparty_portfolio_id names the other side. The entity that is net out is the lender and the other the borrower; the balance outstanding is that net amount. Both sides of one transfer must agree in amount and date; a transfer with no matching row on the other side is counted, and sides_agree is false while any is left.
    grain: By pair of entities and currency
    sql: >-
      create table {name} as with t as (select m.id, m.effective_date as day, m.amount, m.currency, p.legal_entity_id as entity_id, q.legal_entity_id as other_id
      from cash_movements as m join portfolios as p on p.id = m.portfolio_id join portfolios as q on q.id = m.counterparty_portfolio_id
      where m.movement_type = 'transfer' and m.confirmation_status <> 'cancelled' and p.legal_entity_id <> q.legal_entity_id
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      u as (select a.*, not exists (select 1 from t as b where b.entity_id = a.other_id and b.other_id = a.entity_id and b.currency = a.currency and b.day = a.day
      and b.amount = -a.amount) as unmatched from t as a),
      pair as (select least(entity_id, other_id) as lo, greatest(entity_id, other_id) as hi, currency, min(day) as first_transfer_date, max(day) as last_transfer_date,
      count(*) filter (where unmatched) as unmatched_rows, count(*) filter (where entity_id = least(entity_id, other_id)) as lo_rows, count(*) filter (where entity_id <> least(entity_id, other_id)) as hi_rows,
      coalesce(sum(-amount) filter (where entity_id = least(entity_id, other_id)), 0) as lo_out, coalesce(sum(-amount) filter (where entity_id <> least(entity_id, other_id)), 0) as hi_out
      from u group by all),
      net as (select p.*, case when p.lo_rows > 0 then p.lo_out else -p.hi_out end as net_lo from pair as p)
      select case when n.net_lo >= 0 then a.entity_name else b.entity_name end as lender, case when n.net_lo >= 0 then b.entity_name else a.entity_name end as borrower, n.currency,
      cast(abs(n.net_lo) as decimal(18,2)) as balance_outstanding, n.first_transfer_date, n.last_transfer_date, n.unmatched_rows,
      n.lo_rows > 0 and n.hi_rows > 0 and n.lo_out = -n.hi_out and n.unmatched_rows = 0 as sides_agree
      from net as n join legal_entities as a on a.id = n.lo join legal_entities as b on b.id = n.hi
    measure: balance_outstanding
    columns:
      lender: The entity that is net out, owed the balance.
      borrower: The entity that owes it.
      balance_outstanding: Transfers out of the lender less transfers back, in the currency.
      first_transfer_date: The date of the first transfer between the two.
      last_transfer_date: The date of the latest transfer between the two.
      unmatched_rows: Transfer rows with no row on the other side of the same amount and date.
      sides_agree: True when both entities record the transfers with the same amounts and dates.
    tie_out:
      label: The transfers between entities net to zero, so every row has its other side
      sql: >-
        select (select coalesce(sum(m.amount), 0) from cash_movements as m join portfolios as p on p.id = m.portfolio_id join portfolios as q on q.id = m.counterparty_portfolio_id
        where m.movement_type = 'transfer' and m.confirmation_status <> 'cancelled' and p.legal_entity_id <> q.legal_entity_id
        and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)), (select 0 * count(*) from {name})

  - id: distribution_gap
    label: Distributions expected against received
    cards: [37]
    names: [distribution gap, distributions expected against received, distribution not received, distributions received]
    may_read: [cash_movements, instruments, commitments, bank_accounts]
    never_read: [position_snapshots, transactions]
    why: A distribution is promised by a notice (a noticed movement) and arrives as a bank credit (a confirmed movement on an office account). The gap is the notice less the credit; a position or a commitment does not say whether the money arrived.
    formula: For each distribution notice (a noticed movement with a pay date), the notice amount less the confirmed bank credit of the same fund on the pay date. A notice with no credit shows its whole amount as the gap. A pay date that has not come yet is shown as not due, not as a gap.
    grain: By fund and pay date
    sql: >-
      create table {name} as with cm as (select m.* from cash_movements as m where m.movement_type = 'distribution' and m.confirmation_status <> 'cancelled'
      and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id)),
      notice as (select m.instrument_id, m.due_date as pay_date, m.currency, sum(abs(m.amount)) as notice_amount from cm as m
      where m.confirmation_status = 'noticed' and m.notice_kind = 'distribution' group by all),
      credit as (select m.instrument_id, m.effective_date as pay_date, sum(abs(m.amount)) as received from cm as m
      where m.confirmation_status = 'confirmed' and m.bank_account_id is not null and m.notice_kind is null group by all),
      lastday as (select max(m.effective_date) as d from cash_movements as m)
      select i.canonical_name as fund, cast(n.pay_date as varchar) as pay_date, n.currency, cast(n.notice_amount as decimal(18,2)) as notice_amount, cast(coalesce(c.received, 0) as decimal(18,2)) as received,
      cast(case when n.pay_date <= a.d then n.notice_amount - coalesce(c.received, 0) else 0 end as decimal(18,2)) as gap, n.pay_date <= a.d as pay_date_passed,
      case when c.received is null and n.pay_date <= a.d then 'no credit' when c.received is null then 'not due' when n.notice_amount - c.received <> 0 then 'short' else 'received' end as status
      from notice as n join instruments as i on i.id = n.instrument_id cross join lastday as a left join credit as c on c.instrument_id = n.instrument_id and c.pay_date = n.pay_date
    measure: gap
    columns:
      notice_amount: The distribution the fund's notice says will be paid.
      received: The confirmed bank credit of the fund on the pay date, zero when none.
      gap: Notice less credit once the pay date has passed. Zero when the money arrived in full or is not due yet.
      pay_date_passed: True when the pay date is on or before the latest movement date on file.
      status: Received, short, no credit, or not due.
    tie_out:
      label: The notice amounts in the table equal the noticed distributions
      sql: >-
        select (select coalesce(sum(notice_amount), 0) from {name}), (select coalesce(sum(abs(m.amount)), 0) from cash_movements as m where m.movement_type = 'distribution'
        and m.confirmation_status = 'noticed' and m.notice_kind = 'distribution' and not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = m.id))

