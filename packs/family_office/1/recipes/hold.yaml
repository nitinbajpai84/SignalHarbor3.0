# Recipes of one domain (family-office pack). Format, snippets and the rules are in recipes/_shared.yaml; assumptions A7, A8 and A11 onward, in docs/v3/ASSUMPTIONS.md.
# status: stub = named and scoped but not built (sql: null): the loader skips it until the owner of this file fills in sql, grain, measure, columns
# and tie_out and removes `status: stub`. cards = the use-case cards (docs/v3/USE-CASES-100.md numbers) that need it.
recipes:
  - id: net_worth
    label: Net worth
    names: [net worth, networth, worth, total worth, nav, net asset value, assets under management, aum]
    may_read: [position_snapshots, valuation_observations, portfolios, legal_entities, instruments, bank_accounts]
    never_read: [commitments, cash_movements, transactions]
    why: "Net worth is what the family holds at a date: the positions or the valuations on that date. A commitment is a promise to invest, not a holding."
    formula: Net worth = the sum of the market values of the position snapshots of each date, one value for each portfolio, instrument, date and currency (a snapshot that a later one supersedes is out; a carried-forward row is out when a real row exists). Cash counts once, from the administrator's cash line, else the office's bank-account lines, else the desk's derived cash, never two of them for the same portfolio, date and currency. Currencies are never added together.
    grain: By portfolio (or entity) and position date
    always_dims: true   # one split on every build, so the table is the same whatever the brief says it is split by (an entity total is the sum of its portfolios)
    default_dims: [portfolio]
    dims:
      entity: [e.entity_name, entity]
      portfolio: [p.portfolio_name, portfolio]
    sql: >-
      create table {name} as with {holdings} select {dims}l.position_date, l.currency, cast(sum(l.source_market_value) as decimal(18,2)) as net_worth
      from positions as l join portfolios as p on p.id = l.portfolio_id left join legal_entities as e on e.id = p.legal_entity_id group by all
    measure: net_worth
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {latest: position_date, lead: "Net worth on {position_date}:", say: "{portfolio} {currency} {net_worth}", max: 4}
    columns:
      net_worth: The market value of everything held at the position date, in the currency shown.
      position_date: The date the positions are as at.
    tie_out:
      label: Net worth equals the sum of the position snapshots for the same dates, cash counted once
      sql: >-
        select (select coalesce(sum(net_worth), 0) from {name}), (select coalesce(sum(v), 0) from ({holdings_check}) as c)

  - id: identifier_gaps
    label: Instruments with no class or identifier
    status: ready
    cards: [13]
    names: [identifier gaps, securities with no asset class, unclassified holdings, missing identifiers]
    may_read: [instruments, instrument_identifiers, position_snapshots]
    never_read: [commitments, cash_movements, transactions]
    why: "A gap is a fact about the instrument (no asset class, no approved identifier); its size is what is held in it at the instrument's latest position date. A commitment or a cash movement says nothing about either."
    formula: One row for each instrument held at the latest month end loaded (the date the limits are measured on, policy section 3; a market value other than zero there; an instrument that is only in the master, or was sold out before that date, has no row and is not a gap), with a flag for no asset class and a flag for no approved identifier, and the market value held in it at its latest position date. as_of_min, as_of_max and mixed_dates say when the dates held are not all the same (a monthly administrator file next to daily custodian files), so a total is never read as one date by mistake. gap_count, gap_value_total and net_worth are the totals of the same currency, repeated on every row; first_row marks one row of each currency so a signal can read the totals once.
    grain: By instrument, at the latest month end
    sql: >-
      create table {name} as with {positions},
      month_end as (select max(s.position_date) as d from positions as s where s.position_date = last_day(s.position_date)),
      last as (select l.instrument_id, l.position_date, l.currency, l.source_market_value from positions as l join month_end as a on l.position_date = a.d),
      held as (select instrument_id, max(position_date) as position_date, currency, sum(source_market_value) as market_value from last group by instrument_id, currency),
      base as (select i.canonical_name as instrument, i.instrument_type, h.position_date, h.currency, h.market_value,
      (i.asset_class is null or trim(i.asset_class) = '') as no_class,
      not exists (select 1 from instrument_identifiers as x where x.instrument_id = i.id and x.mapping_status = 'approved' and x.valid_to is null) as no_identifier
      from held as h join instruments as i on i.id = h.instrument_id where h.market_value <> 0),
      flagged as (select b.*, (b.no_class or b.no_identifier) as has_gap from base as b)
      select instrument, instrument_type, position_date, currency, cast(market_value as decimal(18,2)) as market_value, no_class, no_identifier, has_gap,
      cast(case when has_gap then market_value else 0 end as decimal(18,2)) as gap_value,
      cast(sum(case when has_gap then 1 else 0 end) over (partition by currency) as integer) as gap_count,
      cast(sum(case when has_gap then market_value else 0 end) over (partition by currency) as decimal(18,2)) as gap_value_total,
      cast(sum(market_value) over (partition by currency) as decimal(18,2)) as net_worth,
      cast(100 * sum(case when has_gap then market_value else 0 end) over (partition by currency) / nullif(sum(market_value) over (partition by currency), 0) as decimal(9,4)) as gap_pct_of_net_worth,
      cast(min(position_date) over (partition by currency) as date) as as_of_min, cast(max(position_date) over (partition by currency) as date) as as_of_max,
      (min(position_date) over (partition by currency) <> max(position_date) over (partition by currency)) as mixed_dates,
      (row_number() over (partition by currency order by instrument) = 1) as first_row
      from flagged
    measure: gap_value
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: has_gap, lead: "Needs a class or identifier:", say: "{instrument} {currency} {market_value}", max: 4}
      - {if: has_gap, once: true, say: "That is {gap_value_total} in all, {gap_pct_of_net_worth}% of net worth"}
    columns:
      gap_value: The market value held in an instrument that has a gap (0 for one that has none).
      has_gap: True when the instrument has no asset class or no approved identifier.
      gap_pct_of_net_worth: The value held in instruments with a gap, as a percent of everything held, same currency.
      as_of_min: The oldest position date among the holdings counted (same on every row of the currency).
      as_of_max: The newest position date among the holdings counted.
      mixed_dates: True when the holdings counted are not all at the same position date.
    tie_out:
      label: The values held add up to the position snapshots at the latest month end
      sql: >-
        select (select coalesce(sum(market_value), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c
        where c.position_date = (select max(d.position_date) from ({positions_check}) as d where d.position_date = last_day(d.position_date)))

  - id: value_age_days
    label: Valuation age
    status: ready
    cards: [21]
    names: [value age, stale valuations, valuation age, days since valuation, old value, old values]
    may_read: [valuation_observations, position_snapshots, instruments]
    never_read: [commitments, cash_movements, transactions]
    why: "How old a value is depends on the date it is valued at, not the date it was loaded. A superseded observation is out: the amended one counts. An estimate is shown as an estimate, never passed off as a final."
    formula: "As-of date less the latest valuation date of each instrument, in days (the as-of date is the latest position date loaded); stale above 90 days (the threshold the card and the stub name; an office that signs its own replaces it in the signal)."
    grain: By instrument
    sql: >-
      create table {name} as with {positions},
      obs as (select o.* from valuation_observations as o where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)),
      latest as (select o.*, row_number() over (partition by o.instrument_id order by o.valuation_date desc, coalesce(o.approval_status = 'estimate', false), o.recorded_at desc, o.id) as rn from obs as o),
      ref as (select coalesce((select max(position_date) from position_snapshots), (select max(valuation_date) from obs)) as d),
      pos as (select p.instrument_id, p.currency, sum(p.source_market_value) as v from positions as p
      where p.position_date = (select max(m.position_date) from positions as m where m.instrument_id = p.instrument_id) group by p.instrument_id, p.currency),
      s as (select i.canonical_name as fund, i.instrument_type, l.valuation_date, a.d as as_of, cast(date_diff('day', l.valuation_date, a.d) as integer) as age_days,
      cast(90 as integer) as stale_after_days, (date_diff('day', l.valuation_date, a.d) > 90) as stale, cast(l.value_amount as decimal(18,2)) as value_amount, l.currency,
      l.approval_status as value_basis, coalesce(l.approval_status = 'estimate', false) as is_estimate,
      coalesce(date_diff('day', (select max(q.valuation_date) from obs as q where q.instrument_id = l.instrument_id and q.valuation_date < l.valuation_date), cast(l.received_at as date)) > 90, false) as was_stale,
      cast(100 * p.v / nullif(sum(p.v) over (partition by p.currency), 0) as decimal(9,2)) as held_pct
      from latest as l join instruments as i on i.id = l.instrument_id cross join ref as a left join pos as p on p.instrument_id = l.instrument_id where l.rn = 1),
      tot as (select cast(count(*) filter (where stale) as integer) as stale_count, coalesce(string_agg(fund, ', ' order by age_days desc) filter (where stale), 'none') as stale_names,
      arg_max(fund, age_days) as stalest_fund,
      cast(count(*) filter (where is_estimate) as integer) as estimate_count, coalesce(string_agg(fund, ', ' order by fund) filter (where is_estimate), 'none') as estimate_names,
      coalesce(arg_max(fund, held_pct) filter (where stale), 'none') as stale_max_fund, coalesce(max(held_pct) filter (where stale), 0) as stale_max_pct,
      coalesce(arg_max(age_days, held_pct) filter (where stale), 0) as stale_max_age from s)
      select s.*, t.stale_count, t.stale_names, t.stalest_fund, t.estimate_count, t.estimate_names, t.stale_max_fund, cast(t.stale_max_pct as decimal(9,2)) as stale_max_pct, t.stale_max_age,
      (row_number() over (order by s.age_days desc, s.fund) = 1) as first_row from s cross join tot as t
    measure: age_days
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: stale, sort: age_days, lead: "Older than {stale_after_days} days:", say: "{fund} {age_days} days ({valuation_date})", max: 4}
    columns:
      age_days: Days from the latest valuation date to the as-of date.
      stale: True when the value is older than the stale threshold.
      value_amount: The latest value, in the currency shown.
      stale_count: How many instruments are stale (the same on every row).
      stale_names: The stale instruments, oldest first (the same on every row).
      value_basis: The status the valuation was recorded with (final, estimate, amended). Whether an estimate may stand as the latest value is the office's decision; the age is worked out on it as recorded and is_estimate says so.
      is_estimate: True when the latest value is a manager estimate (an estimate is never preferred to a final or amended value of the same date).
      estimate_count: How many instruments have an estimate as their latest value (the same on every row).
      estimate_names: Those instruments (the same on every row; 'none' when there are none).
      was_stale: True when the value before the latest one was more than 90 days old on the day the latest arrived.
      held_pct: The share of everything held (the position snapshots at each instrument's latest date, same currency) that the instrument makes up, in percent.
      stale_max_fund: The stale instrument with the largest held_pct ('none' when nothing is stale).
      stale_max_pct: Its held_pct (0 when nothing is stale).
      stale_max_age: Its age in days.
      first_row: True on one row, the oldest value, so a signal can read the totals once.
    tie_out:
      label: Every instrument with a valuation has one row
      sql: >-
        select (select count(*) from {name}), (select count(distinct instrument_id) from valuation_observations)

  - id: allocation
    label: Allocation by asset class and entity
    status: ready
    cards: [31]
    names: [allocation, allocation by asset class, asset allocation, private market allocation, private markets allocation, private equity allocation, in each asset class, by asset class and entity]  # "in each asset class" is the question's words (w7)
    may_read: [position_snapshots, instruments, portfolios, legal_entities]
    never_read: [commitments, cash_movements, transactions]
    why: "Allocation is a share of what is held, so it reads the positions (counted as net_worth counts them) and the class on the instrument. An instrument with no class is shown as unclassified, never dropped."
    formula: Market value of the position snapshots (counted as net_worth counts them, cash left out) by asset class and entity, and each row's share_pct of the total of the same position date and currency, in percent. Cash (instrument type cash, meaning the bank balances and the administrator's cash) is not an allocation line; the allocation covers the investment portfolios (policy section 1), and cash is reported on its own.
    grain: By asset class, entity and position date
    always_dims: true
    default_dims: [asset_class, entity]
    dims:
      asset_class: ["coalesce(nullif(trim(i.asset_class), ''), 'unclassified')", asset_class]
      entity: [e.entity_name, entity]
    sql: >-
      create table {name} as with {positions},
      g as (select {dims}l.position_date, l.currency, cast(sum(l.source_market_value) as decimal(18,2)) as market_value
      from positions as l join portfolios as p on p.id = l.portfolio_id left join legal_entities as e on e.id = p.legal_entity_id
      left join instruments as i on i.id = l.instrument_id where i.instrument_type is distinct from 'cash' group by all)
      select g.*, cast(100 * g.market_value / nullif(sum(g.market_value) over w, 0) as decimal(9,4)) as share_pct,
      cast(sum(g.market_value) over w as decimal(18,2)) as total_value,
      cast(sum(case when g.asset_class = 'unclassified' then g.market_value else 0 end) over w as decimal(18,2)) as unclassified_value,
      cast((select sum(q.source_market_value) from positions as q join instruments as qi on qi.id = q.instrument_id where q.position_date = g.position_date and q.currency = g.currency
      and qi.instrument_type is distinct from 'cash') as decimal(18,2)) as positions_total,
      (row_number() over (partition by g.currency order by g.position_date desc, g.market_value desc) = 1) as first_row
      from g window w as (partition by g.position_date, g.currency)
    measure: share_pct
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {latest: position_date, sort: market_value, lead: "On {position_date}:", say: "{asset_class} {share_pct}% of {entity}", max: 4}
    columns:
      market_value: The market value held in the class and entity at the position date.
      share_pct: The row's share of everything held on the position date, in the same currency, in percent.
      total_value: The total of the rows for the position date and currency (the same on each of them).
      unclassified_value: The part of that total held in instruments with no asset class.
      positions_total: The position snapshots of the same date and currency before any join, to see a position that lost its portfolio.
      first_row: True on one row of the latest position date, so a signal can read the totals once.
    tie_out:
      label: The parts add up to the position snapshots for the same dates
      sql: >-
        select (select coalesce(sum(market_value), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c
        join instruments as ci on ci.id = c.instrument_id where ci.instrument_type is distinct from 'cash')

  - id: nav_rollforward
    label: Private fund value roll-forward
    status: ready
    cards: [38]
    names: [nav rollforward, value roll-forward, nav roll-forward, private fund valuation reconciliation, valuation reconciliation, latest reported nav, private fund value]
    may_read: [valuation_observations, cash_movements, instruments, extracted_fields]
    never_read: [position_snapshots, commitments, transactions]
    why: "The change in a fund's value between two quarter ends is explained by the calls paid in, the distributions paid out and the gain. Calls and distributions are the confirmed cash movements of the fund; the manager's own gain is the net gain or loss line of its statement."
    formula: "By private fund and quarter: closing value = prior quarter-end value + calls - distributions + gain. implied_gain is closing - prior - calls + distributions (what the flows leave to the gain); reported_gain is the manager's net gain or loss line; unexplained = closing - (prior + calls - distributions + reported_gain), empty when the gain line was not read (gain_unreadable says so). An estimate is not preferred to a final or amended value of the same date, and on_estimate marks a quarter that still closes on one. Only confirmed calls and distributions dated after the prior quarter end and up to the closing date count; a superseded valuation is out."
    grain: By private fund and quarter
    sql: >-
      create table {name} as with
      obs as (select o.* from valuation_observations as o where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)
      and o.valuation_date = last_day(o.valuation_date) and month(o.valuation_date) % 3 = 0),
      q as (select o.* from (select o.*, row_number() over (partition by o.instrument_id, o.valuation_date order by coalesce(o.approval_status = 'estimate', false), o.recorded_at desc, o.id) as rn from obs as o) as o where o.rn = 1),
      flows as (select c.id, c.instrument_id, c.effective_date, c.currency, c.movement_type, abs(c.amount) as amount from cash_movements as c
      where c.movement_type in ('call', 'distribution') and c.confirmation_status = 'confirmed'
      and not exists (select 1 from cash_movements as y where y.supersedes_cash_movement_id = c.id)),
      gain as (select document_id, case when count(distinct value_numeric) = 1 then max(value_numeric) end as value_numeric from extracted_fields
      where field_name = 'net_gain_loss' and value_numeric is not null group by document_id),
      mobs as (select o.* from (select o.*, row_number() over (partition by o.instrument_id, o.valuation_date order by coalesce(o.approval_status = 'estimate', false), o.recorded_at desc, o.id) as rn
      from valuation_observations as o where o.valuation_date = last_day(o.valuation_date)
      and not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)) as o where o.rn = 1),
      monthly as (select m.instrument_id, m.valuation_date, x.value_numeric as gain from mobs as m left join gain as x on x.document_id = m.evidence_document_id),
      freq as (select m.instrument_id, case when count(*) filter (where month(m.valuation_date) % 3 <> 0) > 0 then 3 else 1 end as statements_per_quarter from monthly as m group by m.instrument_id),
      pairs as (select n.instrument_id, p.valuation_date as period_start, n.valuation_date as period_end, n.currency, p.value_amount as prior_value,
      n.value_amount as closing_value, n.evidence_document_id, n.approval_status as closing_status from q as n join q as p on p.instrument_id = n.instrument_id
      and p.valuation_date = last_day(cast(n.valuation_date - interval 3 month as date))),
      agg as (select r.*, coalesce(sum(f.amount) filter (where f.movement_type = 'call'), 0) as calls,
      coalesce(sum(f.amount) filter (where f.movement_type = 'distribution'), 0) as distributions
      from pairs as r left join flows as f on f.instrument_id = r.instrument_id and f.currency = r.currency
      and f.effective_date > r.period_start and f.effective_date <= r.period_end group by all),
      qg as (select r.instrument_id, r.period_end, case when count(m.valuation_date) = max(f.statements_per_quarter) and count(m.gain) = count(m.valuation_date)
      then cast(sum(m.gain) as decimal(18,2)) end as reported_gain
      from pairs as r join monthly as m on m.instrument_id = r.instrument_id and m.valuation_date > r.period_start and m.valuation_date <= r.period_end
      join freq as f on f.instrument_id = r.instrument_id group by all)
      select i.canonical_name as fund, a.period_start, a.period_end, a.currency, cast(a.prior_value as decimal(18,2)) as prior_value,
      cast(a.calls as decimal(18,2)) as calls, cast(a.distributions as decimal(18,2)) as distributions, cast(a.closing_value as decimal(18,2)) as closing_value,
      cast(a.closing_value - a.prior_value - a.calls + a.distributions as decimal(18,2)) as implied_gain,
      x.reported_gain,
      cast(a.closing_value - (a.prior_value + a.calls - a.distributions + x.reported_gain) as decimal(18,2)) as unexplained,
      a.closing_status, coalesce(a.closing_status = 'estimate', false) as on_estimate, (x.reported_gain is null) as gain_unreadable,
      (row_number() over (partition by i.canonical_name order by a.period_end desc) = 1) as latest
      from agg as a join instruments as i on i.id = a.instrument_id and i.instrument_type = 'private_fund'
      left join qg as x on x.instrument_id = a.instrument_id and x.period_end = a.period_end
    measure: implied_gain
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: unexplained, say: "{fund} {period_end} is not explained by {unexplained}: {prior_value} plus calls {calls} less distributions {distributions} plus gain {reported_gain} against {closing_value}"}
      - {if: latest, lead: "Latest quarter:", say: "{fund} {prior_value} to {closing_value}, gain {implied_gain}", max: 2}
    columns:
      prior_value: The fund's value at the previous quarter end.
      calls: Confirmed capital calls paid in the quarter.
      distributions: Confirmed distributions received in the quarter.
      closing_value: The value at the quarter end (the amended one when the manager amended it).
      implied_gain: "The gain the flows leave: closing value less prior value less calls plus distributions."
      reported_gain: The net gain or loss the manager's statement reports.
      unexplained: The closing value less the roll-forward made with the manager's reported gain; empty when no reported gain was read (see gain_unreadable).
      closing_status: The status of the closing value (final, estimate, amended). A final or amended value of the same date is preferred to an estimate.
      on_estimate: True when the quarter closes on a manager estimate, so the roll-forward is provisional.
      gain_unreadable: True when the manager's gain line was not read from the statement, or the statement carries two different gain figures; unexplained is then empty and says nothing.
      latest: True on the latest quarter of each fund.
    tie_out:
      label: The calls less distributions in the table equal the confirmed cash movements of the same funds in the same quarters
      sql: >-
        select (select coalesce(sum(calls - distributions), 0) from {name}),
        (select coalesce(sum(case when c.movement_type = 'call' then abs(c.amount) else -abs(c.amount) end), 0) from cash_movements as c
        join instruments as i on i.id = c.instrument_id
        join (select distinct fund, currency, period_start, period_end from {name}) as n on n.fund = i.canonical_name and n.currency = c.currency
        and c.effective_date > n.period_start and c.effective_date <= n.period_end
        where c.movement_type in ('call', 'distribution') and c.confirmation_status = 'confirmed'
        and not exists (select 1 from cash_movements as y where y.supersedes_cash_movement_id = c.id))

  - id: liquid_pnl_mtd
    label: Liquid book gain or loss this month
    status: ready
    cards: [43]
    names: [liquid pnl, gain or loss this month, month to date gain, liquid book profit and loss, daily liquid book profit and loss, liquid book gain or loss]
    may_read: [position_snapshots, transactions, instruments, portfolios]
    never_read: [commitments, cash_movements]
    why: "The gain is the change in value less what was put in or taken out by trading, so it reads the positions of the listed instruments and their trades. Dividends and coupons are income, not part of this figure."
    formula: "Per portfolio holding listed instruments (listed equity, bonds and convertibles): value at the latest position date less value at the last position date on or before the previous month end, less net trades (buys positive, sells negative) traded after that month end and settled on or before the latest position date; gain_pct is the gain over the month-end value, in percent. One currency per row. The total columns add the books of a currency; a book with no month-end value is counted in books_without_start and left out of the gain."
    grain: By portfolio and currency, month to date
    sql: >-
      create table {name} as with {positions},
      liq as (select l.portfolio_id, l.position_date, l.currency, l.source_market_value from positions as l join instruments as i on i.id = l.instrument_id
      where i.instrument_type in ('listed_equity', 'bond', 'convertible')),
      tot as (select portfolio_id, position_date, currency, sum(source_market_value) as value from liq group by all),
      ref as (select portfolio_id, currency, max(position_date) as today from tot group by all),
      mend as (select a.portfolio_id, a.currency, a.today, cast(date_trunc('month', a.today) - interval 1 day as date) as month_end from ref as a),
      base as (select m.portfolio_id, m.currency, m.today, (select max(t.position_date) from tot as t where t.portfolio_id = m.portfolio_id and t.currency = m.currency
      and t.position_date <= m.month_end) as start_date from mend as m),
      tx as (select x.* from transactions as x join instruments as i on i.id = x.instrument_id where i.instrument_type in ('listed_equity', 'bond', 'convertible')
      and x.transaction_type in ('buy', 'sell') and x.status not in ('cancelled', 'failed', 'rejected')
      and not exists (select 1 from transactions as y where y.supersedes_transaction_id = x.id)),
      v as (select b.portfolio_id, b.currency, b.today, b.start_date, t1.value as value_today, t0.value as value_month_end,
      coalesce(sum(case when x.transaction_type = 'buy' then abs(x.cash_amount) else -abs(x.cash_amount) end), 0) as net_trades
      from base as b join tot as t1 on t1.portfolio_id = b.portfolio_id and t1.currency = b.currency and t1.position_date = b.today
      left join tot as t0 on t0.portfolio_id = b.portfolio_id and t0.currency = b.currency and t0.position_date = b.start_date
      left join tx as x on x.portfolio_id = b.portfolio_id and x.currency = b.currency and x.trade_date > b.start_date and x.settlement_date <= b.today group by all),
      r as (select p.portfolio_name as portfolio, v.currency, v.today as position_date, v.start_date as month_end_date, cast(v.value_today as decimal(18,2)) as value_today,
      cast(v.value_month_end as decimal(18,2)) as value_month_end, cast(v.net_trades as decimal(18,2)) as net_trades,
      cast(v.value_today - v.value_month_end - v.net_trades as decimal(18,2)) as gain_loss,
      cast(100 * (v.value_today - v.value_month_end - v.net_trades) / nullif(v.value_month_end, 0) as decimal(9,4)) as gain_pct,
      (v.value_month_end is null) as no_month_start,
      not exists (select 1 from tot as t where t.portfolio_id = v.portfolio_id and t.currency = v.currency and date_trunc('month', t.position_date) = date_trunc('month', v.today)
      and t.position_date < v.today) as new_month
      from v join portfolios as p on p.id = v.portfolio_id)
      select r.*, cast(count(*) over w as integer) as books, cast(count(*) filter (where r.no_month_start) over w as integer) as books_without_start,
      cast(sum(r.value_today) over w as decimal(18,2)) as total_value_today, cast(coalesce(sum(r.value_month_end) over w, 0) as decimal(18,2)) as total_value_month_end,
      cast(sum(r.net_trades) filter (where not r.no_month_start) over w as decimal(18,2)) as total_net_trades,
      cast(coalesce(sum(r.gain_loss) over w, 0) as decimal(18,2)) as total_gain_loss,
      cast(100 * sum(r.gain_loss) over w / nullif(sum(r.value_month_end) over w, 0) as decimal(9,4)) as total_gain_pct,
      (min(r.position_date) over w <> max(r.position_date) over w) as mixed_dates,
      (row_number() over (partition by r.currency order by r.value_month_end desc nulls last, r.portfolio) = 1) as first_row
      from r window w as (partition by r.currency)
    measure: gain_loss
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {say: "{portfolio} {gain_loss} ({gain_pct}%) this month: {value_today} today against {value_month_end} on {month_end_date}, after net trades of {net_trades}"}
    columns:
      value_today: The listed instruments' value at the latest position date.
      value_month_end: Their value at the last position date on or before the previous month end.
      net_trades: Purchases less sales settled since the month end.
      gain_loss: Value today less value at the month end less net trades.
      gain_pct: The gain or loss over the month-end value, in percent.
      no_month_start: True when the book has no listed position on or before the previous month end, so no gain can be worked out for it (it is left out of the total gain, not counted as nil).
      new_month: True when the latest position date is the first one on file in its month (the month has just rolled over).
      books: How many listed books the currency has (the same on every row of the currency).
      books_without_start: How many of them have no month-end value.
      total_value_today: Their value at the latest dates, together.
      total_value_month_end: Their month-end values, together.
      total_net_trades: Net trades of the books that have a month-end value.
      total_gain_loss: The gain or loss of the books that have a month-end value, together.
      total_gain_pct: That gain over their month-end values, in percent.
      mixed_dates: True when the books are not all at the same latest position date.
      first_row: True on the largest book of each currency, so a signal can read the totals once.
    tie_out:
      label: Value today equals the position snapshots of the listed instruments at the latest date
      sql: >-
        select (select coalesce(sum(value_today), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c
        join instruments as i on i.id = c.instrument_id join {name} as n on n.position_date = c.position_date and n.currency = c.currency
        join portfolios as p on p.id = c.portfolio_id and p.portfolio_name = n.portfolio where i.instrument_type in ('listed_equity', 'bond', 'convertible'))

  - id: liquid_price_move
    label: Liquid price move in a day
    status: ready
    cards: [43]
    names: [price move, daily price move, big price move]
    may_read: [position_snapshots, instruments, portfolios]
    never_read: [commitments, cash_movements, transactions]
    why: "A price is read from the positions: market value over quantity. A move is against the previous position date on file for the same holding, so a gap in the files shows as a longer step, not as a jump."
    formula: Price (market value over quantity) of each listed instrument in a portfolio at each position date, against the previous position date on file; move_pct = 100 * (price / previous price - 1). jump_count and jump_names list every move over 10 percent (the card's figure) on any date, so none is missed because a larger one sits elsewhere.
    grain: By portfolio, instrument and position date
    sql: >-
      create table {name} as with {positions},
      px as (select l.portfolio_id, l.instrument_id, l.position_date, l.currency, l.source_market_value / nullif(l.quantity, 0) as price from positions as l
      join instruments as i on i.id = l.instrument_id where i.instrument_type in ('listed_equity', 'bond', 'convertible')),
      mv as (select px.*, lag(price) over w as previous_price, lag(position_date) over w as previous_date from px window w as (partition by portfolio_id, instrument_id, currency order by position_date)),
      m as (select p.portfolio_name as portfolio, i.canonical_name as instrument, mv.position_date, mv.previous_date, cast(mv.price as decimal(18,6)) as price,
      cast(mv.previous_price as decimal(18,6)) as previous_price, cast(100 * (mv.price / nullif(mv.previous_price, 0) - 1) as decimal(9,4)) as move_pct
      from mv join instruments as i on i.id = mv.instrument_id join portfolios as p on p.id = mv.portfolio_id where mv.previous_price is not null),
      tot as (select cast(count(*) filter (where abs(move_pct) > 10) as integer) as jump_count,
      coalesce(string_agg(instrument || ' on ' || cast(position_date as varchar) || ' (' || cast(round(move_pct, 2) as varchar) || ' percent)', '; ' order by abs(move_pct) desc) filter (where abs(move_pct) > 10), 'none') as jump_names from m)
      select m.*, t.jump_count, t.jump_names, (row_number() over (order by abs(m.move_pct) desc, m.position_date desc, m.instrument) = 1) as top_move from m cross join tot as t
    measure: move_pct
    columns:
      move_pct: The price change since the previous position date on file, in percent.
      jump_count: How many moves in the whole table are more than 10 percent either way (the 10 percent of the card; no office rule for it is signed).
      jump_names: Those moves, largest first, with instrument and date ('none' when there are none; the same on every row).
      top_move: True on the largest move in the table (of any date), so a signal can read it once.

  - id: net_worth_after_debt
    label: Net worth after debt
    status: ready
    cards: [17]
    names: [net worth after debt, net of debt, net worth less loans]
    may_read: [position_snapshots, credit_facilities, portfolios, legal_entities, instruments]
    never_read: [commitments, cash_movements, transactions]
    why: "Net worth is what is held at a date; what is owed is the drawn amount of each facility as its latest statement at or before that date says. A loan statement may show the balance as a negative number: the drawn amount here is always the positive amount owed."
    formula: Net worth (as net_worth counts it, cash left out, as the family totals of the allocation count them, that is the investment portfolios of policy section 1) by entity and position date, less the amount owed on each credit facility of the entity (the size of the drawn amount of its latest row at or before the position date, a superseded row out; a facility whose latest row is closed owes nothing), same currency and date. Currencies are never added together; a facility in a currency the entity holds nothing in at that date is not netted here (it needs a rate the model does not hold).
    grain: By entity and position date
    sql: >-
      create table {name} as with {positions},
      nw as (select e.id as entity_id, e.entity_name as entity, l.position_date, l.currency, sum(l.source_market_value) as net_worth
      from positions as l join portfolios as p on p.id = l.portfolio_id join legal_entities as e on e.id = p.legal_entity_id
      left join instruments as ci on ci.id = l.instrument_id where ci.instrument_type is distinct from 'cash' group by all),
      fac as (select f.* from credit_facilities as f where not exists (select 1 from credit_facilities as x where x.supersedes_credit_facility_id = f.id)),
      pick as (select n.entity_id, n.position_date, n.currency, f.drawn_amount, f.status, row_number() over (partition by n.entity_id, n.position_date, n.currency, f.facility_ref
      order by f.as_at desc, f.recorded_at desc) as rn from nw as n join fac as f on f.legal_entity_id = n.entity_id and f.currency = n.currency and f.as_at <= n.position_date),
      debt as (select entity_id, position_date, currency, sum(abs(drawn_amount)) as debt from pick where rn = 1 and status <> 'closed' group by all),
      r as (select n.entity, n.position_date, n.currency, cast(n.net_worth as decimal(18,2)) as net_worth, cast(coalesce(d.debt, 0) as decimal(18,2)) as debt,
      cast(n.net_worth - coalesce(d.debt, 0) as decimal(18,2)) as net_worth_after_debt
      from nw as n left join debt as d on d.entity_id = n.entity_id and d.position_date = n.position_date and d.currency = n.currency)
      select r.*, cast(sum(r.net_worth) over w as decimal(18,2)) as family_net_worth, cast(sum(r.debt) over w as decimal(18,2)) as family_debt,
      cast(sum(r.net_worth_after_debt) over w as decimal(18,2)) as family_net_worth_after_debt,
      (row_number() over (partition by r.currency order by r.position_date desc, r.entity) = 1) as is_latest
      from r window w as (partition by r.position_date, r.currency)
    measure: net_worth_after_debt
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: is_latest, lead: "Net worth after debt:", say: "{entity} {currency} {net_worth_after_debt} ({net_worth} less {debt} debt, {position_date})", max: 4}
    columns:
      net_worth: What the entity holds at the position date.
      debt: The drawn amount of the entity's credit facilities at that date (positive).
      net_worth_after_debt: Net worth less debt.
      family_net_worth: The net worth of all entities at the position date (the same on each of them).
      family_debt: The debt of all entities at the position date.
      family_net_worth_after_debt: Family net worth less family debt.
      is_latest: True on one row of the latest position date, so a signal can read the family totals once.
    tie_out:
      label: Net worth after debt equals the position snapshots less the debt shown
      sql: >-
        select (select coalesce(sum(net_worth_after_debt), 0) from {name}), (select coalesce(sum(c.v), 0) from ({positions_check}) as c
        join instruments as ci on ci.id = c.instrument_id where ci.instrument_type is distinct from 'cash') - (select coalesce(sum(debt), 0) from {name})

  - id: facility_headroom
    label: Credit facility headroom
    status: ready
    cards: [17]
    names: [facility headroom, loan headroom, headroom, undrawn facility, loan debt, debt outstanding, outstanding principal, loan outstanding, loan principal]
    may_read: [credit_facilities, legal_entities]
    never_read: [position_snapshots, commitments, cash_movements, transactions]
    why: "Headroom is what a facility still allows: its limit less what is drawn at its latest statement. A facility whose terms state no limit has no headroom figure; it is left empty, never guessed."
    formula: For each credit facility that is not closed, its latest row (a superseded row out) with the drawn amount (the size of it, always positive), the limit and headroom = limit - drawn (empty when the limit is empty), and drawn_change = drawn less the drawn amount of the facility's previous statement. first_row marks, in each currency, the facility with the least headroom (a facility with a limit before one without); the totals for the currency (facilities, facilities without a limit, drawdowns) repeat on every row. Currencies are never compared.
    grain: By facility, at its latest statement date
    sql: >-
      create table {name} as with fac as (select f.*, lag(abs(f.drawn_amount)) over (partition by f.facility_ref order by f.as_at, f.recorded_at) as prev_drawn,
      row_number() over (partition by f.facility_ref order by f.as_at desc, f.recorded_at desc) as rn from credit_facilities as f
      where not exists (select 1 from credit_facilities as x where x.supersedes_credit_facility_id = f.id)),
      cur as (select f.facility_ref, e.entity_name as entity, f.lender, f.currency, f.as_at, cast(abs(f.drawn_amount) as decimal(18,2)) as drawn_amount, cast(f.limit_amount as decimal(18,2)) as limit_amount,
      cast(f.limit_amount - abs(f.drawn_amount) as decimal(18,2)) as headroom, (f.limit_amount is null) as limit_missing,
      cast(abs(f.drawn_amount) - f.prev_drawn as decimal(18,2)) as drawn_change
      from fac as f left join legal_entities as e on e.id = f.legal_entity_id where f.rn = 1 and f.status <> 'closed'),
      tot as (select currency, cast(count(*) as integer) as facilities, cast(count(*) filter (where limit_missing) as integer) as facilities_without_limit,
      cast(coalesce(sum(drawn_change) filter (where drawn_change > 0), 0) as decimal(18,2)) as drawdown_total,
      coalesce(string_agg(facility_ref, ', ' order by facility_ref) filter (where drawn_change > 0), 'none') as drawdown_facilities,
      coalesce(string_agg(facility_ref, ', ' order by facility_ref) filter (where limit_missing), 'none') as no_limit_facilities from cur group by currency)
      select c.*, t.facilities, t.facilities_without_limit, t.no_limit_facilities, t.drawdown_total, t.drawdown_facilities,
      (row_number() over (partition by c.currency order by c.limit_missing, c.headroom, c.as_at desc, c.facility_ref) = 1) as first_row
      from cur as c join tot as t on t.currency = c.currency
    measure: headroom
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: limit_missing, say: "{entity} has drawn {currency} {drawn_amount} on {facility_ref} with {lender}; no limit is on record, so the headroom is not known"}
      - {say: "{entity} has drawn {currency} {drawn_amount} of {limit_amount} on {facility_ref}, leaving {headroom}"}
    columns:
      drawn_amount: What is drawn at the latest statement, positive.
      limit_amount: The facility limit; empty when the agreement states none.
      headroom: The limit less the drawn amount; empty when there is no limit.
      limit_missing: True when the facility's terms state no limit, so there is no headroom figure (the rule is not on record).
      drawn_change: The drawn amount less the previous statement's; positive is a drawdown, negative a repayment, empty for a first statement.
      facilities: How many open facilities in the currency.
      facilities_without_limit: How many of them state no limit.
      no_limit_facilities: Their references ('none' when there are none).
      drawdown_total: The sum of the drawdowns in the currency since the previous statements.
      drawdown_facilities: The facilities drawn up ('none' when there are none).
      first_row: True on one row of each currency, the facility with the least headroom, so a signal can read it once.

  - id: currency_exposure
    label: Currency exposure
    status: ready
    cards: [64]
    names: [currency exposure, exposure by currency, fx exposure, sgd exposure, unhedged exposure]
    may_read: [position_snapshots, valuation_observations, transactions, fx_confirmations, market_observations, instruments]
    never_read: [commitments, cash_movements]
    why: "What the family owns in each currency is its investments (the funds at their latest value known, the listed holdings at the latest month end, as the allocation counts them) plus the administrator's cash, and an open FX forward moves value from the currency sold to the currency bought. A commitment is a promise, not a holding."
    formula: One row for each currency. investments = the latest value of each fund known (valuation_observations, valued on or before the latest month end loaded, received by the as-of date; a superseded value out, an estimate only when nothing else of that date) plus the listed holdings at the latest month end (a position of an instrument with no valuation). cash = the administrator's cash positions (the instruments named Cash <currency>) at the latest date. The two added are spot_native, and spot_usd_eq converts it at the latest USD fixing on or before the as-of date (market_observations, fx_fixing; USD is 1). The open forwards are the executed forward bookings (transactions) that settle after the as-of date; the currency bought is the booking's currency with its cash amount, the currency sold is the one on the bank's confirmation of the same reference with the booking's quantity; a forward with no confirmation has no known sold currency and is counted in unplaced_forwards, never guessed. fwd_bought and fwd_sold are those legs, fwd_net_usd_eq their net at the fixing, after_usd_eq = spot_usd_eq + fwd_net_usd_eq, share_after_pct its percent of the family total (spot, in USD). fwd_net_confirmed is the same net read from the bank's confirmations of forwards still open, and fwd_gap = confirmed less booked (zero when the bank agrees with the booking). The family reports in USD (the base currency of every portfolio). No hedge limit is signed, so none is applied here.
    grain: By currency at the as-of date
    sql: >-
      create table {name} as with {positions},
      today as (select max(p.position_date) as d from positions as p),
      me as (select max(p.position_date) as d from positions as p where p.position_date = last_day(p.position_date)),
      fx as (select o.quote_currency as currency, arg_max(o.value, o.observed_at) as rate from market_observations as o
      where o.observation_type = 'fx_fixing' and o.base_currency = 'USD' and cast(o.observed_at as date) <= (select d from today)
      and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id) group by o.quote_currency),
      vals as (select o.*, row_number() over (partition by o.instrument_id order by o.valuation_date desc, coalesce(o.approval_status = 'estimate', false), o.recorded_at desc, o.id) as rn
      from valuation_observations as o where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)
      and o.valuation_date <= (select d from me) and cast(o.received_at as date) <= (select d from today)),
      inv as (select v.currency, sum(v.value_amount) as v from vals as v where v.rn = 1 group by v.currency
      union all select p.currency, sum(p.source_market_value) from positions as p join instruments as i on i.id = p.instrument_id
      where p.position_date = (select d from me) and i.instrument_type <> 'cash' and not exists (select 1 from valuation_observations as o where o.instrument_id = p.instrument_id) group by p.currency),
      cash as (select c.currency, sum(c.source_market_value) as v from (select p.currency, p.source_market_value,
      row_number() over (partition by p.portfolio_id, p.instrument_id order by p.position_date desc) as rk from positions as p join instruments as i on i.id = p.instrument_id
      where i.instrument_type = 'cash' and i.canonical_name = 'Cash ' || p.currency and p.position_date <= (select d from today)) as c where c.rk = 1 group by c.currency),
      cfm as (select c.* from fx_confirmations as c where not exists (select 1 from fx_confirmations as x where x.supersedes_fx_confirmation_id = c.id)
      and c.value_date > (select d from today) and c.trade_date <= (select d from today)),
      fwd as (select t.external_trade_id as ref, t.currency as bought_ccy, t.cash_amount as bought, c.currency_sold as sold_ccy, t.quantity_delta as qty
      from transactions as t join instruments as i on i.id = t.instrument_id
      left join (select * from fx_confirmations as y where not exists (select 1 from fx_confirmations as x where x.supersedes_fx_confirmation_id = y.id)) as c on c.trade_reference = t.external_trade_id
      where i.instrument_type = 'fx_forward' and t.status = 'executed' and t.settlement_date > (select d from today) and t.trade_date <= (select d from today)
      and not exists (select 1 from transactions as x where x.supersedes_transaction_id = t.id)),
      legs as (select bought_ccy as currency, bought as amt, 'booked' as src from fwd
      union all select sold_ccy, qty, 'booked' from fwd where sold_ccy is not null
      union all select currency_bought, amount_bought, 'confirmed' from cfm
      union all select currency_sold, -amount_sold, 'confirmed' from cfm),
      ccy as (select currency from inv union select currency from cash union select currency from legs),
      m as (select k.currency, (select d from today) as as_of, (select d from me) as month_end, coalesce(f.rate, case when k.currency = 'USD' then 1 end) as rate,
      coalesce((select sum(v) from inv where inv.currency = k.currency), 0) as investments, coalesce((select v from cash where cash.currency = k.currency), 0) as cash,
      coalesce((select sum(amt) filter (where amt > 0) from legs where legs.currency = k.currency and src = 'booked'), 0) as fwd_bought,
      coalesce(-(select sum(amt) filter (where amt < 0) from legs where legs.currency = k.currency and src = 'booked'), 0) as fwd_sold,
      coalesce((select sum(amt) from legs where legs.currency = k.currency and src = 'confirmed'), 0) as fwd_net_confirmed,
      (select count(*) from fwd where sold_ccy is null) as unplaced_forwards from ccy as k left join fx as f on f.currency = k.currency),
      u as (select m.*, m.investments + m.cash as spot_native, round((m.investments + m.cash) / m.rate, 2) as spot_usd_eq,
      round((m.fwd_bought - m.fwd_sold) / m.rate, 2) as fwd_net_usd_eq from m)
      select u.currency, u.as_of, u.month_end, cast(u.rate as decimal(18,6)) as rate, cast(u.investments as decimal(18,2)) as investments, cast(u.cash as decimal(18,2)) as cash,
      cast(u.spot_native as decimal(18,2)) as spot_native, cast(u.spot_usd_eq as decimal(18,2)) as spot_usd_eq, cast(u.fwd_bought as decimal(18,2)) as fwd_bought,
      cast(u.fwd_sold as decimal(18,2)) as fwd_sold, cast(round(u.fwd_bought / u.rate, 2) as decimal(18,2)) as fwd_bought_usd_eq, cast(u.fwd_net_usd_eq as decimal(18,2)) as fwd_net_usd_eq,
      cast(u.spot_usd_eq + u.fwd_net_usd_eq as decimal(18,2)) as after_usd_eq,
      cast(sum(u.spot_usd_eq) over () as decimal(18,2)) as family_total_usd_eq,
      cast(100 * u.spot_usd_eq / nullif(sum(u.spot_usd_eq) over (), 0) as decimal(9,2)) as share_spot_pct,
      cast(100 * (u.spot_usd_eq + u.fwd_net_usd_eq) / nullif(sum(u.spot_usd_eq) over (), 0) as decimal(9,2)) as share_after_pct,
      cast(u.fwd_net_confirmed as decimal(18,2)) as fwd_net_confirmed, cast(u.fwd_net_confirmed - (u.fwd_bought - u.fwd_sold) as decimal(18,2)) as fwd_gap,
      cast(u.unplaced_forwards as integer) as unplaced_forwards, (u.currency <> 'USD') as non_base, (u.rate is null) as no_rate
      from u
    measure: after_usd_eq
    columns:
      investments: The funds at their latest value known plus the listed holdings at the latest month end, in the currency shown.
      cash: The administrator's cash at the latest date, in the currency shown.
      spot_usd_eq: What is held in the currency (investments and cash), in USD at the latest fixing.
      fwd_bought: The open forwards' bought leg in the currency, as booked.
      fwd_sold: The open forwards' sold leg in the currency, as booked (a positive amount).
      after_usd_eq: What is held in the currency after the open forwards, in USD at the fixing (the bought leg added, the sold leg taken off).
      family_total_usd_eq: Everything held, in USD (the same on every row).
      share_after_pct: The currency's after-forward amount as a percent of the family total.
      fwd_gap: The open forwards in the currency as the bank confirms them, less as booked (positive means the bank confirmed more).
      unplaced_forwards: How many open forwards have no confirmation, so no known sold currency (the same on every row).
      non_base: True for a currency other than USD.
    tie_out:
      label: The forward legs bought add up to the open forwards as booked
      sql: >-
        select (select coalesce(sum(fwd_bought), 0) from {name}), (select coalesce(sum(t.cash_amount), 0) from transactions as t join instruments as i on i.id = t.instrument_id
        where i.instrument_type = 'fx_forward' and t.status = 'executed' and t.settlement_date > (select max(as_of) from {name}) and t.trade_date <= (select max(as_of) from {name}))

  - id: actions_next_14d
    label: Corporate actions in the next 14 days
    status: ready
    cards: [55]
    names: [corporate actions, actions next 14 days, corporate action calendar, dividends coming, coupons coming, elections due, tender offer]
    may_read: [corporate_actions, documents, extracted_fields, position_snapshots, instruments]
    never_read: [commitments, transactions]
    why: "What is coming on the liquid book is what the custodian's notices announce: an ex-date or a pay date in the window is a booking, an election with a deadline in the window is a decision. The cash to book is the notice's own figure at the holding it states, never a rate worked out here."
    formula: "One row for each corporate action as it stands (a re-issued notice supersedes the earlier one). The window is the as-of date (the latest position date) to 14 days after it, both days in (the card's 14 days). bucket = decide when the notice needs an election and its deadline is in the window; missed when the deadline has passed; book when no election is needed and the ex-date or the pay date is in the window; later when the event is after the window; past otherwise. quantity and expected_cash are the notice's fields (quantity_held, expected_cash; a corrected value wins, a rejected one is out). For a decision, offer_price is the notice's price, last_price the position's value over its quantity at the as-of date, premium_pct the offer over that price, in percent. cash_to_book is the sum of expected_cash of the bookings."
    grain: By corporate action notice
    sql: >-
      create table {name} as with {positions},
      today as (select max(p.position_date) as d from positions as p),
      ca as (select c.* from corporate_actions as c where not exists (select 1 from corporate_actions as x where x.supersedes_corporate_action_id = c.id)),
      fld as (select cast(f.document_id as varchar) as doc, f.field_name, coalesce(try_cast(f.corrected_value_text as decimal(28,10)), f.value_numeric) as v from extracted_fields as f
      join documents as d on d.id = f.document_id where d.document_type = 'corporate_action_notice' and f.review_status <> 'rejected' and f.field_name in ('quantity_held', 'expected_cash')),
      px as (select p.instrument_id, sum(p.source_market_value) / nullif(sum(p.quantity), 0) as price from positions as p where p.position_date = (select d from today) group by p.instrument_id),
      s as (select i.canonical_name as security, replace(c.action_type, '_', ' ') as event, c.action_type, c.ex_date, c.pay_date, c.election_required, c.election_deadline as respond_by,
      c.custodian_ref, t.d as window_from, cast(t.d + 14 as date) as window_to,
      (select max(v) from fld where fld.doc = c.source_document_id and fld.field_name = 'quantity_held') as quantity,
      (select max(v) from fld where fld.doc = c.source_document_id and fld.field_name = 'expected_cash') as expected_cash,
      case when c.election_required then c.rate_per_unit end as offer_price, case when c.election_required then x.price end as last_price,
      case when c.election_required and c.election_deadline between t.d and t.d + 14 then 'decide' when c.election_required and c.election_deadline < t.d then 'missed'
      when not coalesce(c.election_required, false) and (c.ex_date between t.d and t.d + 14 or c.pay_date between t.d and t.d + 14) then 'book'
      when greatest(c.ex_date, c.pay_date, c.election_deadline) > t.d + 14 then 'later' else 'past' end as bucket
      from ca as c join instruments as i on i.id = c.instrument_id cross join today as t left join px as x on x.instrument_id = c.instrument_id)
      select s.security, s.event, s.bucket, s.ex_date, s.pay_date, s.respond_by, s.window_from, s.window_to, cast(s.quantity as decimal(18,2)) as quantity,
      cast(s.expected_cash as decimal(18,2)) as expected_cash, cast(s.offer_price as decimal(18,4)) as offer_price, cast(round(s.last_price, 2) as decimal(18,2)) as last_price,
      cast(round(100 * (s.offer_price / nullif(round(s.last_price, 2), 0) - 1), 2) as decimal(9,2)) as premium_pct, s.custodian_ref,
      cast(coalesce(sum(s.expected_cash) filter (where s.bucket = 'book') over (), 0) as decimal(18,2)) as cash_to_book,
      cast(count(*) filter (where s.bucket = 'book') over () as integer) as book_count, cast(count(*) filter (where s.bucket = 'decide') over () as integer) as decide_count,
      (row_number() over (partition by s.bucket order by coalesce(s.respond_by, s.pay_date), s.security) = 1) as first_in_bucket
      from s
    measure: expected_cash
    columns:
      bucket: "book (a mandatory cash event in the window), decide (an election due in the window), missed (an election whose deadline has passed), later (after the window), past."
      quantity: The holding the notice states.
      expected_cash: The cash the notice states, in the notice's currency (none for an election until the office elects).
      respond_by: The election deadline of the notice, when it needs one.
      offer_price: The price the notice offers, for an election.
      last_price: The position's value over its quantity at the as-of date.
      premium_pct: The offer price over the last price, in percent.
      cash_to_book: The expected cash of all the bookings in the window (the same on every row).
      first_in_bucket: True on one row of each bucket (the earliest deadline or pay date), so a signal can read the counts once.
    tie_out:
      label: Every corporate action as it stands has one row
      sql: >-
        select (select count(*) from {name}), (select count(*) from corporate_actions as c where not exists (select 1 from corporate_actions as x where x.supersedes_corporate_action_id = c.id))

  - id: real_asset_value
    label: Real assets register
    status: ready
    cards: [65]
    names: [real assets, real asset register, property register, real asset value, property and art, what real assets we own]
    may_read: [real_assets, legal_entities, market_observations, position_snapshots]
    never_read: [commitments, cash_movements, transactions]
    why: "A real asset is worth its latest appraisal; an older appraisal is history. Who owns it is the entity on the appraisal, and the title deed's registered holder is set beside it, never put in its place."
    formula: "One row for each real asset: its latest appraisal on or before the as-of date (the latest position date; a superseded appraisal out). value_usd = the appraised value at the latest USD fixing on or before the as-of date (market_observations, fx_fixing; USD is 1). type_total_usd and entity_total_usd sum value_usd by asset type and by owning entity, total_usd over all. title_differs is true when the title holder is not the owning entity's name."
    grain: By real asset
    sql: >-
      create table {name} as with {positions},
      today as (select max(p.position_date) as d from positions as p),
      fx as (select o.quote_currency as currency, arg_max(o.value, o.observed_at) as rate from market_observations as o
      where o.observation_type = 'fx_fixing' and o.base_currency = 'USD' and cast(o.observed_at as date) <= (select d from today)
      and not exists (select 1 from market_observations as x where x.supersedes_observation_id = o.id) group by o.quote_currency),
      a as (select r.*, row_number() over (partition by r.asset_ref order by r.appraised_on desc, r.recorded_at desc, r.id) as rn from real_assets as r
      where not exists (select 1 from real_assets as x where x.supersedes_real_asset_id = r.id) and r.appraised_on <= (select d from today)),
      s as (select a.asset_ref, a.asset_name, a.asset_type, e.entity_name as entity, a.title_holder_name as title_holder, a.currency, a.appraised_value, a.appraised_on, a.appraiser,
      (select d from today) as as_of, coalesce(f.rate, case when a.currency = 'USD' then 1 end) as rate from a left join legal_entities as e on e.id = a.legal_entity_id
      left join fx as f on f.currency = a.currency where a.rn = 1),
      v as (select s.*, round(s.appraised_value / s.rate, 2) as value_usd, (s.title_holder is distinct from s.entity) as title_differs from s)
      select v.asset_ref, v.asset_name, v.asset_type, v.entity, v.title_holder, v.currency, cast(v.appraised_value as decimal(18,2)) as latest_value, v.appraised_on, v.appraiser, v.as_of,
      cast(v.rate as decimal(18,6)) as rate, cast(v.value_usd as decimal(18,2)) as value_usd,
      cast(sum(v.value_usd) over (partition by v.asset_type) as decimal(18,2)) as type_total_usd, cast(sum(v.value_usd) over (partition by v.entity) as decimal(18,2)) as entity_total_usd,
      cast(sum(v.value_usd) over () as decimal(18,2)) as total_usd, v.title_differs, cast(count(*) filter (where v.title_differs) over () as integer) as title_differs_count,
      (v.rate is null) as no_rate, (row_number() over (partition by v.title_differs order by v.value_usd desc, v.asset_ref) = 1) as first_in_kind
      from v
    measure: value_usd
    columns:
      latest_value: The latest appraised value, in the asset's currency.
      value_usd: The latest value in USD at the fixing.
      type_total_usd: All real assets of the same type, in USD.
      entity_total_usd: All real assets of the same owning entity, in USD.
      total_usd: All real assets, in USD (the same on every row).
      title_holder: The holder the title deed registers (the owner of record on the appraisal when no deed is on file).
      title_differs: True when the title holder is not the entity that owns the asset.
      title_differs_count: How many assets have title in another name (the same on every row).
      no_rate: True when no fixing is loaded for the asset's currency (no USD value, never guessed).
      first_in_kind: True on the largest asset with title in another name and on the largest one without, so a signal can read one of each.
    tie_out:
      label: Every real asset has one row
      sql: >-
        select (select count(*) from {name}), (select count(distinct asset_ref) from real_assets)

  - id: appraisal_age
    label: Appraisal age of the real assets
    status: ready
    cards: [66]
    names: [appraisal age, appraisal due, appraisal overdue, revaluation due, age of appraisal]
    may_read: [real_assets, legal_entities, position_snapshots]
    never_read: [commitments, cash_movements, transactions]
    why: "How old an appraisal is depends on the date the appraiser valued the asset, not on when the report was filed."
    formula: "One row for each real asset: the as-of date (the latest position date) less the date of its latest appraisal (a superseded appraisal out), in days; due when above 365 days (the card's line)."
    grain: By real asset
    sql: >-
      create table {name} as with {positions},
      today as (select max(p.position_date) as d from positions as p),
      a as (select r.*, row_number() over (partition by r.asset_ref order by r.appraised_on desc, r.recorded_at desc, r.id) as rn from real_assets as r
      where not exists (select 1 from real_assets as x where x.supersedes_real_asset_id = r.id) and r.appraised_on <= (select d from today)),
      s as (select a.asset_ref, a.asset_name, a.asset_type, e.entity_name as entity, a.appraised_on, a.appraiser, t.d as as_of,
      cast(date_diff('day', a.appraised_on, t.d) as integer) as age_days, cast(365 as integer) as due_after_days, (date_diff('day', a.appraised_on, t.d) > 365) as due
      from a cross join today as t left join legal_entities as e on e.id = a.legal_entity_id where a.rn = 1)
      select s.*, cast(count(*) filter (where s.due) over () as integer) as due_count,
      coalesce(string_agg(s.asset_name, ', ' order by s.age_days desc) filter (where s.due) over (), 'none') as due_names,
      (row_number() over (partition by s.due order by s.age_days desc, s.asset_ref) = 1 and s.due) as first_due
      from s
    measure: age_days
    columns:
      age_days: Days from the latest appraisal to the as-of date.
      due: True when the latest appraisal is more than 365 days old.
      due_count: How many assets are due a new appraisal (the same on every row).
      due_names: Those assets, oldest appraisal first (the same on every row; 'none' when there are none).
      first_due: True on the asset with the oldest appraisal among those due.
    tie_out:
      label: Every real asset has one row
      sql: >-
        select (select count(*) from {name}), (select count(distinct asset_ref) from real_assets)

  - id: unrealised_gain
    label: Unrealised gain by lot
    status: ready
    cards: [67]
    names: [unrealised gain, unrealized gain, unrealised gain by lot, tax lots, lot gains, loss lots, tax loss candidates]
    may_read: [tax_lots, position_snapshots, instruments, portfolios, business_rules, rule_versions]
    never_read: [commitments, cash_movements]
    why: "A gain not yet taken is what an open lot is worth today less what it cost. The lots are the custodian's register; the price is the position's own at the register date, so the lots and the holding agree."
    formula: "One row for each open lot of the latest register of each portfolio (a superseded lot out). value = the lot's quantity times the price of the holding at the register date (the position's market value over its quantity, same portfolio and instrument); gain = value less cost; days_held = register date less acquired date. holding_value and holding_gain sum by security; book_value is everything the portfolio holds at the register date, and holding_pct the security's share of it, in percent (what the single-name limit measures). exempt is true for a security a signed, approved rule exempts from the single-name limit (rule_versions, dimension single_name_exempt); name_rank ranks the other securities of the portfolio by holding_pct, largest first. total_gain is the gain of all the lots (losses taken off), total_loss the lots with a loss."
    grain: By tax lot
    sql: >-
      create table {name} as with {positions},
      lots as (select l.* from tax_lots as l where not exists (select 1 from tax_lots as x where x.supersedes_tax_lot_id = l.id) and coalesce(l.status, 'open') = 'open'
      and l.as_at = (select max(y.as_at) from tax_lots as y where y.portfolio_id = l.portfolio_id)),
      px as (select p.portfolio_id, p.instrument_id, p.position_date, sum(p.source_market_value) as v, sum(p.quantity) as q from positions as p group by all),
      book as (select portfolio_id, position_date, sum(v) as total from px group by all),
      s as (select l.lot_ref as lot, i.canonical_name as security, i.instrument_type, pf.portfolio_name as portfolio, l.acquired_on as acquired, l.as_at,
      cast(date_diff('day', l.acquired_on, l.as_at) as integer) as days_held, l.quantity, l.cost_amount as cost, l.currency,
      round(l.quantity * x.v / nullif(x.q, 0), 2) as value, x.v as holding_value, b.total as book_value
      from lots as l join instruments as i on i.id = l.instrument_id left join portfolios as pf on pf.id = l.portfolio_id
      left join px as x on x.portfolio_id = l.portfolio_id and x.instrument_id = l.instrument_id and x.position_date = l.as_at
      left join book as b on b.portfolio_id = l.portfolio_id and b.position_date = l.as_at),
      ex as (select distinct json_extract_string(v.parameters, '$.instrument') as security from rule_versions as v join business_rules as b on b.id = v.business_rule_id
      where v.approval_status = 'approved' and v.effective_to is null and json_extract_string(v.parameters, '$.dimension') = 'single_name_exempt'),
      g as (select s.*, s.value - s.cost as gain, s.security in (select security from ex) as exempt from s)
      select g.lot, g.security, g.instrument_type, g.portfolio, g.acquired, g.as_at, g.days_held, cast(g.quantity as decimal(18,2)) as quantity, cast(g.cost as decimal(18,2)) as cost,
      cast(g.value as decimal(18,2)) as value, cast(g.gain as decimal(18,2)) as gain, g.currency, (g.gain < 0) as is_loss,
      cast(sum(g.gain) over (partition by g.portfolio, g.security) as decimal(18,2)) as holding_gain, cast(g.holding_value as decimal(18,2)) as holding_value,
      cast(g.book_value as decimal(18,2)) as book_value, cast(100 * g.holding_value / nullif(g.book_value, 0) as decimal(9,2)) as holding_pct,
      g.exempt, case when not g.exempt then dense_rank() over (partition by g.portfolio, g.exempt order by g.holding_value desc, g.security) end as name_rank,
      cast(count(*) over () as integer) as lots, cast(coalesce(sum(g.gain) over (), 0) as decimal(18,2)) as total_gain,
      cast(coalesce(sum(g.gain) filter (where g.gain < 0) over (), 0) as decimal(18,2)) as total_loss,
      cast(count(*) filter (where g.gain < 0) over () as integer) as loss_lots, cast(count(*) filter (where g.value is null) over () as integer) as unpriced_lots,
      (row_number() over (partition by g.portfolio, g.security order by g.acquired, g.lot) = 1) as first_of_security,
      (row_number() over (order by g.gain, g.lot) = 1) as first_row
      from g
    measure: gain
    columns:
      value: The lot's quantity at the holding's price on the register date.
      gain: Value less cost (negative is a loss).
      days_held: Days from the acquired date to the register date.
      holding_gain: The gain of all the lots of the same security.
      holding_value: The holding of the security at the register date.
      book_value: Everything the portfolio holds at the register date.
      holding_pct: The security's share of the book, in percent (the measure the single-name limit uses).
      exempt: True when a signed rule exempts the security from the single-name limit.
      name_rank: 1 for the largest holding that is not exempt, 2 for the next (none when exempt).
      total_gain: The gain of all the lots, losses taken off (the same on every row).
      total_loss: The lots with a loss, added (the same on every row).
      unpriced_lots: Lots with no position at the register date, so no value (never guessed).
      first_of_security: True on the oldest lot of each security, so a signal can read the holding once.
      first_row: True on the lot with the largest loss, so a signal can read the totals once.
    tie_out:
      label: The lots add up to the book at the register date
      sql: >-
        select (select coalesce(sum(value), 0) from {name}), (select coalesce(max(book_value), 0) from {name})

  - id: income_forecast
    label: Dividend and coupon income forecast
    status: ready
    cards: [68]
    names: [income forecast, dividend forecast, coupon income, income next 12 months, dividend and coupon income]
    may_read: [cash_movements, instruments, position_snapshots]
    never_read: [commitments, transactions]
    why: "The income the liquid book will pay is the dividends and coupons the office's income calendar expects, each at its pay date. Cash already received is a fact, not a forecast; a payment past its date is not counted again."
    formula: "One row for each expected dividend or coupon (cash_movements, expected, as the income calendar gives it; a superseded line out) paid after the as-of date (the latest position date) and up to one year after it (the card's 12 months). quarter = the calendar quarter of the pay date. quarter_total sums the quarter, total all, coupons and dividends each kind; events counts the payments. Totals are by currency."
    grain: By expected payment
    sql: >-
      create table {name} as with {positions},
      today as (select max(p.position_date) as d from positions as p),
      c as (select c.* from cash_movements as c cross join today as t where not exists (select 1 from cash_movements as x where x.supersedes_cash_movement_id = c.id)
      and c.confirmation_status = 'expected' and c.movement_type in ('dividend', 'coupon') and c.due_date > t.d and c.due_date <= cast(t.d + interval 1 year as date))
      select c.due_date as pay_date, i.canonical_name as security, i.instrument_type, c.movement_type as event, cast(c.amount as decimal(18,2)) as amount, c.currency,
      (select d from today) as period_from, cast((select d from today) + interval 1 year as date) as period_to,
      cast(year(c.due_date) as varchar) || '-Q' || cast(quarter(c.due_date) as varchar) as quarter,
      cast(sum(c.amount) over (partition by c.currency, year(c.due_date), quarter(c.due_date)) as decimal(18,2)) as quarter_total,
      cast(sum(c.amount) over (partition by c.currency) as decimal(18,2)) as total,
      cast(coalesce(sum(c.amount) filter (where c.movement_type = 'coupon') over (partition by c.currency), 0) as decimal(18,2)) as coupons,
      cast(coalesce(sum(c.amount) filter (where c.movement_type = 'dividend') over (partition by c.currency), 0) as decimal(18,2)) as dividends,
      cast(count(*) over (partition by c.currency) as integer) as events,
      (row_number() over (partition by c.currency order by c.due_date, i.canonical_name) = 1) as first_row
      from c left join instruments as i on i.id = c.instrument_id
    measure: amount
    columns:
      amount: The expected cash of the payment, in the currency shown.
      quarter: The calendar quarter of the pay date.
      quarter_total: The expected income of the quarter.
      total: The expected income of the 12 months (the same on every row of a currency).
      coupons: The coupons of the 12 months.
      dividends: The dividends of the 12 months.
      events: How many payments are expected.
      first_row: True on the first payment, so a signal can read the totals once.
    tie_out:
      label: Coupons and dividends add up to the total
      sql: >-
        select (select coalesce(sum(coupons + dividends), 0) from (select distinct currency, coupons, dividends from {name}) as t), (select coalesce(sum(amount), 0) from {name})

  - id: lookthrough_exposure
    label: Look-through exposure by company
    status: ready
    cards: [69]
    names: [look-through exposure, lookthrough exposure, what the funds own, look through the funds, exposure through funds, company exposure through funds, fund overlap]
    may_read: [fund_holdings, source_records, valuation_observations, position_snapshots, instruments, portfolios, business_rules, rule_versions]
    never_read: [commitments, cash_movements, transactions]
    why: "What the family owns through a fund is the fund's value times the weight the manager's holdings list gives the company. A commitment or a call says nothing of what the fund holds."
    formula: >-
      For each fund with a holdings list (the latest list of each fund, a superseded row out): its latest statement value (the valuation nothing supersedes with the latest
      valuation date, as expected_distributions) times each company's weight, rounded to the cent, summed by company and by sector. 'Other holdings' is the manager's
      remainder, not a company, and has no row. funds = the fund keys the holdings list gives (the office's own fund codes), fund_names the funds. The liquid book is
      what the portfolios with a signed single-name limit hold at their latest position date (as the single-name limit measures it); direct_value is the company's own
      holding in it. family_investments = the liquid book plus the latest value of every fund (cash out). Shares are percent, two decimals.
    grain: By company
    sql: >-
      create table {name} as with {positions},
      vo as (select o.* from valuation_observations as o where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)),
      lv as (select instrument_id, valuation_date, value_amount from (select v.*, row_number() over (partition by v.instrument_id order by v.valuation_date desc,
      v.received_at desc, v.recorded_at desc) as rn from vo as v) as v where v.rn = 1),
      fh as (select h.* from fund_holdings as h where not exists (select 1 from fund_holdings as x where x.supersedes_fund_holding_id = h.id)
      and h.as_at = (select max(y.as_at) from fund_holdings as y where y.instrument_id = h.instrument_id)),
      line as (select h.holding_name as company, h.sector, split_part(s.external_record_id, ':', 1) as fund_key, i.canonical_name as fund, l.valuation_date, h.as_at,
      round(l.value_amount * h.weight_pct / 100, 2) as amount from fh as h join lv as l on l.instrument_id = h.instrument_id join instruments as i on i.id = h.instrument_id
      left join source_records as s on s.id = h.source_record_id where lower(h.holding_name) <> 'other holdings'),
      lim as (select p.id as portfolio_id from business_rules as r join rule_versions as v on v.business_rule_id = r.id join portfolios as p on p.portfolio_code = json_extract_string(v.parameters, '$.portfolio')
      where r.rule_type = 'policy' and lower(v.approval_status) = 'approved' and v.effective_to is null and json_extract_string(v.parameters, '$.dimension') = 'single_name'),
      book as (select l.instrument_id, l.position_date, l.source_market_value as v from positions as l join lim as m on m.portfolio_id = l.portfolio_id
      where l.position_date = (select max(z.position_date) from positions as z where z.portfolio_id = l.portfolio_id)),
      tot as (select (select sum(v) from book) as liquid_book, (select max(position_date) from book) as book_date,
      (select sum(v) from book) + (select coalesce(sum(l.value_amount), 0) from lv as l join instruments as i on i.id = l.instrument_id where i.instrument_type like '%fund') as family_investments),
      co as (select company, min(sector) as sector, sum(amount) as through_funds, list(distinct fund_key order by fund_key) as funds,
      string_agg(distinct fund, ', ' order by fund) as fund_names, count(distinct fund_key) as fund_count, min(valuation_date) as oldest_value, max(as_at) as holdings_as_at
      from line group by company),
      dir as (select lower(i.canonical_name) as company, sum(b.v) as direct_value from book as b join instruments as i on i.id = b.instrument_id group by 1),
      x as (select c.*, coalesce(d.direct_value, 0) as direct_value, t.liquid_book, t.book_date, t.family_investments,
      sum(c.through_funds) over (partition by c.sector) as sector_total from co as c cross join tot as t left join dir as d on d.company = lower(c.company))
      select company, sector, cast(through_funds as decimal(18,2)) as through_funds, funds, fund_names, cast(fund_count as integer) as fund_count, (fund_count > 1) as in_several_funds,
      cast(round(100 * through_funds / nullif(family_investments, 0), 2) as decimal(9,2)) as share_of_family_pct, cast(sector_total as decimal(18,2)) as sector_through_funds,
      cast(direct_value as decimal(18,2)) as direct_value, cast(round(100 * direct_value / nullif(liquid_book, 0), 2) as decimal(9,2)) as direct_pct_of_liquid_book,
      cast(round(100 * (direct_value + through_funds) / nullif(liquid_book, 0), 2) as decimal(9,2)) as with_funds_pct_of_liquid_book,
      cast(liquid_book as decimal(18,2)) as liquid_book, book_date, cast(family_investments as decimal(18,2)) as family_investments, oldest_value, holdings_as_at,
      cast(row_number() over (order by through_funds desc, company) as integer) as rank,
      cast(count(*) filter (where fund_count > 1) over () as integer) as several_count,
      string_agg(company, ', ' order by through_funds desc, company) filter (where fund_count > 1) over () as several_names,
      (row_number() over (order by through_funds desc, company) = 1) as first_row
      from x
    measure: through_funds
    columns:
      through_funds: What the family holds in the company through its funds (fund value times weight, summed over the funds).
      funds: The fund keys of the holdings lists the company is in.
      fund_names: The funds the company is in.
      in_several_funds: True when the company sits in more than one fund.
      share_of_family_pct: through_funds as a percent of family_investments.
      sector_through_funds: The look-through total of the company's sector (the same on every row of the sector).
      direct_value: The company's own holding in the liquid book at its latest position date (0 when not held directly).
      direct_pct_of_liquid_book: direct_value as a percent of the liquid book.
      with_funds_pct_of_liquid_book: direct_value plus through_funds, as a percent of the liquid book.
      family_investments: The liquid book plus the latest value of every fund (the same on every row).
      oldest_value: The oldest fund statement date the company's figure rests on.
      several_count: How many companies sit in more than one fund (the same on every row).
      several_names: Those companies, largest first (the same on every row).
      first_row: True on the largest company, so a signal can read the totals once.
    tie_out:
      label: The companies and the managers' 'Other holdings' add up to the latest values of the funds with a holdings list
      sql: >-
        with vo as (select o.* from valuation_observations as o where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)),
        lv as (select instrument_id, value_amount from (select v.*, row_number() over (partition by v.instrument_id order by v.valuation_date desc, v.received_at desc, v.recorded_at desc) as rn from vo as v) as v where v.rn = 1),
        fh as (select h.* from fund_holdings as h where not exists (select 1 from fund_holdings as x where x.supersedes_fund_holding_id = h.id)
        and h.as_at = (select max(y.as_at) from fund_holdings as y where y.instrument_id = h.instrument_id))
        select (select coalesce(sum(through_funds), 0) from {name}) + (select coalesce(sum(round(l.value_amount * h.weight_pct / 100, 2)), 0) from fh as h join lv as l on l.instrument_id = h.instrument_id where lower(h.holding_name) = 'other holdings'),
        (select coalesce(sum(l.value_amount), 0) from lv as l where l.instrument_id in (select instrument_id from fh))
