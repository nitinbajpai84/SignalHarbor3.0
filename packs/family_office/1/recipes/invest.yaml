# Recipes of one domain (family-office pack). Format, snippets and the rules are in recipes/_shared.yaml; assumptions A7, A8 and A11 onward, in docs/v3/ASSUMPTIONS.md.
# status: stub = named and scoped but not built (sql: null): the loader skips it until the owner of this file fills in sql, grain, measure, columns
# and tie_out and removes `status: stub`. cards = the use-case cards (docs/v3/USE-CASES-100.md numbers) that need it.
# Built here (w1 invest): commitments_by_fund, private_markets_budget, ddq_compare, fund_irr_tvpi, fee_drag (the stubs of cards 7, 35, 39, 49) and manager_timeline (25),
# mandate_fit (34), memo_support (40), commit_check (41). A call notice is a `call` row (the investment part) and a `fee` row (the fee part) with notice_kind capital_call,
# commitment_id set, effective_date = due date, received_at = notice date, amounts negative (money out, A5); a distribution is a positive `distribution` row, noticed then confirmed.
# Built here (w1b, cards 51 to 100): vintage_split (80), expected_distributions (71). watch_flags (53) and manager_score (76) stay stubs: docs/v3/w1/build51-invest.md, Needs.
recipes:
  - id: commitments_by_fund
    label: Commitments by fund
    cards: [7, 34, 41]
    names: [commitments by fund, commitment pacing, unfunded by fund, called and unfunded, unfunded commitment, unfunded commitments, unfunded amount]
    may_read: [commitments, cash_movements, instruments, legal_entities]
    never_read: [position_snapshots, transactions]
    why: >-
      A commitment is a promise to invest and its calls are movements of capital. Net worth, positions and trades say nothing of it.
    formula: >-
      For each fund and entity: the commitment, the capital called (the called_to_date the commitments register states at its as-at date, plus the capital
      calls logged since: every noticed call, and a confirmed one noticed after the register date; if the register states no called figure, all the
      confirmed calls) and unfunded = commitment less called. A commitment row that a later one supersedes is out, and so is a shadow
      row (no register source, no called figure, no call movement, in a fund whose other rows state a called figure), as called_to_date leaves it out. A call notice is a call row (the
      investment part) and a fee row (the fee part), both counted. Currencies are never added together; one row per currency adds up the funds.
    grain: By entity and fund, with one total row per currency
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id
      = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id
      = x.id) and exists (select 1 from commitments as r where r.instrument_id = x.instrument_id and r.called_to_date is not null))), mv as (select m.commitment_id, sum(-m.amount) filter (where m.confirmation_status = 'noticed' and (c.called_to_date is null or cast(m.received_at as date) >= c.called_as_at)) as noticed, sum(-m.amount) filter (where
      m.confirmation_status = 'confirmed') as confirmed_all, sum(-m.amount) filter (where m.confirmation_status = 'confirmed' and cast(m.received_at as date) >= c.called_as_at) as confirmed_after from cmv as m join cm as c on c.id = m.commitment_id where m.notice_kind = 'capital_call' and
      m.movement_type in ('call', 'fee') and not exists (select 1 from cmv as z where z.supersedes_cash_movement_id = m.id) group by
      m.commitment_id), cu as (select c.*, case when c.called_to_date is null then coalesce(v.confirmed_all, 0) else c.called_to_date +
      coalesce(v.confirmed_after, 0) end as paid, coalesce(v.noticed, 0) as noticed from cm as c left join mv as v on v.commitment_id = c.id), fr as (select
      e.entity_name as entity, i.canonical_name as fund, c.currency, c.called_as_at as as_at, cast(c.commitment_amount as decimal(18,2)) as committed,
      cast(c.paid + c.noticed as decimal(18,2)) as called, cast(c.noticed as decimal(18,2)) as noticed, cast(c.commitment_amount - c.paid - c.noticed as
      decimal(18,2)) as unfunded from cu as c join instruments as i on i.id = c.instrument_id left join legal_entities as e on e.id = c.legal_entity_id)
      select entity, fund, currency, as_at, committed, called, noticed, unfunded, 0 as is_total from fr union all select 'All entities', 'All funds',
      currency, max(as_at), sum(committed), sum(called), sum(noticed), sum(unfunded), 1 from fr group by currency
    measure: unfunded
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: is_total, stop: true, say: "Unfunded commitments total {currency} {unfunded} across all funds: {called} called of {committed} committed"}
      - {sort: unfunded, lead: "Unfunded:", say: "{fund} {currency} {unfunded} of {committed}", max: 4}
    columns:
      committed: What the office committed to the fund.
      called: 'Capital called to date: the register''s figure plus the calls logged since, a noticed call included.'
      noticed: Calls noticed by the manager and not yet recorded against the commitment (part of called).
      unfunded: Committed less called. What the fund can still ask for.
      is_total: '1 on the row that adds up all the funds of a currency, 0 on a fund row.'
    tie_out:
      label: Committed on the total rows equals the commitments of the register (rows nothing supersedes, shadow rows left out)
      sql: >-
        with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id) select (select coalesce(sum(committed), 0) from {name} where is_total = 1), (select coalesce(sum(x.commitment_amount), 0) from commitments as x where
        not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null
        and not exists (select 1 from cmv as m where m.commitment_id = x.id) and exists (select 1 from commitments as r where r.instrument_id =
        x.instrument_id and r.called_to_date is not null)))


  - id: private_markets_budget
    label: Private markets budget headroom
    cards: [7, 34, 41]
    names: [private markets budget, budget headroom, private markets headroom, room to commit]
    may_read: [rule_versions, business_rules, commitments, position_snapshots, instruments, market_observations, cash_movements]  # cash_movements: only to tell a shadow commitment row
    never_read: [transactions]
    why: >-
      The budget is a signed rule applied to what the family is worth, set against what it has committed. With no signed rule there is no budget to state.
    formula: >-
      Budget = the max_pct of the signed rule allocation_private_markets (the latest version approved and in force at the register date) times net worth at
      the latest position date, counted as net_worth counts it; headroom = budget less all the commitments to private funds (committed, not only called).
      Every amount is in USD: other currencies are converted at the latest fx_fixing (units per USD) on or before the position date (net worth) or the
      register date (commitments); when a currency has no fixing the amounts are empty and conversion_gaps says how many. With no signed rule the figure is
      held, not guessed.
    grain: One row, in USD
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), {positions}, cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where
      y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))), reg as (select coalesce(max(called_as_at), current_date) as d from cm), rl as (select b.rule_code, v.id as
      rule_version_id, cast(json_extract_string(v.parameters, '$.max_pct') as double) as max_pct from business_rules as b join rule_versions as v on
      v.business_rule_id = b.id where v.approval_status = 'approved' and v.effective_from <= (select d from reg) and (v.effective_to is null or
      v.effective_to > (select d from reg)) qualify row_number() over (partition by b.rule_code order by v.effective_from desc, v.version_number desc) = 1),
      fxo as (select o.quote_currency as currency, o.value as rate, cast(o.observed_at as date) as d from market_observations as o where o.observation_type
      = 'fx_fixing' and o.base_currency = 'USD' and not exists (select 1 from market_observations as z where z.supersedes_observation_id = o.id)), nw as
      (select sum(case when p.currency = 'USD' then p.source_market_value else (p.source_market_value) / (select f.rate from fxo as f where f.currency =
      p.currency and f.d <= p.position_date order by f.d desc limit 1) end) as net_worth, count(*) filter (where (p.currency <> 'USD' and not exists (select
      1 from fxo as f where f.currency = p.currency and f.d <= p.position_date))) as gaps from positions as p where p.position_date = (select
      max(q.position_date) from positions as q)), cmt as (select sum(case when c.currency = 'USD' then c.commitment_amount else (c.commitment_amount) /
      (select f.rate from fxo as f where f.currency = c.currency and f.d <= (select d from reg) order by f.d desc limit 1) end) as committed, count(*)
      filter (where (c.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = c.currency and f.d <= (select d from reg)))) as gaps from
      cm as c) select 'USD' as currency, cast(case when w.gaps = 0 then w.net_worth end as decimal(18,2)) as net_worth, r.max_pct as limit_pct, cast(case
      when w.gaps = 0 then w.net_worth * r.max_pct / 100 end as decimal(18,2)) as budget, cast(case when t.gaps = 0 then coalesce(t.committed, 0) end as
      decimal(18,2)) as committed, cast(case when w.gaps + t.gaps = 0 then w.net_worth * r.max_pct / 100 - coalesce(t.committed, 0) end as decimal(18,2)) as
      headroom, w.gaps + t.gaps as conversion_gaps, r.rule_version_id from nw as w cross join cmt as t join rl as r on r.rule_code =
      'allocation_private_markets'
    measure: headroom
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: limit_pct, say: "Room under the {limit_pct}% private markets budget is {currency} {headroom}: {committed} committed of {budget}"}
      - {once: true, say: "The policy sets no private markets budget, so there is no room to compute"}
    columns:
      currency: 'USD: the reporting currency of the office; every amount is converted to it.'
      conversion_gaps: 'How many amounts have no fixing to convert them; not zero means the budget figures are empty.'
      net_worth: What the family holds at the latest position date.
      limit_pct: 'The private-markets limit of the signed policy, in percent of net worth.'
      budget: Net worth times the limit.
      committed: 'Everything committed to private funds, called or not.'
      headroom: Budget less committed. Negative means the budget is exceeded.
    tie_out:
      label: Committed equals the commitments of the register, in USD
      sql: >-
        select (select coalesce(sum(committed), 0) from {name}), (select coalesce(sum(case when x.currency = 'USD' then x.commitment_amount else
        x.commitment_amount / (select f.rate from (select o.quote_currency as c, o.value as rate, cast(o.observed_at as date) as d from market_observations as
        o where o.observation_type = 'fx_fixing' and o.base_currency = 'USD') as f where f.c = x.currency and f.d <= (select max(called_as_at) from
        commitments) order by f.d desc limit 1) end), 0) from commitments as x where not exists (select 1 from commitments as y where
        y.supersedes_commitment_id = x.id) and exists (select 1 from {name}))
    needs:
      - why: 'No private-markets limit is signed in the allocation policy, so there is no budget to compute and none is guessed.'
        sql: >-
          select count(*) from business_rules as b join rule_versions as v on v.business_rule_id = b.id where b.rule_code = 'allocation_private_markets' and
          v.approval_status = 'approved'


  - id: ddq_compare
    label: Manager questionnaire comparison
    cards: [35, 40]
    names: [ddq compare, questionnaire comparison, compare managers questionnaires, compare manager questionnaires, answers side by side]
    may_read: [extracted_fields, documents, instruments]
    never_read: [commitments, cash_movements, transactions]
    why: >-
      A questionnaire answer is a fact read from a document; it is compared with the same manager's earlier answer, never with a number from the books.
    formula: >-
      The answers to the same question from each manager questionnaire (a document of type ddq; its fields named 'ddq: <question>', the manager in its
      manager_name field), matched by topic, side by side by manager and date. changed = 1 when the answer differs from the same manager's previous
      questionnaire. A topic the manager did not answer, or answered 'to follow', shows as a gap (open_item = 1). A questionnaire another one supersedes is
      out.
    grain: By manager, topic and questionnaire
    sql: >-
      create table {name} as with q as (select d.id as doc_id, d.title, d.document_date, m.value_text as manager from documents as d join extracted_fields
      as m on m.document_id = d.id and m.field_name = 'manager_name' where d.document_type = 'ddq' and not exists (select 1 from documents as s where
      s.supersedes_document_id = d.id)), a as (select f.document_id as doc_id, substr(f.field_name, 6) as topic, coalesce(f.corrected_value_text,
      f.value_text) as answer, f.page_number from extracted_fields as f where f.field_name like 'ddq:%' and f.review_status not in ('rejected', 'held')), t as (select
      distinct q.manager, a.topic from q join a on a.doc_id = q.doc_id), j as (select g.manager, t.topic, g.title as questionnaire, g.document_date as
      answered_on, a.answer, a.page_number as page, lag(a.answer) over (partition by g.manager, t.topic order by g.document_date) as previous_answer,
      lag(g.document_date) over (partition by g.manager, t.topic order by g.document_date) as previous_on from q as g join t on t.manager = g.manager left
      join a on a.doc_id = g.doc_id and a.topic = t.topic) select manager, topic, questionnaire, answered_on, answer, page, previous_answer, cast(case when
      previous_on is not null and answer is distinct from previous_answer then 1 else 0 end as integer) as changed, cast(case when answer is null or
      lower(answer) like '%to follow%' then 1 else 0 end as integer) as open_item from j
    measure: changed
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: changed, lead: "Changed:", say: "{topic} from {previous_answer} to {answer}", max: 6}
    columns:
      answer: 'The manager''s answer in this questionnaire, as read from the document.'
      previous_answer: 'The same manager''s answer in the questionnaire before this one.'
      changed: '1 when the answer differs from the previous questionnaire''s.'
      open_item: '1 when the answer is missing or ''to follow''.'
    tie_out:
      label: Every answer read from a questionnaire appears once
      sql: >-
        select (select count(*) from {name} where answer is not null), (select count(*) from extracted_fields as f join documents as d on d.id = f.document_id
        where d.document_type = 'ddq' and f.field_name like 'ddq:%' and f.review_status not in ('rejected', 'held') and not exists (select 1 from documents as s where
        s.supersedes_document_id = d.id))


  - id: fund_irr_tvpi
    label: Fund IRR and TVPI
    cards: [39, 40]
    names: [fund irr, irr and tvpi, tvpi, private fund return since inception, irr tvpi dpi, return of each private fund, irr, dpi, earned their place, stop adding to]
    may_read: [cash_movements, valuation_observations, commitments, instruments, legal_entities, extracted_fields]
    never_read: [position_snapshots, transactions]
    why: >-
      The return of a private fund is made of the dated calls, the dated distributions and the manager's values, not of market prices.
    formula: >-
      For each private fund, from its first value on file (the opening value, paid in on that date) to the register date: the confirmed calls and fees
      (out), the confirmed distributions (in) and the latest value (in, at the register date). IRR = the annual rate that makes these dated flows sum to
      zero (actual days over 365, found by bisection), in percent. called = what has been paid (the register's called_to_date plus later confirmed calls; a
      noticed call is not paid yet). TVPI = (distributions + latest value) / called, DPI = distributions / called, RVPI = latest value / called. history_gap = the cumulative called the latest statement states less what the opening statement states plus the calls on file; when it is not zero, or a distribution is noticed whose due date has passed and no bank credit has confirmed it (distributions_not_received), irr_status is 'incomplete' and the IRR is not to be relied on. The IRR runs from the first value on file, not from the date the office invested. A movement counts for the commitment that replaced the one it was posted to (a notice posted to a stub before the register arrived), else for the fund's only commitment. A confirmed bank payment to the fund that no confirmed call records is a paid call (the bank shows the call was paid when the notice was never matched). A shadow commitment row (no register source, no called figure, no call movement, in a fund whose other rows in the same currency state a called figure) is left out, as in commitments_by_fund.
    grain: By fund
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where
      y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))), ch(id, cur) as (select id, id from cm union all select y.supersedes_commitment_id, ch.cur from ch join commitments as y on y.id = ch.id
      where y.supersedes_commitment_id is not null), one as (select instrument_id, any_value(id) as cid from cm group by instrument_id having count(*) = 1),
      mm as (select m.*, coalesce((select max(ch.cur) from ch where ch.id = m.commitment_id), (select o.cid from one as o where o.instrument_id = m.instrument_id)) as cid
      from cmv as m where (m.notice_kind = 'capital_call' or m.movement_type in ('distribution', 'payment')) and not exists (select 1 from cmv as z
      where z.supersedes_cash_movement_id = m.id)), pc as (select m.* from mm as m where m.cid is not null and m.confirmation_status = 'confirmed' and ((m.notice_kind =
      'capital_call' and m.movement_type in ('call', 'fee')) or (m.movement_type = 'payment' and m.amount < 0 and not exists (select 1 from mm as k where k.instrument_id =
      m.instrument_id and k.notice_kind = 'capital_call' and k.confirmation_status = 'confirmed' and k.amount = m.amount and k.effective_date = m.effective_date)))),
      mv as (select c.id as commitment_id, (select sum(-m.amount) from mm as m where m.cid = c.id and m.notice_kind = 'capital_call' and m.confirmation_status = 'noticed'
      and (c.called_to_date is null or cast(m.received_at as date) >= c.called_as_at)) as noticed, (select sum(-p.amount) from pc as p where p.cid = c.id) as confirmed_all,
      (select sum(-p.amount) from pc as p where p.cid = c.id and cast(p.received_at as date) >= c.called_as_at) as confirmed_after from cm as c), cu as (select c.*, case when c.called_to_date is null then coalesce(v.confirmed_all,
      0) else c.called_to_date + coalesce(v.confirmed_after, 0) end as paid, coalesce(v.noticed, 0) as noticed from cm as c left join mv as v on
      v.commitment_id = c.id), reg as (select coalesce(max(called_as_at), current_date) as d from cm), vo as (select v.* from valuation_observations as v
      where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = v.id) and cast(v.received_at as date) <= (select d from
      reg)), se as (select c.id as cid, c.instrument_id, (select min(v.valuation_date) from vo as v where v.instrument_id = c.instrument_id) as start_d,
      (select max(v.valuation_date) from vo as v where v.instrument_id = c.instrument_id) as end_d from cu as c), v0 as (select s.cid, max(v.value_amount)
      as val, max(v.evidence_document_id) as doc from se as s join vo as v on v.instrument_id = s.instrument_id and v.valuation_date = s.start_d group by
      s.cid), v1 as (select s.cid, max(v.value_amount) as val, max(v.evidence_document_id) as doc, max(v.valuation_type) as vtype from se as s join vo as v
      on v.instrument_id = s.instrument_id and v.valuation_date = s.end_d group by s.cid), mf as (select s.cid, case when m.movement_type = 'payment' then 'call' else m.movement_type end as movement_type, m.effective_date, m.amount
      from se as s join (select * from pc union all select * from mm where movement_type = 'distribution' and confirmation_status = 'confirmed') as m on m.cid = s.cid
      where m.effective_date > s.start_d and m.effective_date <= (select d from reg)), fl as (select cid, cast(0 as double) as d, -val as c from v0 union all select s.cid,
      cast((select d from reg) - s.start_d as double), v1.val from se as s join v1 on v1.cid = s.cid union all select m.cid, cast(m.effective_date -
      s.start_d as double), m.amount from mf as m join se as s on s.cid = m.cid), b(cid, lo, hi, n) as (select distinct cid, cast(-0.99 as double),
      cast(10.0 as double), 0 from fl union all select s.cid, case when s.flo * s.fmid <= 0 then s.lo else s.mid end, case when s.flo * s.fmid <= 0 then
      s.mid else s.hi end, s.n + 1 from (select t.*, (select sum(c / power(1 + t.lo, d / 365.0)) from fl where fl.cid = t.cid) as flo, (select sum(c /
      power(1 + t.mid, d / 365.0)) from fl where fl.cid = t.cid) as fmid from (select cid, lo, hi, n, (lo + hi) / 2 as mid from b where n < 60) as t) as s),
      irr as (select cid, (lo + hi) / 2 as r from b where n = 60 and (select sum(c / power(0.01, d / 365.0)) from fl where fl.cid = b.cid) * (select sum(c /
      power(11.0, d / 365.0)) from fl where fl.cid = b.cid) <= 0), dist as (select cid, coalesce(sum(amount) filter (where movement_type = 'distribution'), 0) as dist from mf group by cid), dn as (select m.cid, count(*) as n from mm as m where m.movement_type = 'distribution' and m.confirmation_status = 'noticed' and m.cid is not null and m.effective_date <= (select d from reg) and not exists (select 1 from mm as b where b.cid = m.cid and b.movement_type = 'distribution' and b.notice_kind is null and b.confirmation_status = 'confirmed' and b.effective_date = m.effective_date) group by m.cid), cum as (select s.cid, (select max(f.value_numeric) from extracted_fields as f where f.document_id = v0.doc and
      f.field_name = 'cumulative_called') as c0, (select max(f.value_numeric) from extracted_fields as f where f.document_id = v1.doc and f.field_name =
      'cumulative_called') as c1, (select coalesce(sum(-m.amount), 0) from mf as m where m.cid = s.cid and m.movement_type <> 'distribution' and
      m.effective_date <= s.end_d) as calls_to_end from se as s join v0 on v0.cid = s.cid join v1 on v1.cid = s.cid) select e.entity_name as entity,
      i.canonical_name as fund, c.currency, s.start_d as first_value_on, s.end_d as latest_period, (select d from reg) as as_at, cast(v0.val as
      decimal(18,2)) as opening_value, cast(v1.val as decimal(18,2)) as latest_value, case v1.vtype when 'manager_estimate' then 'estimate' when
      'manager_amended' then 'amended' else 'final' end as latest_status, cast(c.paid as decimal(18,2)) as called, cast(coalesce(d.dist, 0) as
      decimal(18,2)) as distributions, cast(round(100 * r.r, 2) as decimal(9,2)) as irr_pct, cast(round((coalesce(d.dist, 0) + v1.val) / nullif(c.paid, 0),
      4) as decimal(9,4)) as tvpi, cast(round(coalesce(d.dist, 0) / nullif(c.paid, 0), 4) as decimal(9,4)) as dpi, cast(round(v1.val / nullif(c.paid, 0), 4)
      as decimal(9,4)) as rvpi, cast(u.c1 - (u.c0 + u.calls_to_end) as decimal(18,2)) as history_gap, cast(coalesce(n.n, 0) as integer) as distributions_not_received, case when r.r is null or coalesce(abs(u.c1 - (u.c0 + u.calls_to_end)), 0) > 0.005 or coalesce(n.n, 0) > 0 then 'incomplete' else 'ok' end as irr_status from cu as c join se as s on s.cid = c.id join v0 on v0.cid = c.id join v1
      on v1.cid = c.id join cum as u on u.cid = c.id join instruments as i on i.id = c.instrument_id left join legal_entities as e on e.id =
      c.legal_entity_id left join irr as r on r.cid = c.id left join dist as d on d.cid = c.id left join dn as n on n.cid = c.id
    measure: tvpi
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {sort: irr_pct, lead: "IRR and TVPI:", say: "{fund} {irr_pct}% ({tvpi}x)", max: 8}
    columns:
      distributions_not_received: 'Distributions noticed, due by the register date and not confirmed by a bank credit. Not zero means the distributions are incomplete.'
      opening_value: 'The manager''s value on the first date on file, treated as paid in on that date.'
      latest_value: 'The manager''s latest value that nothing replaces, at its period end.'
      called: Capital paid in to date (a noticed call is not counted).
      distributions: Distributions received (confirmed) after the first value.
      irr_pct: 'Annualised internal rate of return since the first value, in percent.'
      tvpi: (Distributions + latest value) / called.
      dpi: Distributions / called.
      rvpi: Latest value / called.
      history_gap: 'Cumulative called on the latest statement less the opening statement''s plus the calls on file. Not zero means a call is missing or extra.'
      irr_status: 'ok, or incomplete when the call history does not add up or no rate exists.'
    tie_out:
      label: 'Called equals the commitments register''s called figure for the same funds (nothing confirmed after the register date)'
      sql: >-
        select (select coalesce(sum(called), 0) from {name}), (select coalesce(sum(x.called_to_date), 0) from commitments as x where not exists (select 1 from
        commitments as y where y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cash_movements as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null)))


  - id: fee_drag
    label: Fees paid to each manager
    cards: [49]
    names: [fee drag, fees paid, fees paid to each manager, management fees, fees as share of gain, fee share of gain, share of gain, fee share]
    may_read: [cash_movements, commitments, extracted_fields, documents, valuation_observations, instruments]
    never_read: [position_snapshots, transactions]
    why: >-
      Fees are the fee parts the managers billed in their calls, set against the gain their funds made. They are not market costs.
    formula: >-
      Per manager, over the window from each fund's first value to the register date: fees_paid = the confirmed fee movements of the manager's funds; gross
      gain = net gain + fees, net gain = latest value - opening value - calls paid (call and fee parts) + distributions; fee_drag_pct = fees_paid / gross
      gain in percent, left empty when the gross gain is not positive. expected_fees = for each fee row, the commitment times the fund's management_fee_rate (the latest fund terms document, only when its fee_basis is the commitment; a fraction per billing); fees_above_terms = what the fee rows exceed that. A fee row of a fund with no such terms on record is counted in fee_rows_without_terms and then expected_fees and fees_above_terms are empty, never zero.
    grain: By manager and currency
    sql: >-
      create table {name} as with cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id
      = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cash_movements as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))), mv as (select m.commitment_id, sum(-m.amount) filter (where m.confirmation_status = 'noticed' and (c.called_to_date is null or cast(m.received_at as date) >= c.called_as_at)) as noticed, sum(-m.amount) filter (where
      m.confirmation_status = 'confirmed') as confirmed_all, sum(-m.amount) filter (where m.confirmation_status = 'confirmed' and cast(m.received_at as date) >= c.called_as_at) as confirmed_after from cash_movements as m join cm as c on c.id = m.commitment_id where m.notice_kind = 'capital_call' and
      m.movement_type in ('call', 'fee') and not exists (select 1 from cash_movements as z where z.supersedes_cash_movement_id = m.id) group by
      m.commitment_id), cu as (select c.*, case when c.called_to_date is null then coalesce(v.confirmed_all, 0) else c.called_to_date +
      coalesce(v.confirmed_after, 0) end as paid, coalesce(v.noticed, 0) as noticed from cm as c left join mv as v on v.commitment_id = c.id), reg as
      (select coalesce(max(called_as_at), current_date) as d from cm), vo as (select v.* from valuation_observations as v where not exists (select 1 from
      valuation_observations as x where x.supersedes_valuation_id = v.id) and cast(v.received_at as date) <= (select d from reg)), se as (select c.id as
      cid, c.instrument_id, (select min(v.valuation_date) from vo as v where v.instrument_id = c.instrument_id) as start_d, (select max(v.valuation_date)
      from vo as v where v.instrument_id = c.instrument_id) as end_d from cu as c), v0 as (select s.cid, max(v.value_amount) as val,
      max(v.evidence_document_id) as doc from se as s join vo as v on v.instrument_id = s.instrument_id and v.valuation_date = s.start_d group by s.cid), v1
      as (select s.cid, max(v.value_amount) as val, max(v.evidence_document_id) as doc, max(v.valuation_type) as vtype from se as s join vo as v on
      v.instrument_id = s.instrument_id and v.valuation_date = s.end_d group by s.cid), mf as (select s.cid, m.movement_type, m.effective_date, m.amount
      from se as s join cash_movements as m on m.commitment_id = s.cid where m.confirmation_status = 'confirmed' and (m.movement_type = 'distribution' or
      m.notice_kind = 'capital_call') and m.effective_date > s.start_d and m.effective_date <= (select d from reg) and not exists (select 1 from
      cash_movements as z where z.supersedes_cash_movement_id = m.id)), rate as (select t.instrument_id, t.r from (select d.instrument_id, f.value_numeric as r, row_number() over (partition by d.instrument_id order by d.document_date desc, d.received_at desc) as rn from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'management_fee_rate' join extracted_fields as b on b.document_id = d.id and b.field_name = 'fee_basis' and b.value_text like 'commitment%' where d.document_type = 'fund_terms' and not exists (select 1 from documents as s where s.supersedes_document_id = d.id)) as t where t.rn = 1),
      fp as (select m.commitment_id as cid, -cast(f.value_numeric as decimal(18,2)) as amount from cash_movements as m join se as s on s.cid = m.commitment_id left join cash_movements as z on z.id = m.supersedes_cash_movement_id join documents as nd on nd.source_record_id = coalesce(z.source_record_id, m.source_record_id) and nd.document_type = 'capital_call_notice' and not exists (select 1 from documents as s2 where s2.supersedes_document_id = nd.id) join extracted_fields as f on f.document_id = nd.id and f.field_name = 'management_fee' where m.notice_kind = 'capital_call' and m.movement_type = 'call' and m.confirmation_status = 'confirmed' and not exists (select 1 from cash_movements as y where y.supersedes_cash_movement_id = m.id) and m.effective_date > s.start_d and m.effective_date <= (select d from reg)), fr as (select c.id as cid, i.manager_name, c.currency, c.commitment_amount, r.r, fp.amount from cu as c join instruments as i on i.id = c.instrument_id join fp on fp.cid = c.id left join rate as r on r.instrument_id = c.instrument_id), ff as
      (select cid, manager_name, currency, sum(-amount) as fees, sum(commitment_amount * r) as expected, sum(greatest(-amount - commitment_amount * r, 0)) as above, count(*) filter (where r is null) as no_terms from fr group by all), fc as (select cid, coalesce(sum(-amount), 0) as calls from mf where movement_type <> 'distribution' group by cid), fd
      as (select cid, coalesce(sum(amount), 0) as dist from mf where movement_type = 'distribution' group by cid), pf as (select i.manager_name, c.currency,
      coalesce(f.fees, 0) as fees, coalesce(f.expected, 0) as expected, coalesce(f.above, 0) as above, coalesce(f.no_terms, 0) as no_terms, v1.val - v0.val - coalesce(k.calls, 0) +
      coalesce(d.dist, 0) as net from cu as c join instruments as i on i.id = c.instrument_id join v0 on v0.cid = c.id join v1 on v1.cid = c.id left join ff
      as f on f.cid = c.id left join fc as k on k.cid = c.id left join fd as d on d.cid = c.id) select manager_name as manager, currency, count(*) as funds,
      cast(sum(fees) as decimal(18,2)) as fees_paid, cast(case when sum(no_terms) = 0 then sum(expected) end as decimal(18,2)) as expected_fees, cast(case when sum(no_terms) = 0 then sum(above) end as decimal(18,2)) as fees_above_terms, cast(sum(no_terms) as integer) as fee_rows_without_terms, cast(sum(net) as decimal(18,2)) as net_gain, cast(sum(net + fees) as decimal(18,2)) as gross_gain, cast(case when sum(net + fees) >
      0 then round(100 * sum(fees) / sum(net + fees), 2) end as decimal(9,2)) as fee_drag_pct, case when sum(fees) = 0 then 'no fees paid' when sum(net + fees) > 0 then 'fees are ' || round(100 * sum(fees) / sum(net + fees), 2) || ' percent of the gross gain' else 'the share of gain is not stated: the gross gain is not positive' end as fee_drag_text from pf group by all
    measure: fees_paid
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {sort: fees_paid, say: "{manager} fees {fees_paid} ({fees_above_terms} above terms), net gain {net_gain}", max: 4}
    columns:
      fee_rows_without_terms: 'Fee rows of funds whose fee terms are not on record. Not zero means the terms test cannot be made for the manager.'
      fee_drag_text: 'The share of gain in words, or why it is not stated.'
      funds: How many funds of the manager the office holds.
      fees_paid: Fee parts of the calls paid to the manager in the window.
      expected_fees: 'What the fund terms say those fees should have been (commitment times the fee rate, per fee row).'
      fees_above_terms: The part of the fees above the terms. Zero when every fee matches.
      net_gain: 'Latest value less opening value, less calls paid, plus distributions.'
      gross_gain: Net gain plus the fees.
      fee_drag_pct: 'Fees as a share of the gross gain, in percent. Empty when the gross gain is not positive.'
    tie_out:
      label: The fees paid equal the fee movements confirmed in the window
      sql: >-
        select (select coalesce(sum(fees_paid), 0) from {name}), (select coalesce(sum(f.value_numeric), 0) from cash_movements as m join commitments as c on c.id = m.commitment_id left join cash_movements as z on z.id = m.supersedes_cash_movement_id join documents as nd on nd.source_record_id = coalesce(z.source_record_id, m.source_record_id) and nd.document_type = 'capital_call_notice' and not exists (select 1 from documents as s2 where s2.supersedes_document_id = nd.id) join extracted_fields as f on f.document_id = nd.id and f.field_name = 'management_fee' where m.notice_kind = 'capital_call' and m.movement_type = 'call' and m.confirmation_status = 'confirmed' and not exists (select 1 from cash_movements as y where y.supersedes_cash_movement_id = m.id) and not exists (select 1 from commitments as y where y.supersedes_commitment_id = c.id) and m.effective_date > (select min(v.valuation_date) from valuation_observations as v where v.instrument_id = c.instrument_id) and m.effective_date <= (select coalesce(max(called_as_at), current_date) from commitments))


  - id: manager_timeline
    label: Manager timeline since the last meeting
    cards: [25, 35]
    names: [manager timeline, what changed at the manager, changes since the last meeting, since we last met]
    may_read: [valuation_observations, documents, extracted_fields, instruments]
    never_read: [commitments, cash_movements, transactions]
    why: >-
      What changed at a manager is what it sent after the date of the last meeting with it: its statements, restatements and letters. Nothing else.
    formula: >-
      For each manager with a recorded meeting (a document with fields counterparty and meeting_date), the items dated after its last meeting, newest first:
      every valuation of its funds received after that date (final, estimate or amended; restated_from is the value an amended one replaces) and every
      newsletter with its team change. Each item names its source document.
    grain: By manager and item, newest first
    sql: >-
      create table {name} as with mtg as (select f.value_text as manager, max(cast(d.value_text as date)) as last_meeting from extracted_fields as f join
      extracted_fields as d on d.document_id = f.document_id and d.field_name = 'meeting_date' where f.field_name = 'counterparty' group by f.value_text),
      st as (select m.manager, m.last_meeting, cast(v.received_at as date) as item_date, 'statement' as item_kind, i.canonical_name as fund,
      v.valuation_date as period, case v.valuation_type when 'manager_estimate' then 'estimate' when 'manager_amended' then 'amended' else 'final' end as
      status_kind, v.value_amount as value, v.currency, p.value_amount as restated_from, cast(null as varchar) as detail, d.title as source, (select cast(max(w.received_at) as date) from valuation_observations as w where w.supersedes_valuation_id = v.id) as replaced_on from
      valuation_observations as v join instruments as i on i.id = v.instrument_id join mtg as m on m.manager = i.manager_name left join
      valuation_observations as p on p.id = v.supersedes_valuation_id left join documents as d on d.id = v.evidence_document_id where cast(v.received_at as
      date) > m.last_meeting), nl as (select m.manager, m.last_meeting, d.document_date as item_date, 'newsletter' as item_kind, cast(null as varchar) as
      fund, cast(null as date) as period, 'team change' as status_kind, cast(null as decimal(28,8)) as value, cast(null as varchar) as currency, cast(null as decimal(28,8)) as restated_from, t.value_text as detail, d.title as source, cast(null as date) as replaced_on from documents as d join extracted_fields as c on c.document_id = d.id
      and c.field_name = 'counterparty' join mtg as m on m.manager = c.value_text left join extracted_fields as t on t.document_id = d.id and t.field_name =
      'team_change' where d.document_type = 'newsletter' and d.document_date > m.last_meeting) select * from st union all select * from nl
    measure: value
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: restated_from, stop: true, say: "{fund} value for {period} restated from {restated_from} to {value} on {item_date}"}
      - {sort: value, lead: "Since the last meeting on {last_meeting}:", say: "{fund} {status_kind} value {value} on {item_date}"}
    columns:
      replaced_on: 'For a statement that a later one replaces, the date of the replacement; empty otherwise. It stays in the list because it did arrive.'
      last_meeting: The date of the last recorded meeting with the manager.
      item_date: 'The date the item arrived (a statement''s issue date, a letter''s date).'
      status_kind: 'estimate, final or amended for a statement; team change for a newsletter.'
      value: The value the statement states.
      restated_from: 'For an amended statement, the value it replaces.'
      source: The document the item comes from.
    tie_out:
      label: Every valuation received after the last meeting appears as a statement item
      sql: >-
        select (select count(*) from {name} where item_kind = 'statement'), (select count(*) from valuation_observations as v join instruments as i on i.id =
        v.instrument_id join (select f.value_text as manager, max(cast(d.value_text as date)) as last_meeting from extracted_fields as f join extracted_fields
        as d on d.document_id = f.document_id and d.field_name = 'meeting_date' where f.field_name = 'counterparty' group by f.value_text) as m on m.manager =
        i.manager_name where cast(v.received_at as date) > m.last_meeting)


  - id: mandate_fit
    label: Mandate fit of a fund under review
    cards: [34]
    names: [mandate fit, fit against the mandate, fit against class size and liquidity limits, screen a new fund, minimum ticket, minimum ticket vs policy limit, ticket against policy limit]
    words_all: [[mandate], [fit, fits, fitting, suit, suits]]  # r6 uc-034: "does the Harborlight fund fit our mandate"
    may_read: [deal_pipeline, commitments, cash_movements, instruments, business_rules, rule_versions, position_snapshots, market_observations]
    never_read: [transactions]
    why: >-
      A fund under review is judged on its ticket against the limits the policy signs and the room left, never on a limit the office has not set.
    formula: >-
      For each deal in the pipeline that nothing supersedes (its ticket is target_commitment): uncalled_before = the unfunded of all commitments (as
      commitments_by_fund counts them), uncalled_after = that plus the ticket, ticket_pct_of_uncalled = ticket / uncalled_before. All of it in USD: other
      currencies are converted at the latest fx_fixing (units per USD) on or before the register date; with no fixing the amounts are empty (conversion_gaps
      counts them). The private-markets limit and the limit of its asset class are the max_pct of the latest approved version in force of the rules
      allocation_private_markets and allocation_<asset_class> times net worth (USD, latest position date); a limit that is not signed shows as empty and its
      status as 'not set'; a signed limit that cannot be computed shows 'not stated'.
    grain: By deal
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), {positions}, cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where
      y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))), mv as (select m.commitment_id, sum(-m.amount) filter (where m.confirmation_status = 'noticed' and
      (c.called_to_date is null or cast(m.received_at as date) >= c.called_as_at)) as noticed, sum(-m.amount) filter (where m.confirmation_status =
      'confirmed') as confirmed_all, sum(-m.amount) filter (where m.confirmation_status = 'confirmed' and cast(m.received_at as date) >= c.called_as_at) as
      confirmed_after from cmv as m join cm as c on c.id = m.commitment_id where m.notice_kind = 'capital_call' and m.movement_type in ('call',
      'fee') and not exists (select 1 from cmv as z where z.supersedes_cash_movement_id = m.id) group by m.commitment_id), cu as (select c.*,
      case when c.called_to_date is null then coalesce(v.confirmed_all, 0) else c.called_to_date + coalesce(v.confirmed_after, 0) end as paid,
      coalesce(v.noticed, 0) as noticed from cm as c left join mv as v on v.commitment_id = c.id), reg as (select coalesce(max(called_as_at), current_date)
      as d from cm), rl as (select b.rule_code, v.id as rule_version_id, cast(json_extract_string(v.parameters, '$.max_pct') as double) as max_pct from
      business_rules as b join rule_versions as v on v.business_rule_id = b.id where v.approval_status = 'approved' and v.effective_from <= (select d from
      reg) and (v.effective_to is null or v.effective_to > (select d from reg)) qualify row_number() over (partition by b.rule_code order by
      v.effective_from desc, v.version_number desc) = 1), fxo as (select o.quote_currency as currency, o.value as rate, cast(o.observed_at as date) as d
      from market_observations as o where o.observation_type = 'fx_fixing' and o.base_currency = 'USD' and not exists (select 1 from market_observations as
      z where z.supersedes_observation_id = o.id)), nw as (select sum(case when p.currency = 'USD' then p.source_market_value else (p.source_market_value) /
      (select f.rate from fxo as f where f.currency = p.currency and f.d <= p.position_date order by f.d desc limit 1) end) as net_worth, count(*) filter
      (where (p.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = p.currency and f.d <= p.position_date))) as gaps from positions
      as p where p.position_date = (select max(q.position_date) from positions as q)), cu2 as (select c.*, i.asset_class, i.manager_name, case when
      c.currency = 'USD' then c.commitment_amount else (c.commitment_amount) / (select f.rate from fxo as f where f.currency = c.currency and f.d <= (select
      d from reg) order by f.d desc limit 1) end as cmt_usd, case when c.currency = 'USD' then c.commitment_amount - c.paid - c.noticed else
      (c.commitment_amount - c.paid - c.noticed) / (select f.rate from fxo as f where f.currency = c.currency and f.d <= (select d from reg) order by f.d
      desc limit 1) end as unf_usd, (c.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = c.currency and f.d <= (select d from
      reg))) as gap from cu as c join instruments as i on i.id = c.instrument_id), tot as (select sum(unf_usd) as uncalled, sum(cmt_usd) as committed,
      count(*) filter (where gap) as gaps from cu2), cls as (select asset_class, sum(cmt_usd) as committed, count(*) filter (where gap) as gaps from cu2
      group by asset_class), dl as (select x.* from deal_pipeline as x where not exists (select 1 from deal_pipeline as y where y.supersedes_deal_id =
      x.id)), x as (select l.deal_name, l.manager_name, l.strategy, l.asset_class, l.stage, l.currency, l.target_commitment as ticket, case when l.currency
      = 'USD' then l.target_commitment else (l.target_commitment) / (select f.rate from fxo as f where f.currency = l.currency and f.d <= (select d from
      reg) order by f.d desc limit 1) end as ticket_usd, cast((l.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = l.currency and
      f.d <= (select d from reg))) as integer) as tgap, t.uncalled, t.committed, t.gaps, (select r.max_pct from rl as r where r.rule_code =
      'allocation_private_markets') as pm_pct, (select r.max_pct from rl as r where r.rule_code = 'allocation_' || l.asset_class) as class_pct, w.net_worth,
      w.gaps as nwgaps, coalesce(k.committed, 0) as class_committed, coalesce(k.gaps, 0) as kgaps, (select count(*) from cu2 as c where c.manager_name =
      l.manager_name) as held from dl as l cross join tot as t cross join nw as w left join cls as k on k.asset_class = l.asset_class), y as (select x.*,
      cast(case when pm_pct is not null and nwgaps = 0 and gaps = 0 and tgap = 0 then net_worth * pm_pct / 100 - committed - ticket_usd end as
      decimal(18,2)) as budget_room_after, cast(case when class_pct is not null and nwgaps = 0 and gaps = 0 and kgaps = 0 and tgap = 0 then net_worth *
      class_pct / 100 - class_committed - ticket_usd end as decimal(18,2)) as class_room_after from x) select deal_name, manager_name as manager, strategy,
      asset_class, stage, currency, cast(ticket as decimal(18,2)) as ticket, cast(case when gaps = 0 then uncalled end as decimal(18,2)) as uncalled_before,
      cast(case when (gaps = 0 and tgap = 0) then uncalled + ticket_usd end as decimal(18,2)) as uncalled_after, cast(case when (gaps = 0 and tgap = 0) then
      round(100 * ticket_usd / nullif(uncalled, 0), 2) end as decimal(9,2)) as ticket_pct_of_uncalled, cast(case when held > 0 then 1 else 0 end as integer)
      as manager_held, pm_pct as private_markets_limit_pct, budget_room_after, case when pm_pct is null then 'not set' when budget_room_after is null then
      'not stated' when budget_room_after >= 0 then 'within' else 'over' end as budget_status, class_pct as class_limit_pct, class_room_after, case when
      class_pct is null then 'not set' when class_room_after is null then 'not stated' when class_room_after >= 0 then 'within' else 'over' end as
      class_status, gaps + tgap as conversion_gaps from y
    measure: ticket
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {all: true, say: "{deal_name}: the {currency} {ticket} ticket is {ticket_pct_of_uncalled}% of the {uncalled_before} uncalled, taking it to {uncalled_after}; budget {budget_status}"}  # r6 uc-034: the ticket, the uncalled before and after, never a plain read of the ticket alone
    columns:
      conversion_gaps: 'How many amounts have no fixing to convert them to USD; not zero means the figures that need them are empty.'
      ticket: 'The commitment the office would make (the deal''s target commitment).'
      uncalled_before: 'What the office can still be called for across all its funds, before this ticket.'
      uncalled_after: The same with this ticket added.
      ticket_pct_of_uncalled: 'The ticket as a share of the current uncalled commitments, in percent.'
      manager_held: '1 when the office already holds a fund of this manager, 0 when the manager is new to it.'
      budget_room_after: Private-markets budget less all commitments less this ticket. Empty when no budget is signed.
      budget_status: 'within, over, or ''not set'' when the policy signs no private-markets limit.'
      class_room_after: 'The asset class''s limit less its commitments less this ticket. Empty when the class has no signed limit.'
      class_status: 'within, over, or ''not set'' when the class has no signed limit.'
    tie_out:
      label: The tickets equal the target commitments of the deals nothing supersedes
      sql: >-
        select (select coalesce(sum(ticket), 0) from {name}), (select coalesce(sum(x.target_commitment), 0) from deal_pipeline as x where not exists (select 1
        from deal_pipeline as y where y.supersedes_deal_id = x.id))


  - id: memo_support
    label: Figures cited in an investment committee memo
    cards: [40]
    names: [memo support, figures cited in the memo, figures in the committee memo, investment committee memo figures, latest call fee, fee in the latest call, fee in latest call]
    may_read: [commitments, cash_movements, valuation_observations, documents, extracted_fields, instruments]
    never_read: [transactions, position_snapshots]
    why: >-
      A memo may cite only a figure that traces to a file; each line names its source, and a line with no source is shown as untraced.
    formula: >-
      For each fund the memo may cite: the commitment, the capital called (a noticed call included), the unfunded, the latest value (with its status and
      period, from the statement), the fee part of the latest call notice, and the number of answers that changed between the manager's last two
      questionnaires. Each line carries its source (the document or the register record) and traced = 1 when it has one.
    grain: By fund and figure
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id
      = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))), mv as (select m.commitment_id, sum(-m.amount) filter (where m.confirmation_status = 'noticed' and (c.called_to_date is null or cast(m.received_at as date) >= c.called_as_at)) as noticed, sum(-m.amount) filter (where
      m.confirmation_status = 'confirmed') as confirmed_all, sum(-m.amount) filter (where m.confirmation_status = 'confirmed' and cast(m.received_at as date) >= c.called_as_at) as confirmed_after from cmv as m join cm as c on c.id = m.commitment_id where m.notice_kind = 'capital_call' and
      m.movement_type in ('call', 'fee') and not exists (select 1 from cmv as z where z.supersedes_cash_movement_id = m.id) group by
      m.commitment_id), cu as (select c.*, case when c.called_to_date is null then coalesce(v.confirmed_all, 0) else c.called_to_date +
      coalesce(v.confirmed_after, 0) end as paid, coalesce(v.noticed, 0) as noticed from cm as c left join mv as v on v.commitment_id = c.id), lv as (select
      v.*, row_number() over (partition by v.instrument_id order by v.valuation_date desc, v.received_at desc) as rn from valuation_observations as v where
      not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = v.id)), lf as (select m.commitment_id, coalesce(f.value_numeric, 0) as fee, m.received_at, coalesce(z.source_record_id, m.source_record_id) as source_record_id, row_number() over (partition by m.commitment_id order by m.effective_date desc, m.received_at desc) as rn from cmv as m left join cmv as z on z.id = m.supersedes_cash_movement_id left join documents as nd on nd.source_record_id = coalesce(z.source_record_id, m.source_record_id) and nd.document_type = 'capital_call_notice' and not exists (select 1 from documents as s2 where s2.supersedes_document_id = nd.id) left join extracted_fields as f on f.document_id = nd.id and f.field_name = 'management_fee' where m.notice_kind = 'capital_call' and m.movement_type = 'call' and m.confirmation_status <> 'cancelled' and not exists (select 1 from cmv as y where y.supersedes_cash_movement_id = m.id)), dq as (select d.id as doc_id, d.title, d.document_date, m.value_text as manager
      from documents as d join extracted_fields as m on m.document_id = d.id and m.field_name = 'manager_name' where d.document_type = 'ddq' and not exists (select 1 from documents as s where s.supersedes_document_id = d.id)), da as (select
      q.manager, q.title, q.document_date, coalesce(f.corrected_value_text, f.value_text) as answer, lag(coalesce(f.corrected_value_text, f.value_text))
      over (partition by q.manager, f.field_name order by q.document_date) as prev from dq as q join extracted_fields as f on f.document_id = q.doc_id and
      f.field_name like 'ddq:%'), qd as (select manager, count(*) filter (where prev is not null and answer is distinct from prev) as n, max(title) as src
      from da where document_date = (select max(x.document_date) from dq as x where x.manager = da.manager) group by manager), rows_ as (select
      i.canonical_name as fund, c.currency, 'commitment' as figure, c.commitment_amount as value, cast(c.committed_on as date) as as_at, cast(null as
      varchar) as detail, 'register record ' || c.source_record_id as source, c.source_record_id is not null as traced from cu as c join instruments as i on
      i.id = c.instrument_id union all select i.canonical_name, c.currency, 'called', c.paid + c.noticed, c.called_as_at, 'register called_to_date plus
      calls logged since', 'register record ' || c.source_record_id, c.source_record_id is not null from cu as c join instruments as i on i.id =
      c.instrument_id union all select i.canonical_name, c.currency, 'unfunded', c.commitment_amount - c.paid - c.noticed, c.called_as_at, 'commitment less
      called', 'register record ' || c.source_record_id, c.source_record_id is not null from cu as c join instruments as i on i.id = c.instrument_id union
      all select i.canonical_name, v.currency, 'latest_value', v.value_amount, v.valuation_date, case v.valuation_type when 'manager_estimate' then
      'estimate' when 'manager_amended' then 'amended' else 'final' end, d.title, d.id is not null from lv as v join instruments as i on i.id =
      v.instrument_id left join documents as d on d.id = v.evidence_document_id where v.rn = 1 and exists (select 1 from cu as c where c.instrument_id =
      v.instrument_id) union all select i.canonical_name, c.currency, 'fee_in_call', f.fee, cast(f.received_at as date), 'fee part of the latest call
      notice', 'call notice record ' || f.source_record_id, f.source_record_id is not null from lf as f join cu as c on c.id = f.commitment_id join
      instruments as i on i.id = c.instrument_id where f.rn = 1 union all select i.canonical_name, cast(null as varchar), 'ddq_changes', q.n, cast(null as
      date), 'answers changed between the manager''s last two questionnaires', q.src, q.src is not null from qd as q join instruments as i on i.manager_name
      = q.manager where exists (select 1 from cu as c where c.instrument_id = i.id)) select fund, currency, figure, case figure when 'commitment' then 'commitment' when 'called' then 'capital called' when 'unfunded' then 'unfunded' when 'latest_value' then 'latest value' when 'fee_in_call' then 'fee in the latest call' when 'ddq_changes' then 'questionnaire answers changed' else figure end as figure_label, cast(value as decimal(18,2)) as value,
      as_at, detail, source, cast(traced as integer) as traced from rows_
    measure: value
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: "figure = fee_in_call and traced", all: true, lead: "Fee in the latest call:", say: "{fund} {value} {currency}"}  # r5 uc-040: the memo keeps the fee part of the latest call
      - {if: not traced, lead: "Not traced:", say: "{fund} {figure_label} {value}"}
      - {once: true, say: "{n} memo figures, {sum:traced} traced to a source"}
    columns:
      figure_label: 'The figure in plain words.'
      figure: 'commitment, called, unfunded, latest_value, fee_in_call or ddq_changes.'
      value: The figure.
      detail: 'How the figure is counted, or the status of the statement it comes from.'
      source: The document or record the figure comes from.
      traced: '1 when the figure has a source, 0 when it has none (to be struck out of the memo).'
    tie_out:
      label: Every fund of the register has its commitment line
      sql: >-
        with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id) select (select count(*) from {name} where figure = 'commitment'), (select count(*) from commitments as x where not exists (select 1 from commitments
        as y where y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null)))


  - id: commit_check
    label: Budget, limit and cash tests of a new commitment
    cards: [41]
    names: [commit check, budget limit and cash tests, can we commit, cash cover after the commitment, fit our budget limits and cash, budget limits and cash, can we commit it]
    may_read: [deal_pipeline, commitments, cash_movements, instruments, business_rules, rule_versions, position_snapshots, market_observations, bank_accounts]
    never_read: [transactions]
    why: >-
      A commitment is approved only when it fits the signed budget, the signed class limit and the cash the office will need for its calls; each test is
      shown, none is guessed.
    formula: >-
      For each deal in the pipeline that nothing supersedes and is not declined (its ticket is target_commitment), each on its own (the tickets
      are not added: the committee approves one deal at a time): uncalled_after = the unfunded of
      all commitments, in every currency, plus the ticket, all in USD (converted at the latest fx_fixing, units per USD, on or before the register date);
      cash_usd = the cash instruments' latest position snapshots, other currencies converted at the latest fixing on or before the cash date; need_24m =
      uncalled_after, on the stated basis that all uncalled commitments may be called within 24 months (assumption of the answer key; no signed pacing rule
      exists, so need_basis says so); cash_cover_pct = cash_usd / need_24m in percent, cash_status 'short' when cash is below the need, 'not stated' when a
      currency has no fixing. The budget and class tests are those of mandate_fit and read 'not set' when the policy signs no limit, 'not stated' when they
      cannot be computed. A shadow commitment row (no register source, no called figure, no call movement, in a fund whose other rows in the same currency state a called figure) is left out, as in commitments_by_fund.
    grain: By deal
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), {positions}, cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where
      y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))), mv as (select m.commitment_id, sum(-m.amount) filter (where m.confirmation_status = 'noticed' and
      (c.called_to_date is null or cast(m.received_at as date) >= c.called_as_at)) as noticed, sum(-m.amount) filter (where m.confirmation_status =
      'confirmed') as confirmed_all, sum(-m.amount) filter (where m.confirmation_status = 'confirmed' and cast(m.received_at as date) >= c.called_as_at) as
      confirmed_after from cmv as m join cm as c on c.id = m.commitment_id where m.notice_kind = 'capital_call' and m.movement_type in ('call',
      'fee') and not exists (select 1 from cmv as z where z.supersedes_cash_movement_id = m.id) group by m.commitment_id), cu as (select c.*,
      case when c.called_to_date is null then coalesce(v.confirmed_all, 0) else c.called_to_date + coalesce(v.confirmed_after, 0) end as paid,
      coalesce(v.noticed, 0) as noticed from cm as c left join mv as v on v.commitment_id = c.id), reg as (select coalesce(max(called_as_at), current_date)
      as d from cm), rl as (select b.rule_code, v.id as rule_version_id, cast(json_extract_string(v.parameters, '$.max_pct') as double) as max_pct from
      business_rules as b join rule_versions as v on v.business_rule_id = b.id where v.approval_status = 'approved' and v.effective_from <= (select d from
      reg) and (v.effective_to is null or v.effective_to > (select d from reg)) qualify row_number() over (partition by b.rule_code order by
      v.effective_from desc, v.version_number desc) = 1), fxo as (select o.quote_currency as currency, o.value as rate, cast(o.observed_at as date) as d
      from market_observations as o where o.observation_type = 'fx_fixing' and o.base_currency = 'USD' and not exists (select 1 from market_observations as
      z where z.supersedes_observation_id = o.id)), nw as (select sum(case when p.currency = 'USD' then p.source_market_value else (p.source_market_value) /
      (select f.rate from fxo as f where f.currency = p.currency and f.d <= p.position_date order by f.d desc limit 1) end) as net_worth, count(*) filter
      (where (p.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = p.currency and f.d <= p.position_date))) as gaps from positions
      as p where p.position_date = (select max(q.position_date) from positions as q)), cu2 as (select c.*, i.asset_class, i.manager_name, case when
      c.currency = 'USD' then c.commitment_amount else (c.commitment_amount) / (select f.rate from fxo as f where f.currency = c.currency and f.d <= (select
      d from reg) order by f.d desc limit 1) end as cmt_usd, case when c.currency = 'USD' then c.commitment_amount - c.paid - c.noticed else
      (c.commitment_amount - c.paid - c.noticed) / (select f.rate from fxo as f where f.currency = c.currency and f.d <= (select d from reg) order by f.d
      desc limit 1) end as unf_usd, (c.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = c.currency and f.d <= (select d from
      reg))) as gap from cu as c join instruments as i on i.id = c.instrument_id), tot as (select sum(unf_usd) as uncalled, sum(cmt_usd) as committed,
      count(*) filter (where gap) as gaps from cu2), cls as (select asset_class, sum(cmt_usd) as committed, count(*) filter (where gap) as gaps from cu2
      group by asset_class), dl as (select x.* from deal_pipeline as x where not exists (select 1 from deal_pipeline as y where y.supersedes_deal_id = x.id)
      and x.stage not in ('declined', 'passed')), cd as (select max(p.position_date) as d from positions as p join instruments as i on i.id = p.instrument_id and i.instrument_type = 'cash' where exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id and ba.holder_kind = 'office')), lc as (select p.* from positions as p join instruments as i on i.id = p.instrument_id and i.instrument_type = 'cash' where exists (select 1 from bank_accounts as ba where ba.cash_instrument_id = i.id and ba.holder_kind = 'office') and p.position_date = (select max(q.position_date) from positions as q where q.instrument_id = p.instrument_id)), cash as (select sum(case when p.currency = 'USD' then p.source_market_value else
      (p.source_market_value) / (select f.rate from fxo as f where f.currency = p.currency and f.d <= (select d from cd) order by f.d desc limit 1) end) as
      cash_usd, count(*) filter (where (p.currency <> 'USD' and not exists (select 1 from fxo as f where f.currency = p.currency and f.d <= (select d from
      cd)))) as unconverted, min(p.position_date) as oldest from lc as p), x as (select l.deal_name, l.asset_class, l.currency, l.target_commitment as
      ticket, case when l.currency = 'USD' then l.target_commitment else (l.target_commitment) / (select f.rate from fxo as f where f.currency = l.currency
      and f.d <= (select d from reg) order by f.d desc limit 1) end as ticket_usd, cast((l.currency <> 'USD' and not exists (select 1 from fxo as f where
      f.currency = l.currency and f.d <= (select d from reg))) as integer) as tgap, t.uncalled, t.committed, t.gaps, (select r.max_pct from rl as r where
      r.rule_code = 'allocation_private_markets') as pm_pct, (select r.max_pct from rl as r where r.rule_code = 'allocation_' || l.asset_class) as
      class_pct, w.net_worth, w.gaps as nwgaps, coalesce(k.committed, 0) as class_committed, coalesce(k.gaps, 0) as kgaps from dl as l cross join tot as t
      cross join nw as w left join cls as k on k.asset_class = l.asset_class), y as (select x.*, cast(case when pm_pct is not null and nwgaps = 0 and gaps =
      0 and tgap = 0 then net_worth * pm_pct / 100 - committed - ticket_usd end as decimal(18,2)) as budget_room_after, cast(case when class_pct is not null
      and nwgaps = 0 and gaps = 0 and kgaps = 0 and tgap = 0 then net_worth * class_pct / 100 - class_committed - ticket_usd end as decimal(18,2)) as
      class_room_after from x) select y.deal_name, y.currency, cast(y.ticket as decimal(18,2)) as new_commitment, cast(case when (gaps = 0 and tgap = 0)
      then y.uncalled end as decimal(18,2)) as uncalled_before, cast(case when (gaps = 0 and tgap = 0) then y.uncalled + y.ticket_usd end as decimal(18,2))
      as uncalled_after, cast(case when c.unconverted = 0 then round(c.cash_usd, 2) end as decimal(18,2)) as cash_usd, c.unconverted as cash_unconverted,
      c.oldest as cash_oldest_on, cast(case when (gaps = 0 and tgap = 0) then y.uncalled + y.ticket_usd end as decimal(18,2)) as need_24m, 'all uncalled
      commitments after the ticket, assumed called within 24 months (no signed pacing rule is on record; the assumption of the answer key)' as need_basis,
      cast(case when (gaps = 0 and tgap = 0) and c.unconverted = 0 then round(100 * c.cash_usd / nullif(y.uncalled + y.ticket_usd, 0), 2) end as
      decimal(9,2)) as cash_cover_pct, case when not (gaps = 0 and tgap = 0) or c.unconverted > 0 or c.cash_usd is null then 'not stated' when c.cash_usd >=
      y.uncalled + y.ticket_usd then 'covered' else 'short' end as cash_status, cast(case when (gaps = 0 and tgap = 0) and c.unconverted = 0 then c.cash_usd
      - (y.uncalled + y.ticket_usd) end as decimal(18,2)) as cash_gap, y.pm_pct as private_markets_limit_pct, y.budget_room_after, case when y.pm_pct is
      null then 'not set' when y.budget_room_after is null then 'not stated' when y.budget_room_after >= 0 then 'within' else 'over' end as budget_status,
      y.class_pct as class_limit_pct, y.class_room_after, case when y.class_pct is null then 'not set' when y.class_room_after is null then 'not stated'
      when y.class_room_after >= 0 then 'within' else 'over' end as class_status, y.gaps + y.tgap as conversion_gaps from y cross join cash as c
    measure: cash_usd
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {all: true, say: "{deal_name}: {new_commitment} takes uncalled to {uncalled_after}; cash of {cash_usd} covers {cash_cover_pct}% of it ({cash_status}); budget {budget_status}"}
    columns:
      cash_oldest_on: 'The oldest position date among the cash accounts counted.'
      conversion_gaps: 'How many amounts have no fixing to convert them to USD.'
      class_status: 'within, over, ''not set'' when the class has no signed limit, or ''not stated''.'
      new_commitment: The ticket of the deal under approval.
      uncalled_after: Unfunded commitments of all funds plus the new ticket.
      cash_usd: 'Cash of all accounts at the latest cash date, in USD (other currencies at the fixing).'
      need_24m: 'What the cash must cover: all uncalled commitments after the ticket, assumed called within 24 months.'
      cash_cover_pct: 'Cash as a share of that need, in percent.'
      cash_status: 'covered, or short when the cash does not cover the need.'
      cash_gap: Cash less the need. Negative means short.
      budget_status: 'within, over, or ''not set'' when the policy signs no private-markets limit.'
    needs:
      - why: 'No cash position is loaded, so the cash test cannot be stated.'
        sql: >-
          select count(*) from position_snapshots as p join instruments as i on i.id = p.instrument_id and i.instrument_type = 'cash'
      - why: 'No deal is under review in the pipeline, so there is no commitment to test.'
        sql: >-
          select count(*) from deal_pipeline as x where x.stage not in ('declined', 'passed')



  - id: vintage_split
    label: Commitments by vintage year
    cards: [80]
    names: [vintage split, commitments by vintage year, vintage year, spread of commitments by year, commitments bunched in one year, private commitments by year]
    words_all: [[vintage, vintages, bunched, spread], [commitment, commitments, private, year, years]]
    may_read: [commitments, instruments]
    never_read: [cash_movements, position_snapshots, transactions]
    why: >-
      A vintage is the year a commitment was made. It comes from the commitment date of the register, not from the calls (a call is money moving, not the promise) and not from the value of the fund.
    formula: >-
      Commitment amount by the year of its commitment date (committed_on), over the commitments nothing supersedes. Per currency, each year's share is the year's commitment over
      that currency's total (currencies are never added together). One total row per currency; the largest year per currency is marked. The figure states the spread only: no limit
      on how bunched is too bunched is signed, so none is applied here.
    grain: By currency and vintage year, with one total row per currency
    sql: >-
      create table {name} as with cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))),
      f as (select c.currency, cast(year(c.committed_on) as integer) as vintage_year, i.canonical_name as fund, c.commitment_amount as amt from cm as c join instruments as i on i.id = c.instrument_id),
      y as (select currency, vintage_year, sum(amt) as commitment, count(distinct fund) as funds_count, string_agg(distinct fund, '; ' order by fund) as funds from f group by currency, vintage_year),
      t as (select currency, sum(commitment) as total, max(commitment) as top, sum(funds_count) as n from y group by currency)
      select y.currency, y.vintage_year, cast(y.commitment as decimal(18,2)) as commitment, cast(round(100 * y.commitment / t.total, 2) as decimal(9,2)) as share_pct,
      cast(y.funds_count as integer) as funds_count, y.funds, cast(case when y.commitment = t.top then 1 else 0 end as integer) as is_largest, 0 as is_total, cast(y.vintage_year as varchar) as year_text from y join t on t.currency = y.currency
      union all select t.currency, cast(null as integer), cast(t.total as decimal(18,2)), cast(100 as decimal(9,2)), cast(t.n as integer), 'All funds', 0, 1, cast(null as varchar) from t
    measure: commitment
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: is_total, once: true, say: "{currency} {commitment} committed across {funds_count} funds in all years"}
      - {if: year_text, sort: commitment, lead: "Commitments by vintage year:", say: "{year_text} {commitment} ({share_pct}% of the total, {funds_count} fund(s))", all: true}
    columns:
      vintage_year: 'The year of the commitment date; empty on the total row.'
      year_text: 'The same year as text, for a sentence (2021, not 2,021); empty on the total row.'
      commitment: 'What the office committed in the year (on the total row, in all years) for the currency.'
      share_pct: 'The year''s commitment as a percent of the currency''s total commitments.'
      funds_count: How many funds were committed in the year.
      funds: The funds committed in the year.
      is_largest: '1 on the year with the largest commitment of the currency.'
      is_total: '1 on the row that adds up all the years of a currency, 0 on a year row.'
    tie_out:
      label: Commitments on the total rows equal the commitments of the register (rows nothing supersedes)
      sql: >-
        select (select coalesce(sum(commitment), 0) from {name} where is_total = 1), (select coalesce(sum(x.commitment_amount), 0) from commitments as x where
        not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null)))
    needs:
      - why: 'No commitment is on the register, so there is no spread to state.'
        sql: >-
          select count(*) from commitments


  - id: watch_flags
    label: Manager watchlist flags
    cards: [53]
    names: [watch flags, manager watchlist, watchlist, managers to watch, late restated or changed statements, managers with statement issues, statement issues, statements changed this quarter, late restated or changed statement, given us a late, managers have given us]
    words_all: [[statement, statements], [late, restated, changed, amended, issues, issue, personnel, watch, watchlist]]
    may_read: [expected_statements, documents, extracted_fields, valuation_observations, instruments]
    never_read: [cash_movements, transactions, position_snapshots]
    why: >-
      A manager goes on the watchlist for what it sent, or failed to send, in the window: late statements, restated statements, statements still
      missing, and mails announcing a change in its team. Each count names its evidence; values and money are not part of it.
    formula: >-
      Per manager (instruments.manager_name), over the 90 days to the as-at date (the latest day a document was received; the window of the card's
      formula): late = statements received in the window after their due date (expected_statements, the statement's own period), not counting
      amended ones; amended = amended statements received in the window; missing = expected statements due before the as-at date with no value
      received for the period; personnel_changes = manager_news mails (document manager_news with a team_change field, counterparty the manager)
      dated in the window. A newsletter is not a mail and is not counted (the card's method counts mails). total = the four added up;
      on_watchlist = 1 when the total is above 0.
    grain: By manager
    sql: >-
      create table {name} as with asat as (select max(cast(received_at at time zone 'UTC' as date)) as d from documents), lo as (select d - 90 as d from asat),
      due as (select e.* from expected_statements as e where not exists (select 1 from expected_statements as x where x.supersedes_expected_statement_id = e.id)),
      st as (select i.manager_name as m, o.evidence_document_id as doc, o.valuation_type as t, cast(o.received_at as date) as r, d.due_date from valuation_observations as o
      join instruments as i on i.id = o.instrument_id left join due as d on d.instrument_id = o.instrument_id and d.period_end = o.valuation_date
      where cast(o.received_at as date) between (select d from lo) and (select d from asat)),
      mi as (select i.manager_name as m, i.canonical_name || ' ' || cast(e.period_end as varchar) as what from due as e join instruments as i on i.id = e.instrument_id
      where i.manager_name is not null and e.due_date < (select d from asat) and not exists (select 1 from valuation_observations as o where o.instrument_id = e.instrument_id
      and o.valuation_date = e.period_end)),
      pc as (select c.value_text as m, count(distinct d.id) as n, string_agg(distinct t.value_text, '; ') as what from documents as d join extracted_fields as c on
      c.document_id = d.id and c.field_name = 'counterparty' join extracted_fields as t on t.document_id = d.id and t.field_name = 'team_change'
      where d.document_type = 'manager_news' and not exists (select 1 from documents as s where s.supersedes_document_id = d.id)
      and coalesce(d.document_date, cast(d.received_at as date)) between (select d from lo) and (select d from asat) group by 1),
      g as (select distinct manager_name as m from instruments where manager_name is not null),
      x as (select g.m as manager, (select count(distinct doc) from st where st.m = g.m and st.t <> 'manager_amended' and st.r > st.due_date) as late,
      (select count(distinct doc) from st where st.m = g.m and st.t = 'manager_amended') as amended, (select count(*) from mi where mi.m = g.m) as missing,
      coalesce((select n from pc where pc.m = g.m), 0) as personnel_changes, (select what from pc where pc.m = g.m) as personnel_detail,
      (select string_agg(what, '; ') from mi where mi.m = g.m) as missing_detail from g)
      select manager, cast(late as integer) as late, cast(amended as integer) as amended, cast(missing as integer) as missing, cast(personnel_changes as integer) as personnel_changes,
      cast(late + amended + missing + personnel_changes as integer) as total, cast(case when late + amended + missing + personnel_changes > 0 then 1 else 0 end as integer) as on_watchlist,
      missing_detail, personnel_detail, (select d from lo) as window_start, (select d from asat) as as_at from x
    measure: total
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: on_watchlist, lead: "Statement watch since {window_start}:", say: "{manager}: {late} late, {amended} restated or changed, {missing} missing, {personnel_changes} personnel changes", all: true}
    columns:
      late: 'Statements received in the window after their due date (amended ones not counted here).'
      amended: Amended statements received in the window.
      missing: Expected statements due before the as-at date that never arrived.
      personnel_changes: 'Mails from the manager announcing a team change, dated in the window.'
      total: The four counts added up.
      on_watchlist: '1 when the manager has at least one flag.'
      missing_detail: 'The fund and period of each missing statement.'
      personnel_detail: The team changes the mails announce.
      window_start: 'The first day of the 90 day window.'
      as_at: 'The as-at date: the latest day a document was received.'
    tie_out:
      label: The personnel changes equal the manager news mails dated in the window
      sql: >-
        select (select coalesce(sum(personnel_changes), 0) from {name}), (select count(distinct d.id) from documents as d join extracted_fields as t on t.document_id = d.id
        and t.field_name = 'team_change' join extracted_fields as c on c.document_id = d.id and c.field_name = 'counterparty' where d.document_type = 'manager_news'
        and c.value_text in (select manager from {name}) and not exists (select 1 from documents as s where s.supersedes_document_id = d.id)
        and coalesce(d.document_date, cast(d.received_at as date)) between (select max(window_start) from {name}) and (select max(as_at) from {name}))
    needs:
      - why: 'No expected statement is on record, so lateness and missing statements cannot be stated.'
        sql: >-
          select count(*) from expected_statements


  - id: expected_distributions
    label: Distributions expected in the next year
    cards: [71]
    names: [expected distributions, distributions we expect, money back from the funds, distributions in the next year, expected payouts, distribution outlook, projected fund payout, fund payout, projected payout, expected distributions over the next year, expect back from the funds]
    words_all: [[distribution, distributions, payout, payouts], [expect, expected, expecting, projected, outlook, back, next, year]]
    may_read: [valuation_observations, documents, extracted_fields, instruments]
    never_read: [cash_movements, transactions, position_snapshots]
    why: >-
      An expected distribution is the manager's projected payout rate applied to the fund's value. Cash already moved, trades and positions say nothing of what the
      manager plans to pay back; the noticed or paid distributions are another figure (distribution_gap).
    formula: >-
      For each fund with a distribution outlook: its latest statement value (the valuation nothing supersedes with the latest valuation date, so an amended statement
      replaces the one it corrects) times the projected payout rate of each quarter of the manager's latest outlook (a rate is a fraction of the value at quarter end).
      Rows per fund and quarter, a total per fund, a total per quarter and one total, per currency (currencies are never added). A fund whose value is older than the
      newest statement date among the funds of its currency is marked stale: the amount rests on an old value. No rate is assumed for a fund without an outlook.
    grain: By currency, fund and quarter end, with a total per fund, per quarter and for all funds
    sql: >-
      create table {name} as with vo as (select o.* from valuation_observations as o where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = o.id)),
      lv as (select instrument_id, valuation_date, value_amount, currency from (select v.*, row_number() over (partition by v.instrument_id order by v.valuation_date desc,
      v.received_at desc, v.recorded_at desc) as rn from vo as v) as v where v.rn = 1),
      od as (select d.id, d.instrument_id from (select d.*, row_number() over (partition by d.instrument_id order by d.received_at desc, d.recorded_at desc) as rn from documents as d
      where d.document_type = 'manager_distribution_outlook' and d.instrument_id is not null and not exists (select 1 from documents as z where z.supersedes_document_id = d.id)) as d where d.rn = 1),
      q as (select o.instrument_id, cast(f.value_text as date) as quarter_end, f.value_numeric as rate from od as o join extracted_fields as f on f.document_id = o.id and f.field_name = 'projected_payout_rate'),
      fq as (select l.currency, i.canonical_name as fund, l.valuation_date, l.value_amount as latest_value, q.quarter_end, q.rate, round(l.value_amount * q.rate, 2) as amount,
      max(l.valuation_date) over (partition by l.currency) as newest from q join lv as l on l.instrument_id = q.instrument_id join instruments as i on i.id = q.instrument_id)
      select currency, fund, valuation_date, cast(latest_value as decimal(18,2)) as latest_value, quarter_end, cast(round(100 * (latest_value * rate) / nullif(latest_value, 0), 4) as decimal(9,4)) as payout_pct,
      cast(amount as decimal(18,2)) as amount, cast(case when valuation_date < newest then 1 else 0 end as integer) as is_stale, 'fund_quarter' as row_kind from fq
      union all select currency, fund, max(valuation_date), cast(max(latest_value) as decimal(18,2)), cast(null as date), cast(null as decimal(9,4)), cast(sum(amount) as decimal(18,2)),
      cast(max(case when valuation_date < newest then 1 else 0 end) as integer), 'fund_total' from fq group by currency, fund
      union all select currency, 'All funds', cast(null as date), cast(null as decimal(18,2)), quarter_end, cast(null as decimal(9,4)), cast(sum(amount) as decimal(18,2)), 0, 'quarter_total'
      from fq group by currency, quarter_end
      union all select currency, 'All funds', cast(null as date), cast(sum(v) as decimal(18,2)), cast(null as date), cast(null as decimal(9,4)), cast(sum(a) as decimal(18,2)), 0, 'total'
      from (select currency, fund, max(latest_value) as v, sum(amount) as a from fq group by currency, fund) as f group by currency
    measure: amount
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {if: row_kind = total, once: true, say: "Expected distributions over the next four quarters: {currency} {amount}, on latest values of {latest_value}"}
      - {if: row_kind = quarter_total, lead: "By quarter:", say: "{quarter_end}: {amount}", all: true}
      - {if: row_kind = fund_total, sort: amount, lead: "By fund:", say: "{fund} {amount} on a value of {latest_value} at {valuation_date}", all: true}
    columns:
      fund: 'The fund; All funds on the quarter and total rows.'
      valuation_date: The date of the statement value the amount rests on.
      latest_value: 'The fund''s latest statement value (on the total row, the funds'' values added up).'
      quarter_end: 'The quarter end the manager projects the payout for; empty on the fund and total rows.'
      payout_pct: 'The manager''s projected payout for the quarter, in percent of the fund value.'
      amount: The distribution expected (value times rate), added up on the fund, quarter and total rows.
      is_stale: '1 when the fund''s value is older than the newest statement date among the funds of its currency.'
      row_kind: 'fund_quarter, fund_total, quarter_total or total.'
    tie_out:
      label: The total rows equal the latest values times the outlook rates, recomputed from the statements and the outlooks
      sql: >-
        select (select coalesce(sum(amount), 0) from {name} where row_kind = 'total'), (select coalesce(sum(round(v.value_amount * f.value_numeric, 2)), 0)
        from documents as d join extracted_fields as f on f.document_id = d.id and f.field_name = 'projected_payout_rate'
        join (select o.instrument_id, arg_max(o.value_amount, (o.valuation_date, o.received_at, o.recorded_at)) as value_amount from valuation_observations as o
        where o.id not in (select x.supersedes_valuation_id from valuation_observations as x where x.supersedes_valuation_id is not null) group by o.instrument_id) as v on v.instrument_id = d.instrument_id
        where d.document_type = 'manager_distribution_outlook' and d.id not in (select z.supersedes_document_id from documents as z where z.supersedes_document_id is not null)
        and d.received_at = (select max(e.received_at) from documents as e where e.document_type = 'manager_distribution_outlook' and e.instrument_id = d.instrument_id
        and e.id not in (select z.supersedes_document_id from documents as z where z.supersedes_document_id is not null)))
    needs:
      - why: 'No manager distribution outlook is loaded, so there is no payout rate to apply.'
        sql: >-
          select count(*) from documents as d join extracted_fields as f on f.document_id = d.id where d.document_type = 'manager_distribution_outlook' and f.field_name = 'projected_payout_rate'
      - why: 'No statement value of a fund is loaded, so there is nothing to apply the payout rates to.'
        sql: >-
          select count(*) from valuation_observations


  - id: manager_score
    label: Manager scorecard
    cards: [76]
    names: [manager score, manager scorecard, scorecard, which managers to keep add to or exit]
    words_all: [[manager, managers], [score, scorecard, keep, exit, verdict, add]]
    may_read: [expected_statements, documents, extracted_fields, valuation_observations, cash_movements, commitments, instruments, business_rules, rule_versions]
    never_read: [transactions, position_snapshots]
    why: >-
      A manager is scored on what its funds earned, what it charged against that gain, whether its statements came on time and its watchlist
      flags. The weights, caps and bands are the office's signed scorecard rule, never fixed here.
    formula: >-
      Per manager and currency, over its funds with statement values: return = (latest value - first value - calls paid + distributions received,
      confirmed movements after the first value) / first value, in percent; fee drag = the fee parts of the confirmed call notices / (that gain +
      the fees), 100 when that gross gain is not positive, empty when no fee is on record (a hedge or index fund bills no call); on-time share =
      statements on time / statements since the first value (each non-amended statement received, an estimate and a final apart, plus each expected
      statement due and never received, which is not on time; a statement is on time when received by the due date of expected_statements, or when no
      due date is on record for it yet);
      watch flags = the total of watch_flags over its 90 day window. score = 100 x (w_returns x min(max(return / return cap, 0), 1) + w_fees x
      (1 - min(fee drag / fee drag cap, 1)), or the fee part when unknown, + w_timeliness x on-time share + w_watch x max(1 - flags / flag cap, 0)),
      with weights and caps from the signed rule manager_score_weights; verdict add, keep or review or exit at the bands of manager_score_bands.
      With no signed rule the score and verdict are empty.
    grain: By manager and currency
    sql: >-
      create table {name} as with recursive hd(id, head) as (select x.id, x.id from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) union all select y.supersedes_commitment_id, hd.head from hd join commitments as y on y.id = hd.id where y.supersedes_commitment_id is not null), cmv as (select m.* exclude (commitment_id), coalesce(hd.head, m.commitment_id) as commitment_id from cash_movements as m left join hd on hd.id = m.commitment_id), asat as (select max(cast(received_at as date)) as d from documents), lo as (select d - 90 as d from asat),
      rl as (select b.rule_code, v.parameters as p from business_rules as b join rule_versions as v on v.business_rule_id = b.id where b.rule_code in ('manager_score_weights', 'manager_score_bands')
      and v.approval_status = 'approved' and v.effective_from <= (select d from asat) and (v.effective_to is null or v.effective_to > (select d from asat))
      qualify row_number() over (partition by b.rule_code order by v.effective_from desc, v.version_number desc) = 1),
      w as (select cast(json_extract_string(p, '$.returns') as double) as wr, cast(json_extract_string(p, '$.fees') as double) as wf, cast(json_extract_string(p, '$.timeliness') as double) as wt,
      cast(json_extract_string(p, '$.watch') as double) as ww, cast(json_extract_string(p, '$.return_cap_pct') as double) as rc, cast(json_extract_string(p, '$.fee_drag_cap_pct') as double) as fc,
      cast(json_extract_string(p, '$.watch_flags_cap') as double) as wc, cast(json_extract_string(p, '$.fee_part_when_unknown') as double) as fu from rl where rule_code = 'manager_score_weights'),
      bd as (select cast(json_extract_string(p, '$.add_min') as double) as add_min, cast(json_extract_string(p, '$.keep_min') as double) as keep_min from rl where rule_code = 'manager_score_bands'),
      vo as (select v.* from valuation_observations as v where not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = v.id) and cast(v.received_at as date) <= (select d from asat)),
      fv as (select i.id as iid, i.manager_name as m, min(v.valuation_date) as d0, max(v.valuation_date) as d1 from vo as v join instruments as i on i.id = v.instrument_id where i.manager_name is not null group by all),
      f0 as (select f.*, (select max(v.value_amount) from vo as v where v.instrument_id = f.iid and v.valuation_date = f.d0) as v0, (select max(v.value_amount) from vo as v where v.instrument_id = f.iid
      and v.valuation_date = f.d1) as v1, (select max(v.currency) from vo as v where v.instrument_id = f.iid and v.valuation_date = f.d1) as ccy from fv as f),
      cm as (select x.* from commitments as x where not exists (select 1 from commitments as y where y.supersedes_commitment_id = x.id) and not (x.source_record_id is null and x.called_to_date is null and not exists (select 1 from cmv as m0 where m0.commitment_id = x.id) and exists (select 1 from commitments as r0 where r0.instrument_id = x.instrument_id and r0.currency = x.currency and r0.called_to_date is not null))),
      mf as (select c.instrument_id as iid, sum(-m.amount) filter (where m.movement_type <> 'distribution') as calls, sum(m.amount) filter (where m.movement_type = 'distribution') as dist
      from cm as c join cmv as m on m.commitment_id = c.id join f0 on f0.iid = c.instrument_id where m.confirmation_status = 'confirmed' and (m.movement_type = 'distribution'
      or m.notice_kind = 'capital_call') and m.effective_date > f0.d0 and m.effective_date <= (select d from asat) and not exists (select 1 from cmv as z where z.supersedes_cash_movement_id = m.id) group by 1),
      fp as (select c.instrument_id as iid, sum(f.value_numeric) as fees from cmv as m join cm as c on c.id = m.commitment_id join f0 on f0.iid = c.instrument_id left join cmv as z on
      z.id = m.supersedes_cash_movement_id join documents as nd on nd.source_record_id = coalesce(z.source_record_id, m.source_record_id) and nd.document_type = 'capital_call_notice' and not exists
      (select 1 from documents as s2 where s2.supersedes_document_id = nd.id) join extracted_fields as f on f.document_id = nd.id and f.field_name = 'management_fee' where m.notice_kind = 'capital_call'
      and m.movement_type = 'call' and m.confirmation_status = 'confirmed' and not exists (select 1 from cmv as y where y.supersedes_cash_movement_id = m.id) and m.effective_date > f0.d0
      and m.effective_date <= (select d from asat) group by 1),
      ex as (select e.instrument_id, e.period_end, min(e.due_date) as due_date from expected_statements as e where not exists (select 1 from expected_statements as x
      where x.supersedes_expected_statement_id = e.id) group by all),
      so as (select o.instrument_id as iid, o.valuation_date, o.valuation_type, min(cast(o.received_at as date)) as rcv from valuation_observations as o join f0 on f0.iid = o.instrument_id
      where o.valuation_type <> 'manager_amended' and o.valuation_date >= f0.d0 and cast(o.received_at as date) <= (select d from asat) group by all),
      sc0 as (select s.iid, count(*) as n, count(*) filter (where e.due_date is null or s.rcv <= e.due_date) as on_time from so as s left join ex as e on e.instrument_id = s.iid
      and e.period_end = s.valuation_date group by 1 union all select e.instrument_id, count(*), 0 from ex as e join f0 on f0.iid = e.instrument_id where e.period_end >= f0.d0
      and e.due_date < (select d from asat) and not exists (select 1 from valuation_observations as o where o.instrument_id = e.instrument_id and o.valuation_date = e.period_end) group by 1),
      sc as (select iid, sum(n) as n, sum(on_time) as on_time from sc0 group by 1),
      st as (select i.manager_name as m, o.evidence_document_id as doc, o.valuation_type as t, cast(o.received_at as date) as r, d.due_date from valuation_observations as o
      join instruments as i on i.id = o.instrument_id left join ex as d on d.instrument_id = o.instrument_id and d.period_end = o.valuation_date
      where cast(o.received_at as date) between (select d from lo) and (select d from asat)),
      mi as (select i.manager_name as m from ex as e join instruments as i on i.id = e.instrument_id where i.manager_name is not null and e.due_date < (select d from asat)
      and not exists (select 1 from valuation_observations as o where o.instrument_id = e.instrument_id and o.valuation_date = e.period_end)),
      pc as (select c.value_text as m, count(distinct d.id) as n from documents as d join extracted_fields as c on c.document_id = d.id and c.field_name = 'counterparty'
      join extracted_fields as t on t.document_id = d.id and t.field_name = 'team_change' where d.document_type = 'manager_news' and not exists (select 1 from documents as s where s.supersedes_document_id = d.id)
      and coalesce(d.document_date, cast(d.received_at as date)) between (select d from lo) and (select d from asat) group by 1),
      wf as (select g.m, (select count(distinct doc) from st where st.m = g.m and st.t <> 'manager_amended' and st.r > st.due_date) + (select count(distinct doc) from st where st.m = g.m
      and st.t = 'manager_amended') + (select count(*) from mi where mi.m = g.m) + coalesce((select n from pc where pc.m = g.m), 0) as flags from (select distinct m from f0) as g),
      mg as (select f.m as manager, f.ccy as currency, count(*) as funds, min(f.d0) as opening_date, max(f.d1) as latest_date, sum(f.v0) as opening, sum(f.v1) as latest,
      sum(f.v1 - f.v0 - coalesce(k.calls, 0) + coalesce(k.dist, 0)) as net, sum(coalesce(p.fees, 0)) as fees, sum(coalesce(s.n, 0)) as due_n, sum(coalesce(s.on_time, 0)) as on_time_n
      from f0 as f left join mf as k on k.iid = f.iid left join fp as p on p.iid = f.iid left join sc as s on s.iid = f.iid group by all),
      y as (select g.*, 100 * net / nullif(opening, 0) as ret, case when fees = 0 then null when net + fees <= 0 then 100 else 100 * fees / (net + fees) end as drag,
      on_time_n / nullif(due_n, 0) as share, coalesce(x.flags, 0) as flags from mg as g left join wf as x on x.m = g.manager),
      z as (select y.*, round(100 * (w.wr * least(greatest(ret / w.rc, 0), 1) + w.wf * case when drag is null then w.fu else 1 - least(drag / w.fc, 1) end + w.wt * share
      + w.ww * greatest(1 - flags / w.wc, 0)), 1) as score from y left join w on true)
      select manager, currency, cast(funds as integer) as funds, opening_date, latest_date, cast(opening as decimal(18,2)) as opening_value, cast(latest as decimal(18,2)) as latest_value,
      cast(net as decimal(18,2)) as net_gain, cast(fees as decimal(18,2)) as fees_paid, cast(round(ret, 2) as decimal(9,2)) as return_pct, cast(round(drag, 2) as decimal(9,2)) as fee_drag_pct,
      cast(round(share, 3) as decimal(9,3)) as on_time_share, cast(due_n as integer) as statements_due, cast(on_time_n as integer) as statements_on_time, cast(flags as integer) as watch_flags,
      cast(score as decimal(9,1)) as score, case when score is null or (select count(*) from bd) = 0 then null when score >= (select add_min from bd) then 'add' when score >= (select keep_min from bd)
      then 'keep' else 'review or exit' end as verdict, (select wr from w) as weight_returns, (select wf from w) as weight_fees, (select wt from w) as weight_timeliness, (select ww from w) as weight_watch from z
    measure: score
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {sort: score, lead: "Scorecard, highest first:", say: "{manager} {score} ({verdict}): return {return_pct}%, on time {on_time_share}, {watch_flags} watch flags", all: true}
    columns:
      opening_date: The date of the first statement value of the manager's funds.
      opening_value: 'The first statement values of its funds, added up.'
      latest_value: 'The latest statement values of its funds, added up.'
      net_gain: 'Latest less first value, less calls paid, plus distributions received.'
      fees_paid: Fee parts of the confirmed call notices of its funds.
      return_pct: 'The net gain as a percent of the first value.'
      fee_drag_pct: 'Fees as a percent of the gross gain; 100 when the gross gain is not positive; empty when no fee is on record.'
      on_time_share: 'Statements received by their due date, as a share of the statements received or missing since the first value.'
      watch_flags: 'Late, amended, missing statements and personnel-change mails in the 90 day window (watch_flags).'
      score: 'The weighted score out of 100 (signed rule manager_score_weights). Empty when no rule is signed.'
      verdict: 'add, keep or review or exit at the signed bands (manager_score_bands).'
      weight_returns: The signed weight of the return part.
    tie_out:
      label: The latest values equal the latest statement values of every fund with a manager
      sql: >-
        select (select coalesce(sum(latest_value), 0) from {name}), (select coalesce(sum(v.value_amount), 0) from valuation_observations as v join instruments as i on i.id = v.instrument_id
        where i.manager_name is not null and not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = v.id) and v.valuation_date = (select max(w.valuation_date)
        from valuation_observations as w where w.instrument_id = v.instrument_id and not exists (select 1 from valuation_observations as x where x.supersedes_valuation_id = w.id)))
    needs:
      - why: 'The scorecard weights are not signed (rule manager_score_weights), so no score is given and none is guessed.'
        sql: >-
          select count(*) from business_rules as b join rule_versions as v on v.business_rule_id = b.id where b.rule_code = 'manager_score_weights' and v.approval_status = 'approved'
      - why: 'No statement value of a fund is loaded, so there is nothing to score.'
        sql: >-
          select count(*) from valuation_observations


  - id: deal_stage
    label: Deals under review by stage and age
    cards: [77]
    names: [deal stage, deals by stage, deal pipeline, pipeline of deals, deals under review, stuck deals, days in stage]
    words_all: [[deal, deals], [stage, stages, pipeline, review, stuck, moving]]
    may_read: [deal_pipeline, business_rules, rule_versions]
    never_read: [commitments, cash_movements, transactions, position_snapshots]
    why: >-
      A deal's place in the pipeline is its latest stage and the day it entered it; a deal is stuck by the office's signed stage limit, not by a
      number fixed here.
    formula: >-
      One row per deal in the pipeline that nothing supersedes and is not declined or passed: days_in_stage = the as-at date (the latest day the
      pipeline was received) less the date the deal entered its stage; stuck = 1 when days_in_stage is above the days of the signed rule
      deal_stage_limit_days, empty when no limit is signed. deals_in_stage counts the deals of its stage; total_ticket adds the tickets of all deals
      of the currency (currencies are never added).
    grain: By deal
    sql: >-
      create table {name} as with asat as (select max(cast(received_at as date)) as d from deal_pipeline),
      rl as (select cast(json_extract_string(v.parameters, '$.days') as integer) as days from business_rules as b join rule_versions as v on v.business_rule_id = b.id
      where b.rule_code = 'deal_stage_limit_days' and v.approval_status = 'approved' and v.effective_from <= (select d from asat) and (v.effective_to is null or v.effective_to > (select d from asat))
      order by v.effective_from desc, v.version_number desc limit 1),
      dl as (select x.* from deal_pipeline as x where not exists (select 1 from deal_pipeline as y where y.supersedes_deal_id = x.id) and lower(x.stage) not in ('declined', 'passed')),
      r as (select l.*, cast(date_diff('day', l.stage_on, (select d from asat)) as integer) as days_in_stage from dl as l)
      select deal_name, manager_name as manager, asset_class, stage, stage_on, days_in_stage, currency, cast(target_commitment as decimal(18,2)) as ticket,
      (select days from rl) as stage_limit_days, cast(case when (select days from rl) is null then null when days_in_stage > (select days from rl) then 1 else 0 end as integer) as stuck,
      cast(count(*) over (partition by stage) as integer) as deals_in_stage, cast(sum(target_commitment) over (partition by currency) as decimal(18,2)) as total_ticket,
      (select d from asat) as as_at from r
    measure: ticket
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {once: true, say: "{n} deals in review, {currency} {sum:ticket} in total"}
      - {if: stuck, sort: days_in_stage, lead: "Past the stage limit:", say: "{deal_name} ({manager}) in {stage} for {days_in_stage} days, {currency} {ticket}", all: true}
      - {if: not stuck, sort: days_in_stage, lead: "Moving:", say: "{deal_name} in {stage} for {days_in_stage} days, {currency} {ticket}", all: true}
    columns:
      stage: The stage the deal is in now.
      stage_on: The date the deal entered that stage.
      days_in_stage: 'Days from the date it entered the stage to the as-at date.'
      ticket: 'The commitment the office would make (the deal''s target commitment).'
      stage_limit_days: 'The signed stage limit in days (rule deal_stage_limit_days); empty when none is signed.'
      stuck: '1 when the deal has been in its stage longer than the signed limit, 0 when not, empty when no limit is signed.'
      deals_in_stage: How many deals are in the same stage.
      total_ticket: The tickets of all deals of the currency added up.
      as_at: 'The as-at date: the latest day the pipeline was received.'
    tie_out:
      label: The tickets equal the target commitments of the deals nothing supersedes and nobody declined
      sql: >-
        select (select coalesce(sum(ticket), 0) from {name}), (select coalesce(sum(x.target_commitment), 0) from deal_pipeline as x where not exists (select 1
        from deal_pipeline as y where y.supersedes_deal_id = x.id) and lower(x.stage) not in ('declined', 'passed'))
    needs:
      - why: 'No deal is in the pipeline, so there is nothing to place by stage.'
        sql: >-
          select count(*) from deal_pipeline


  - id: redemption_dates
    label: Redemption notice date and cash date
    cards: [78]
    names: [redemption dates, redemption notice, notice date and cash date, redeem from a hedge fund, when to send the redemption notice, notice and lock-up, last notice date, notice date, redemption date, cash date]
    words_all: [[redeem, redemption, redemptions, redeeming], [notice, dealing, cash, lockup, lock, date, dates]]
    may_read: [documents, extracted_fields, valuation_observations, instruments]
    never_read: [cash_movements, transactions, position_snapshots, commitments]
    why: >-
      When the office may leave a fund and when the money comes back are set by the fund's own redemption terms (dealing, notice, lock-up, payment
      lag, holdback), applied to its latest statement value. No date is assumed that the terms do not give.
    formula: >-
      For each fund with redemption terms (the latest redemption_terms document of the fund): the dealing dates are the last business day (Monday to
      Friday; no holiday calendar is on record) of each month, or of each quarter-end month when the dealing is quarterly. The dealing date is the
      first one on or after the lock-up end whose notice deadline (dealing date less the notice days, moved back to a business day) is not before the
      as-at date (the latest day a document was received). cash_date = dealing date plus the payment lag days, moved forward to a business day;
      cash_at_payment = the latest statement value less the holdback percent, held back until the audit the rest. A fund whose dealing day is not
      the last business day of the period gets no dates (dealing_rule_known = 0).
    grain: By fund
    sql: >-
      create table {name} as with asat as (select max(cast(received_at as date)) as d from documents),
      rt as (select d.id, d.instrument_id, d.title from documents as d where d.document_type = 'redemption_terms' and d.instrument_id is not null and not exists
      (select 1 from documents as z where z.supersedes_document_id = d.id) qualify row_number() over (partition by d.instrument_id order by d.received_at desc, d.recorded_at desc) = 1),
      t as (select r.instrument_id, r.title as source, max(f.value_text) filter (where f.field_name = 'redemption_frequency') as frequency,
      max(f.value_text) filter (where f.field_name = 'dealing_day') as dealing_day, max(f.value_numeric) filter (where f.field_name = 'notice_days') as notice_days,
      max(f.value_numeric) filter (where f.field_name = 'payment_lag_days') as lag_days, max(f.value_numeric) filter (where f.field_name = 'holdback_pct') as holdback_pct,
      max(try_cast(f.value_text as date)) filter (where f.field_name = 'lockup_end_date') as lockup_end from rt as r join extracted_fields as f on f.document_id = r.id group by all),
      lv as (select v.instrument_id, v.valuation_date, v.value_amount, v.currency, v.valuation_type from valuation_observations as v where not exists (select 1 from valuation_observations as x
      where x.supersedes_valuation_id = v.id) qualify row_number() over (partition by v.instrument_id order by v.valuation_date desc, v.received_at desc, v.recorded_at desc) = 1),
      me as (select t.instrument_id, last_day(cast(date_trunc('month', (select d from asat)) as date) + to_months(cast(g.n as integer))) as m from t cross join range(0, 37) as g(n)
      where lower(t.dealing_day) like '%last business day%' and (lower(t.frequency) = 'monthly' or (lower(t.frequency) = 'quarterly'
      and month(last_day(cast(date_trunc('month', (select d from asat)) as date) + to_months(cast(g.n as integer)))) % 3 = 0))),
      dd as (select instrument_id, m - cast(case dayofweek(m) when 0 then 2 when 6 then 1 else 0 end as integer) as deal from me),
      nb as (select d.instrument_id, d.deal, d.deal - cast(t.notice_days as integer) as nd, d.deal + cast(t.lag_days as integer) as pd, t.lockup_end from dd as d join t on t.instrument_id = d.instrument_id),
      nb2 as (select instrument_id, deal, nd - cast(case dayofweek(nd) when 0 then 2 when 6 then 1 else 0 end as integer) as notice_by,
      pd + cast(case dayofweek(pd) when 6 then 2 when 0 then 1 else 0 end as integer) as cash_date, lockup_end from nb),
      fst as (select * from nb2 where deal >= coalesce(lockup_end, deal) and notice_by >= (select d from asat) qualify row_number() over (partition by instrument_id order by deal) = 1)
      select i.canonical_name as fund, l.currency, cast(l.value_amount as decimal(18,2)) as latest_value, l.valuation_date as value_date,
      case l.valuation_type when 'manager_estimate' then 'estimate' when 'manager_amended' then 'amended' else 'final' end as value_status, t.frequency, t.dealing_day,
      cast(t.notice_days as integer) as notice_days, t.lockup_end, cast(t.lag_days as integer) as payment_lag_days, cast(t.holdback_pct as decimal(9,2)) as holdback_pct,
      f.deal as dealing_date, f.notice_by as send_notice_by, cast(date_diff('day', (select d from asat), f.notice_by) as integer) as days_to_send, f.cash_date,
      cast(round(l.value_amount * (100 - t.holdback_pct) / 100, 2) as decimal(18,2)) as cash_at_payment,
      cast(l.value_amount - round(l.value_amount * (100 - t.holdback_pct) / 100, 2) as decimal(18,2)) as held_back_until_audit,
      cast(case when lower(t.dealing_day) like '%last business day%' and lower(t.frequency) in ('monthly', 'quarterly') then 1 else 0 end as integer) as dealing_rule_known,
      cast(case when t.lockup_end > (select d from asat) then 1 else 0 end as integer) as locked_up, (select d from asat) as as_at, t.source
      from t join instruments as i on i.id = t.instrument_id left join lv as l on l.instrument_id = t.instrument_id left join fst as f on f.instrument_id = t.instrument_id
    measure: cash_at_payment
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {say: "{fund}: send notice by {send_notice_by} ({days_to_send} days from today) for dealing on {dealing_date}; cash {cash_at_payment} on {cash_date}, with {held_back_until_audit} held back until audit", all: true}
    columns:
      latest_value: The fund's latest statement value.
      value_status: 'estimate, final or amended: the statement the value comes from.'
      notice_days: 'Calendar days of notice the terms ask for before the dealing date.'
      lockup_end: 'The end of the lock-up: no dealing date before it.'
      dealing_date: 'The first dealing date the notice can still reach (on or after the lock-up end).'
      send_notice_by: 'The last day to send the notice (dealing date less the notice days, back to a business day).'
      days_to_send: Days from the as-at date to that last day.
      cash_date: 'The day the cash is paid (dealing date plus the payment lag, forward to a business day).'
      cash_at_payment: 'The latest value less the holdback.'
      held_back_until_audit: 'The holdback, paid after the fund''s audit.'
      dealing_rule_known: '1 when the dealing day is the last business day of the month or quarter, the only rule this figure reads.'
      locked_up: '1 when the lock-up has not ended at the as-at date.'
    tie_out:
      label: The cash at payment and the holdback add up to the latest value
      sql: >-
        select (select coalesce(sum(cash_at_payment + held_back_until_audit), 0) from {name}), (select coalesce(sum(latest_value), 0) from {name} where cash_at_payment is not null)
    needs:
      - why: 'No redemption terms of a fund are loaded, so no notice or cash date can be given.'
        sql: >-
          select count(*) from documents where document_type = 'redemption_terms'


  - id: rebalance_trades
    label: Amounts to trade to reach the target allocation
    cards: [79]
    names: [rebalance trades, rebalancing proposal, amounts to trade to reach target, back in range, what to sell or buy, rebalance, holdings to sell or buy, sell or buy, amounts to trade]
    words_all: [[rebalance, rebalancing, trade, trades, sell, buy], [target, targets, range, allocation, weight, class]]
    may_read: [position_snapshots, portfolios, instruments, business_rules, rule_versions]
    never_read: [transactions, cash_movements, commitments]
    why: >-
      A rebalancing trade is the target share of the book less what the class holds now. The targets are the office's allocation rules; a target
      that is only proposed is shown as a suggestion and says so, it is never treated as signed.
    formula: >-
      For each portfolio with target rules (allocation_<asset_class> with a target_pct: the latest approved version, else the latest proposed one):
      book = the portfolio's positions at its latest position date, per currency; current = the value of each asset class (an instrument with no class
      is counted under its instrument type, and class_from_type says so); target = book x target_pct / 100; trade = target - current, positive buy,
      negative sell. targets_status is 'signed' when the rule is approved, else 'proposed, not signed: a suggestion only'. A class held without a
      target gets a row with no target and no trade.
    grain: By portfolio, currency and asset class
    sql: >-
      create table {name} as with {positions},
      tg as (select json_extract_string(v.parameters, '$.portfolio') as portfolio, json_extract_string(v.parameters, '$.asset_class') as asset_class,
      cast(json_extract_string(v.parameters, '$.target_pct') as decimal(9,4)) as target_pct, lower(v.approval_status) as approval_status from business_rules as b join rule_versions as v
      on v.business_rule_id = b.id where b.rule_code like 'allocation_%' and json_extract_string(v.parameters, '$.target_pct') is not null and lower(v.approval_status) in ('approved', 'proposed')
      and v.effective_to is null qualify row_number() over (partition by b.rule_code, json_extract_string(v.parameters, '$.portfolio') order by case lower(v.approval_status) when 'approved' then 0 else 1 end,
      v.version_number desc) = 1),
      dt as (select p.portfolio_id, max(p.position_date) as d from positions as p group by 1),
      held as (select f.portfolio_code as portfolio, p.position_date, p.currency, coalesce(i.asset_class, i.instrument_type) as asset_class, cast(i.asset_class is null as integer) as from_type,
      p.source_market_value as v from positions as p join dt on dt.portfolio_id = p.portfolio_id and dt.d = p.position_date join portfolios as f on f.id = p.portfolio_id
      join instruments as i on i.id = p.instrument_id where f.portfolio_code in (select portfolio from tg)),
      bk as (select portfolio, currency, max(position_date) as position_date, sum(v) as book from held group by all),
      cls as (select portfolio, currency, asset_class, sum(v) as cur, max(from_type) as from_type from held group by all),
      x as (select b.portfolio, b.currency, b.position_date, b.book, t.asset_class, coalesce(c.cur, 0) as cur, coalesce(c.from_type, 0) as from_type, t.target_pct, t.approval_status
      from bk as b join tg as t on t.portfolio = b.portfolio left join cls as c on c.portfolio = b.portfolio and c.currency = b.currency and c.asset_class = t.asset_class
      union all select b.portfolio, b.currency, b.position_date, b.book, c.asset_class, c.cur, c.from_type, null, null from cls as c join bk as b on b.portfolio = c.portfolio
      and b.currency = c.currency where not exists (select 1 from tg as t where t.portfolio = c.portfolio and t.asset_class = c.asset_class))
      select portfolio, currency, position_date, asset_class, cast(cur as decimal(18,2)) as current, cast(round(100 * cur / nullif(book, 0), 2) as decimal(9,2)) as current_pct,
      cast(target_pct as decimal(9,2)) as target_pct, cast(round(book * target_pct / 100, 2) as decimal(18,2)) as target,
      cast(round(book * target_pct / 100, 2) - cur as decimal(18,2)) as trade, case when target_pct is null then null when round(book * target_pct / 100, 2) > cur then 'buy'
      when round(book * target_pct / 100, 2) < cur then 'sell' else 'none' end as side, case approval_status when 'approved' then 'signed' when 'proposed' then 'proposed, not signed: a suggestion only' end as targets_status,
      cast(from_type as integer) as class_from_type, cast(book as decimal(18,2)) as book from x
    measure: trade
    answer:  # the one-line answer: lines of a sentence over the rows the question names (v3_figures.say)
      - {once: true, say: "Portfolio {portfolio}, {currency} book {book}: trades to reach the targets ({targets_status})"}
      - {sort: trade, say: "{asset_class}: {trade} ({side}), from {current_pct}% to the {target_pct}% target", all: true}
    columns:
      current: The value the class holds at the latest position date.
      current_pct: The class as a percent of the book.
      target_pct: 'The target percent of the book (rule allocation_<asset_class>).'
      target: The book times the target percent.
      trade: 'Target less current: positive buy, negative sell.'
      side: 'buy, sell or none.'
      targets_status: '''signed'' when the target is approved, else a suggestion only (proposed, not signed).'
      class_from_type: '1 when an instrument of the row has no asset class and is counted under its instrument type.'
      book: 'The portfolio''s positions at the latest date, in the currency.'
    tie_out:
      label: The current values add up to the book of the portfolio
      sql: >-
        select (select coalesce(sum(current), 0) from {name}), (select coalesce(sum(b), 0) from (select max(book) as b from {name} group by portfolio, currency))
    needs:
      - why: 'No target allocation is on record (signed or proposed), so there is nothing to trade toward and no target is guessed.'
        sql: >-
          select count(*) from business_rules as b join rule_versions as v on v.business_rule_id = b.id where b.rule_code like 'allocation_%' and json_extract_string(v.parameters, '$.target_pct') is not null
