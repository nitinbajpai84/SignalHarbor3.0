# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card 1 uc-001-noticelog, signal row 2: arrives 'Same PDF forwarded a second time by the manager' -> 'Duplicate of notice 7, nothing new logged' -> nobody (see it, no work).
suggestion: true
id: uc-001-noticelog-duplicate
title: The same capital call notice came in again
pain_points:
- PP-02
- INT-DOC
- INT-LIQ
trigger:
  on: file_arrived
  kind: capital_call_notice
inputs:
- kind: doc
  fields:
  - fund
  - call_no
  - seen_before
subject: '{doc.fund} call {doc.call_no} again'
condition: doc.seen_before == 1
severity: info
route_to: ops_clerk
action:
  verb: see
  options:
  - See it
message: Duplicate of {doc.fund} call {doc.call_no}, already logged. Nothing new is logged.
evidence:
- doc.fund
- doc.call_no
