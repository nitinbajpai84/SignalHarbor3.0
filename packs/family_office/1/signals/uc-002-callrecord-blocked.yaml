# SUGGESTION. Call larger than what is left (or in another currency than the commitment). Card uc-002-callrecord, W1 cash builder (docs/v3/w1/build-cash.md). The fee part is its own signal, uc-002-callrecord-fee-off.
suggestion: true
id: uc-002-callrecord-blocked
title: Call larger than what is left
pain_points:
- PP-02
row: exception
trigger:
  'on': action_done
  signal: uc01-call-arrives
inputs:
- kind: doc
  fields:
  - fund
  - investor
  - amount
  - currency
  - call_no
- kind: figure
  id: called_to_date
  recipe: called_to_date
  as: calls
  by:
    fund: doc.fund
    investor: doc.investor
condition: doc.currency != calls.currency or doc.amount > calls.unfunded_before_notice
subject: '{doc.fund} call {doc.call_no}'
severity: problem
route_to: cfo
action:
  verb: approve
  options:
  - Approve the exception
  - Send it back to the fund
hold:
  blocks: record_call
  scope: '{doc.fund}'
  until: the Head of Finance decides
message: '{doc.fund} call {doc.call_no} ({doc.currency} {doc.amount:,.0f}) is more than the commitment can take in {calls.currency}: {calls.unfunded_before_notice:,.0f} was left before it. It needs the Head of Finance''s decision before it is recorded.'
evidence:
- calls
- doc.amount
