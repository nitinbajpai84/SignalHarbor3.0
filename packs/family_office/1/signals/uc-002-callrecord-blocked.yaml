# SUGGESTION. Call larger than what is left, or fee off the terms. Card uc-002-callrecord, W1 cash builder (docs/v3/w1/build-cash.md).
suggestion: true
id: uc-002-callrecord-blocked
title: Call larger than what is left, or fee off the terms
pain_points:
- PP-02
row: exception
trigger:
  'on': action_done
  signal: uc01-call-arrives
inputs:
- kind: doc
  fields:
  - fund
  - investor
  - amount
  - currency
  - call_no
- kind: figure
  id: called_to_date
  recipe: called_to_date
  as: calls
  by:
    fund: doc.fund
- kind: figure
  id: call_fee_check
  recipe: call_fee_check
  as: fee
  by:
    fund: doc.fund
    call_no: doc.call_no
condition: doc.amount > calls.unfunded_before_notice or not fee.fee_matches
subject: '{doc.fund} call {doc.call_no}'
severity: problem
route_to: cfo
action:
  verb: approve
  options:
  - Approve the exception
  - Send it back to the fund
hold:
  blocks: record_call
  scope: '{doc.fund}'
  until: the Head of Finance decides
message: '{doc.fund} call {doc.call_no} ({doc.amount:,.0f}) cannot be recorded as it stands: {calls.unfunded_before_notice:,.0f} was left before it, and the fee on the notice is {fee.fee_on_notice:,.0f} against {fee.fee_per_terms:,.0f} per the fund terms.'
evidence:
- calls
- fee
- doc.amount
