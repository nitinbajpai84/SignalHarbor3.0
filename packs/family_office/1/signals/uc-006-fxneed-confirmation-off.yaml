# SUGGESTION. The bank's rate on a confirmation differs from the fixing. Card uc-006-fxneed, W1 cash builder (docs/v3/w1/build-cash.md). Part two of the card: every conversion is checked against the fixing of its trade date, not against the planned amount.
# Needs a signed rule fx_plan_tolerance (parameters pct): the 0.1 percent is in the card and the answer key, not in the office rules, so while no rule is signed the signal is skipped with the reason.
suggestion: true
id: uc-006-fxneed-confirmation-off
title: The bank's rate differs from the fixing
pain_points:
- PP-01
row: exception
trigger:
  'on': file_arrived
  kind: fx_confirmation
inputs:
- kind: doc
  fields:
  - trade_reference
  - rate
- kind: figure
  id: fx_rate_check
  recipe: fx_rate_check
  as: chk
  by:
    trade_reference: doc.trade_reference
- kind: rule
  id: fx_plan_tolerance
  as: tol
condition: abs(chk.difference_pct) > tol.pct
subject: '{doc.trade_reference}'
severity: problem
route_to: ops_lead
action:
  verb: call_back
  options:
  - Record the call to the bank
hold:
  blocks: close_fx_match
  scope: '{doc.trade_reference}'
  until: the bank corrects or the difference is accepted
message: 'The confirmation {doc.trade_reference} is at {chk.bank_rate} against the fixing {chk.fixing} of {chk.trade_date}: {chk.difference_pct:.4f} percent apart, over the signed {tol.pct} percent. Call the bank before the match is closed.'
evidence:
- chk
- tol
- doc.rate
