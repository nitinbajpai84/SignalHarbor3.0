# SUGGESTION. uc-013 row 2: the owner supplies the class and the identifier. Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-013-secgaps-completed
title: Every holding has a class and an identifier
pain_points: [INT-RISK, INT-TRUST, INT-DATAGOV]
trigger: {on: figure_changed, figure: identifier_gaps}
inputs:
- kind: figure
  id: identifier_gaps
  recipe: identifier_gaps
  as: gap
  by: {first_row: true}
condition: gap.gap_count == 0
