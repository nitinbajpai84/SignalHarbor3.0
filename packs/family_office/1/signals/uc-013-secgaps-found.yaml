# SUGGESTION. uc-013 row 1: a new holding appears in the administrator file. Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-013-secgaps-found
title: Holdings with no class or identifier
pain_points: [INT-RISK, INT-TRUST, INT-DATAGOV]
trigger: {on: figure_changed, figure: identifier_gaps}
inputs:
- kind: figure
  id: identifier_gaps
  recipe: identifier_gaps
  as: gap
  by: {has_gap: true}
condition: gap.gap_count > 0
subject: '{gap.instrument}: no class or identifier, {gap.market_value:,.0f}'
severity: needs
route_to: head_of_data
action:
  verb: record
  options: [Ask the owner of the security master]
message: '{gap.instrument}, held at {gap.currency} {gap.market_value:,.0f} at {gap.position_date}, has no asset class or no approved identifier. In all, {gap.gap_count} instrument(s) in {gap.currency} have a gap: {gap.gap_value_total:,.0f} ({gap.gap_pct_of_net_worth:.2f} percent of what is held). Ask the owner of the security master to complete it?'
evidence: [gap]
