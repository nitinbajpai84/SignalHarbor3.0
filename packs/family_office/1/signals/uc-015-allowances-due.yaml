# SUGGESTION. Card 15 row 1: the allowance due per family member for the current month, against what is paid to date.
# One figure_changed event per row of the allowance_due figure, the row passed as the document (recipes/office.yaml, allowance_due).
suggestion: true
id: uc-015-allowances-due
title: An allowance is due this month
pain_points: [INT-LIQ, PP-01, INT-GOV]
trigger: {on: figure_changed, figure: allowance_due}
inputs:
  - {kind: doc, fields: [member_name, month, scheduled, paid, owed, currency, entity, earlier]}
subject: "{doc.member_name} {doc.month}"
condition: doc.owed > 0 and doc.earlier == 0
severity: needs
route_to: principal
action: {verb: approve, options: [Approve, Change]}
message: "{doc.member_name}: {doc.currency} {doc.owed:,.0f} due for {doc.month} from {doc.entity} (scheduled {doc.scheduled:,.0f}, paid {doc.paid:,.0f}). Approve?"
evidence: [doc.member_name, doc.scheduled, doc.paid, doc.owed]
