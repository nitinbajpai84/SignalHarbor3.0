# SUGGESTION. uc-017 row 2: drawdown recorded, net worth after debt updates. Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-017-liab-drawdown
title: A drawdown is recorded
pain_points: [INT-SCOPE, PP-01, INT-LIQ]
