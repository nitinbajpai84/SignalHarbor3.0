# SUGGESTION. uc-017 row 2: a loan statement shows more drawn than the one before (drawn_change > 0). Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-017-liab-drawdown
title: A drawdown is recorded
pain_points: [INT-SCOPE, PP-01, INT-LIQ]
trigger: {on: file_arrived, kind: loan_statement}
inputs:
- kind: figure
  id: facility_headroom
  recipe: facility_headroom
  as: fac
  by: {first_row: true}
condition: fac.drawdown_total > 0
subject: 'drawdown on {fac.drawdown_facilities}: {fac.drawdown_total:,.0f}'
severity: info
route_to: principal
action:
  verb: see
  options: [Seen]
message: 'More is drawn than at the previous loan statement: {fac.currency} {fac.drawdown_total:,.0f} on {fac.drawdown_facilities}. Net worth after debt falls by the same amount.'
evidence: [fac]
