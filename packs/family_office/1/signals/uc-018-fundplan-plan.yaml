# SUGGESTION. Which entity pays the call. Card uc-018-fundplan, W1 cash builder (docs/v3/w1/build-cash.md).
suggestion: true
id: uc-018-fundplan-plan
title: Which entity pays the call
pain_points:
- PP-01
row: normal
trigger:
  'on': action_done
  signal: uc01-call-fits
inputs:
- kind: doc
  fields:
  - fund
  - call_no
  - due_date
  - amount
  - currency
- kind: figure
  id: funding_plan
  recipe: funding_plan
  as: plan
  by:
    fund: doc.fund
    due_date: doc.due_date
    call_amount: doc.amount
    is_named: true
condition: plan.call_amount > 0
subject: '{doc.fund} call {doc.call_no}'
severity: needs
route_to: cfo
action:
  verb: approve
  options:
  - Accept the plan
message: '{plan.entity} pays {doc.fund} call {doc.call_no} ({plan.call_amount:,.0f} {plan.currency}, due {plan.due_date}). Its cover after calls and the buffer is {plan.cover_after_calls:,.0f}.'
evidence:
- plan
