# SUGGESTION. uc-021 row 3, exception: a stale value that is more than the single-name limit of what is held. The limit is the signed single_name_limit_pct (its own wording says the liquid portfolio; whether it applies to funds is for the office to confirm). Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-021-stale-breach-on-stale
title: A limit breach that rests on a stale value
pain_points: [INT-TRUST, INT-RISK, PP-04]
trigger: {on: figure_changed, figure: value_age_days}
inputs:
- kind: figure
  id: value_age_days
  recipe: value_age_days
  as: age
  by: {first_row: true}
- {kind: rule, id: single_name_limit_pct, as: limit}
condition: age.stale_count > 0 and age.stale_max_pct > limit.value
subject: 'breach on stale value: {age.stale_max_fund}'
severity: needs
route_to: risk_officer
action:
  verb: record
  options: [Label the breach 'possibly stale', The breach stands]
hold: {blocks: confirm_breach, scope: '{age.stale_max_fund}', until: the breach is labelled or confirmed}
message: '{age.stale_max_fund}, the largest of the stale values, is {age.stale_max_pct:.2f} percent of what is held against the {limit.value} percent single-name limit, and its value is {age.stale_max_age} days old. Label the breach possibly stale?'
evidence: [age, limit]
