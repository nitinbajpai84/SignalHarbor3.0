# SUGGESTION. uc-021 row 1: month-end values arrive. Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-021-stale-found
title: Fund values older than 90 days
pain_points: [INT-TRUST, INT-RISK, PP-04]
trigger: {on: figure_changed, figure: value_age_days}
inputs:
- kind: figure
  id: value_age_days
  recipe: value_age_days
  as: age
  by: {first_row: true}
condition: age.stale_count > 0
subject: 'stale values at {age.as_of}: {age.stale_names}'
severity: needs
route_to: risk_officer
action:
  verb: record
  options: [Label them stale in the limits and report notes]
hold: {blocks: use_stale_values, scope: '{age.stale_names}', until: the values are labelled stale in the limits and report notes}
message: '{age.stale_count} fund value(s) are older than {age.stale_after_days} days at {age.as_of}: {age.stale_names}. Label them stale in the limits and report notes so nobody leans on them?'
evidence: [age]
