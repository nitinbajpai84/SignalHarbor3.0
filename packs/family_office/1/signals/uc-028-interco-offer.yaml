# SUGGESTION. An entity can lend and stay above its buffer. Card uc-028-interco, W1 cash builder (docs/v3/w1/build-cash.md).
suggestion: true
id: uc-028-interco-offer
title: An entity can lend and stay above its buffer
pain_points:
- PP-01
row: normal
trigger:
  'on': action_done
  signal: uc01-cash-shortfall
inputs:
- kind: doc
  fields:
  - fund
  - call_no
  - currency
- kind: figure
  id: funding_plan
  recipe: funding_plan
  as: plan
  by:
    fund: doc.fund
    is_named: true
condition: plan.transfer_needed and plan.best_other_spare >= plan.shortfall
subject: '{doc.fund} call {doc.call_no}'
severity: needs
route_to: cfo
action:
  verb: approve
  options:
  - Approve the transfer
message: '{plan.best_other_entity} can lend {plan.shortfall:,.0f} to {plan.entity} and stay above its buffer. Approve the transfer?'
evidence:
- plan
