# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card 29 uc-029-closeck, signal row 3: arrives 'An item open past its due date' -> 'Owner named and reminded' -> Grace Ong (1 call).
suggestion: true
id: uc-029-closeck-item-late
title: A close step is open past its due date
pain_points:
- PP-07
- INT-OPS
- PP-04
trigger:
  on: date_passed
  kind: close_item
inputs:
- kind: doc
  fields:
  - close_month
  - step
  - step_name
  - owner
- kind: figure
  id: close_items_done
  as: c
  by:
    close_month: doc.close_month
    step: doc.step
subject: close {doc.close_month} step {doc.step}
condition: c.late == 1 and c.open == 1
severity: problem
route_to: ops_lead
action:
  verb: call_back
  options:
  - Record the reminder to the owner
hold:
  blocks: sign_close
  scope: '{doc.close_month}'
  until: the step is done or its owner has been reminded
message: Close {doc.close_month}, step {doc.step} '{doc.step_name}' (owner {c.owner}) was due {c.due_on} and is {c.days_late} days past. The owner is named and needs a reminder.
evidence:
- c.due_on
- c.days_late
