# SUGGESTION. Pay date passed and the credit is short or missing. Card uc-037-distrack, W1 cash builder (docs/v3/w1/build-cash.md). date_passed items need a field with 'due' in its name (v3_signals.dated_items): the distribution layout must name its pay date that way.
suggestion: true
id: uc-037-distrack-no-credit
title: Pay date passed and the credit is short or missing
pain_points:
- PP-02
row: exception
trigger:
  'on': date_passed
  kind: distribution_notice
inputs:
- kind: doc
  fields:
  - fund
  - pay_date
  - days_past
- kind: figure
  id: distribution_gap
  recipe: distribution_gap
  as: gap
  by:
    fund: doc.fund
    pay_date: doc.pay_date
condition: gap.gap > 0
subject: '{doc.fund} distribution {doc.pay_date}'
severity: needs
route_to: fund_accountant
action:
  verb: approve
  options:
  - Send the chase
hold:
  blocks: close_distribution
  scope: '{doc.fund}'
  until: the credit is found or the gap is explained
message: '{doc.fund}: the notice said {gap.notice_amount:,.0f} on {gap.pay_date}; {gap.received:,.0f} arrived. The gap is {gap.gap:,.0f}. Send a chase to the fund?'
evidence:
- gap
