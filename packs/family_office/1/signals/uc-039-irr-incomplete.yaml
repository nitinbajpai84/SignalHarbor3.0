# SUGGESTION. Card 39 row 3, the exception: the calls on file do not add up to the cumulative called the manager's statements state (a call is missing or extra), so the IRR is shown as incomplete.
suggestion: true
id: uc-039-irr-incomplete
title: A fund's call history is incomplete
pain_points: [PP-03, INT-PERF]
trigger: {on: figure_changed, figure: fund_irr_tvpi}
inputs:
  - {kind: doc, fields: [fund, irr_status]}
subject: "{doc.fund}"
condition: doc.irr_status == 'incomplete'
