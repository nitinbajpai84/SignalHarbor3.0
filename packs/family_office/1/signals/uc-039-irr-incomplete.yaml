# SUGGESTION. Card 39 row 3, the exception: the calls on file do not add up to the cumulative called the manager's statements state (a call is missing or extra), or a distribution noticed is not confirmed by a bank credit, so the IRR is shown as incomplete.
suggestion: true
id: uc-039-irr-incomplete
title: A fund's call history is incomplete
pain_points: [PP-03, INT-PERF]
trigger: {on: figure_changed, figure: fund_irr_tvpi}
inputs:
  - {kind: doc, fields: [fund, irr_status]}
subject: "{doc.fund}"
condition: doc.irr_status == 'incomplete'
severity: problem
route_to: investment_analyst
action: {verb: call_back, options: [Ask the Fund Accountant for the missing call]}
hold: {blocks: show_irr, scope: "{doc.fund}", until: the calls and distributions add up or the gap is explained}
message: "{doc.fund}: the capital calls or distributions on file do not add up to what the manager's statements and the bank show, so its IRR is shown as incomplete. Ask the Fund Accountant what is missing."
evidence: [doc.fund]
