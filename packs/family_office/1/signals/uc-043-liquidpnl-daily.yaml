# SUGGESTION. uc-043 row 1: daily prices and positions arrive. Numbers come from the card's recipe; the office edits or switches it off.
suggestion: true
id: uc-043-liquidpnl-daily
title: Liquid book gain or loss this month
pain_points: [PP-03, INT-PERF]
trigger: {on: figure_changed, figure: liquid_pnl_mtd}
inputs:
- kind: figure
  id: liquid_pnl_mtd
  recipe: liquid_pnl_mtd
  as: pnl
  by: {first_row: true}
condition: pnl.total_value_month_end > 0
subject: 'liquid books to {pnl.position_date}: {pnl.total_gain_loss:,.0f}'
severity: info
route_to: cio
action:
  verb: see
  options: [Seen]
message: 'The {pnl.books} listed book(s) together are {pnl.total_gain_loss:,.0f} ({pnl.total_gain_pct:.2f} percent) since {pnl.month_end_date}: {pnl.total_value_today:,.0f} now, {pnl.total_value_month_end:,.0f} then, net trades {pnl.total_net_trades:,.0f}. {pnl.books_without_start} book(s) have no month-end value and are left out of the gain.'
evidence: [pnl]
