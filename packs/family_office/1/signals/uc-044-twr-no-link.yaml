# SUGGESTION. Card 44 row 3. EXCEPTION. The monthly returns do not link to the stated quarter: the figure is held with the break.
suggestion: true
id: uc-044-twr-no-link
title: Monthly returns do not link to the quarter
pain_points: [PP-03, INT-PERF]
trigger: {on: figure_changed, figure: twr_periods}
inputs:
  - {kind: doc, fields: [portfolio, period_label, linked_return_pct, stated_return_pct]}
subject: "{doc.portfolio} {doc.period_label} break"
condition: "doc.linked_return_pct != doc.stated_return_pct"
severity: problem
route_to: investment_analyst
action: {verb: approve, options: [Explain the break, Use the linked return]}
hold: {blocks: report_performance, scope: "{doc.portfolio} {doc.period_label}", until: the break is explained}
message: "The monthly returns of {doc.portfolio} link to {doc.linked_return_pct:.4f} percent for {doc.period_label}, but the stated figure is {doc.stated_return_pct:.4f} percent. The figure is held."
evidence: [doc.portfolio, doc.period_label, doc.linked_return_pct, doc.stated_return_pct]
