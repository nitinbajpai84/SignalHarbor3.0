# SUGGESTION. Card 46 row 3. EXCEPTION. The effects do not add to the active return: the table is not shown and the difference is named.
suggestion: true
id: uc-046-attrib-does-not-add
title: The effects do not add up
pain_points: [PP-03, INT-PERF]
trigger: {on: figure_changed, figure: attribution}
inputs:
  - {kind: doc, fields: [portfolio, month_end, sum_of_effects_pct, active_pct, adds_up]}
subject: "{doc.portfolio} {doc.month_end} attribution break"
condition: "doc.adds_up == 0"
severity: problem
route_to: investment_analyst
action: {verb: approve, options: [Explain the difference, Redo it with the month's flows]}
hold: {blocks: show_attribution, scope: "{doc.portfolio} {doc.month_end}", until: the difference is explained}
message: "The effects for {doc.portfolio} to {doc.month_end} add to {doc.sum_of_effects_pct:.4f} points but the active return is {doc.active_pct:.4f}. The table is not shown."
evidence: [doc.portfolio, doc.month_end, doc.sum_of_effects_pct, doc.active_pct, doc.adds_up]
