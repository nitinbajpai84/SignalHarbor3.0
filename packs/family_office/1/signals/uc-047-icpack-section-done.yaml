# SUGGESTION. Card 47 row 2. A section owner marks the section done: a status tick.
suggestion: true
id: uc-047-icpack-section-done
title: A section is done
pain_points: [PP-07, INT-OPS]
trigger: {on: figure_changed, figure: pack_items}
inputs:
