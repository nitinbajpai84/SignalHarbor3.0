# SUGGESTION. Card 50: the invoice is lower than the fee schedule gives. The office is not overcharged, but the vendor may bill the difference later.
suggestion: true
id: uc-050-feeinv-below-schedule
title: A fee invoice is below the fee schedule
pain_points: [INT-OPS, PP-04, INT-GOV]
trigger: {on: figure_changed, figure: invoice_variance}
inputs:
  - {kind: doc, fields: [invoice_no, vendor, currency, billed, expected, variance]}
let: {under: 0 - doc.variance}
subject: "{doc.invoice_no}"
condition: doc.variance < 0
severity: needs
route_to: ops_lead
action: {verb: approve, options: [Approve for payment as billed]}
message: "{doc.vendor} invoice {doc.invoice_no}: {doc.currency} {doc.billed:,.2f} billed against {doc.expected:,.2f} on the fee schedule, {under:,.2f} less. The vendor may bill the difference later. Approve as billed?"
evidence: [doc.invoice_no, doc.billed, doc.expected, doc.variance]
