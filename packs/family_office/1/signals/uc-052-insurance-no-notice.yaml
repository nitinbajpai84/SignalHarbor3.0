# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc-052-insurance, the exception: a policy renews in the next 60 days and no renewal notice is on file. No hold: the card only watches.
suggestion: true
id: uc-052-insurance-no-notice
title: A policy renews in 60 days and no renewal notice is on file
pain_points: [PP-08, INT-GOV]
trigger: {on: figure_changed, figure: renewals_due}
inputs:
  - {kind: doc, fields: [policy, policy_name, currency, sum_insured, premium, next_renewal_date, days_left, due_in_60_days, renewal_notice_received]}
subject: "{doc.policy} no renewal notice"
condition: doc.due_in_60_days == 1 and doc.renewal_notice_received == 0
severity: problem
route_to: hr_admin
action: {verb: call_back, options: [Ask the broker for the renewal notice]}
message: "{doc.policy_name} ({doc.policy}, sum insured {doc.currency} {doc.sum_insured:,.0f}) renews on {doc.next_renewal_date}, in {doc.days_left:,.0f} days, and no renewal notice is on file. Ask the broker for it."
evidence: [doc.policy, doc.next_renewal_date, doc.renewal_notice_received]
