# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc-060-docinbox (use cases 51 to 100, no priority): a file in the inbox read by its content -> where it belongs, or that it is not office business -> the Operations Clerk names its source or refuses it.
suggestion: true
id: uc-060-docinbox-duplicate
title: A file in the inbox is already loaded
pain_points:
- INT-DOC
- INT-GOV
trigger:
  'on': figure_changed
  figure: unrecognised_files
inputs:
- kind: doc
  fields:
  - file
  - belongs_in
  - status
subject: '{doc.file} already loaded'
condition: doc.status == 'duplicate'
severity: info
route_to: ops_clerk
action:
  verb: see
  options:
  - See it
message: '{doc.file} belongs in {doc.belongs_in} and is a copy of a file already loaded. It is not loaded twice.'
evidence:
- doc.belongs_in
