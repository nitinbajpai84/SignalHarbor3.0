# SUGGESTION. Card 74 row 1. The board date is set: the headline figures of the family, each with the file it comes from.
suggestion: true
id: uc-074-boardpack-headline
title: The board headline is ready
pain_points: [PP-07, INT-OPS]
trigger: {on: figure_changed, figure: board_summary}
inputs:
