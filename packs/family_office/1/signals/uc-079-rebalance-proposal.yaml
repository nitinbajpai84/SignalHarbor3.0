# SUGGESTION. Card 79 row 1: the drift is outside the band; the amount to sell or buy per asset class to reach the target goes to the CIO, who approves; the trading desk executes.
suggestion: true
id: uc-079-rebalance-proposal
title: Amount to trade to reach the target
pain_points: [INT-RISK, INT-GOV]
trigger: {on: figure_changed, figure: rebalance_trades}
inputs:
  - {kind: doc, fields: [portfolio, asset_class, currency, current_pct, target_pct, target, trade, side, targets_status]}
subject: "{doc.portfolio} {doc.asset_class}"
condition: doc.trade != 0
severity: needs
route_to: cio
action: {verb: approve, options: [Approve the trade, Change it]}
message: "{doc.portfolio} {doc.asset_class}: {doc.current_pct} percent now against a target of {doc.target_pct}; {doc.side} {doc.currency} {doc.trade:,.0f} to reach {doc.target:,.0f}. Targets: {doc.targets_status}."
evidence: [doc.current_pct, doc.target, doc.trade, doc.targets_status]
