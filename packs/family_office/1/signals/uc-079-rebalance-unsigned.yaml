# SUGGESTION. Card 79, the exception: the targets are proposed, not signed, so the trades are a suggestion only. Nothing is executed until the targets are signed or the CIO decides to trade on the proposal.
suggestion: true
id: uc-079-rebalance-unsigned
title: The targets are not signed
pain_points: [INT-RISK, INT-GOV]
trigger: {on: figure_changed, figure: rebalance_trades}
inputs:
  - {kind: doc, fields: [portfolio, asset_class, target_pct, trade, targets_status]}
subject: "{doc.portfolio} {doc.asset_class}"
condition: doc.targets_status != 'signed'
severity: needs
route_to: cio
action: {verb: approve, options: [Sign the targets, Trade on the proposal, Wait]}
hold: {blocks: execute_rebalance, scope: "{doc.portfolio}", until: the targets are signed or the CIO decides to trade on the proposal}
message: "{doc.portfolio} {doc.asset_class}: the target of {doc.target_pct} percent is {doc.targets_status}. The trade of {doc.trade:,.0f} waits until the targets are signed or you decide."
evidence: [doc.target_pct, doc.targets_status]
