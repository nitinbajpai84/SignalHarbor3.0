# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc-082-covergap: the policies that name an asset insure less than its latest appraisal.
suggestion: true
id: uc-082-covergap-under-insured
title: An asset is insured below its value
pain_points: [INT-RISK, PP-08]
trigger: {on: figure_changed, figure: cover_gap}
inputs:
  - {kind: doc, fields: [asset, appraised_usd, insured_usd, gap_usd, status, no_policy, under_insured]}
subject: "{doc.asset} under-insured"
condition: doc.under_insured == 1
severity: needs
route_to: hr_admin
action: {verb: record, options: [Take the gap to the Principal]}
message: "{doc.asset} is insured for USD {doc.insured_usd:,.2f} against an appraisal of USD {doc.appraised_usd:,.2f}: USD {doc.gap_usd:,.2f}. Take the gap to the Principal."
evidence: [doc.asset, doc.insured_usd, doc.appraised_usd, doc.gap_usd]
