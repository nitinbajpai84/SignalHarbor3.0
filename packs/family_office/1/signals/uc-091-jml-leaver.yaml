# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc-091-jml: a leaver still holds access.
suggestion: true
id: uc-091-jml-leaver
title: A leaver still has access
pain_points: [INT-GOV, INT-DATAGOV]
trigger: {on: figure_changed, figure: access_review}
inputs:
  - {kind: doc, fields: [person, system, permission, no_approver, leaver, joiner_not_requested, unused_90]}
subject: "{doc.person} {doc.system} leaver"
condition: doc.leaver == 1
severity: problem
route_to: head_of_data
action: {verb: record, options: [Remove the access]}
message: "{doc.person} has left and still has {doc.system} ({doc.permission}). Remove it."
evidence: [doc.person, doc.system]
