# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc-091-jml: a joiner holds a system the joiner mail did not ask for.
suggestion: true
id: uc-091-jml-not-requested
title: A joiner has access nobody asked for
pain_points: [INT-GOV, INT-DATAGOV]
trigger: {on: figure_changed, figure: access_review}
inputs:
  - {kind: doc, fields: [person, system, permission, no_approver, leaver, joiner_not_requested, unused_90]}
subject: "{doc.person} {doc.system} not requested"
condition: doc.joiner_not_requested == 1
severity: needs
route_to: head_of_data
action: {verb: record, options: [Remove the access or record the request]}
message: "{doc.person} joined with {doc.system} ({doc.permission}), which the joiner mail did not ask for. Remove it or record the request."
evidence: [doc.person, doc.system]
