# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc-097-kycrefresh: a KYC document expires in the next 90 days.
suggestion: true
id: uc-097-kycrefresh-expiring
title: A KYC document expires in 90 days
pain_points: [INT-GOV, PP-08]
trigger: {on: figure_changed, figure: kyc_expiry}
inputs:
  - {kind: doc, fields: [entity, counterparty, document, expires_on, days_left, expired, expiring_90]}
subject: "{doc.entity} {doc.document} expiring"
condition: doc.expiring_90 == 1
severity: needs
route_to: risk_officer
action: {verb: record, options: [Ask the owner to supply a new one]}
message: "{doc.document} of {doc.entity} for {doc.counterparty} expires on {doc.expires_on}, in {doc.days_left:,.0f} days. Ask the owner to supply a new one."
evidence: [doc.document, doc.expires_on, doc.days_left]
