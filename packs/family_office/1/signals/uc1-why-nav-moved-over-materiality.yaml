# SUGGESTION. Card 20 row 3. EXCEPTION. The amended value moves the report by more than the materiality line: a revision case opens to the CIO.
suggestion: true
id: uc1-why-nav-moved-over-materiality
title: An amendment is over the materiality line
pain_points: [PP-04, INT-TRUST, INT-PERF]
trigger: {on: figure_changed, figure: change_since_report}
inputs:
  - {kind: doc, fields: [fund, valuation_date, original_value, amended_value, change_since_report]}
  - {kind: rule, id: cio_materiality, as: mat}
subject: "{doc.fund} {doc.valuation_date} revision"
condition: "abs(doc.change_since_report) > mat.amount or abs(doc.change_since_report) * 100 / doc.original_value > mat.pct"
severity: problem
route_to: cio
action: {verb: approve, options: [Open a revision case for the committee, Not material]}
hold: {blocks: issue_report, scope: "{doc.fund}", until: the CIO decides on the revision}
message: "{doc.fund} moved by {doc.change_since_report:,.0f} ({doc.original_value:,.0f} to {doc.amended_value:,.0f}), over the materiality line of {mat.amount:,.0f} or {mat.pct}%. A revision case is open for the committee."
evidence: [doc.fund, doc.change_since_report, doc.original_value, doc.amended_value, mat]
