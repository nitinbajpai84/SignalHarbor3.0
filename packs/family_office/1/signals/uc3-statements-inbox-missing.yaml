# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card 19 uc3-statements-inbox, signal row 1: arrives 'Month end passes' -> 'Statements expected from each manager against those received; two late, one missing 63 days' -> Helen Foo (1 click (send the chase draft)).
suggestion: true
id: uc3-statements-inbox-missing
title: A statement is missing, a chase is drafted
pain_points:
- PP-05
- INT-TRUST
- INT-DOC
trigger:
  on: date_passed
  kind: expected_statement
inputs:
- kind: doc
  fields:
  - fund
  - period_end
  - due_date
  - days_past
- kind: figure
  id: statement_timeliness
  as: s
  by:
    statement_of: doc.fund
    period_end: doc.period_end
subject: '{doc.fund} statement {doc.period_end}'
condition: s.status == 'missing' and doc.days_past > 0
severity: needs
route_to: fund_accountant
action:
  verb: approve
  options:
  - Send the chase draft
message: '{s.statement_of}: the statement for {s.period_end} was due {s.due_date} and has not come, {s.business_days_overdue} business days overdue. A chase draft is ready; you send it.'
evidence:
- s
- doc.due_date
