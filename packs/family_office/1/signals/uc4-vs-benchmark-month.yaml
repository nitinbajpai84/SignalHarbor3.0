# SUGGESTION. Card 42 row 1. The month-end export and index levels arrive: the portfolio against the blended benchmark for the month.
suggestion: true
id: uc4-vs-benchmark-month
title: The portfolio against its benchmark for the month
pain_points: [PP-03, INT-BENCH, INT-PERF]
trigger: {on: figure_changed, figure: time_weighted_return}
inputs:
  - {kind: doc, fields: [portfolio, benchmark_code, period_kind, period_label, portfolio_return_pct, benchmark_return_pct, active_pct, months_without_benchmark]}
subject: "{doc.portfolio} {doc.period_label} against benchmark"
condition: "doc.period_kind == 'month' and doc.months_without_benchmark == 0"
severity: info
route_to: cio
action: {verb: see}
message: "{doc.portfolio} returned {doc.portfolio_return_pct:.4f} percent in {doc.period_label} against {doc.benchmark_return_pct:.4f} percent for the {doc.benchmark_code} benchmark: {doc.active_pct:.4f} points active."
evidence: [doc.portfolio, doc.benchmark_code, doc.period_kind, doc.period_label, doc.portfolio_return_pct]
