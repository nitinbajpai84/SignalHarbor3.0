# SUGGESTION. Called plus unfunded is not the commitment. Card uc6-uncalled, W1 cash builder (docs/v3/w1/build-cash.md).
suggestion: true
id: uc6-uncalled-adds-up
title: Called plus unfunded is not the commitment
pain_points:
- PP-02
row: exception
trigger:
  'on': action_done
  signal: uc01-call-fits
inputs:
- kind: doc
  fields:
  - fund
- kind: figure
  id: called_to_date
  recipe: called_to_date
  as: calls
  by:
    fund: doc.fund
condition: calls.called_after_notice + calls.unfunded_after_notice != calls.commitment or calls.unfunded_after_notice < 0
subject: '{doc.fund} uncalled'
severity: problem
route_to: fund_accountant
action:
  verb: record
  options:
  - Correct the record
hold:
  blocks: report_uncalled
  scope: '{doc.fund}'
  until: the record is corrected
message: '{doc.fund}: called {calls.called_after_notice:,.0f} plus unfunded {calls.unfunded_after_notice:,.0f} is not the commitment {calls.commitment:,.0f}. Check the register and the calls recorded.'
evidence:
- calls
