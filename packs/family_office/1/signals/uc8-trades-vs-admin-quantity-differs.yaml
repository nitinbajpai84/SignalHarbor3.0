# SUGGESTION: the pack's usual signal. The office may edit or replace it (<company>/v3/signals/office/<id>.yaml). Card uc8-trades-vs-admin (use cases 51 to 100, no priority): a trade the desk booked and the administrator booked with another quantity -> the break -> the Operations Clerk raises it and sends it to the Operations Lead.
suggestion: true
id: uc8-trades-vs-admin-quantity-differs
title: The administrator booked another quantity than the desk
pain_points:
- PP-06
- INT-DOC
trigger:
  on: figure_changed
  figure: trade_breaks
inputs:
- kind: doc
  fields:
  - trade
  - security
  - break_kind
  - our_quantity
  - administrator_quantity
  - difference_quantity
  - difference_amount
  - currency
subject: '{doc.trade} quantity differs'
condition: doc.break_kind == 'quantity differs'
severity: problem
route_to: ops_clerk
action:
  verb: record
  options:
  - Raise the break and send it to the Operations Lead
hold:
  blocks: accept_administrator_trades
  scope: '{doc.trade}'
  until: the break is raised and sent to the Operations Lead
message: '{doc.security} {doc.trade}: the desk booked {doc.our_quantity:,.0f} units, the administrator {doc.administrator_quantity:,.0f}, a difference of {doc.difference_quantity:,.0f} units (about {doc.difference_amount:,.0f}
  {doc.currency}). The administrator trades are not accepted until the break is raised.'
evidence:
- doc.our_quantity
- doc.administrator_quantity
- doc.difference_amount
