# SUGGESTION. Card 9 (month-end SOP), row 1: the process narrative and the handover email were read and every step has an owner and a check.
# The narrative reader passes the counts as doc fields (steps, steps_without_owner, steps_without_check) with the file as the source.
suggestion: true
id: uc9-sop-steps-drawn
title: The steps, lanes and checks are drawn
pain_points: [INT-OPS, INT-DATAGOV]
trigger: {on: file_arrived, kind: process_narrative}
inputs:
  - {kind: doc, fields: [process_name, steps, steps_without_owner, steps_without_check]}
subject: "{doc.process_name}"
condition: doc.steps > 0 and doc.steps_without_owner == 0 and doc.steps_without_check == 0
severity: needs
route_to: hr_admin
action: {verb: approve, options: [Accept the steps]}
message: "{doc.process_name}: {doc.steps:,.0f} steps drawn with their lanes, hand-overs, checks and what happens when a step fails. Every step has an owner and a check. Accept?"
evidence: [doc.process_name, doc.steps]
