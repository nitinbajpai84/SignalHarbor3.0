use_cases:
- id: uc-001-noticelog
  order: 1
  priority: 1
  status: proposed
  story: capital-call
  title: Log an incoming capital call notice
  domain: Operate and control
  owner: ops_clerk
  involved:
  - fund_accountant
  - ops_lead
  cadence: event
  trigger: Tuesday 09:12, an email with Capital Call Notice No. 7 for Cedarpoint Ventures III
  decision_served: Whether the notice is complete and which fund, amount and due date it carries, so it can go to the Fund Accountant
  question: A Cedarpoint call notice just came in by email. Which fund, how much and by when?
  kind: act
  centre: Action
  inputs:
  - capital call notice pdf
  - email
  figures:
  - id: call_notice_amount
    name: Call notice amount, due date, purpose, wire account
    formula: 'Read from the PDF: investor, amount, due date, purpose split, account ending; each with page and quoted line'
    answer_key: 'Generator prints the notice: USD 1,250,000, due 23 Oct 2026, 900,000 investments + 350,000 fee, account ending 4471'
  - id: notices_open
    name: Notices logged and not yet recorded
    formula: Count of notices logged with no call recorded against a commitment
    answer_key: Generated notices minus notices marked recorded
  action: Clerk logs the notice (fund, amount, due date, page quote) and hands it to the Fund Accountant
  signs: ops_lead
  reuses:
    recipes: []
    skills:
    - data.recognise-file
    - data.read-pdf-fields
    - data.match-identity
    - data.detect-duplicate
    - action.route-owner
    figures: []
  builds_on: []
  layer: 1
  needs_new:
  - table:fund_notices
  - skill:read-capital-call-notice
  pain_points:
  - PP-02
  - INT-DOC
  - INT-LIQ
  kpis:
  - K01
  - K04
  - K05
  - K06
  - K14
  signals:
  - arrives: Email with 'Cedarpoint Ventures III, Capital Call Notice No. 7' PDF
    signal: A capital call notice of a layout seen before; investor, amount, due date, purpose and wire account read with page and quote; two checks agree
    acts: Sam Lee
    effort: 1 click (Log)
    type: normal
  - arrives: Same PDF forwarded a second time by the manager
    signal: Duplicate of notice 7, nothing new logged
    acts: nobody
    effort: see it, no work
    type: normal
  - arrives: Notice carries a different amount in the body and in the table
    signal: Fields disagree, notice is not logged as read; both quotes shown
    acts: Sam Lee
    effort: 1 decision (which one is right) or 1 call
    type: exception
- id: uc-002-callrecord
  order: 2
  priority: 2
  status: proposed
  story: capital-call
  title: Record a capital call against the commitment
  domain: Cash and treasury
  owner: fund_accountant
  involved:
  - ops_clerk
  - cfo
  cadence: event
  trigger: A logged notice is handed over
  decision_served: Whether the call is within the commitment and can be recorded as called, with uncalled falling by the same amount
  question: Does call 7 fit what we committed to Cedarpoint Ventures III, and what is left after it?
  kind: act
  centre: Action
  inputs:
  - capital call notice pdf
  - commitments register xlsx
  figures:
  - id: called_to_date
    name: Called to date by fund
    formula: Called before the notice + this notice
    answer_key: 'Generator: 6,000,000 before call 7, 7,250,000 after'
  - id: unfunded_after_call
    name: Unfunded after call
    formula: Commitment less called to date
    answer_key: Commitment 10,000,000 minus 7,250,000 = 2,750,000
  - id: fee_part_check
    name: Fee part of the call against fund terms
    formula: Fee on the notice against the fee rate in the fund terms
    answer_key: 350,000 equals the fee rate on file times the base; boolean from generator
  action: Fund Accountant records the call; a call larger than the uncalled amount stops and goes to the CFO
  signs: fund_accountant
  reuses:
    recipes: []
    skills:
    - data.match-identity
    - check.adds-up
    - action.detect-exception
    - action.route-owner
    figures:
    - call_notice_amount
    - notices_open
  builds_on:
  - uc-001-noticelog
  layer: 2
  needs_new:
  - recipe:called_to_date
  - table:fund_notices
  pain_points:
  - PP-02
  - INT-LIQ
  - INT-DOC
  kpis:
  - K01
  - K04
  - K05
  - K06
  - K14
  signals:
  - arrives: Logged notice 7 for USD 1,250,000
    signal: Evergreen Holdings committed 10,000,000, called 6,000,000; after this call 7,250,000 called, 2,750,000 unfunded; fee part 350,000 matches the fund terms
    acts: Helen Foo
    effort: 1 click (Record)
    type: normal
  - arrives: Call recorded
    signal: Commitments figure updates and the open-notices count falls by one
    acts: nobody
    effort: see it, no work
    type: normal
  - arrives: A call larger than the unfunded amount, or a fee part off the fund terms
    signal: Record is blocked and routed to the CFO with the difference
    acts: Daniel Foo
    effort: 1 decision
    type: exception
- id: uc6-liquidity
  order: 3
  priority: 3
  status: tested
  story: capital-call
  title: Can each entity meet its capital calls?
  domain: Cash and treasury
  owner: cfo
  involved:
  - principal
  - cio
  cadence: daily
  trigger: Every morning, and when a call is recorded
  decision_served: Whether each entity has cash for the calls due in 30 and 60 days, or needs a transfer
  question: What is our cash by entity today?
  kind: answer
  centre: Consume
  inputs:
  - administrator cash csv
  - commitments register xlsx
  - capital call notice pdf
  figures:
  - id: cash_by_entity
    name: Cash by entity
    formula: 'Cash recipe: market value of cash positions summed by entity and date'
    answer_key: 'Existing key: 2,305,906.48 / 1,252,492.34 (10UC / UC6 answer key)'
  - id: calls_due
    name: Calls due in 30 and 60 days
    formula: Sum of recorded call notices with due date inside the window, per entity
    answer_key: 'Existing key: 905,000; generator sums notices by due date'
  action: CFO decides whether to fund from cash, move cash or ask for time
  signs: cfo
  reuses:
    recipes:
    - cash_by_entity
    skills:
    - intent.restate-ask
    - data.match-identity
    - check.against-source
    - action.detect-exception
    - consume.answer-question
    figures:
    - called_to_date
    - unfunded_after_call
    - fee_part_check
  builds_on:
  - uc-002-callrecord
  layer: 3
  needs_new: []
  pain_points:
  - PP-01
  - PP-02
  - INT-LIQ
  kpis:
  - K01
  - K04
  - K05
  - K06
  brief_say: 'I want to know every morning whether each entity can meet its capital calls from cash: cash by entity, calls due in 30 and 60 days, and uncalled commitments. Mei and Raj read it; I decide.
    Monthly refresh.'
  fixture_files:
  - uc6:2026-07
  existing_check:
    ask: What is our cash by entity today?
    expect:
    - 2,305,906.48
    - 1,252,492.34
    - 905,000
  signals:
  - arrives: Daily administrator cash file and recorded calls
    signal: Cash by entity and calls due in 30 and 60 days per entity
    acts: Daniel Foo
    effort: see it, no work
    type: normal
  - arrives: Call 7 recorded, due 23 Oct
    signal: Holdings has 1,230,000 USD against 1,250,000 due
    acts: Daniel Foo
    effort: 1 decision (see next card)
    type: normal
  - arrives: Administrator cash file missing at 10:00
    signal: Figure shown as stale with its date, no answer given as if fresh
    acts: Grace Ong
    effort: 1 call to the administrator
    type: exception
- id: uc-004-callcheck
  order: 4
  priority: 4
  status: proposed
  story: capital-call
  title: Check a call against cash and approve the payment
  domain: Cash and treasury
  owner: cfo
  involved:
  - fund_accountant
  - ops_lead
  - principal
  cadence: event
  trigger: A call is recorded and falls due within 30 days
  decision_served: Approve the payment of the call from the entity cash, or refuse and ask for a transfer
  question: Can Holdings pay the Cedarpoint call on the 23rd?
  kind: act
  centre: Action
  inputs:
  - capital call notice pdf
  - commitments register xlsx
  - administrator cash csv
  figures:
  - id: cash_after_calls
    name: Cash after calls due, by entity
    formula: Cash by entity (per currency at the planning rate) less calls due by the due date less the 250,000 buffer from the signed office rule; negative means short
    answer_key: 'Holdings USD 1,230,000 vs call 1,250,000 + buffer 250,000: short USD 270,000'
  - id: sgd_to_convert
    name: Amount to convert to cover the shortfall (SGD)
    formula: Shortfall x USD/SGD WMR 4pm
    answer_key: 270,000 x 1.3400 = 361,800
  - id: call_vs_commitment_check
    name: Notice against unfunded commitments
    formula: Notice amount <= unfunded before the call
    answer_key: Boolean from generator rows
  action: CFO approves the payment instruction; a short entity routes to the transfer or FX step
  signs: cfo
  reuses:
    recipes:
    - cash_by_entity
    skills:
    - check.against-source
    - action.size-impact
    - action.suggest-next-step
    - action.route-owner
    figures:
    - called_to_date
    - unfunded_after_call
    - fee_part_check
    - cash_by_entity
    - calls_due
  builds_on:
  - uc-002-callrecord
  - uc6-liquidity
  layer: 4
  needs_new:
  - table:payments
  - recipe:cash_after_calls
  - table:office_rules
  pain_points:
  - PP-02
  - INT-LIQ
  - INT-GOV
  kpis:
  - K01
  - K04
  - K05
  - K06
  signals:
  - arrives: Daniel asks 'Can Holdings pay the Cedarpoint call on the 23rd?'
    signal: Short USD 270,000 after the 250,000 buffer; convert about SGD 361,800 at 1.3400; each number has its source
    acts: Daniel Foo
    effort: 1 decision (Approve, Change or Fund from another entity)
    type: normal
  - arrives: Approval over 500,000 USD
    signal: The signed office rule asks for Daniel's name and time on the record
    acts: Daniel Foo
    effort: 1 click
    type: normal
  - arrives: The buffer rule would be broken by paying from the proposed source
    signal: Harbor shows the breach and does not propose that source
    acts: Daniel Foo
    effort: 1 decision
    type: exception
