# 100 family-office use cases for testing Harbor and watching the office picture grow. Every item here is a SUGGESTION (industry practice), never enforced; the person decides.
# Written to docs/v3/USE-CASES-100.md (method, matrix, cards). Model card: docs/v3/use-cases/UC01-CAPITAL-CALL.md.
# order: build-up order (a card only builds on lower orders). priority 1..50: the ranked top 50 we test first (capital-call story 1..7, then by shared pain).
# status: tested = already in role_builds.yaml (id kept); proposed = new. layer: 1 + deepest card it builds on (1 = basics).
# answer keys are computed by the data generator from the universe (docs/test/make_10uc_universe.py, extended); never typed by hand. Fixture people/figures: Evergreen office, synthetic.
# pain_points: ids from packs/family_office/1/painpoints_sample.yaml (PP-xx) and problems.yaml (INT-xx); kpis from kpi_tree.yaml. signals: top 50 only.
suggestion: true
template: family_office@1
count: 100
people:
- id: cio
  person: Raj Patel
- id: cfo
  person: Daniel Foo
- id: head_of_data
  person: Anita Rao
- id: principal
