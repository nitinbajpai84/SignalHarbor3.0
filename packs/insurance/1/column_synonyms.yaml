# Template insurance@1 column synonyms (V3-03 brief item 6). Seeded ONLY from spellings actually
# found in sh_data/workspaces/star-insurance/contracts/discovery/insurance/*.profile.json, this
# repo's source contracts (docs/signal-harbor/cmo-proof/kpis.json source_tables/formula text),
# and the research note. Every spelling below carries its own source; where only one spelling is
# known (the canonical one), the synonym list is empty rather than invented.
#
# Regex patterns are plain, case-insensitive, anchored alternations of the known spellings --
# no attempt to guess spellings that have not actually been seen anywhere in this pack's sources.
