  # -- Pack / model concepts -----------------------------------------------------------------
  - term: Policy coverage
    definition: A row on pol_policy_coverages -- one of a policy's base or rider coverages, each with its own ape_amount.
    synonyms: []
    do_not_confuse_with: [Base policy, Rider]
    source: "docs/signal-harbor/cmo-proof/kpis.json K01 source_tables"
  - term: Funnel
    definition: One stage-by-stage chain in the engagement-leads-policies-profit measurement chain this pack uses (engagement funnel, lead funnel).
    synonyms: []
    do_not_confuse_with: []
    source: "Research note section 1"
  - term: Belief to test
    definition: A problem template's stated hypothesis the data should confirm or disprove, carried as the belief_to_test field on each problems.yaml entry.
    synonyms: []
    do_not_confuse_with: []
    source: "templates/insurance/1/problems.yaml (this pack)"
  - term: Signal
    definition: A named pattern (e.g. continuity risk, hidden gems, friction, pull) a problem template asks North to surface, carried as the signals field on each problems.yaml entry.
    synonyms: []
    do_not_confuse_with: []
    source: "templates/insurance/1/problems.yaml (this pack)"
  - term: KPI tree
    definition: The set of KPI nodes, drives edges and lever nodes for an industry, with definitions and units but no values or targets.
    synonyms: []
    do_not_confuse_with: []
    source: "templates/insurance/1/kpi_tree.yaml header (this pack)"
  - term: North-star KPI
    definition: A tier-1 KPI the whole KPI tree exists to move (K01 New-business APE, K02 New-business profit in this pack).
    synonyms: [North star KPI]
    do_not_confuse_with: [Driver KPI]
    source: "docs/signal-harbor/cmo-proof/kpis.json tier field"
  - term: Driver KPI
    definition: A tier-2 KPI (e.g. policies sold, leads generated) that feeds a north-star KPI.
    synonyms: []
    do_not_confuse_with: [North-star KPI]
    source: "docs/signal-harbor/cmo-proof/kpis.json tier field"
  - term: Efficiency KPI
    definition: A KPI tier measuring cost or return (cost per lead, cost per policy, marketing ROI in this pack).
    synonyms: []
    do_not_confuse_with: [Driver KPI]
    source: "docs/signal-harbor/cmo-proof/kpis.json tier field"
  - term: YTD
    definition: Year-to-date -- 1 January of the latest data date's year, through the latest data date.
    synonyms: [Year to date]
    do_not_confuse_with: []
    source: "Research note section 6 glossary; 02_kpi_definitions.md"
