# Industry label overlay for template insurance@1 (design section 3.1). LABELS AND SCOPE NOTES
# ONLY -- no permission keys (checked by scripts/sh/template_check.py). Insurance is the
# platform's original, base-case industry, so labels are close to the canonical role names, with
# scope notes naming the insurance-specific artefacts each role works with day to day.
template: insurance@1
labels:
  cmo: {label: "CMO", scope_note: "Owns the new-business and retention KPI charter for the insurance book."}
  cmo_delegate: {label: "CMO delegate", scope_note: "Acts for the CMO on marketing-ops approvals."}
  marketing_ops_analyst: {label: "Marketing ops analyst", scope_note: "Runs CEP journeys, campaigns and lead scoring."}
  actuarial_finance_analyst: {label: "Actuarial / finance analyst", scope_note: "Loss ratios, reserving inputs, premium reconciliation."}
  head_of_data: {label: "Head of Data", scope_note: "Owns the insurance + market gold semantics and the KPI tree."}
  data_owner_steward: {label: "Data owner / steward", scope_note: "Policy, claims and customer source contracts."}
  data_engineer: {label: "Data engineer", scope_note: "Bronze/silver/gold pipelines for policies, claims, CEP."}
  tech_lead_enterprise_architect: {label: "Tech lead / enterprise architect", scope_note: ""}
  compliance_dpo: {label: "Compliance / DPO", scope_note: "PII in customer and policy data (CLAUDE.md rule 0)."}
  ops_run_team: {label: "Ops run team", scope_note: "Monthly/daily feed runs, incident response."}
  platform_admin: {label: "Workspace platform admin", scope_note: ""}
