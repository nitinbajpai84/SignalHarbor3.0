[project]
name = "signal-harbor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pyyaml", "httpx", "duckdb", "openpyxl", "sqlglot", "jsonschema", "referencing"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules", "sh_platform"]
pythonpath = ["."]
