# The design document structure. Section order here is the page order. `fill: records` is written by code from the records (also the fallback);
# `fill: span.design.*` is prose from Span, and reads "Not available yet" naming `missing` until Span has drafted it.
sections:
  - {id: purpose, title: "Purpose and scope", from: [charter], fill: span.design.purpose, missing: "the charter summary"}
  - {id: context, title: "Context from the charter", from: [charter, intent], fill: records}
  - {id: current, title: "Current state", from: [architecture record], diagram: current, fill: records}
  - {id: target, title: "Target architecture", from: [span target draft], diagram: target, fill: span.design.target, missing: "Span's target architecture draft"}
  - {id: delta, title: "What changes", from: [change note], diagram: delta, fill: records}
  - {id: model, title: "Data model and modelling technique", from: [blueprint model, modelling pack], fill: span.design.model, missing: "Span's model draft"}
  - {id: layers, title: "Layers: landed, cleaned, finished", from: [contracts, blueprint lineage], fill: records}
  - {id: sources, title: "Sources and their strategic flags", from: [source map], fill: records}
  - {id: flows, title: "Data flows", from: [contracts], fill: records}
  - {id: security, title: "Security and the egress boundary", from: [blueprint access], fill: records}
  - {id: quality, title: "Quality and testing", from: [blueprint rules, change note tests], fill: records}
  - {id: operations, title: "Operations", from: [contracts, change note run book], fill: records}
  - {id: decisions, title: "Decisions and alternatives", from: [change note decisions], fill: span.design.decisions, missing: "Span's decision records"}
  - {id: risks, title: "Risks and open questions", from: [change note risks], fill: span.design.risks, missing: "Span's risk review"}
  - {id: suggestions, title: "Suggestions for the data team", from: [proposals], fill: records}
