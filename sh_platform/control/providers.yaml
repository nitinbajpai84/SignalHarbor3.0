# The model providers a company may be given (IC-5a). Ids here are configuration values, not names in code:
# the placeholders below are replaced by the company admin / operator with their real provider and model ids.
# No key is ever stored here; a key lives in the environment only.
providers:
  - id: provider_a
    models: [model_a1, model_a2]
  - id: provider_b
    models: [model_b1]
