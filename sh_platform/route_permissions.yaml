# Every route (method + path pattern) must be declared here. DEFAULT DENY: an undeclared route returns 403.
# Per route: public: true | authenticated: true (any signed-in account that has a company) | roles: [any of].
# authenticated and roles may be combined: roles then adds accounts (such as super_admin, which has no
# company) that `authenticated` alone would refuse.
# Key forms: "GET /path/{id}", "WEBSOCKET /path", "MOUNT /prefix/{path}" (a mounted app or static folder).
# authenticated: true is for account-level routes only (sign-out, who am I). NEVER use it on a route that
# reads or writes a company plane; those must list the roles that may use them.
# A MOUNT rule applies to EVERYTHING inside the mounted app. Use mounts for static files only; include a
# sub-app's routes with include_router so each route is declared here on its own.
# A route type this table cannot classify (for example app.frontend) is refused; use a declared mount.
# Later packages add their routes below.
roles:
  super_admin: Runs the control area; has no company and never reads company data.
  company_admin: Manages the people and settings of one company.
  sponsor: Backs the work and signs the charter and the baseline.
  analyst: Prepares and reviews work for the company.
  head_of_data: Approves the design pack, the build plan and the verified map. Held in addition to analyst; opens no route on its own.
  approver: Approves a charter from outside; named by the organiser.
  participant: Joins a session and adds notes.
  owner: A nominated data owner who answers requests and signs a part of the baseline.
