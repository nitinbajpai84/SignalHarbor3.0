# E3b Reconciliation. Running a check: the operations seat (analyst), the business owner (owner, UC5) and the administrator; code also needs full access to a portfolio. Reading the last results is open to sponsor, approver and participant.
routes:
  POST /api/v1/recon/{code}/run: {roles: [company_admin, analyst, head_of_data, owner]}
  GET /api/v1/recon/runs: {roles: [company_admin, analyst, sponsor, approver, participant, owner]}
