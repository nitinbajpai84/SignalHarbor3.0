# E6a Agent run tracing. Runs, cost and failures are for the company admin only.
routes:
  GET /api/v1/agent-runs: {roles: [company_admin]}
  GET /api/v1/agent-runs/loops: {roles: [company_admin]}
  GET /api/v1/agent-runs/trace/{trace_id}: {roles: [company_admin]}
  GET /api/v1/agent-runs/model-trouble: {roles: [company_admin]}  # the Settings banner: a provider out of credit, named
