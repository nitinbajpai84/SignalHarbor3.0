# G3 The benchmark sheet. The decision maker and the architect read; the raiser (a decision maker) and the owner of a KPI sign (the handler checks the name).
routes:
  GET /api/v1/build/{iid}/benchmarks/sheet: {roles: [company_admin, sponsor, analyst, owner]}
  POST /api/v1/build/{iid}/benchmarks/sheet/rows/{rid}: {roles: [company_admin, sponsor, analyst]}
  POST /api/v1/build/{iid}/benchmarks/sheet/read: {roles: [company_admin, sponsor, analyst]}
  POST /api/v1/build/{iid}/benchmarks/sheet/sign: {roles: [company_admin, sponsor, analyst]}
  GET /api/v1/build/{iid}/benchmarks/sheet/doc: {roles: [company_admin, sponsor, analyst, owner]}
