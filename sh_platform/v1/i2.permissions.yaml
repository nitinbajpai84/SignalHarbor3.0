# I2 North's thread. Any company role may start and write; the project's team check (G1) decides whose intent.
routes:
  POST /api/v1/intents: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  GET /api/v1/intents/{iid}/thread: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  POST /api/v1/intents/{iid}/thread: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  POST /api/v1/intents/{iid}/thread/files: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
