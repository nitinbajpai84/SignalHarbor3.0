# I6a North's conversation. Any company role may start and talk; the project's team check (G1) decides whose intent.
routes:
  GET /api/v1/intents/open: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  POST /api/v1/intents/chat: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  GET /api/v1/intents/{iid}/chat: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  POST /api/v1/intents/{iid}/chat: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  POST /api/v1/intents/{iid}/chat/files: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  POST /api/v1/intents/{iid}/send-to-build: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
