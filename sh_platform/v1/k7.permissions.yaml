# K7 benchmark read path. Read only; the handler also needs the consumer seat, and a portfolio the person may not see is a 404 (E1d).
routes:
  GET /api/v1/benchmarks: {roles: [sponsor, approver, analyst, company_admin, participant]}
  GET /api/v1/benchmarks/comparison: {roles: [sponsor, approver, analyst, company_admin, participant]}
