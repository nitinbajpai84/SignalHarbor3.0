# K7 SOP from the signed process map. Any company role may read; the handler also needs the consumer seat and a signed intent.
routes:
  GET /api/v1/intents/{iid}/sop: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
  GET /api/v1/intents/{iid}/sop/download: {roles: [participant, owner, approver, sponsor, analyst, company_admin]}
