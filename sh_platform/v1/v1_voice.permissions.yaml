# V1 Voice: speak and listen on every agent screen. Every company role may use it (speech is per request; audio is never stored).
routes:
  GET /api/v1/voice: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v1/voice/transcribe: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v1/voice/speak: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
