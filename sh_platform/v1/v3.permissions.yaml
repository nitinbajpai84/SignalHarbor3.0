# Harbor 3.0: the Desk, one thread, three decisions. The single-signer office: every company role may use it; the engine acts for the other seats.
routes:
  GET /api/v3/desk: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/threads: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/threads: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/threads/{tid}: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/threads/{tid}/say: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/threads/{tid}/decide: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/threads/{tid}/discard: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/threads/{tid}/brief: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/threads/{tid}/workbench: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/files: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/files: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
