# W7 security controls: the audit log and the office MFA setting are for the company administrator.
routes:
  GET /api/v3/audit: {roles: [company_admin]}
  GET /api/v3/audit/export.csv: {roles: [company_admin]}
  GET /api/v3/security/settings: {roles: [company_admin]}
  PUT /api/v3/security/settings: {roles: [company_admin]}
