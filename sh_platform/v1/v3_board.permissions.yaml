# Harbor 3.0 board, ask and note: read for every company role (Lumen answers within what the person may see).
routes:
  GET /api/v3/board: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/ask: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/note: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/consume: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/review: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/review/{field_id}: {roles: [company_admin, sponsor, analyst, owner, approver]}
