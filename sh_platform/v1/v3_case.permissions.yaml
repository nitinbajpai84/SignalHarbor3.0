# Harbor 3.0: one case, reshaped from the 2.0 case (Tally). The act route maps to 2.0 note, dismiss (close and timing) and resolve; code decides who may act on which case.
routes:
  GET /api/v3/cases/{cid}: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/cases/{cid}/act: {roles: [company_admin, sponsor, analyst, owner, approver]}
