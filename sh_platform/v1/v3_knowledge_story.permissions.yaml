# Harbor 3.0 Knowledge, the use case story: read for every company role (it shows this company only).
routes:
  GET /api/v3/knowledge/usecases: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/knowledge/usecase/{tid}: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/knowledge/domain/{did}: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/knowledge/model/logical: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/knowledge/model/physical: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/knowledge/decisions: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
