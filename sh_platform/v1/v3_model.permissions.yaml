# Harbor 3.0 industry model, packs and language. Reading is open to every company role; admitting, rejecting and teaching words is for everyone but a participant.
routes:
  GET /api/v3/model: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/model/proposals/{pid}: {roles: [company_admin, sponsor, analyst, owner, approver]}
  GET /api/v3/packs: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/language: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/language/words: {roles: [company_admin, sponsor, analyst, owner, approver]}
  POST /api/v3/language/corrections/{cid}: {roles: [company_admin, sponsor, analyst, owner, approver]}
