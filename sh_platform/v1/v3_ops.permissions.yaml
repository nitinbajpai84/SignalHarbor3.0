# Harbor 3.0 operations: people, runs, connections, setup. Reading is open to every company role; changing autonomy or the pack is for the people who decide or do.
routes:
  GET /api/v3/people: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/people/autonomy: {roles: [company_admin, sponsor, analyst, owner, approver]}
  GET /api/v3/runs: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/connections: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/setup: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/setup: {roles: [company_admin, sponsor, analyst]}
