# Harbor 3.0 role suggestions: every company role reads its own; setting a job is checked in the handler (anyone for themselves, admin-ish for others).
routes:
  GET /api/v3/me/role: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/people/jobs: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/people/job: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
