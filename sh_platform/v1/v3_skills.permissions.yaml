# Harbor skills: list, read, usage, and the admit flow for skills Harbor wrote. Single-signer office: every company role may use it.
routes:
  GET /api/v3/skills: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/skills/usage: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  GET /api/v3/skills/{sid}: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/skills/{sid}/edit: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/skills/{sid}/try: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/skills/{sid}/admit: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
  POST /api/v3/skills/{sid}/reject: {roles: [company_admin, sponsor, analyst, owner, approver, participant]}
