# X5 document extraction. The decision maker shapes the spec (what to take out of each kind of document) and says yes to a revised
# spec; the analyst (data engineer seat) runs the reading and works the review queue; the queue line is read by every working seat.
routes:
  GET /api/v1/intents/{iid}/extract: {roles: [company_admin, sponsor, analyst]}
  POST /api/v1/intents/{iid}/extract/propose: {roles: [company_admin, sponsor]}
  PUT /api/v1/intents/{iid}/extract/types/{tid}: {roles: [company_admin, sponsor]}
  POST /api/v1/intents/{iid}/extract/run: {roles: [company_admin, analyst]}
  POST /api/v1/intents/{iid}/extract/types/{tid}/revision: {roles: [company_admin, sponsor]}
  GET /api/v1/extract/queue: {roles: [company_admin, sponsor, analyst]}
  GET /api/v1/extract/{doc_id}: {roles: [company_admin, analyst]}
  POST /api/v1/extract/{doc_id}/accept: {roles: [company_admin, analyst]}
