# Lumen (Consume): tile figures, follow-up edits, answers in words, refusals. Answer key P33 (K01-K03), P16.
# Dashboard {did} is the seeded one (dash-0ad2b1c7, tiles t-000001..3). Questions: POST /api/v1/consume/p/{pid}/dashboards/{did}/ask {text}.
