  agent: lumen
  role: sponsor
  desc: K01 Net worth by entity, Sep 2026 - the three entity figures.
  route: {method: GET, path: "/api/v1/consume/p/{pid}/dashboards/{did}/tiles/t-000001/data"}
  expected: {status: 200, figures: ["22875000", "63950000", "16580000"]}
