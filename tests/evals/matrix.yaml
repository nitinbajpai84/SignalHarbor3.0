# A1 matrix (EVT-20, ER-17): each of the six roles asks each of the four agents one data question, inside the company (outside any
# project for North, Span and Lumen; on the Entity B cash case for Tally). Every cell also scores A2 (loop_trace: model -> tool -> model ->
# answer, no rules reply), A9 + A14 (trace_complete: tier, tokens, price, time, context and guard steps on the trace), A7 (groundedness) and
# A13 (egress_clean). Asking is never an action, so a refusal (403) of a question fails A1. The owner seat is Helen Foo (tools/seed_10uc.py).
# A Tally case a role cannot see is looked up as the company admin, so the role's own answer (or refusal) is what is scored.
- &north
  id: MX-NOR-OWNER
  agent: north
  role: owner
  desc: A1 owner asks North what the company already holds about the month-end report.
  route: {method: POST, path: /api/v1/intents/chat}
  turns: [{say: "What does the office already have about the monthly investment report? Two or three lines, please."}]
  expected: {status: 200, words_any: [["report"]], forbidden: ["Traceback"]}
  scorers: [words, loop_trace, trace_complete, groundedness, egress_clean, latency_ms, cost]
- {<<: *north, id: MX-NOR-SPONSOR, role: sponsor, desc: A1 sponsor asks North what the company already holds about the month-end report.}
- {<<: *north, id: MX-NOR-ANALYST, role: analyst, desc: A1 analyst asks North what the company already holds about the month-end report.}
- {<<: *north, id: MX-NOR-APPROVER, role: approver, desc: A1 approver asks North what the company already holds about the month-end report.}
- {<<: *north, id: MX-NOR-PARTICIPANT, role: participant, desc: A1 participant asks North what the company already holds about the month-end report.}
- {<<: *north, id: MX-NOR-ADMIN, role: company_admin, desc: A1 company admin asks North what the company already holds about the month-end report.}

