  turns:
    - {say: "From now on show my figures weekly", expect: {status: 200}}
    - {method: GET, path: /api/v1/memory/me, as_role: approver, expect: {status: 200, absent: ["weekly"]}}
    - {method: GET, path: /api/v1/memory/me, save: {mid: "items[text~week].id"}, cleanup: true}
    - {method: DELETE, path: "/api/v1/memory/me/{saved.mid}", cleanup: true}
  expected: {}
  scorers: [turn_expect]

