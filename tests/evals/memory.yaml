- id: MEM-07
  agent: memory
  role: participant
  desc: Company memory is written only by the administrator and analysts - a participant gets 403.
  route: {method: POST, path: /api/v1/memory/company}
  pending_if_missing: true
  turns: [{body: {text: "Eval check: this should not be stored"}}]
  expected: {status: 403}
  scorers: [access]

- id: MEM-08
  agent: memory
  role: approver
  desc: Company memory (agreed words) is readable by everyone in the company. None is seeded, so the administrator writes one first (ev.29).
  route: {method: GET, path: /api/v1/memory/company}
  pending_if_missing: true
  turns:
    - {method: POST, as_role: company_admin, body: {text: "Eval check: the office calls the month-end pack the investment report"}, save: {cid: "id"}, expect: {status: 200}}
    - {expect: {status: 200, contains: ["Eval check: the office calls"]}}
    - {method: GET, as_role: participant, expect: {status: 200, contains: ["Eval check: the office calls"]}}
    - {method: DELETE, path: "/api/v1/memory/company/{saved.cid}", as_role: company_admin, cleanup: true}
  expected: {}
  scorers: [turn_expect]

