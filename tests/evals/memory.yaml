# Agent memory (sh_platform/v1/mem_routes.py, mem_agent.py) and the context map (docs/plan/MEMORY-CONTEXT-MAP.md, MEM2).
# Routes: GET /api/v1/memory/me ; DELETE /api/v1/memory/me/{id} ; GET/POST /api/v1/memory/company. A preference is written by a
# plain-words rule on a Lumen turn ("from now on ...", "I prefer ...").
# `new_login: true` on a turn signs the same person in again with a fresh session (a second session). `cleanup: true` turns run even when
# an earlier turn failed, so an item leaves no memory behind. Test phrases use "weekly" / "quarterly" / "in SGD" as markers.
- id: MEM-01
  agent: memory
  role: analyst  # EVT-T1: a preference is told to Lumen where it builds tiles (Build studio, OP1); Mei Chen is a maker
  desc: A preference told to Lumen is still there in a new session.
  route: {method: POST, path: "/api/v1/build/p/{pid}/studio/{sdid}/ask"}
  pending_if_missing: true
  turns:
    - {say: "From now on show my figures monthly", expect: {status: 200, contains: ["remember"]}}
    - {method: GET, path: /api/v1/memory/me, new_login: true, save: {mid: "items[text~month].id"}, expect: {status: 200, contains: ["month"]}}
    - {method: DELETE, path: "/api/v1/memory/me/{saved.mid}", cleanup: true}
  expected: {}
  scorers: [turn_expect, egress_clean]

- id: MEM-02
  agent: memory
  role: analyst  # EVT-T1: a preference is told to Lumen where it builds tiles (Build studio, OP1); Mei Chen is a maker
  desc: A colour preference is used by the next tile (blue line colour in the spec).
  route: {method: POST, path: "/api/v1/build/p/{pid}/studio/{sdid}/ask"}
  pending_if_missing: true
  turns:
    - {say: "I prefer blue lines", expect: {status: 200}}
    - {method: GET, path: /api/v1/memory/me, save: {mid: "items[text~blue].id"}, expect: {contains: ["blue"]}}
    - {say: "Show me net worth by month", expect: {status: 200, contains: ["#2563eb"]}}
    - {method: DELETE, path: "/api/v1/memory/me/{saved.mid}", cleanup: true}
  expected: {}
  scorers: [turn_expect]

- id: MEM-03
  agent: memory
  role: analyst  # EVT-T1: a preference is told to Lumen where it builds tiles (Build studio, OP1); Mei Chen is a maker
  desc: Forget works - after delete the item is gone from the list.
  route: {method: POST, path: "/api/v1/build/p/{pid}/studio/{sdid}/ask"}
  pending_if_missing: true
  turns:
    - {say: "From now on show my figures in SGD", expect: {status: 200}}
    - {method: GET, path: /api/v1/memory/me, save: {mid: "items[text~SGD].id"}, expect: {contains: ["SGD"]}}
    - {method: DELETE, path: "/api/v1/memory/me/{saved.mid}", expect: {status: 200, contains: ["forgotten"]}}
    - {method: GET, path: /api/v1/memory/me, expect: {status: 200, absent: ["in SGD"]}}
  expected: {}
  scorers: [turn_expect]

- id: MEM-04
