# North, wave 2 package N. Run offline: python tools/run_evals.py --offline --agents north_w2 --out <dir>. `replay:` is the model's part,
# in the reply shapes recorded in docs/test-evidence/agents/new-uc (use cases A and B) and cycle-1/H-aqf15. `live: true` = owed to the live
# 3-of-3 rerun once the model accounts are topped up (--agents north_w2 without --offline). Synthetic data only.
- id: NW2-NU01
  agent: north
  role: analyst
  live: true
  desc: NU-01 (A16) - after the person answered, North does not ask the same question again, and the drafts line appears once.
  replay:
    - {say: '{"reply": "What decisions will Daniel make from it?", "asked": "readers", "sow_patch": {"goal": {"readers": ["Daniel Foo"]}}, "covered": []}'}
    - {say: '{"reply": "Thanks. What decisions will Daniel make from it? I have proposed 1 thing to change; say yes to accept, or tell me what is wrong.", "asked": "readers", "sow_patch": {"goal": {"decisions": ["which managers to chase"]}}, "covered": []}'}
  route: {method: POST, path: /api/v1/intents/chat}
  turns:
    - {say: "A manager reporting timeliness scorecard for Daniel Foo.", save: {iid: id}, expect: {status: 200}}
    - {say: "Daniel decides which managers to chase at the next manager meeting.", path: "/api/v1/intents/{saved.iid}/chat", expect: {status: 200}}
  expected: {status: 200, forbidden: ["What decisions will Daniel make", "I have proposed 1 thing"]}
  scorers: [turn_expect, words]

- id: NW2-NU02
  agent: north
  role: analyst
  live: true
  desc: NU-02 (A10) - two sources turned down in words leave the pending proposal; only the kept source waits for a yes.
  replay:
    - {say: '{"reply": "Which rules apply?", "sow_patch": {"sources": [{"name": "Excel tracker", "kind": "file"}, {"name": "Signal Harbor", "kind": "system"}, {"name": "Fund register", "kind": "file"}]}, "covered": []}'}
    - {say: '{"reply": "I have removed the Excel tracker and Signal Harbor from the sources. What does good look like?", "withdraw": ["Excel tracker", "Signal Harbor"], "covered": []}'}
  route: {method: POST, path: /api/v1/intents/chat}
  turns:
    - {say: "A manager reporting scorecard. Sources: the Excel tracker, Signal Harbor and the fund register.", save: {iid: id}, expect: {status: 200}}
    - {say: "Not the Excel tracker and not 'Signal Harbor' as sources, please drop those two.", path: "/api/v1/intents/{saved.iid}/chat", expect: {status: 200}}
    - {method: GET, path: "/api/v1/intents/{saved.iid}/proposals", expect: {status: 200, contains: ["sources/Fund register"]}}
  expected: {}
  scorers: [turn_expect]

- id: NW2-NU05
  agent: north
  role: analyst
  live: true
  desc: NU-03, NU-04, NU-05 (A7) - the use case B benchmark sentence lands as one sheet row with the person's -1.50; no row is cut from the sentence (no 30 or 2026 as figures).
  replay:
    - {say: '{"reply": "Which figures do you report?", "sow_patch": {"kpis": [{"name": "Manager exposure headroom", "definition": "55 minus the share, in points"}]}, "covered": []}'}
    - {say: '{"reply": "Thank you. Which documents are involved?", "covered": ["benchmarks"], "sow_patch": {"kpis": [{"name": "Manager exposure headroom", "benchmark": "given"}]}, "benchmark_rows": [{"kpi": "Manager exposure headroom", "period": "2026-09", "by": {"manager": "Cedarpoint Ventures", "portfolio": "EG-B-OPS"}, "reported": "-1.50", "expected": "same"}]}'}
  route: {method: POST, path: /api/v1/intents/chat}
  turns:
    - {say: "Exposure by manager with limit headroom; the figure is manager exposure headroom.", save: {iid: id}, expect: {status: 200}}
    - {say: "yes", path: "/api/v1/intents/{saved.iid}/chat", expect: {status: 200}}
    - {say: "Success: the tile matches our sheet. Last month, 30 Sep 2026, we reported Cedarpoint Ventures at 56.50% of the Entity B portfolio EG-B-OPS (12,925,000 of 22,875,000), headroom -1.50 points; it should read the same after the load.",
       path: "/api/v1/intents/{saved.iid}/chat", expect: {status: 200, absent: ["but not the figures yet"]}}
    - {method: GET, path: "/api/v1/build/{saved.iid}/benchmarks/sheet", expect: {status: 200, contains: ["-1.5", "cedarpoint ventures"], absent: ["2026.0", "\"reported\": 30"]}}
  expected: {}
  scorers: [turn_expect]

- id: NW2-NU06
  agent: north
  role: analyst
  live: true
  desc: NU-06 (A10) - the recorded refused-argument shapes (section "kpis", content as JSON text) now draft the KPI; the turn ends in a pending draft, never "could not reach the model".
  # the recorded argument shapes (tests/evals/replay.py _BAD_SECTION), now taken; the model then answers. (The repeated-call path, where North's
  # no-tools "answer now" call follows, is in tests/v1/test_north_w2.py: the replay gives every no-tools call the side answer.)
  replay:
    - {calls: [[propose_intent_section, {section: kpis, content: {name: Manager concentration, unit: percent}}], [propose_intent_section, {section: kpi, content: '{"name": "Manager concentration", "unit": "percent"}'}]]}
    - {say: "I have drafted the three figures for you to check."}
  route: {method: POST, path: /api/v1/intents/chat}
  turns:
    - {say: "We need a monthly manager concentration report. The figure: share of the portfolio per manager in percent.", save: {iid: id},
       expect: {status: 200, absent: ["could not reach the model", "rules-only"]}}
    - {method: GET, path: "/api/v1/intents/{saved.iid}/proposals", expect: {status: 200, contains: ["kpis/Manager concentration"]}}
  expected: {}
  scorers: [turn_expect, loop_trace]

