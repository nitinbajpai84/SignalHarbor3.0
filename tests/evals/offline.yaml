  replay: qualify_sql
  route: {method: POST, path: "/api/v1/build/p/{pid}/chat"}
  turns:
    - {say: "Add a gold table by manager, portfolio and entity with the latest value per instrument up to 30 Sep 2026 and each manager's share."}
    - {method: GET, path: "/api/v1/build/p/{pid}/plan", expect: {status: 200, absent: ["gold_exposure_by_manager_across_ent_summary"]}}
