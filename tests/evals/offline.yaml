- id: OFF-MULTILINE
  agent: span
  role: analyst
  desc: NU-12 (S) - a dry run of a normal multi-line SELECT runs (line breaks are not control characters to refuse).
  replay: multiline_sql
  route: {method: POST, path: "/api/v1/build/p/{pid}/chat"}
  turns: [{say: "Try a select of the latest holdings value by manager, portfolio and entity."}]
  expected: {status: 200, tools_ok: [dry_run_sql]}
  scorers: [tool_outcome]

- id: OFF-ARGS24
  agent: north
  role: analyst
  live: true
  desc: NU-06 (N) - the recorded 24 propose_intent_section shapes in one turn; the model was reached, so North never says it could not reach it (an accepted draft or a named reason).
  replay: refused_args_24
  route: {method: POST, path: /api/v1/intents/chat}
  turns:
    - say: "We need a monthly manager concentration report for the family council. The three figures: share of the portfolio per manager in percent, the largest manager's share, and the headroom to the 25 percent limit."
