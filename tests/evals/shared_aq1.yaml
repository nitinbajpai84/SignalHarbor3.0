# Shared runtime, AQ1 package S (cycle 1 fixes): egress vault and names, the loop, the number guard, router prices, the trace, memory and the
# shared tools. One item per fix, through the product's own routes. Run: tools/run_evals.py --agents shared_aq1 ... Synthetic data only.
- id: SAQ-ER01
  agent: tally
  role: analyst
  desc: ER-01 (A13) - after Tally has talked about Entity B and the September investment report, Span still reaches the model (no vault_name block).
  route: {method: POST, path: "/api/v1/cases/{case:Cash differs|Entity B}/ask", field: question}
  turns:
    - {say: "Why does cash for Entity B differ in the September investment report?", expect: {status: 200}}
    - {say: "Which gold tables hold the investment report, and how many rows has each?", path: /api/v1/build/chat, field: text, expect: {status: 200, absent: ["rules-only", "could not reach the model"]}}
  expected: {}
  scorers: [turn_expect, egress_clean, loop_trace]

