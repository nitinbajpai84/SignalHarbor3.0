- id: LUM-SP-03
  agent: lumen
  role: sponsor
  desc: "ER-12, A4: 'And for Entity B?' repeats the last question for Entity B, not a question about tile settings."
  route: {method: POST, path: /api/v1/consume/chat}
  turns: [{say: "What was Entity A's cash at the administrator on 8 October 2026?"}, {say: "And for Entity B?"}]
  expected: {status: 200, words_any: [["880,400", "880400"]], forbidden: ["setting"]}
  sources: ["/api/v1/consume/p/{pid}/dashboards/{did}/tiles/t-000002/data"]  # EVT-T2
  scorers: [words, groundedness, loop_trace]
