# Tally (Action): names the right cause and figures for a case. Answer key P08 (cash), P28-P30 (trades), P17-P19 (limits), P02 (revision), P22 (capital call).
# Routes (sh_platform/v1/e4a_routes.py): GET /api/v1/cases/{id}/tally, POST /api/v1/cases/{id}/ask {question}. The landing note
# docs/plan/v4-landings/TALLY.md was not on disk when these were written; if the n1_tally route moves, change `route` here only.
# {case:A|B|type=x} = the case whose title holds A and B (and whose exception_type is x, when set), found in GET /api/v1/cases for that role.
# "Figures filled by the program" = groundedness: every number in the worded answer must be in the findings/sources the program returned.
- id: TAL-01
  agent: tally
  role: approver
  desc: P08 cash break - Entity B, administrator 880,400 against trading export 868,000, difference 12,400, tolerance 5,000.
  route: {method: POST, path: "/api/v1/cases/{case:Cash differs|Entity B}/ask", field: question}
  pending_if_missing: true
  turns: [{say: "Why is this a break, and by how much?"}]
  expected: {status: 200, figures: ["12400", "880400", "868000", "5000"], words: ["Entity B"]}
  scorers: [figure_match, groundedness, citation_present, egress_clean, latency_ms, cost]

- id: TAL-02
  agent: tally
  role: analyst
  desc: P08 explanation without a question is built by the program - same figures, no model digits.
  route: {method: GET, path: "/api/v1/cases/{case:Cash differs|Entity B}/tally"}
  pending_if_missing: true
  expected: {status: 200, figures: ["12400", "880400", "868000"]}
  scorers: [figure_match, groundedness, citation_present, latency_ms]

